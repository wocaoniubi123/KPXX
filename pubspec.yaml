name: kpxx
description: KPXX - 自用入口聚合应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  encrypt: ^5.0.3
  # 快猫 API 的 md5 签名（纯 Dart，无原生代码）
  crypto: ^3.0.3
  # iOS 网络栈换成 NSURLSession（cupertino_http）：读系统 Wi-Fi 代理/VPN 配置、
  # HTTP/2——浏览器能打开的站 App 也能开（dart:io 默认直连、不读系统代理）。
  # 1.x 线兼容 Flutter 3.24（2.x 迁到 objective_c，保守起见不上）。
  cupertino_http: '>=1.5.0 <2.0.0'
  # 播放器引擎换成 libmpv（FFmpeg）：缓冲区大小可配、HLS 跳转由 FFmpeg 处理，
  # 替代 iOS 原生 AVPlayer（其缓冲/seek 容差在 iOS 上无法配置，长视频跳转会卡死）
  # 版本要钉住：media_kit_video 1.3.x 会拉 volume_controller 3.x，
  # 那个用了 Flutter 3.29+ 的 FlutterSceneLifeCycleDelegate，3.24 编译不过。
  # 1.2.5 走 volume_controller ^2.0.7（老版本，兼容 3.24）。
  media_kit: '>=1.1.11 <1.2.0'
  media_kit_video: '>=1.2.5 <1.3.0'
  media_kit_libs_ios_video: ^1.1.3
  # ★ 2026-10-09（Windows 桌面开发链路 ✓ 用户要求"Windows 也能播"）：
  #   media_kit 在**每个平台**都要一个"带原生库"的伴生包 ✓ —— iOS 那套在上面（`..._ios_video` ✓）；
  #   缺了它 ⇒ 运行时 `MediaKit.ensureInitialized()` 直接抛 `Cannot find libmpv-2.dll …` ☠
  #   （桌面首次冒烟的逐字原文 ✓）⇒ 播放链路整个起不来 ✓。
  #   ⚠️ 它是 **Windows-only** 的包（pubspec 只声明 windows ✓）⇒ **iOS 侧零影响** ✓；
  #   ⚠️ 版本线**与 iOS 那套不同**（各自的包各自发版：iOS = 1.1.x / Windows = 1.0.x ✓）；
  #   ⚠️ 它**不带 DLL** ✗ —— 构建时由它的 `windows/CMakeLists.txt:70` 现下 `mpv-dev-…7z`
  #      （GitHub release ✓ 走 `file(DOWNLOAD)` ⇒ 受 `HTTPS_PROXY` 影响 ✓ ⇒ 本机构建要带代理环境变量 ✓）。
  media_kit_libs_windows_video: ^1.0.11

  # 2026-10-05（用户拍板）：直播房间页改用 iOS 原生播放器（iOS = AVPlayer）；版本钉 **2.10.1**
  #   理由（2026-10-05 二次拍板：升框架 ✓）：2.10.0 是**首次**支持 `videoViewType` 的版本（可选平台视图/纹理 ✓），
  #   2.9.5 里**没有**这个参数（CI 实证 ✓）；2.10.0 要求 Dart ^3.6.0 ⇒ 配套 Flutter ≥3.27。
  #   ⚠️ 2026-10-05 三次拍板升到 **2.10.1**：它才修掉"直播要等 duration≠0 才算初始化"⇒ 直播间首帧慢的正主 ✓
  #   ⚠️ CI 用的 Flutter 已从 3.27.4 升到 **3.47.6**（Dart 3.13.5 ✓ 官方最新 stable ✓ 见 `.github/workflows/ios.yml:25` ✓）。
  video_player: 2.10.1
  # 区间放开：让 pub 自动挑与当前 Flutter SDK 兼容的最新版
  #（写 ^4.8.0 可能解析到要求更高 SDK 的版本导致 pub get 失败）
  webview_flutter: '>=4.7.0 <5.0.0'
  # iOS 的 WebView 创建参数（allowsInlineMediaPlayback 等）在这个包里：
  # 随 webview_flutter 一起装，但**显式声明**以消除 depend_on_referenced_packages
  # （锁文件里已是 3.22.0，这里只放开区间 ✓）
  webview_flutter_wkwebview: '>=3.0.0 <4.0.0'
  # 设置持久化：2.5.4+ 需要 Flutter 3.35，钉在 3.24 能用的范围
  shared_preferences: '>=2.3.5 <2.5.4'
  # 亮度调节（media_kit_video 本来就依赖它，版本区间要保持一致，否则解析冲突）
  screen_brightness: '>=0.2.2+1 <0.3.0'
  # 站点 favicon 是 ICO（内嵌 BMP），Flutter 不认识 ICO，
  # 用纯 Dart 的 image 包解成 PNG（无原生代码）
  image: ^4.2.0
  # 系统音量（和手机音量键同一套）；media_kit_video 本来就依赖它，版本区间保持一致
  volume_controller: '>=2.0.7 <3.0.0'
  # 瀑布流卡片布局（Pektino：横竖混排、按顺序填充两列不留空档）——
  # Flutter 没有原生瀑布流；这个库的 SliverMasonryGrid 是懒加载的，0.7.0 兼容 3.24
  flutter_staggered_grid_view: ^0.7.0
  # 背景图：从相册选图（1.2.0 起要 Flutter 3.27+，1.2.3 要 3.38+ → 必须钉在 1.1.x）
  image_picker: '>=1.1.0 <1.2.0'
  # 背景图存沙盒要拿 documents 目录（2.1.6 要 Flutter 3.38+ → 钉在 2.1.x）
  path_provider: '>=2.1.0 <2.1.6'
  # 导出背景图到系统相册（图集页左滑「导出」）。2.3.3 的约束很松
  # （sdk >=3.0.0 / flutter >=3.7.0、podspec ios.deployment_target 11.0），
  # 3.24.5 可用；iOS 侧需要 Info.plist 两条权限（见 .github/workflows/ios.yml）
  gal: '>=2.3.0 <3.0.0'
  # 2026-10-05（用户拍板 方案A）：**错误日志页加「导出」** —— 把整份日志当文件交给系统分享面板 ✓
  #   钉区间而**不是** `^`：`pubspec.lock` 被 gitignore ⇒ CI 每次按约束取"满足的最高版" ✓
  #   ⇒ 上限 `<13.4.0` 防大版本漂移；13.3.1 的要求逐条满足（依据 recon 调研 ✓）：
  #   Flutter ≥3.38.1（本仓 CI = 3.47.6 ✓）/ Dart ≥3.10（本仓 3.13.5 ✓）/ iOS ≥13.0（本仓部署目标 13.0 ✓）。
  share_plus: '>=13.3.1 <13.4.0'
  # 2026-10-05（用户拍板 B）：图集2（photos18）的图**全是 AVIF**、系统里 Flutter 解不出 ⇒
  #   自建**本地插件**：iOS 侧用系统自带 ImageIO（CGImageSource → CGImageDestination，PNG 无损）解 ✓
  #   ⇒ 走 `path:` 引入 ✓ **不改 CI 生成步骤、不用改 pbxproj**（CocoaPods 自动编译+注册 ✓）
  #   ⇒ 回退 = 删 `plugins/kp_avif/**` + 删这一行 + 删图集2 里那几处接线 ✓
  kp_avif:
    path: plugins/kp_avif
  device_preview: ^3.0.0
  http2: ^3.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # 默认背景图（原图 3277x4096 太大：解码要 ~53MB 内存；打包前缩到 1440 宽 ≈10MB）
    - assets/bg_default.jpg
