name: kpxx
description: KPXX - 自用入口聚合应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  video_player: ^2.9.0
  encrypt: ^5.0.3
  # 区间放开：让 pub 自动挑与当前 Flutter SDK 兼容的最新版
  #（写 ^4.8.0 可能解析到要求更高 SDK 的版本导致 pub get 失败）
  webview_flutter: '>=4.7.0 <5.0.0'

dev_dependencies:
  flutter_lints: ^4.0.0

# 本地内置的 video_player_avfoundation：打了 2 处原生补丁
# （跳转不等缓冲、seek 给 1 秒容差），见 third_party/.../FVPVideoPlayer.m 里的 [KPXX 本地补丁]。
# 之所以内置：video_player 的公开 API 没有任何缓冲/seek 容差开关，只能改原生。
dependency_overrides:
  video_player_avfoundation:
    path: third_party/video_player_avfoundation

flutter:
  uses-material-design: true
