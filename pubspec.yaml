name: kpxx
description: KPXX - 自用入口聚合应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  encrypt: ^5.0.3
  # 快猫 API 的 md5 签名（纯 Dart，无原生代码）
  crypto: ^3.0.3
  # iOS 网络栈换成 NSURLSession（cupertino_http）：读系统 Wi-Fi 代理/VPN 配置、
  # HTTP/2——浏览器能打开的站 App 也能开（dart:io 默认直连、不读系统代理）。
  # 1.x 线兼容 Flutter 3.24（2.x 迁到 objective_c，保守起见不上）。
  cupertino_http: '>=1.5.0 <2.0.0'
  # 播放器引擎换成 libmpv（FFmpeg）：缓冲区大小可配、HLS 跳转由 FFmpeg 处理，
  # 替代 iOS 原生 AVPlayer（其缓冲/seek 容差在 iOS 上无法配置，长视频跳转会卡死）
  # 版本要钉住（★ 2026-10-12 更新口径，原注释已过时 ☠）：
  #   · **media_kit 已升到 1.2.6**（🛢️ 修"复用档切集黑屏"：1.2.0 的 `FIX: video_player black screen`
  #     + `open()` 改用 `loadlist` 重写 —— 配 libmpv 0.41 实测复用档恢复正常）；
  #   · **media_kit_video 仍停在 1.2.5**：1.3.1 要求 `volume_controller ^3.0.2` + `screen_brightness_* ^2.0.0`，
  #     而本仓为 iOS 兼容**钉着** `volume_controller >=2.0.7 <3.0.0` / `screen_brightness >=0.2.2+1 <0.3.0`
  #     ⇒ 两条独立硬冲突（pub 求解器正确拒绝）⇒ **要升 1.3.1 必须先放开那两条钉、并回归 iOS 构建** ☑️
  #   · ⚠️ **旧注释里"Flutter 3.24 编不过"那条前提已过期**：本仓现在是 **Flutter 3.47.6**（CI 实锤）☑️
  media_kit: '>=1.1.11 <1.3.0'
  media_kit_video: '>=1.2.5 <1.4.0'   # 上界 <1.4.0：把 BREAKING 的 2.0.x（移除 volume_controller/screen_brightness 依赖）挡在外 ✅
  media_kit_libs_ios_video: ^1.1.3
  # ★ 2026-10-09（Windows 桌面开发链路 ✓ 用户要求"Windows 也能播"）：
  #   media_kit 在**每个平台**都要一个"带原生库"的伴生包 ✓ —— iOS 那套在上面（`..._ios_video` ✓）；
  #   缺了它 ⇒ 运行时 `MediaKit.ensureInitialized()` 直接抛 `Cannot find libmpv-2.dll …` ☠
  #   （桌面首次冒烟的逐字原文 ✓）⇒ 播放链路整个起不来 ✓。
  #   ⚠️ 它是 **Windows-only** 的包（pubspec 只声明 windows ✓）⇒ **iOS 侧零影响** ✓；
  #   ⚠️ 版本线**与 iOS 那套不同**（各自的包各自发版：iOS = 1.1.x / Windows = 1.0.x ✓）；
  #   ⚠️ 它**不带 DLL** ✗ —— 构建时由它的 `windows/CMakeLists.txt:70` 现下 `mpv-dev-…7z`
  #      （GitHub release ✓ 走 `file(DOWNLOAD)` ⇒ 受 `HTTPS_PROXY` 影响 ✓ ⇒ 本机构建要带代理环境变量 ✓）。
  media_kit_libs_windows_video: ^1.0.11

  # 2026-10-05（用户拍板）：直播房间页改用 iOS 原生播放器（iOS = AVPlayer）；版本钉 **2.10.1**
  #   理由（2026-10-05 二次拍板：升框架 ✓）：2.10.0 是**首次**支持 `videoViewType` 的版本（可选平台视图/纹理 ✓），
  #   2.9.5 里**没有**这个参数（CI 实证 ✓）；2.10.0 要求 Dart ^3.6.0 ⇒ 配套 Flutter ≥3.27。
  #   ⚠️ 2026-10-05 三次拍板升到 **2.10.1**：它才修掉"直播要等 duration≠0 才算初始化"⇒ 直播间首帧慢的正主 ✓
  #   ⚠️ CI 用的 Flutter 已从 3.27.4 升到 **3.47.6**（Dart 3.13.5 ✓ 官方最新 stable ✓ 见 `.github/workflows/ios.yml:25` ✓）。
  video_player: 2.10.1
  # 区间放开：让 pub 自动挑与当前 Flutter SDK 兼容的最新版
  #（写 ^4.8.0 可能解析到要求更高 SDK 的版本导致 pub get 失败）
  webview_flutter: '>=4.7.0 <5.0.0'
  # iOS 的 WebView 创建参数（allowsInlineMediaPlayback 等）在这个包里：
  # 随 webview_flutter 一起装，但**显式声明**以消除 depend_on_referenced_packages
  # （锁文件里已是 3.22.0，这里只放开区间 ✓）
  webview_flutter_wkwebview: '>=3.0.0 <4.0.0'
  # 设置持久化：2.5.4+ 需要 Flutter 3.35，钉在 3.24 能用的范围
  shared_preferences: '>=2.3.5 <2.5.4'
  # 亮度调节（media_kit_video 本来就依赖它，版本区间要保持一致，否则解析冲突）
  screen_brightness: '>=0.2.2+1 <0.3.0'
  # 站点 favicon 是 ICO（内嵌 BMP），Flutter 不认识 ICO，
  # 用纯 Dart 的 image 包解成 PNG（无原生代码）
  image: ^4.2.0
  # 系统音量（和手机音量键同一套）；media_kit_video 本来就依赖它，版本区间保持一致
  volume_controller: '>=2.0.7 <3.0.0'
  # 瀑布流卡片布局（Pektino：横竖混排、按顺序填充两列不留空档）——
  # Flutter 没有原生瀑布流；这个库的 SliverMasonryGrid 是懒加载的，0.7.0 兼容 3.24
  flutter_staggered_grid_view: ^0.7.0
  # 背景图：从相册选图（1.2.0 起要 Flutter 3.27+，1.2.3 要 3.38+ → 必须钉在 1.1.x）
  image_picker: '>=1.1.0 <1.2.0'
  # 背景图存沙盒要拿 documents 目录（2.1.6 要 Flutter 3.38+ → 钉在 2.1.x）
  path_provider: '>=2.1.0 <2.1.6'
  # 导出背景图到系统相册（图集页左滑「导出」）。2.3.3 的约束很松
  # （sdk >=3.0.0 / flutter >=3.7.0、podspec ios.deployment_target 11.0），
  # 3.24.5 可用；iOS 侧需要 Info.plist 两条权限（见 .github/workflows/ios.yml）
  gal: '>=2.3.0 <3.0.0'
  # 2026-10-05（用户拍板 方案A）：**错误日志页加「导出」** —— 把整份日志当文件交给系统分享面板 ✓
  #   钉区间而**不是** `^`：`pubspec.lock` 被 gitignore ⇒ CI 每次按约束取"满足的最高版" ✓
  #   ⇒ 上限 `<13.4.0` 防大版本漂移；13.3.1 的要求逐条满足（依据 recon 调研 ✓）：
  #   Flutter ≥3.38.1（本仓 CI = 3.47.6 ✓）/ Dart ≥3.10（本仓 3.13.5 ✓）/ iOS ≥13.0（本仓部署目标 13.0 ✓）。
  share_plus: '>=13.3.1 <13.4.0'
  # 2026-10-05（用户拍板 B）：图集2（photos18）的图**全是 AVIF**、系统里 Flutter 解不出 ⇒
  #   自建**本地插件**：iOS 侧用系统自带 ImageIO（CGImageSource → CGImageDestination，PNG 无损）解 ✓
  #   ⇒ 走 `path:` 引入 ✓ **不改 CI 生成步骤、不用改 pbxproj**（CocoaPods 自动编译+注册 ✓）
  #   ⇒ 回退 = 删 `plugins/kp_avif/**` + 删这一行 + 删图集2 里那几处接线 ✓
  kp_avif:
    path: plugins/kp_avif
  # ★ 2026-10-19（用户拍板 C：全部能存相册）：HLS 下载产物 .ts → .mp4 重封装（iOS 专用插件；
  #   非 iOS 不参与构建 —— 调用方 API 见 `plugins/kp_video_export/lib/kp_video_export.dart`）
  #   ⇒ 回退 = 删 `plugins/kp_video_export/**` + 删这两行 + 删下载页开始用的 KpVideoExport 调用 ✓
  kp_video_export:
    path: plugins/kp_video_export
  device_preview: ^3.0.0
  http2: ^3.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

# ★ 2026-10-12（用户要求 ✓："Windows 端换了 iOS 端也得换，做好备份随时回退"）
#   **为什么换**：iOS 那份原生库从 pub 上的 1.1.4（钉 `MPV_XCFRAMEWORKS_VERSION=v0.6.0`，
#     2023-09-24 构建）换成 media-kit 主分支的 1.1.5（钉 **v0.7.2**，2026-06-27 构建）
#     ⇒ 两端跟进同一代 libmpv（Windows 那份 libs 另有自己的版本线，见上面 1.0.x 那行 ✓）。
#
#   ⚠️ **它不解决 seek** 🛢️（**已核实，别记错功**）：
#      `libmpv-darwin-build` 的 v0.6.0 与 v0.7.2 用的是**同一份** `ffmpeg-fix-hls-mp4-seek.patch`
#      （blob sha 两边都是 `58bffcefd983109b7ff43aee860893960f92acf6`，528 B）——
#      v0.6.0 的 `scripts/ffmpeg/build.sh` 里就明写着 `patch -p1 <…/ffmpeg-fix-hls-mp4-seek.patch` ✓；
#      且两边 **FFmpeg 同为 6.0**（`ffmpeg-6.0.tar.xz`）、**mpv 同为 v0.36.0**。
#      v0.7.2 相比 v0.6.0 **只多** `ltmain-target-passthrough.patch` +
#      `mpv-audiounit-shared-session.patch` 两条与 HLS/seek **无关**的补丁（其余 4 条 ffmpeg 补丁逐一比 sha 全同）。
#      ⇒ 想修 seek 得另找病因（或本地 fork 自己打 xcframework），**不是换这个包能解决的**。
#
#   ⚠️ 为什么钉 **commit** 而不是分支名 `main`：`main` 已迁到 pub workspace
#      （`pubspec.yaml` 里带 `resolution: workspace`，迁移提交 `b29d407a4e39` / 2026-07-02）
#      ⇒ 作为 git 依赖不安全；**本 commit `2e35dbde9fd1`（2026-06-27）在迁移之前**，
#      其 pubspec 无 `resolution` 字段 ✓（约束 `sdk >=2.17.0 <4.0.0` / `flutter >=3.0.0` ✓ 本机与 CI 都满足）。
#
#   ⚠️ 范围：**只覆盖 iOS 这一份**。**不动** `media_kit` / `media_kit_video` /
#      `media_kit_libs_windows_video` / 其它任何依赖（该包不依赖 media_kit ⇒ 无版本约束冲突 ✓）。
#
#   ⚠️ 回滚 = **删掉下面整段 `dependency_overrides`** + `flutter pub get` ⇒ 回到 1.1.4 / v0.6.0 ✓
#      （改前备份：`%TEMP%\kpxx_ios_libs_backup\`；`pubspec.yaml` sha256 `ba949d98fda1395d8f6a1a42617e8cf7d1f5e81efc22c52394260e67d86368b2`）
dependency_overrides:
  # ★ 2026-10-12（用户拍板"直接 B，一步到位"）：改成 vendor 进**本仓库**的那份
  #   （`third_party/media_kit_libs_ios_video/`），不再指 media-kit 的 git。
  #
  #   为什么弃用上面那条 git override（media-kit@`2e35dbde`）🛢️：
  #     那份带 `ios/media_kit_libs_ios_video/Package.swift` ⇒ Flutter 把它判成"**支持 SPM**"
  #     （实证：失败 run 38175637422 的"不支持 SPM 插件"清单里**唯独少了它**，成功那轮有 6 项含它）
  #     ⇒ 不再走 CocoaPods 路径 ⇒ podspec 里那句 `system("make")`（**唯一**负责产出
  #     `ios/Frameworks/Mpv.xcframework` 的步骤）不执行 ⇒ 归档链接期
  #     `Error (Xcode): Framework 'Mpv' not found`。
  #
  #   vendor 那份 = 上游 1.1.4 的**老布局**（`ios/Classes/**` + 老式 podspec，**故意没有
  #     `Package.swift`**），只有 `ios/Makefile` 的下载地址指向**我们自己 Release 的自编产物**
  #     （保留**动态** `Mpv` 框架名；目标 mpv 0.41.0 / ffmpeg 7.x —— 官方预编译停在
  #      mpv 0.36/ffmpeg 6.0，MPVKit 是 `Libmpv` + 静态库，两者都用不了）。
  #   ⚠️ 自编产物由 `.github/workflows/build-libmpv-ios.yml` 产出；它的 sha256 **必须**回填进
  #      `third_party/media_kit_libs_ios_video/ios/Makefile` 的 `MPV_XCFRAMEWORKS_SHA256SUM`
  #      （现在还是占位值 ⇒ 没回填的话 iOS 构建会**故意**在 shasum 校验那一步红掉）。
  #   ⚠️ 回滚 = **删掉下面整段 `dependency_overrides`** + `flutter pub get`
  #      ⇒ 回到 pub.dev 的 1.1.4（mpv 0.36.0 / ffmpeg 6.0，但能编过）
  media_kit_libs_ios_video:
    path: third_party/media_kit_libs_ios_video

  # ★ 2026-10-22（CI 构建失败修复）：把 `video_player_avfoundation` 钉在 **2.12.1**。
  #   🛢️ 依据：run `39737829077` 的 Swift 编译错误全部指向
  #     `video_player_avfoundation-2.12.2/.../AVFactory.swift:31` 与 `VideoPlayer.swift:205/558/568`,
  #     （`@isolation` 宏 / `isolated` 参数 / 捕获 var self —— 都是 **Swift 6.2** 才有的东西）；
  #     CI runner 是 `macos-14`（Xcode 旧，不认这些）⇒ 编译失败。
  #   🛢️ 为什么本地能编：本地 `pubspec.lock` 解析到 **2.12.1**；但 `pubspec.lock` 被 `.gitignore`
  #     忽略 ⇒ CI 的 `flutter pub get` 会重新解析 ⇒ 拿到最新的 2.12.2 ☠。
  #   ⇒ 钉 2.12.1 后 CI 与本地一致。
  #   ⚠️ 回滚 = 删掉这一行 + `flutter pub get`（同时需把 CI runner 换到 macos-15 才能用回新版）
  video_player_avfoundation: 2.12.1

flutter:
  uses-material-design: true
  assets:
    # 默认背景图（原图 3277x4096 太大：解码要 ~53MB 内存；打包前缩到 1440 宽 ≈10MB）
    - assets/bg_default.jpg
    # ★ 2026-10-12（用户要求 ✅："把站点的图标做成 app 内置的站点图标吧。每次加载图标太烦了。"）：
    #   **站点入口图标内置**（128×128 透明底 PNG，一台机器抓一次 ⇒ 之后**零网络** ✅）。
    #   来源 URL 抄各站点文件的 `iconUrl`；拿不到图标的站（51吃瓜）不加 `assetIcon` ⇒ 走首字色块 ✅。
    - assets/site_icons/
