name: kpxx
description: KPXX - 自用入口聚合应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  video_player: ^2.9.0
  encrypt: ^5.0.3
  # 区间放开：让 pub 自动挑与当前 Flutter SDK 兼容的最新版
  #（写 ^4.8.0 可能解析到要求更高 SDK 的版本导致 pub get 失败）
  webview_flutter: '>=4.7.0 <5.0.0'

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
