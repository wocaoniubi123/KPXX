name: kp_avif
description: KPXX 本地插件——iOS 侧用系统自带的 ImageIO 把 AVIF 解成 PNG。非 iOS / 解不出 ⇒ 一律 null（不崩）。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: KpAvifPlugin
      # ★ 2026-10-09（Windows 桌面链路 ✓ 用户要求"桌面上图集2 不再红叉"）：
      #   新增 **Windows 实现**（`windows/` 目录，C++ 走系统 WIC 解 AVIF ⇒ 再编成 PNG ✓）。
      #   ⚠️ **iOS 那一行与 `ios/` 目录一个字未动** ✓；两侧契约完全相同：
      #      通道 `kp_avif` / 方法 `decodeToPng` / 入 Uint8List / 出 PNG 或 null ✓。
      #   ⚠️ 系统没装 AVIF 解码器（Store 包 HEIF Image Extension）时 ⇒ 本实现返回 null ⇒
      #      Dart 侧照旧走占位 ✓ **绝不会比今天更糟** ✓。
      windows:
        pluginClass: KpAvifPluginCApi
