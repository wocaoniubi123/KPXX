name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUNDLE_ID: ysc.tool6041.sign
  TEAM_ID: Z8J7VYHQZF
  APP_NAME: KPXX

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: 生成 iOS 工程（iOS 目录不入库，构建时生成）
        run: |
          flutter create --platforms=ios --org ysc .
          ls ios/

      - name: 导入签名证书 (p12 + 描述文件)
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 -d > /tmp/cert.p12
          echo "$PROFILE_BASE64" | base64 -d > /tmp/profile.mobileprovision
          # 从描述文件取 UUID，安装到系统 Provisioning Profiles 目录
          UUID=$(security cms -D -i /tmp/profile.mobileprovision -o - 2>/dev/null | plutil -extract UUID raw - 2>/dev/null | tr -d '\n' | sed 's/.*://' || true)
          # plutil 输出可能带前缀，兜底提取
          if [ -z "$UUID" ]; then
            UUID=$(security cms -D -i /tmp/profile.mobileprovision -o - 2>/dev/null | plutil -extract UUID raw - 2>/dev/null | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/' || true)
          fi
          if [ -z "$UUID" ]; then
            echo "::error:: 无法提取描述文件 UUID"
            exit 1
          fi
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          mkdir -p -v "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # 独立 keychain，避免污染 runner
          security create-keychain -p "$P12_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$P12_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 修改 iOS 工程（bundle id / 手动签名 / 显示名）
        run: |
          cd ios
          # bundle id 必须是描述文件里的 ysc.tool6041.sign
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = ysc.kpxx;/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/' Runner.xcodeproj/project.pbxproj
          # 手动签名 + 团队 ID
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};\
                DEVELOPMENT_TEAM = ${{ env.TEAM_ID }};/' Runner.xcodeproj/project.pbxproj
          # 应用显示名
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ env.APP_NAME }}" Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${{ env.APP_NAME }}" Runner/Info.plist || true
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|CODE_SIGN_STYLE\|DEVELOPMENT_TEAM" Runner.xcodeproj/project.pbxproj | head -8

      - name: 生成导出选项 (Ad-hoc)
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key>
          <string>ad-hoc</string>
          <key>teamID</key>
          <string>${{ env.TEAM_ID }}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>provisioningProfiles</key>
          <dict>
          <key>${{ env.BUNDLE_ID }}</key>
          <string>${{ env.PROFILE_UUID }}</string>
          </dict>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Flutter build IPA
        run: |
          flutter pub get
          flutter build ipa --release --export-options-plist=ExportOptions.plist

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: kpxx-ipa
          path: build/ios/ipa/*.ipa

      - name: 列出产物
        run: ls -la build/ios/ipa/ && shasum -a 256 build/ios/ipa/*.ipa
