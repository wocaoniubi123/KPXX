name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUNDLE_ID: ysc.tool6041.sign
  TEAM_ID: Z8J7VYHQZF
  APP_NAME: KPXX

jobs:
  build:
    runs-on: macos-14
    # 发 Releases 需要写权限 ✓
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Flutter version
        run: flutter --version

      # ★ 2026-10-12（修 `Framework 'Mpv' not found`，run 38175637422 实测 ✅）：
      #   iOS 新库版 `media_kit_libs_ios_video 1.1.5`（git override）**自带 `Package.swift`** ⇒
      #   Flutter 3.47.6 **默认走 SwiftPM** 装它 ⇒ **SPM 路径不会执行 podspec 里的 `system("make")`**
      #   ⇒ `Mpv.xcframework` 永远不会被下载 ⇒ 链接期报 `Framework 'Mpv' not found` ☠
      #   （旧版 1.1.4 没有 `Package.swift` ⇒ 只能走 CocoaPods ⇒ 所以以前能出包 ✅）
      #   ⇒ **在这里显式关掉 SwiftPM，回到 CocoaPods**：podspec 的 `make` 会照常拉 xcframework ✅。
      #   ⚠️ 关掉后**对所有插件都用 CocoaPods**（与历次成功构建同一条路 ✅），不影响其它插件。
      - name: 关闭 SwiftPM（改用 CocoaPods，确保 media_kit 的 Makefile 会下载 Mpv.xcframework）
        run: flutter config --no-enable-swift-package-manager

      - name: 生成 iOS 工程（iOS 目录不入库，构建时生成）
        run: |
          flutter create --platforms=ios --org ysc --project-name kpxx .
          ls ios/

      # ★ 2026-10-13（**用户拍板：继续出未签名的包** ✅）：原「导入签名证书 (p12 + 描述文件)」整步删除
      #   —— 3 个签名 secret 已按用户要求删除（`gh secret list` 为空 ✅）⇒ 这步必失败 ☠
      #   此后 `PROFILE_UUID` / `PROFILE_NAME` **不再产生**（下面的"修改 iOS 工程"里那两个占位符会是空串，
      #   对 `--no-codesign` 构建无影响 ✅）
      - name: 签名（已移除，CI 出未签名包 ✅）
        run: |
          echo "CI 不签名 ⇒ 出未签名 IPA（kpxx-<版本>.ipa），由用户自行签名 ✅"

      - name: 修改 iOS 工程（bundle id / 手动签名 / 显示名）
        run: |
          cd ios
          # 用 python3 做全局替换（BSD sed 多行插入不可靠）
          python3 - << 'PYEOF'
          import os
          import re
          p = 'Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = ysc.kpxx;',
                        'PRODUCT_BUNDLE_IDENTIFIER = ysc.tool6041.sign;')
          # Flutter 模板自带 iphoneos 专用 identity（优先级最高），必须一并换成 Distribution
          s = s.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";',
                        '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";')
          # 模板没有 CODE_SIGN_STYLE 行（缺省=Automatic 开发签名），在三个 configuration
          # 的 DEVELOPMENT_TEAM 后补全手动签名配置（该行在 Runner 的 Debug/Release/Profile 各一处）
          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = ysc.tool6041.sign;',
                        'PRODUCT_BUNDLE_IDENTIFIER = ysc.tool6041.sign;\n\t\t\t\tDEVELOPMENT_TEAM = Z8J7VYHQZF;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "'
                        + os.environ.get('PROFILE_NAME', '') + '";')
          # ⚠️ 2026-10-08（用户要求 ✓）：把**进程名**从模板默认的 `Runner` 改成 `KPXX` ✓ ——
          #   iOS「设置 → 隐私与安全性 → 分析与改进 → 分析数据」里的文件名取的是**进程名**
          #   ⇒ 改完是 `KPXX-<日期>-<时分秒>.ips` ✓（模板里 `CFBundleName` = `$(PRODUCT_NAME)` ⇒ 一起变 ✓）。
          #   ⚠️ 只影响**以后**产生的日志 ✗（旧文件仍叫 `Runner-…` ✓）；模板里 `RunnerTests` 那个 target
          #   用的是同一个占位串 ⇒ 会一起被改名（我们不跑单测、archive 也不编它 ⇒ 实测无影响 ✓，CI 若报错
          #   就按这一行回退 ✓）。
          s = s.replace('PRODUCT_NAME = "$(TARGET_NAME)";', 'PRODUCT_NAME = KPXX;')
          # media_kit(libmpv) 需要 iOS 13+，部署目标一并提到 13.0
          s = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
                     'IPHONEOS_DEPLOYMENT_TARGET = 13.0;', s)
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          # Podfile 的平台版本也提到 13.0（模板里这行默认是注释掉的）
          python3 - << 'PYEOF'
          import re
          p = 'Podfile'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r"#?\s*platform :ios, '[0-9.]+'", "platform :ios, '13.0'", s, count=1)
          if s2 == s:
              s2 = "platform :ios, '13.0'\n" + s
          open(p, 'w', encoding='utf-8').write(s2)
          PYEOF
          grep -n "platform :ios" Podfile
          # 应用显示名
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ env.APP_NAME }}" Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${{ env.APP_NAME }}" Runner/Info.plist || true
          # 相册权限（背景图「从相册选择」用）：iOS 14+ 走 PHPicker 本来不需要，
          # 但部署目标是 13.0，iOS 13 会走 UIImagePickerController —— 缺这条描述会直接崩
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 换背景图时需要从相册选一张图片" Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 换背景图时需要从相册选一张图片" Runner/Info.plist
          grep -n "NSPhotoLibraryUsageDescription" Runner/Info.plist
          # 写相册权限（图集页左滑「导出」用 gal 存进系统相册）：iOS 14+ 走的是
          # **addOnly**（只写）授权 —— 缺这条描述**直接崩**（gal 源码 GalPlugin.swift
          # 的 hasAccess/requestAccess 分支：14+ 用 .addOnly，13 用全部权限）
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 保存图片或视频到系统相册时需要相册写入权限" Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 保存图片或视频到系统相册时需要相册写入权限" Runner/Info.plist
          grep -n "NSPhotoLibraryAddUsageDescription" Runner/Info.plist
          # ★ 2026-10-08（用户要求 ✓）：**让 App 的 Documents 出现在「文件」App 里** ✅ ——
          #   目的：直接在「文件 → 我的 iPhone → KPXX」里看 `kpxx_error.log` ✓（不用再走 设置→诊断→导出 ✓）。
          #   ⚠️ **两个键都要** ✓：`UIFileSharingEnabled`（显示名「应用支持 iTunes 文件共享」）
          #   + `LSSupportsOpeningDocumentsInPlace`（「就地打开文稿」）—— 缺后者就不会出现在
          #   「文件」App 的「我的 iPhone」里 ✗。只暴露 `Documents/` ✓（Library/Caches 不会露 ✓）。
          #   代价（已知 ✓）：用户可在「文件」里改/删 `Documents/` 里的文件 ✗（日志被删=无事 ✓；
          #   背景图被删那张就加载失败 ✓ 属可接受）。
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" Runner/Info.plist
          grep -n "UIFileSharingEnabled\|LSSupportsOpeningDocumentsInPlace" Runner/Info.plist
          # ⚠️ **关掉 Impeller**（用户 2026-10-02 报"软件有时候会字体会变成这样"——花字，
          # 跨控件、偶发，截图里顶部通知条/图标标签/底部文字块同时花 ✗）。
          # 判断依据（**推断 🔍，不是已确认**）：
          #   · 项目**没有打包字体**、也没设 `fontFamily` → 用的是系统字体 → 排除"缺字形"✗
          #     （缺字形会是方框 □□□，不是这种乱码状 ✗）
          #   · 花字**横跨好几个互不相关的控件** → 指向**渲染层**而不是某个控件 ✗
          #   · Flutter 3.24 在 iOS 上**默认走 Impeller** ✓ → 它是最小代价的一次实验 ✓
          # 验证方式：装这个包后看花字还会不会出现 ✓。**若仍然花**，说明不是它 → 把这三行删掉
          # 即可回退 ✓（同时我再去查：背景图那层滤镜/混合、以及文字是否画在带 filter 的图层上）。
          /usr/libexec/PlistBuddy -c "Add :FLTEnableImpeller bool false" Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :FLTEnableImpeller false" Runner/Info.plist
          grep -n "FLTEnableImpeller" Runner/Info.plist
          # ★ 2026-10-24（用户拍板方案 ①）：**允许明文 HTTP** —— 直播聚合接口只给 `http://`（无 https）：
          #   目录 `http://api.hclyz.com:81/mf/json.txt`、备用 `http://api.maiyoux.com:81/mf/json.txt`
          #   🛢️ 实证：iOS 上两个域名都报 `ClientException`（用户 1.6.1 真机日志）；
          #     同一 URL 在服务器/Windows 端都是 HTTP 200 ⇒ 不是域名挂了，是 **iOS ATS 拒绝明文 HTTP**。
          #   🛢️ 本工程此前**从未配过 ATS**（全文件无 NSAppTransportSecurity / NSAllowsArbitraryLoads）。
          #   ⚠️ 用**全局**开关（不是 `NSExceptionDomains` 白名单）：该接口的域名会变
          #     （作者文件头写了"备用域名 api.maiyoux.com:81"，且它给的查新域名渠道已失效）
          #     ⇒ 白名单会随域名更换再次失效 ✗；全局开关换域名也照样能用 ✅。
          #   回退：删掉下面这几行即可（不影响其它任何配置）✅
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" Runner/Info.plist
          # 自证：写进去了才算（没写进去当场失败，别等到装机才发现 ✗）
          grep -A2 -n "NSAppTransportSecurity" Runner/Info.plist || { echo "::error::NSAppTransportSecurity 未写入 Info.plist（明文 HTTP 仍会被 ATS 拒）"; exit 1; }
          grep -q "NSAllowsArbitraryLoads" Runner/Info.plist || { echo "::error::NSAllowsArbitraryLoads 未写入 Info.plist"; exit 1; }
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE\|DEVELOPMENT_TEAM" Runner.xcodeproj/project.pbxproj | head -12
          grep -n "PRODUCT_NAME = KPXX;" Runner.xcodeproj/project.pbxproj | head -6
          # 自证：进程名确实改成了 KPXX（一处都没有就**当场失败** ✗ —— 分析数据文件名靠它 ✓）
          grep -q "PRODUCT_NAME = KPXX;" Runner.xcodeproj/project.pbxproj || { echo "::error::PRODUCT_NAME 未改成 KPXX（分析日志名不会变）"; exit 1; }

      - name: 替换 App 图标（ios_icon/ ⇒ Runner/Assets.xcassets/AppIcon.appiconset）
        run: |
          SET=ios/Runner/Assets.xcassets/AppIcon.appiconset
          echo "--- 模板自带（替换前）---"; ls -1 "$SET" | head -25
          cp -f ios_icon/Icon-App-*.png "$SET"/
          echo "--- 替换后 ---"; ls -1 "$SET" | head -25
          # 每个图标都必须被模板的 Contents.json 引用；有一个没被引用就**当场失败** ✗（不静默）
          for f in ios_icon/Icon-App-*.png; do
            n=$(basename "$f")
            grep -q "\"$n\"" "$SET/Contents.json" || { echo "::error::Contents.json 未引用 $n —— 图标没生效"; exit 1; }
          done
          echo "15 个图标全部被 Contents.json 引用 ✓"
          # 尺寸核对：1024 那张必须是 1024×1024（App Store 尺寸，iOS 必需）
          python3 -c "import struct,sys; d=open('$SET/Icon-App-1024x1024@1x.png','rb').read(33); w,h=struct.unpack('>II',d[16:24]); print('1024 图实际尺寸 =',w,'x',h); sys.exit(0 if (w,h)==(1024,1024) else 1)"

      # ★ 2026-10-13（用户拍板"出未签名的包" ✅）：原「生成导出选项 (Ad-hoc)」整步删除
      #   —— `ExportOptions.plist` 只对"签名导出 (flutter build ipa --export-options-plist)"有意义；
      #      现在走 `--no-codesign` + 自己打包 ⇒ 不再需要它（也避免了引用 `PROFILE_UUID` 必失败 ☠）✅

      # ⚠️ 一次列出全部 Dart 错误 ✓（CFE 每轮只抛第一条 ✗，会拖成十几轮）
      # 只对 error 生效：infos/warnings 不算失败 ✓（仓库无 analysis_options.yaml，噪音低 ✓）
      - name: 代码检查 (flutter analyze)
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Flutter build IPA
        run: |
          flutter pub get
          # ★ 2026-10-05（用户拍板"**方案 2**"✓）：让**系统/签名看到的版本号 = `kAppVersion`** ✗
          #   原来 iOS 工程吃的是 `pubspec.yaml:4` 的 `version: 1.0.0+1` ☠（全仓没有一处设过 CFBundleShortVersionString ✓ 已核 ✓）
          #   ⚠️ 注意：**下面**"按版本号重命名 IPA"那步（:164-166）是**构建之后**才把 `APP_VERSION` 写进 `$GITHUB_ENV` 的 ✗
          #      ⇒ 构建这一步**必须就地读一次** ✓（本步只加这几行 ✗ **没有改动任何步骤的顺序** ✓）
          VER=$(sed -n "s/.*kAppVersion = '\([^']*\)'.*/\1/p" lib/app_version.dart | head -1)
          if [ -z "$VER" ]; then echo "::error:: 读不到 kAppVersion"; exit 1; fi
          # `--build-number` **只能是数字** ✓（`CFBundleVersion` 不接受点号 ✗）
          #   ⇒ 取"版本号**去掉点**"：1.1.0⇒110、1.1.9⇒119、1.2.0⇒120 ✓ —— **单调递增** ✓
          #   （依据 ✓：新规则"每段 0~9、满 9 进位"（见 `lib/app_version.dart` ✓）⇒ 去点后按数字比较永远递增 ✓；
          #     另一条路 = 直接用 `$GITHUB_RUN_NUMBER` ✓ 但那样与版本号无关 ✗ 故不取 ✓）
          flutter build ios --release --no-codesign \
            --build-name="$VER" --build-number="$(echo $VER | tr -d '.')"
          # ★ 2026-10-13（用户拍板"出未签名的包" ✅）：**自己打"未签名 ipa"** ——
          #   `--no-codesign` 只产 `build/ios/iphoneos/<PRODUCT_NAME>.app`（无签名 ✅）
          #   ⚠️ 本仓 `PRODUCT_NAME` 已被改成 **`KPXX`**（见上面"修改 iOS 工程"那步 ✅）
          #      ⇒ 产物是 **`KPXX.app`**，**不是** `Runner.app`（2026-10-13 实测踩过：写死 Runner.app 直接失败 ☠）
          #      ⇒ 这里用 **glob** 取，避免以后再被改名坑 ✅
          #   ⇒ 按 ipa 规范打包：`Payload/<app>` ⇒ `ditto -c -k --sequesterRsrc --keepParent`
          #      （macOS 原生；避免 zip 打进 `__MACOSX`/resource fork 影响用户自行重签 ✅）
          APP=$(ls -d build/ios/iphoneos/*.app | head -1)
          echo "APP=$APP"
          rm -rf /tmp/pk && mkdir -p /tmp/pk/Payload
          cp -R "$APP" "/tmp/pk/Payload/$(basename "$APP")"
          mkdir -p build/ios/ipa
          (cd /tmp/pk && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/build/ios/ipa/kpxx-$VER.ipa")
          ls -la build/ios/ipa/

      # ✅ 按 App 里的版本号给 ipa 改名（用户 2026-10-03 要求：方便区分每次构建 ✓）
      - name: 按版本号重命名 IPA
        run: |
          VER=$(sed -n "s/.*kAppVersion = '\([^']*\)'.*/\1/p" lib/app_version.dart | head -1)
          if [ -z "$VER" ]; then echo "::error:: 读不到 kAppVersion"; exit 1; fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          cd build/ios/ipa
          # ★ 2026-10-13：上面已按 `kpxx-$VER.ipa` 命名 ⇒ 这里跳过它自己（`mv a a` 会报错 ☠）
          for f in *.ipa; do
            [ "$f" = "kpxx-$VER.ipa" ] && continue
            mv "$f" "kpxx-$VER.ipa"
          done
          ls -la
      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: kpxx-ipa
          path: build/ios/ipa/*.ipa

      # ✅ 另发一份到 Releases（ipa 直下 ✓）；Actions 产物仍保留 ✓（用户 2026-10-03 决定：两边都出 ✓）
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$TAG" build/ios/ipa/*.ipa \
            --title "$TAG" \
            --notes "自动构建 ${{ github.sha }}（$(date -u +%Y-%m-%dT%H:%MZ)）"
          echo "已发布 Release: $TAG"
      - name: 列出产物
        run: ls -la build/ios/ipa/ && shasum -a 256 build/ios/ipa/*.ipa
