name: Build libmpv iOS xcframework (self-built)

# ★ 2026-10-12（用户拍板"直接 B，一步到位"）
#   目的：自己编一份 iOS 用的 libmpv xcframework，**保留动态框架名 `Mpv`**（media_kit 硬编码要它：
#     `media_kit/lib/src/player/native/core/native_library.dart` 里 iOS/macOS 的库名是
#     `Mpv.framework/Mpv`，且走 `DynamicLibrary.open(...)` ⇒ 必须是【动态】框架）。
#
#   为什么不用现成的：
#     · 官方 media-kit/libmpv-darwin-build 的预编译已到天花板：v0.6.0 / v0.7.2 / v0.7.3
#       全是 `mpv 0.36.0` + `ffmpeg 6.0`（依据：各 tag 的 `packages.lock.nix` 原文）
#     · mpvkit/MPVKit（活跃，mpv 0.41.0 / ffmpeg n9.0.2）不能用：框架名是 `Lib*`（不是 `Mpv`），
#       且其 `Libmpv.xcframework` 内层是 `!<arch>` **静态归档**（实测 Mach-O 头），
#       `DynamicLibrary.open` 加载不了；依赖族也与官方那套不同，无法混搭。
#
#   做法 = 复用官方**配方**（nix + patches），只升 ffmpeg / mpv 两个版本号 ⇒ 产物形态/命名与官方一致。
#
#   产物名（由官方 nix 公式决定，原文：`archiveBaseName = "libmpv-${format}_${version}_${os}-${arch}-${variant}-${flavor}"`）：
#     `libmpv-xcframeworks_<VERSION>_ios-universal-video-default.tar.gz`
#   ⚠️ `<VERSION>` 会**同时**用作 Release 的 tag 与资产文件名的一部分 ——
#      因为下游 `third_party/media_kit_libs_ios_video/ios/Makefile` 的下载 URL 是手写的固定串。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本串：既进产物文件名，也当 Release tag（改这里要同步改 third_party 里的 Makefile URL）"
        required: true
        default: "libmpv-ios-0.41.0-ffmpeg7.1"
      ffmpeg_version:
        description: "FFmpeg 版本（对应 https://ffmpeg.org/releases/ffmpeg-<ver>.tar.xz）"
        required: true
        default: "7.1"
      mpv_version:
        description: "mpv 版本（不带 v 前缀，对应 https://github.com/mpv-player/mpv/archive/refs/tags/v<ver>.tar.gz）"
        required: true
        default: "0.41.0"
      dry_run:
        description: "只准备不构建（校验版本改行是否生效，不编、不发 Release）"
        type: boolean
        default: false

# 发 Release 要写权限（与仓库现有的 ios.yml 同款做法）
permissions:
  contents: write

jobs:
  build:
    # 与官方 ci.yaml 一致：macos-15（arm64）。官方注释原文指向 macos-15-arm64 runner 说明
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
      MPV_VERSION: ${{ inputs.mpv_version }}
      RECIPE_REPO: media-kit/libmpv-darwin-build
      # 钉 tag（不用 main）：可复现。v0.7.3 = 2026-09-14，官方最新
      RECIPE_REF: v0.7.3
      # 只编 media_kit 需要的那一个目标（官方 Makefile 注释给的属性名格式：
      #   `mk-out-archive-libs-macos-universal-video-default`）⇒ 不编全矩阵，省时间
      TARGET: mk-out-archive-xcframeworks-ios-universal-video-default
      ASSET_NAME: libmpv-xcframeworks_${{ inputs.version }}_ios-universal-video-default.tar.gz

    steps:
      # ★ ASCII 自检（**放最前面，目的是快速失败**，别再浪费一次 7 分钟的真编）
      #   依据 🛢️（上一轮 CI 原文）：
      #     `/Users/runner/work/_temp/576f701a-….sh: line 4: FF_URL<坏字节>: unbound variable`
      #     `##[error]Process completed with exit code 1.`
      #   触发点：那句 `echo "下载 $FF_URL（约 11MB，只这一次）"` —— **`$FF_URL` 紧跟全角括号「（」**，
      #   runner 写临时 .sh 时那个字节被损坏 ⇒ bash 把坏字节当成变量名的一部分 ⇒ unbound variable。
      #   （同文件其它中文在日志里都完整，说明不是整体乱码，而是"变量紧邻非 ASCII"这种组合触发。）
      #   ⇒ 铁律：**中文/全角只准出现在 `name:` / YAML 注释 / 文档里；`run:` 块内一律 ASCII**。
      #   这道自检读的就是本文件，run 块里任何一个字节 > 127 就当场红并打印行号/列号。
      - name: 本仓库 checkout（只为下面那道 ASCII 自检读本 workflow 文件）
        uses: actions/checkout@v4
        with:
          path: self

      - name: ASCII 自检（run 块内不得出现非 ASCII 字节）
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          p = 'self/.github/workflows/build-libmpv-ios.yml'
          lines = open(p, encoding='utf-8').read().replace('\r\n', '\n').split('\n')
          bad = []
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)run:\s*\|\s*$', lines[i])
              if m:
                  base = len(m.group(1))
                  j = i + 1
                  while j < len(lines):
                      ln = lines[j]
                      if ln.strip() == '':
                          j += 1
                          continue
                      if len(ln) - len(ln.lstrip(' ')) <= base:
                          break
                      for k, ch in enumerate(ln):
                          if ord(ch) > 127:
                              bad.append((j + 1, k + 1, 'U+%04X' % ord(ch)))
                      j += 1
                  i = j
              else:
                  i += 1
          print('run-block non-ASCII characters: %d' % len(bad))
          for ln_no, col, cp in bad[:50]:
              print('  line %d col %d %s' % (ln_no, col, cp))
          if bad:
              sys.exit('FAIL: run blocks must be pure ASCII (runner mangles non-ASCII bytes placed right after shell variables)')
          print('OK: every run block is pure ASCII')
          PY

      - name: Platform info
        run: |
          printf "%-16s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-16s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-16s %s\n" "Arch:"           "$(uname -m)"

      - name: Checkout 官方配方（钉 tag）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RECIPE_REPO }}
          ref: ${{ env.RECIPE_REF }}
          path: recipe

      # 与官方 ci.yaml 同款：DeterminateSystems 的 nix 安装器 + magic-nix-cache
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Nix version
        run: nix --version

      # ★ 只改 packages.lock.nix 里 ffmpeg / mpv 两段的 version + url + sha256（共 6 行）
      #   sha256 官方**不给**（实测 https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz.sha256 → 404）
      #     ⇒ 用 `nix-prefetch-url --type sha256 <url>` 现算（nix 接受 base32 形式的 sha256）
      #   （mpv 走 GitHub tarball，更没有官方 sha，同样现算）
      - name: 改版本 pin（ffmpeg / mpv）
        run: |
          set -euo pipefail
          cd recipe
          FF_URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          MPV_URL="https://github.com/mpv-player/mpv/archive/refs/tags/v${MPV_VERSION}.tar.gz"
          echo "ffmpeg url = $FF_URL"
          echo "mpv    url = $MPV_URL"
          FF_SHA=$(nix-prefetch-url --type sha256 "$FF_URL")
          MPV_SHA=$(nix-prefetch-url --type sha256 "$MPV_URL")
          echo "ffmpeg sha256(base32) = $FF_SHA"
          echo "mpv    sha256(base32) = $MPV_SHA"
          FF_VERSION="$FFMPEG_VERSION" MPV_VERSION="$MPV_VERSION" \
          FF_URL="$FF_URL" MPV_URL="$MPV_URL" FF_SHA="$FF_SHA" MPV_SHA="$MPV_SHA" \
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path('packages.lock.nix')
          s = p.read_text()
          def patch_block(s, key, version, url, sha):
              # replace only version / url / sha256 inside this attribute block
              pat = re.compile(r'(?ms)^(\s*' + key + r'\s*=\s*\{)(.*?)(^\s*\};)')
              m = pat.search(s)
              assert m, f'block not found: {key}'
              body = m.group(2)
              body2, n1 = re.subn(r'(?m)^\s*version\s*=\s*"[^"]*";', f'  version = "{version}";', body, count=1)
              body2, n2 = re.subn(r'(?m)^\s*url\s*=\s*"[^"]*";',     f'  url = "{url}";',         body2, count=1)
              body2, n3 = re.subn(r'(?m)^\s*sha256\s*=\s*"[^"]*";',  f'  sha256 = "{sha}";',      body2, count=1)
              assert n1 == n2 == n3 == 1, f'{key}: replaced version={n1} url={n2} sha256={n3}'
              return s[:m.start(2)] + body2 + s[m.end(2):]
          s = patch_block(s, 'ffmpeg', os.environ['FF_VERSION'], os.environ['FF_URL'], os.environ['FF_SHA'])
          s = patch_block(s, 'mpv',    os.environ['MPV_VERSION'], os.environ['MPV_URL'], os.environ['MPV_SHA'])
          p.write_text(s)
          print('--- ffmpeg / mpv blocks after patch ---')
          for key in ('ffmpeg', 'mpv'):
              m = re.search(r'(?ms)^\s*' + key + r'\s*=\s*\{.*?^\s*\};', s)
              print(m.group(0))
          PY
          # self-check: all three lines must be the new version; fail loudly otherwise
          grep -q "ffmpeg-${FFMPEG_VERSION}.tar.xz" packages.lock.nix
          grep -q "tags/v${MPV_VERSION}.tar.gz"     packages.lock.nix
          echo "OK: version pins updated"

      # ★ patch 分流（triage）—— 2026-10-12 **第二版**（依据 = 上一轮 CI 的实测 + 本机复核）
      #
      #   上一轮 CI 实况 🛢️（监控从全量日志取的原文）：
      #     `mk-pkg-ffmpeg-patched-source> patching file libavformat/hls.c`
      #     `Reversed (or previously applied) patch detected!  Assume -R? [n]`
      #     `1 out of 1 hunk ignored -- saving rejects to file libavformat/hls.c.rej`
      #     ⇒ 唯一那条"硬失败"patch（ffmpeg-fix-hls-mp4-seek）反而把构建搞红了。
      #   本机复核（下载 ffmpeg-7.1.tar.xz，只解出 libavformat/hls.c 看）🛢️：
      #     · `hls_read_seek` 起于 **L2440**；该修复恰在 **L2510-L2511**：
      #         L2510  /* Reset the init segment so it's re-fetched and served appropiately */
      #         L2511  pls->cur_init_section = NULL;
      #       —— **逐字命中，连原 patch 里 "appropiately" 这个拼写错误都一模一样**
      #     ⇒ 结论：**ffmpeg ≥ 7.1 已内含该 fMP4-HLS seek 修复**。
      #   ⚠️ 但不只信我这台机器：**下面先让 CI 自己再证一遍**（"自证"步骤），
      #      **再按它的输出自动决定**这条 patch 是"移除"还是"降级为容忍" ——
      #      一轮 CI 同时完成"取证 + 适配"，不必人工再改一次文件。
      #
      #   其余 patch 一律容忍档（`--forward --fuzz=5 || WARN`）。
      #
      #   ===== 2026-10-12 第三版：7 条 patch 一次性判清（依据 = 逐条下载 7.1 / 0.41 源码 grep，见下表）=====
      #   | 补丁                            | 干什么                                                        | 目标版本已内含? | 符号还在?（会不会编不过）                                                            | 处置 |
      #   |---------------------------------|---------------------------------------------------------------|-----------------|--------------------------------------------------------------------------------------|------|
      #   | ffmpeg-fix-hls-mp4-seek         | fMP4-HLS seek 时重置 init segment                               | 已内含          | -                                                                                    | 移除（自证自动） |
      #   | ffmpeg-fix-vp9-hwaccel          | 拆出独立 vp9_videotoolbox 解码器 + Intel 上换 superframe bsf        | 未内含          | **编不过**：FF_CODEC_CAP_ALLOCATE_PROGRESS 在 7.1 里已不存在                              | **移除（无条件）** |
      #   | ffmpeg-fix-ios-hdr-texture      | iOS 上 10bit 不走 P010 走 BGRA（GLES 无 10bit 纹理）+ 32BGRA 非 full-range 也能映射 | 未内含 | 都在（videotoolbox_best_pixel_format L1143、P010 L1180、BGRA 表项 L52）                    | 保留容忍 |
      #   | ffmpeg-fix-dash-base-url-escape | DASH baseUrl 做 XML 转义                                        | 未内含          | 都在（原语句 dashdec.c L774；xmlEncodeSpecialChars 是 libxml2 API）                       | 保留容忍 |
      #   | mpv-fix-missing-objc            | meson 里补 add_languages('objc')（Apple 编 .m 需要）               | 未内含          | 无新符号                                                                              | 保留容忍 |
      #   | mpv-audiounit-shared-session    | AudioUnit AO 加引用计数式 AVAudioSession + 新选项                  | 未内含          | -（CI 已证**打不上**）                                                                  | 保留容忍 |
      #   | mpv-remove-libass               | 去掉 libass 依赖                                                | 未内含          | 无新符号                                                                              | 保留容忍（**且见下**） |
      #
      #   逐条依据（都是对 7.1 / 0.41 真源码 grep 出来的）：
      #   · vp9：FF_CODEC_CAP_ALLOCATE_PROGRESS 在 7.1 libavcodec/codec_internal.h **0 命中**
      #     （与 CI 原文 vp9.c:1887:33 error: use of undeclared identifier 'FF_CODEC_CAP_ALLOCATE_PROGRESS' 吻合）；
      #     且 ff_vp9_videotoolbox_decoder 在 7.1 的 vp9.c / allcodecs.c **均 0 命中**（上游没并它）。
      #     => **移除它不丢 VP9 硬解**：7.1 的通用 ff_vp9_decoder 里**本来就有**
      #        #if CONFIG_VP9_VIDEOTOOLBOX_HWACCEL / HWACCEL_VIDEOTOOLBOX(vp9)（vp9.c L1871-1873）。
      #        该补丁真正做的事是"把 VT 从通用解码器拆成独立 vp9_videotoolbox 解码器" => 我们不需要。
      #   · hdr-texture：7.1 的 videotoolbox_best_pixel_format 里 return AV_PIX_FMT_P010;(L1180) 附近
      #     **没有** TARGET_OS_IPHONE 分支（该文件里 3 处 TARGET_OS_IPHONE 在 L790/919/927，与此无关）；
      #     hwcontext_videotoolbox.c L52 仍是 { kCVPixelFormatType_32BGRA, true, AV_PIX_FMT_BGRA }
      #     => 补丁两个 hunk 的上下文都还在，能干净打上、符号齐。
      #   · dash：7.1 dashdec.c 里 xmlEncodeSpecialChars **0 命中**、原语句 xmlNodeSetContent(node, root_url); 仍在 L774
      #     => 能干净打上。（注：我们的内容只走 HLS，这条价值低；但它既然能干净打上，按规矩**不擅自动它**。）
      #   · missing-objc：0.41 的 meson.build 里 add_languages('objc') **0 命中** => 仍需要。
      #   · audiounit-shared-session：0.41 的 ao_audiounit.m 里补丁引入的 acquire_audio_session / use_count **0 命中**，
      #     且 CI 实测前向失败 => 保留容忍。它在官方 **v0.6.0**（我们现用那版）的 patch 列表里**本来就没有**
      #     （v0.6.0 = 6 条 / v0.7.2 = 8 条）=> 丢它**不构成回退**。
      #   · remove-libass：nix/packages/mk-pkg-mpv/default.nix 原文表明它**只在 audio 变体下执行**：
      #       if [ "${variant}" == "${variants.audio}" ]; then ... patch -p1 <...mpv-remove-libass.patch ...
      #     而我们编的是 ...-video-default => **variant=video => 那条 if 不成立 => 这条 patch 根本不会被执行**（inert）。
      #     目标行虽都还在（能干净打上），但对我们等于空操作 => 保持原样（容忍档），不额外动手。
      #
      #   ★ "下一条会编不过的"排查结论：除 vp9 外，**没有**发现"能打上但引用符号已消失"的补丁
      #     （hdr / dash 的目标符号逐一在 7.1 里确认存在；missing-objc / remove-libass 不引入新符号；
      #      audiounit 是打不上而非编不过）。❓ 未纳入本表的只有 ltmain-target-passthrough.patch
      #     —— 它不作用在这两个 nix 文件上（是 libtool 系的包用的），本流程不重写它，也**没审计**它。
      #
      #   ⚠️ `mpv-audiounit-shared-session.patch` 上一轮**实测打不上**（mpv 0.36→0.41 变动）。影响面：
      #     · 它是什么 🛢️（patch 原文）：**非上游的自定义改动**，给 mpv 的 AudioUnit AO
      #       (`audio/out/ao_audiounit.m`) 加"**引用计数式** AVAudioSession 管理"
      #       （pthread 锁 + `audiounit_session_use_count`，acquire/release 成对），
      #       并把原先内联的 `setCategory:Playback` / `setMode:MoviePlayback` / `setActive:YES|NO`
      #       换成 `acquire_audio_session()` / `release_audio_session()`，
      #       另外**新增一个选项** `audiounit-skip-session-management`。
      #     · 打不上 ⇒ 退回 mpv **原生**行为（就是该 patch 的 `-` 那几行：init 里直接设会话、
      #       uninit 里 `setActive:NO` + `NotifyOthersOnDeactivation`），
      #       **没有** `MixWithOthers`、**没有**引用计数、**没有**那个选项。
      #     · 选项缺失的影响 = **0** 🛢️：`audiounit-skip-session-management` 在**本仓库**与
      #       media_kit 全家族（media_kit / media_kit_video / media_kit_libs_ios_video /
      #       media_kit_libs_windows_video）**全部 0 命中** —— 没有任何代码在设它。
      #     · 会话行为的差异 **不构成回退** 🛢️：这条 patch 在官方 **v0.6.0**（我们**现在**就在用的那版）
      #       的 patch 列表里**本来就没有**（v0.6.0 = 6 条，v0.7.2 = 8 条，多出来的正是它 + ltmain）
      #       ⇒ 丢它 = 与现状持平。
      #     · ❓ 未验证：多实例并发播放时"引用计数缺失"会不会真出问题 —— 没测过，**不猜**。
      - name: 自证：ffmpeg 7.1 是否已内含 fMP4-HLS seek 修复（只取证，不改构建行为）
        id: hls_fix
        run: |
          set -euo pipefail
          cd recipe
          FF_URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          echo "downloading $FF_URL (about 11MB, once only)"
          curl -L --fail --silent --show-error -o "$RUNNER_TEMP/ff.tar.xz" "$FF_URL"
          mkdir -p "$RUNNER_TEMP/ffsrc"
          tar -xJf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP/ffsrc" "ffmpeg-${FFMPEG_VERSION}/libavformat/hls.c"
          rm -f "$RUNNER_TEMP/ff.tar.xz"   # already extracted; do not waste runner disk
          HLS="$RUNNER_TEMP/ffsrc/ffmpeg-${FFMPEG_VERSION}/libavformat/hls.c"
          test -f "$HLS"
          echo "hls.c bytes = $(wc -c < "$HLS")"
          echo "hls_read_seek starts at: $(grep -nF 'static int hls_read_seek' "$HLS" | head -1)"

          # extract the '+' lines of the patch (excluding '+++') as feature strings, trimmed
          grep -E '^\+[^+]' patches/ffmpeg-fix-hls-mp4-seek.patch \
            | sed -e 's/^+//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^$' > "$RUNNER_TEMP/features.txt"
          TOTAL=$(wc -l < "$RUNNER_TEMP/features.txt" | tr -d ' ')
          echo "feature strings = $TOTAL"
          HIT=0
          while IFS= read -r feat; do
            if grep -nF -- "$feat" "$HLS" > "$RUNNER_TEMP/hit.txt"; then
              HIT=$((HIT + 1))
              echo "  HIT $(head -1 "$RUNNER_TEMP/hit.txt")"
              echo "      feature: $feat"
            else
              echo "  MISS: $feat"
            fi
          done < "$RUNNER_TEMP/features.txt"

          if [ "$TOTAL" -gt 0 ] && [ "$HIT" -eq "$TOTAL" ]; then
            echo "VERDICT: ffmpeg ${FFMPEG_VERSION} ALREADY CONTAINS the fMP4-HLS seek fix (features $HIT/$TOTAL all hit)"
            echo "present=true" >> "$GITHUB_OUTPUT"
            {
              echo "### fMP4-HLS seek self-check"
              echo "- ffmpeg ${FFMPEG_VERSION} libavformat/hls.c: feature strings $HIT/$TOTAL all hit"
              echo "- verdict: ALREADY CONTAINED => that patch will be removed automatically"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "VERDICT: NOT contained ($HIT/$TOTAL) => the fMP4-HLS seek fix would be MISSING, needs separate evaluation"
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### fMP4-HLS seek self-check"
              echo "- ffmpeg ${FFMPEG_VERSION} libavformat/hls.c: feature strings $HIT/$TOTAL hit"
              echo "- verdict: NOT contained => patch downgraded to tolerant; build continues but SEEK FIX MAY BE MISSING"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: patch 分流（hls 按自证结果自动移除/降级；vp9 无条件移除；其余容忍）
        run: |
          set -euo pipefail
          cd recipe
          HLS_PRESENT='${{ steps.hls_fix.outputs.present }}' python3 - <<'PY'
          import os, pathlib, re
          HLS = 'ffmpeg-fix-hls-mp4-seek.patch'
          # Patches removed unconditionally (see the audit table in the comment block above this step):
          #   vp9-hwaccel cannot compile against ffmpeg >= 7.1 (FF_CODEC_CAP_ALLOCATE_PROGRESS was removed)
          #   and is not needed: the vanilla ff_vp9_decoder in 7.1 already carries HWACCEL_VIDEOTOOLBOX(vp9).
          REMOVE_ALWAYS = {'ffmpeg-fix-vp9-hwaccel.patch'}
          present = os.environ.get('HLS_PRESENT') == 'true'
          print(f'hls fix already contained (from self-check step) = {present}')
          files = ['nix/packages/mk-pkg-ffmpeg/default.nix', 'nix/packages/mk-pkg-mpv/default.nix']
          line_re = re.compile(r'^(\s*)patch -p1 <(\$\{\.\./\.\./\.\./patches/([A-Za-z0-9_.\-]+)\})\s*$')
          total_matched = 0
          for f in files:
              p = pathlib.Path(f)
              out, wrapped, removed = [], [], []
              had_hls = False
              seen_remove_always = set()
              file_matched = 0
              for line in p.read_text().splitlines(keepends=True):
                  m = line_re.match(line.rstrip('\n'))
                  if not m:
                      out.append(line)
                      continue
                  file_matched += 1
                  name = m.group(3)
                  if name == HLS:
                      had_hls = True
                  if name in REMOVE_ALWAYS:
                      seen_remove_always.add(name)
                  if name in REMOVE_ALWAYS:
                      # cannot compile on the new version and not needed => drop it (see the audit table)
                      out.append(f'{m.group(1)}echo "NOTE: skip {name} -- removed: does not compile against the new ffmpeg (FF_CODEC_CAP_ALLOCATE_PROGRESS gone) and is not needed"\n')
                      removed.append(name)
                  elif name == HLS and present:
                      # already upstream (ffmpeg >= 7.1) => drop the patch, leave a log line in the nix build log
                      out.append(f'{m.group(1)}echo "NOTE: skip {name} -- already contained in ffmpeg >= 7.1 (see the self-check step)"\n')
                      removed.append(name)
                  elif name == HLS:
                      out.append(f'{m.group(1)}(patch -p1 --forward --fuzz=5 <{m.group(2)} || echo "SEEK-FIX-MISSING: {name} cannot apply and ffmpeg 7.1 does not contain it => seek fix missing")\n')
                      wrapped.append(name)
                  else:
                      out.append(f'{m.group(1)}(patch -p1 --forward --fuzz=5 <{m.group(2)} || echo "WARN-PATCH-FAILED: {name}")\n')
                      wrapped.append(name)
              total_matched += file_matched
              p.write_text(''.join(out))
              print(f'{f}: processed={file_matched} removed={removed} tolerant={wrapped}')
              # every REMOVE_ALWAYS patch that exists in this file MUST have been removed
              assert seen_remove_always <= set(removed), \
                  f'{f}: REMOVE_ALWAYS patch not removed: {sorted(seen_remove_always - set(removed))}'
              # the assertion must branch on whether THIS file actually contains the hls patch
              # (behavior test on the dev machine caught the unconditional version crashing on the mpv file)
              if had_hls:
                  assert (HLS in removed) if present else (HLS in wrapped), \
                      f'{f}: has hls patch but handling mismatch (present={present})'
              else:
                  assert HLS not in removed and HLS not in wrapped, \
                      f'{f}: does not have hls patch but it was touched'
                  print(f'  ({f} has no hls patch -> that assertion skipped, expected)')
              assert file_matched == len(removed) + len(wrapped), f'{f}: count mismatch'
          # this self-check must count BEFORE the rewrite: the regex only matches the original
          # `patch -p1 <...>` form, after rewriting they are wrapped and this would always be 0
          print(f'self-check: processed {total_matched} patch lines (0 means the regex missed everything)')
          assert total_matched > 0, 'regex matched nothing: triage would be silently broken, must fix'
          PY
          echo '--- ffmpeg patch section after patch ---'
          sed -n '/patchedSource/,/^  *$/p' nix/packages/mk-pkg-ffmpeg/default.nix | head -20
          echo '--- mpv patch section after patch ---'
          sed -n '/patchedSource/,/^  *$/p' nix/packages/mk-pkg-mpv/default.nix | head -20

      # ★ 2026-10-12 第四版：mpv 0.41 的 meson 选项适配
      #   依据 🛢️（CI 原文）：`mk-pkg-mpv-iossimulator-arm64-video> ERROR: Unknown options: "libplacebo,
      #     macos-10-11-features, macos-10-12-2-features, macos-10-14-features, rpi, rpi-mmal, sdl2,
      #     stdatomic, ta-leak-report, vaapi-x-egl, win32-internal-pthreads"`
      #   —— 这 11 个名字正好等于"配方传的选项" 与 0.41 `meson.options`（105 个 option 名）的**差集**
      #   （配方侧 = `nix/packages/mk-pkg-mpv/default.nix` 的 `DISABLE_ALL_OPTIONS` 数组；
      #     目标侧 = https://raw.githubusercontent.com/mpv-player/mpv/v0.41.0/meson.options）
      #
      #   逐条映射（选项 | 0.41 是否存在 | 改名? | 对 iOS 产物有用? | 处理）：
      #   | ta-leak-report          | 否 | 无对应（0.41 新增的是 disable-packet-pool，语义不同） | 无（开发用途） | 删除 |
      #   | sdl2                    | 否 | 已拆成 sdl2-video / sdl2-audio / sdl2-gamepad（三者 0.41 都在，配方**已各自单独传 =disabled**） | 无（桌面输出） | 删除 |
      #   | stdatomic               | 否 | 无对应 | 无 | 删除 |
      #   | win32-internal-pthreads | 否 | 0.41 的叫 win32-threads | 无（Windows 专用） | 删除（**不改名**：给 iOS 传 Windows 选项没意义） |
      #   | libplacebo              | 否 | 选项被移除（但见下警告） | 见下 | 删除（选项没了；但 0.41 把 libplacebo 变成硬依赖） |
      #   | rpi / rpi-mmal          | 否 | 无对应（树莓派支持已移除） | 无 | 删除 |
      #   | vaapi-x-egl             | 否 | 无对应（0.41 只有 vaapi-drm / vaapi-wayland / vaapi-win32 / vaapi-x11） | 无（Linux） | 删除 |
      #   | macos-10-11-features    | 否 | 0.41 换代为 macos-10-15-4 / macos-11 / macos-11-3 / macos-12-features —— **不是改名，是最低版本抬了** | 无（我们编 iOS，部署目标 13.0） | 删除 |
      #   | macos-10-12-2-features  | 否 | 同上 | 无 | 删除 |
      #   | macos-10-14-features    | 否 | 同上 | 无 | 删除 |
      #   => **没有一条需要"改名保留"**：11 条全是桌面/历史平台相关，原本都被设成 disabled/false；
      #      0.41 里它们连选项都不存在 => 删掉等价于"该特性在这个版本已不存在"。
      #
      #   *** 本轮解决不了、必须让 lead/用户知道的问题 *** 🛢️
      #     mpv 0.41 `meson.build` L29 原文：`libplacebo = dependency('libplacebo', version: '>=6.338.2',`
      #     下一行是 `default_options: [...]` —— **没有 `required:` 参数** => meson 默认 **required=true**
      #     => libplacebo 是**硬依赖**；且 0.41 里 `get_option('libplacebo')` **0 命中**（选项被彻底移除，无法禁用）。
      #     对照 mpv **0.36.0**（我们现用版）原文：`required: get_option('libplacebo')`
      #     + `features += {'libplacebo': libplacebo.found()}`
      #     => **0.36 是最后一个"libplacebo 可选"的版本；0.37 起（含 0.37/0.38/0.39/0.40/0.41）全是硬依赖**。
      #     而本配方**不构建 libplacebo**（没有 mk-pkg-libplacebo，产物框架清单里也没有 Placebo）
      #     => **选项改完之后的下一关必然是 `Dependency libplacebo ... not found`**。
      #     这不是选项问题，是"配方缺一个依赖包" => 需要 lead/用户决策
      #     （给配方加 libplacebo 包 / 维持 mpv 0.36 / 自己打补丁把 libplacebo 变回可选）。
      #     **本轮受"不许动版本 pin 机制"约束，不擅自改 mpv 版本。**
      - name: 改写配方里 mpv 的 meson 选项（去掉目标版本已不存在的 11 个）
        run: |
          set -euo pipefail
          cd recipe
          python3 - <<'PY'
          import pathlib, re
          P = 'nix/packages/mk-pkg-mpv/default.nix'
          unknown = ['libplacebo', 'macos-10-11-features', 'macos-10-12-2-features',
                     'macos-10-14-features', 'rpi', 'rpi-mmal', 'sdl2', 'stdatomic',
                     'ta-leak-report', 'vaapi-x-egl', 'win32-internal-pthreads']
          lines = pathlib.Path(P).read_text().splitlines(keepends=True)
          start = next(i for i, ln in enumerate(lines) if re.match(r'^\s*DISABLE_ALL_OPTIONS=\(\s*$', ln))
          end = next(j for j in range(start + 1, len(lines)) if re.match(r'^\s*\)\s*$', lines[j]))
          body = lines[start + 1:end]
          kept, dropped = [], []
          for ln in body:
              m = re.match(r'^\s*-D([A-Za-z0-9_-]+)=', ln)
              if m and m.group(1) in unknown:
                  dropped.append(m.group(1))
                  continue
              kept.append(ln)
          assert sorted(dropped) == sorted(unknown), 'dropped set mismatch: %s' % sorted(dropped)
          lines[start + 1:end] = kept
          pathlib.Path(P).write_text(''.join(lines))
          print('removed %d unknown options: %s' % (len(dropped), dropped))
          print('--- options still passed to mpv (DISABLE_ALL_OPTIONS array) ---')
          n = 0
          for ln in kept:
              m = re.match(r'^\s*-D([A-Za-z0-9_-]+)=([^ `]*)', ln)
              if m:
                  n += 1
                  print('  -D%s=%s' % (m.group(1), m.group(2)))
          print('total -D options left in that array: %d' % n)
          PY

      # ★ 2026-10-12 第五版：B 方案 —— 给配方补 libplacebo 依赖（用户拍板"全部要最新的"）
      #   依据 🛢️：mpv 0.41 `meson.build` L29 `libplacebo = dependency('libplacebo', version: '>=6.338.2', ...)`
      #     无 `required:`（默认必需）且 `get_option('libplacebo')` 0 命中（无法禁用）；
      #     而配方不构建 libplacebo => 必然停在 `Dependency libplacebo found: NO`。
      #
      #   *** 配方机制（读源码得来，用于判断"要写哪几个文件"）***
      #   · 一个依赖包 = `nix/packages/mk-pkg-<name>/default.nix`：`stdenvNoCC.mkDerivation` + meson，
      #     `--native-file`/`--cross-file` 交叉编译、`--prefix=$out`；依赖用 `buildInputs = [ 其它 mk-pkg-* ]`
      #     （nixpkgs 的 pkg-config wrapper 会把它们的 `lib/pkgconfig` 加进 PKG_CONFIG_PATH => meson 能 `dependency()` 到）。
      #     样板：mk-pkg-dav1d = `inherit src; dontUnpack=true;` + `meson setup build $src`（我们照它，不打补丁）
      #   · **框架清单自动推导，不用手改** 🛢️：`mk-out-frameworks/ios/build-ios.sh` 原文
      #     `find ${DEPS} -name "*.dylib" | while read DYLIB; do FRAMEWORK_NAME=$(basename $DYLIB .dylib | sed 's/\.[0-9]*$//' | sed 's/^lib//')`
      #     => `libplacebo.dylib` 自动成为 `Placebo.framework` ✅（首字母还会被 tr 大写）
      #   · 但**聚集清单要手加**：`mk-out-libs/default.nix` 的 `deps = [ mpv ffmpeg mbedtls ... ]`
      #     只有列进去的包，其 dylib 才会被 `find $dep/lib -name '*.dylib'` 拷进 build
      #   · 我们自己的 media_kit 侧**不用改** ✅：`third_party/.../ios/Makefile` 只解包、
      #     podspec 用通配 `Frameworks/*.xcframework` => 多出的 `Placebo.xcframework` 会被一起 vendor；
      #     `Mpv` 对它 `@rpath/libplacebo.dylib` 的依赖会被 build-ios.sh 后面的
      #     "update dylib dep paths" 段改写成 framework 路径（同一套"文件名→框架名"推导）
      #
      #   *** libplacebo 最小配置（依据 = v6.338.2 meson_options.txt 原文 + mpv 侧约束）***
      #   | 选项 | 6.338.2 默认 | 处理 | 依据 |
      #   | demos | **boolean=true** | **必须 -Ddemos=false** | 默认 true！会去编 demo 程序（还需 GLFW/SDL 之类），我们只要库 |
      #   | tests/bench/fuzz | boolean=false | 显式 false | 默认已 false；写死防上游改默认 |
      #   | vulkan | feature=auto | **-Dvulkan=disabled** | iOS 无 Vulkan；mpv 侧本来就是 `-Dvulkan=disabled` => libplacebo 带不带都行；关掉可免 MoltenVK |
      #   | vk-proc-addr | feature=auto | **disabled** | 只对 vulkan 有意义 |
      #   | d3d11 | feature=auto | **disabled** | Windows 专用 |
      #   | opengl | feature=auto | **-Dopengl=disabled** | 🛢️ CI 原文：`src/opengl/include/glad/meson.build:11:2: ERROR: Problem encountered:
      #           glad (required: >= 2.0, found: none) was not found in PYTHONPATH or ``3rdparty``` —— libplacebo 的 GL 支持要
      #           `3rdparty/glad` **子模块**，而我们的源码是 **GitHub tarball（不含子模块）** + nix 沙箱**无网** ⇒ 必失败 |
      #   | gl-proc-addr / glslang / shaderc / lcms / dovi / libdovi / unwind / xxhash | feature=auto | **保持 auto（不传）** | 🛢️ meson `auto` = "找到就用、找不到就跳过" ⇒ **不可能因缺依赖而配置失败**。CI 已实测 `shaderc found: NO` / `d3d11.h: NO` 都只是继续往下走，`xxhash`/`unwind` 也没报错 ⇒ 无需再显式关 |
      #   ✅ 关 opengl 的**前提已逐条核实**（你点名要核的那条）：
      #     · libplacebo `src/meson.build` L169-174 原文：`if not (components.get('vulkan') or components.get('opengl') or components.get('d3d11'))`
      #       ⇒ 里面只有 **`warning('Building without any graphics API…')`**，**不是 error** ⇒ 三后端全关不会中止配置。
      #     · `src/opengl/meson.build` L1 `opengl_build = get_option('opengl')` / L11 `components.set('opengl', opengl_build.allowed())`
      #       ⇒ 传 disabled 后 `subdir('include/glad')` 不会进入 ⇒ 那个 glad 报错不再触发。
      #     · **mpv 侧不会链接失败** 🛢️：mpv 0.41 `video/out/gpu_next/context.c` 的 GL 路径守卫是
      #       `#if HAVE_GL && defined(PL_HAVE_OPENGL)`（L143、L214）⇒ libplacebo 无 OpenGL 时 `PL_HAVE_OPENGL` 未定义
      #       ⇒ **不会引用 `pl_opengl_create`**，所以链接不缺符号。
      #   ❓ **但有个运行期后果必须让你知道（我没有擅自动，只报）**：mpv 0.41 已**移除 `vo=gpu`**，只剩 `gpu-next`（吃 libplacebo）
      #     ⇒ 而 libplacebo 现在**一个图形后端都没有**（vulkan：iOS 无；d3d11：Windows；opengl：本轮关）
      #     ⇒ **构建/链接能过，但 iOS 上能不能真的出画存疑**。无 OpenGL 时 mpv 走 `#elif HAVE_GL` 分支
      #     （context.c L172 —— **该分支原文我没读，标 ❓**）。
      #     备选（均未验证，供决策）：给 libplacebo 补 `glad`（python 模块；nixpkgs 里可能有 `python3Packages.glad2`，
      #     但"该包是否存在 / CLI 是否与 6.338.2 期望一致"我**没查实**）⇒ 保住 GL 后端 ⇒ 运行期更完整。
      #   （注：原先标 ❓ 的 `xxhash`/`unwind` required 问题，本轮已在 `src/meson.build` 查实：
      #     `unwind = dependency('libunwind', required: get_option('unwind'))`、`xxhash = dependency('libxxhash', required: get_option('xxhash'))`
      #     ⇒ 都跟随各自的 `auto` 选项 ⇒ **不会硬失败** ✅；`lcms`/`libdovi` 同理。）
      #
      #   *** 2026-10-12 第七版：补齐构建期 Python 依赖（本轮缺 jinja2）***
      #   失败原文 🛢️（run 38208233347）：
      #     `…/mk-pkg-libplacebo-source-6.338.2/tools/glsl_preproc/templates.py:1: import jinja2`
      #     `ModuleNotFoundError: No module named 'jinja2'` ⇒ `ninja: build stopped`（已过 meson setup、进了编译阶段）
      #   **构建期 Python 脚本全量排查**（`git/trees/v6.338.2?recursive=1` 列出全部 6 个 .py，逐个读 import）：
      #   | 文件 | 三方 import（其余均为 stdlib 或同目录本地模块） |
      #   | `tools/glsl_preproc/templates.py` | **`import jinja2`**（第 1 行；就是本轮报错处） |
      #   | `tools/glsl_preproc/{main,macros,statement,variables}.py` | 无（只有 `sys`/`argparse`/`re` + `from variables/templates/statement import`） |
      #   | `src/vulkan/utils_gen.py` | `import jinja2`（但 vulkan 已 `-Dvulkan=disabled` ⇒ 不会跑） |
      #   ⇒ **三方依赖只有 `jinja2` 一个** ✅（没有 mako/pygments 之类）
      #   **这些工具什么时候跑** 🛢️：`tools/meson.build` L1 无条件 `subdir('glsl_preproc')`；
      #     `src/shaders/meson.build` L15-22 对 11 个 shader 源逐个 `custom_target(command: glsl_preproc, …)` —— **无条件**。
      #   ⇒ **没有"关掉预处理"的官方开关** ❓（唯一的旋钮是 `tools/glsl_preproc/meson.build` L1 的
      #     `strip_arg = get_option('debug') ? [] : ['--strip']`，那是"是否 strip 输入"，不是开关）
      #     ⇒ 结论：**必须提供 jinja2**，没有绕过的路。
      #   **nativeBuildInputs 复核**：`meson`/`ninja`/`pkg-config` 原来就有 ✅；**`python3` 原来没有** ——
      #     而 libplacebo 构建期确实会调 python（shader 预处理、glad 检查、vulkan utils_gen）
      #     ⇒ 本轮补 `pkgs.python3` + `pkgs.python3Packages.jinja2`（写成和配方其它包一致的 `pkgs.` 前缀风格；
      #     配方里 `pkgs.python3` 的既有写法见 mk-pkg-mbedtls / mk-pkg-mpv）。
      #   🔍 jinja2 的可见性机制（依据，但本机无法跑 nix 验证）：nixpkgs 的 `python3Packages.*` 带 python setup hook，
      #     会把自己所属的 `lib/python3.x/site-packages` 追加到 `PYTHONPATH` ⇒ meson 用 `import('python').find_installation()`
      #     找到的 python3 就能 `import jinja2`。✅ nixpkgs 里该包确实存在：
      #     `pkgs/development/python-modules/jinja2/default.nix`（`pname = "jinja2"`, version 3.1.6）。
      - name: 给配方补 libplacebo 依赖（B 方案：新增包 + 接线；框架清单自动推导不用改）
        run: |
          set -euo pipefail
          cd recipe
          LIBPLACEBO_VERSION="6.338.2"
          LIBPLACEBO_URL="https://github.com/haasn/libplacebo/archive/refs/tags/v${LIBPLACEBO_VERSION}.tar.gz"
          echo "libplacebo url = $LIBPLACEBO_URL"
          LIBPLACEBO_SHA=$(nix-prefetch-url --type sha256 "$LIBPLACEBO_URL")
          echo "libplacebo sha256(base32) = $LIBPLACEBO_SHA"
          LP_VERSION="$LIBPLACEBO_VERSION" LP_URL="$LIBPLACEBO_URL" LP_SHA="$LIBPLACEBO_SHA" python3 - <<'PY'
          import os, pathlib, re, textwrap

          version = os.environ['LP_VERSION']
          url = os.environ['LP_URL']
          sha = os.environ['LP_SHA']

          lock = pathlib.Path('packages.lock.nix')
          s = lock.read_text()
          assert 'libplacebo = {' not in s, 'libplacebo already in packages.lock.nix'
          # Robust anchor -- MUST match BOTH real input shapes:
          #   (a) upstream file:               '  mpv = {\n'
          #   (b) AFTER the version-pin step:  '  mpv = {  version = "0.41.0";'
          #       ^ that step's `re.subn(r'(?m)^\s*version\s*=...')` swallows the newline that preceded
          #         the version line and joins it onto the "= {" line (reproduced locally; this is what
          #         made the CI dry_run fail with the old newline-requiring anchor).
          # So: do NOT require a newline after "{", and capture the indent with [ \t]* only
          # (`\s*` could swallow newlines and corrupt the inserted indentation).
          anchor = re.search(r'(?m)^([ \t]*)mpv = \{', s)
          assert anchor, 'anchor "mpv = {" not found in packages.lock.nix'
          assert s[anchor.start():].startswith(anchor.group(1) + 'mpv = {'), 'anchor sanity check failed'
          ind = anchor.group(1)
          entry = ('%slibplacebo = {\n%s  version = "%s";\n%s  url = "%s";\n%s  sha256 = "%s";\n%s};\n'
                   % (ind, ind, version, ind, url, ind, sha, ind))
          lock.write_text(s[:anchor.start()] + entry + s[anchor.start():])
          print('packages.lock.nix: added libplacebo entry (version=%s, indent=%d, anchor_line=%r)'
                % (version, len(ind), s[anchor.start():anchor.start() + 40]))

          pkgdir = pathlib.Path('nix/packages/mk-pkg-libplacebo')
          pkgdir.mkdir(parents=True, exist_ok=True)
          (pkgdir / 'default.nix').write_text(textwrap.dedent('''
            {
              pkgs ? import ../../utils/default/pkgs.nix,
              os ? import ../../utils/default/os.nix,
              arch ? pkgs.callPackage ../../utils/default/arch.nix { },
            }:

            let
              name = "libplacebo";
              packageLock = (import ../../../packages.lock.nix).${name};
              inherit (packageLock) version;

              callPackage = pkgs.lib.callPackageWith { inherit pkgs os arch; };
              nativeFile = callPackage ../../utils/native-file/default.nix { };
              crossFile = callPackage ../../utils/cross-file/default.nix { };

              pname = import ../../utils/name/package.nix name;
              src = callPackage ../../utils/fetch-tarball/default.nix {
                name = "${pname}-source-${version}";
                inherit (packageLock) url sha256;
              };
            in

            pkgs.stdenvNoCC.mkDerivation {
              name = "${pname}-${os}-${arch}-${version}";
              pname = pname;
              inherit version;
              inherit src;
              dontUnpack = true;
              enableParallelBuilding = true;
              nativeBuildInputs = [
                pkgs.meson
                pkgs.ninja
                pkgs.pkg-config
                pkgs.python3
                pkgs.python3Packages.jinja2
              ];
              configurePhase = \'\'
                meson setup build $src \\
                  --native-file ${nativeFile} \\
                  --cross-file ${crossFile} \\
                  --prefix=$out \\
                  -Ddemos=false \\
                  -Dtests=false \\
                  -Dbench=false \\
                  -Dfuzz=false \\
                  -Dvulkan=disabled \\
                  -Dvk-proc-addr=disabled \\
                  -Dd3d11=disabled \\
                  -Dopengl=disabled
              \'\';
              buildPhase = \'\'
                meson compile -vC build
              \'\';
              installPhase = \'\'
                meson install -C build
              \'\';
            }
          ''').lstrip('\n'))
          print('created nix/packages/mk-pkg-libplacebo/default.nix')

          ol = pathlib.Path('nix/packages/mk-out-libs/default.nix')
          t = ol.read_text()
          assert 'mk-pkg-libplacebo' not in t, 'mk-out-libs already wired'
          a = re.search(r'(?m)^(\s*)ffmpeg = callPackage \.\./mk-pkg-ffmpeg/default\.nix \{ \};\n', t)
          assert a, 'mk-out-libs: ffmpeg callPackage line not found'
          t = t[:a.end()] + '%slibplacebo = callPackage ../mk-pkg-libplacebo/default.nix { };\n' % a.group(1) + t[a.end():]
          b = re.search(r'(?m)^(\s*)mpv\n(\s*)ffmpeg\n(\s*)mbedtls\n', t)
          assert b, 'mk-out-libs: deps trio not found'
          t = t[:b.end()] + '%slibplacebo\n' % b.group(3) + t[b.end():]
          ol.write_text(t)
          print('mk-out-libs: wired libplacebo into callPackage + deps')

          mp = pathlib.Path('nix/packages/mk-pkg-mpv/default.nix')
          m = mp.read_text()
          assert 'mk-pkg-libplacebo' not in m, 'mk-pkg-mpv already wired'
          c = re.search(r'(?m)^(\s*)ffmpeg = callPackage \.\./mk-pkg-ffmpeg/default\.nix \{ \};\n', m)
          assert c, 'mk-pkg-mpv: ffmpeg callPackage line not found'
          m = m[:c.end()] + '%slibplacebo = callPackage ../mk-pkg-libplacebo/default.nix { };\n' % c.group(1) + m[c.end():]
          d = re.search(r'(?m)^(\s*)\[ ffmpeg \]\n', m)
          assert d, 'mk-pkg-mpv: "[ ffmpeg ]" line not found'
          assert re.search(r'(?m)^\s*\+\+ pkgs\.lib\.optionals \(variant == "video"\) \[\n', m), \
              'mk-pkg-mpv: the "++ optionals (variant == video)" continuation line not found'
          # replace ONLY that single line: slice to d.start() .. d.end() (end of "[ ffmpeg ]\n"),
          # so the following "++ ..." line is preserved. (The first version sliced to d.end(1) and
          # left a duplicate "[ ffmpeg ]" line behind, which is invalid nix -- caught by the local
          # behavior test against the real recipe file.)
          m = m[:d.start()] + '%s[ ffmpeg libplacebo ]\n' % d.group(1) + m[d.end():]
          mp.write_text(m)
          print('mk-pkg-mpv: wired libplacebo into buildInputs')

          print('--- mk-pkg-mpv buildInputs after ---')
          mm = mp.read_text()
          idx = mm.find('buildInputs =')
          print(mm[idx:idx + 150])
          lp_lines = [ln for ln in mm.splitlines() if 'libplacebo' in ln]
          print('--- mk-pkg-mpv libplacebo lines after (%d) ---' % len(lp_lines))
          for ln in lp_lines:
              print('  ' + ln)
          print('--- mk-out-libs libplacebo lines after ---')
          lp2 = [ln for ln in ol.read_text().splitlines() if 'libplacebo' in ln]
          for ln in lp2:
              print('  ' + ln)
          PY
          echo '--- new package head ---'
          head -20 nix/packages/mk-pkg-libplacebo/default.nix
          echo '--- lock entry ---'
          grep -A4 'libplacebo = {' packages.lock.nix

      # ★ 先验护栏：在真正 nix build 之前做静态校验 => 秒级失败，别再花 8 分钟才发现
      - name: 先验：-D 选项名必须存在于目标版本
        run: |
          set -euo pipefail
          cd recipe
          python3 - <<'PY'
          import os, pathlib, re, sys, urllib.request
          MPV = os.environ['MPV_VERSION']
          def declared(text):
              return set(re.findall(r"^\s*option\(\s*'([^']+)'", text, re.M))
          def passed(text):
              return set(re.findall(r'^\s*-D([A-Za-z0-9_-]+)=', text, re.M))
          url = 'https://raw.githubusercontent.com/mpv-player/mpv/v%s/meson.options' % MPV
          txt = urllib.request.urlopen(url, timeout=60).read().decode('utf-8', 'replace')
          decl = declared(txt)
          got = passed(pathlib.Path('nix/packages/mk-pkg-mpv/default.nix').read_text())
          bad = sorted(got - decl)
          print('mpv %s: declared=%d passed=%d unknown=%d' % (MPV, len(decl), len(got), len(bad)))
          print('  passed: ' + ', '.join(sorted(got)))
          if bad:
              print('  UNKNOWN: ' + ', '.join(bad))
              sys.exit('FAIL: mpv option(s) not declared in %s' % url)
          print('  OK: every mpv -D option exists in mpv %s meson.options' % MPV)
          ff_opt = pathlib.Path('nix/packages/mk-pkg-ffmpeg/meson.options').read_text()
          ff_decl = declared(ff_opt)
          ff_got = passed(pathlib.Path('nix/packages/mk-pkg-ffmpeg/default.nix').read_text())
          ff_bad = sorted(ff_got - ff_decl)
          print('ffmpeg: declared=%s passed=%s unknown=%d' % (sorted(ff_decl), sorted(ff_got), len(ff_bad)))
          if ff_bad:
              sys.exit('FAIL: ffmpeg option(s) not declared in the recipe meson.options: ' + ', '.join(ff_bad))
          print('  OK: every ffmpeg -D option is declared in the recipe meson.options')
          PY

      - name: Xcode path
        id: xcode_path
        run: |
          # official ci.yaml hardcodes this path; it exists on macos-15 runners.
          # fall back to the currently selected Xcode if it is missing
          if [ -d /Applications/Xcode_16.1.0.app ]; then
            XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)
          else
            XCODE_PATH=$(dirname "$(dirname "$(xcode-select -p)")")
          fi
          "$XCODE_PATH/Contents/Developer/usr/bin/xcodebuild" -version
          echo "xcode_path=$XCODE_PATH" >> "$GITHUB_OUTPUT"

      # ★ 2026-10-12 第六版：让 Nix 看得见"新生成的文件"
      #   失败原文 🛢️（run 38206332339，在求值 `mk-out-archive-xcframeworks-ios-universal-video-default` 时）：
      #     `error: Path 'nix/packages/mk-pkg-libplacebo/default.nix' in the repository
      #      "/Users/runner/work/KPXX/KPXX/recipe" is not tracked by Git.
      #      To make it visible to Nix, run: git -C "…/recipe" add -N "nix/packages/mk-pkg-libplacebo/default.nix"`
      #   机制：**Nix 对 git flake 源只认"已跟踪"的文件**。本轮我们**新建**了
      #     `nix/packages/mk-pkg-libplacebo/default.nix`（untracked）⇒ **eval 期就被拒**，编译根本没开始。
      #     前几轮改写的是**已跟踪文件**（mk-pkg-mpv / mk-out-libs / packages.lock.nix），所以这个问题一直没暴露。
      #   为什么用 `git add -A`，而不是"只 add 那一个文件"或 Nix 提示的 `-N`：
      #     · Nix 只报**第一个** untracked 文件 ⇒ 以后再新增文件就会以"一轮炸一个"的方式白烧 CI；
      #       `-A` 把"新建 + 修改"一次性全部纳入索引，堵死这一类。
      #     · **不用 `-N`（intent-to-add）的原因**：`git add -N` 只登记**路径**，索引里的 blob 是**空的**；
      #       而 `-A` 会把**真实内容**一并写进索引 ⇒ 不管 Nix 是从工作区还是从索引取内容，
      #       拿到的都是真文件，不存在"读到空 blob"的歧义。
      #       （这里是 CI 里对上游 v0.7.3 的**本地克隆**，暂存只影响本次运行、**不会推回上游** ⇒ `-A` 无副作用。）
      #   ⚠️ 位置：必须在 Build（`nix develop -c make … nix build`）**之前**。
      #   ⚠️ 诊断输出用 `sed -n '1,20p'` 而**不是** `| head -20`：`head` 会提前退出触发 SIGPIPE，
      #      配合上面的 `set -o pipefail` 会把这一步判失败。
      #   ⚠️ run 块内**一律 ASCII**（见最前面的 ASCII 自检步骤）：所以下面那句道歉式的
      #      "防御 dubious ownership" 注释也写英文。
      - name: 让 Nix 看得见新生成的文件（git add -A，必须在 nix build 之前）
        run: |
          set -euo pipefail
          cd recipe
          # defensive: git "dubious ownership" check for a nested repo; non-fatal on purpose
          git config --global --add safe.directory "$PWD" || true
          echo '--- recipe git status BEFORE add (first 20) ---'
          git status --porcelain | sed -n '1,20p'
          git add -A
          echo '--- recipe git status AFTER add (first 20) ---'
          git status --porcelain | sed -n '1,20p'
          echo '--- new package file now known to the index ---'
          git ls-files nix/packages/mk-pkg-libplacebo
          echo '--- staged file list (first 20) ---'
          git diff --cached --name-only | sed -n '1,20p'

      - name: Build（只编 target，不编全矩阵）
        if: ${{ !inputs.dry_run }}
        working-directory: recipe
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
        run: |
          nix develop -c make XCODE_PATH="$XCODE_PATH" VERSION="$VERSION" TARGET="$TARGET"

      - name: 取产物 + 打 SHA256
        if: ${{ !inputs.dry_run }}
        id: asset
        run: |
          set -euo pipefail
          cd recipe
          ls -la result/ || true
          # nix build result is a symlink into the store; the tar.gz inside it is the asset
          ASSET=$(find -L result -maxdepth 1 -name "$ASSET_NAME" -print -quit)
          if [ -z "$ASSET" ]; then
            echo "::error::asset $ASSET_NAME not found -- actual .tar.gz files under result/:"; find -L result -maxdepth 3 -name '*.tar.gz' || true; exit 1
          fi
          cp "$ASSET" .
          BYTES=$(stat -f%z "./$ASSET_NAME")
          SHA=$(shasum -a 256 "./$ASSET_NAME" | awk '{print $1}')
          {
            echo "### libmpv iOS asset"
            echo ""
            echo "- file: \`$ASSET_NAME\`"
            echo "- bytes: \`$BYTES\`"
            echo "- sha256: \`$SHA\`"
            echo ""
            echo "Copy this sha256 into \`third_party/media_kit_libs_ios_video/ios/Makefile\` MPV_XCFRAMEWORKS_SHA256SUM."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "asset_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "===== SHA256: $SHA ====="

      - name: Upload artifact（留一份，便于先手工核对再发 Release）
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-ios-xcframework
          if-no-files-found: error
          path: recipe/${{ steps.asset.outputs.asset_name }}

      # 与仓库现有 ios.yml 同款：用 gh 发，不引第三方 action
      # ⚠️ 必须显式 -R "${{ github.repository }}"：本步骤 cwd 在 `recipe/`（官方配方那个仓库），
      #    不指定的话 gh 会把 Release 发到 media-kit/libmpv-darwin-build 去（我们没有写权限 ⇒ 必失败）
      - name: 发到 Releases（tag = 版本串）
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd recipe
          gh release create "$VERSION" "${{ steps.asset.outputs.asset_name }}" \
            -R "${{ github.repository }}" \
            --title "$VERSION" \
            --notes "self-built libmpv iOS xcframework (mpv $MPV_VERSION / ffmpeg $FFMPEG_VERSION, dynamic \`Mpv\`)
          asset: \`${{ steps.asset.outputs.asset_name }}\`
          bytes: \`${{ steps.asset.outputs.asset_bytes }}\`
          sha256: \`${{ steps.asset.outputs.asset_sha256 }}\`
          recipe: $RECIPE_REPO @ $RECIPE_REF (only packages.lock.nix ffmpeg/mpv versions changed)"
          echo "release published: $VERSION"
