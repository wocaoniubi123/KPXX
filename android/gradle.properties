# ★ 2026-11-08（首次 Android 云端构建失败后的修复）：
#   🛢️ 失败原文（run 42479615512，步骤 #9 `Flutter build APK`）：
#     `Execution failed for task ':volume_controller:compileReleaseKotlin'.`
#     `Inconsistent JVM-target compatibility detected for tasks`
#     `'compileReleaseJavaWithJavac' (11) and 'compileReleaseKotlin' (1.8).`
#   🛢️ 根因（读本机 pub 缓存里的插件源码实锤）：
#     · `volume_controller-2.0.7/android/build.gradle`：
#         `ext.kotlin_version = '1.7.21'` + `apply plugin: 'kotlin-android'`
#         + `kotlinOptions { jvmTarget = '1.8' }`，**但它没有写 `compileOptions`**
#         ⇒ Java 侧走 AGP 9 的默认值 **11** ⇒ 11 vs 1.8 不一致 ⇒ KGP 的校验直接报错 ☠
#     · 对照 `screen_brightness_android-0.1.0+2`：它 `sourceCompatibility/targetCompatibility = 1.8`
#         **和** `jvmTarget 1.8` 两边都是 1.8 ⇒ 它是**一致的**，不是它的问题
#     · 我们自己的 `:app` 没错：Java 17 + jvmTarget 17（两边一致）
#   ✅ 修法：把 KGP 的 jvm-target 校验从 error 降为 **warning**（JetBrains 官方支持的开关，
#     见 kotlinlang.org/docs/gradle-configure-project.html「Configure the behavior of this check」）
#     ⚠️ 这只**降低校验等级**，**不改任何字节码**：插件的 Kotlin 仍编到 1.8、Java 编到 11，
#        两个 class 版本（52 / 55）在 ART 上共存完全正常 —— 该检查是"一致性提示"而非功能限制
#     ⚠️ 为什么不去改插件的 jvmTarget：插件源码在 pub 缓存里（`~/.pub-cache/...`），
#        改了**不入库**、CI 上照样是原版 ⇒ 无效 ☠
#     ⚠️ 为什么不升级插件：`volume_controller` 被 `media_kit_video 1.2.5` 硬钉在 `<3.0.0`
#        （见 pubspec.yaml 注释），升级会连带动 iOS 播放链路 ⇒ 用户口径「不动 iOS」☠
kotlin.jvm.target.validation.mode=warning

