/* -------- 列表页 -------- */
const listState = new Map();   // site.name + key -> { items, page, done }
const subSel = new Map();      // site.name + '/' + 分类key -> 子分类 key（默认第一个）

const subSel2 = new Map();     // site.name + '/' + 分类key + '|' + 一级子key -> 二级子 key

/** 一级子分类（选中项；没子分类返回 null），返回 SiteTab 对象 */
function subTabOf(site, cat) {
  if (!cat.subs || !cat.subs.length) return null;
  const want = subSel.get(site.name + '/' + cat.key) || cat.subs[0].key;
  return cat.subs.find((s) => s.key === want) || cat.subs[0];
}

/** 二级子分类（选中项；一级子没有再下一级就返回 null） */
function subTabOf2(site, cat) {
  const l1 = subTabOf(site, cat);
  if (!l1 || !l1.subs || !l1.subs.length) return null;
  const k2 = site.name + '/' + cat.key + '|' + l1.key;
  const want = subSel2.get(k2) || l1.subs[0].key;
  return l1.subs.find((s) => s.key === want) || l1.subs[0];
}

function subOf(site, cat) { return subTabOf(site, cat)?.key || null; }

/** 黄果的"路径型"列表页（与 api.dart 的 _hgPageList 对应）：
 *  /recommend、/newest、/topics/xxx/ → hg-drama-card（翻页 /xxx/2/）
 *  /ranks/hot/                       → hg-rank-item（TOP20）
 *  /chigua/                          → hg-post-card（翻页 /chigua/page/N/） */
async function hgPageList(site, path, page) {
  const p0 = path.endsWith('/') ? path : path + '/';
  // ⚠️ 精选推荐 / 最近上新 走 JSON 接口：页面 HTML 那份是站点没更新的静态版
  if (p0 === '/recommend/' || p0 === '/newest/') {
    const sort = p0 === '/newest/' ? 'sort=new&' : '';
    const j = JSON.parse(await getHtml(site, `/api/videos?${sort}page=${page}&size=20`));
    const items = (j && j.data && j.data.items) || [];
    return items.map(hgItem);
  }
  // 翻页形态按站点实际链接来（不猜）："全部"（/chigua/）→ /chigua/page/2/；
  // 子分类（/chigua/remen/ 等）→ /chigua/remen/2/；其余路径型 → /xxx/2/
  const url = page <= 1 ? p0
    : ((p0 === '/chigua/' || p0 === '/chigua') ? p0 + 'page/' + page + '/' : p0 + page + '/');
  const doc = parseHtml(await getHtml(site, url));
  if (p0.startsWith('/chigua')) return hgPostCards(doc);
  if (p0.startsWith('/ranks')) return hgRankCards(doc);
  // 专题列表页（/topics/）上是"专题卡"，专题自己的页面（/topics/xxx/）才是视频网格
  if (p0 === '/topics/') return hgTopicCards(doc);
  return hgCards(doc);
}

/** 专题卡（a.hg-topic-card → /topics/xxx/）：点开是该专题下的视频列表 */
function hgTopicCards(doc) {
  const out = [];
  for (const a of doc.querySelectorAll('a.hg-topic-card')) {
    const href = a.getAttribute('href') || '';
    const tt = a.querySelector('.hg-topic-card__title');
    const title = ((tt ? tt.textContent : '') || '').replace(/\s+/g, ' ').trim();
    if (!href || !title) continue;
    const img = a.querySelector('img[data-src]') || a.querySelector('img');
    const mt = a.querySelector('.hg-topic-card__meta');
    const meta = ((mt ? mt.textContent : '') || '').replace(/\s+/g, ' ').trim();
    out.push({ title, url: href, cover: img?.getAttribute('data-src') || '', meta, badge: '', desc: '', tags: [] });
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 吃瓜社区的帖子卡（a.hg-post-card → /archives/N/；横版大图，站点桌面 2 列网格） */
function hgPostCards(doc) {
  const out = [];
  for (const a of doc.querySelectorAll('a.hg-post-card')) {
    const href = a.getAttribute('href') || '';
    const t = a.querySelector('.hg-post-card__body h3');
    const title = (t ? t.textContent : '').replace(/\s+/g, ' ').trim();
    if (!href || !title) continue;
    const img = a.querySelector('img[data-src]') || a.querySelector('img');
    const date = (a.querySelector('.hg-post-card__date')?.textContent || '').trim();
    out.push({ title, url: href, cover: img?.getAttribute('data-src') || '', meta: metaDate(date), badge: '', desc: '', tags: [] });
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 排行榜（TOP20）：每项一个视频，名次写进 meta */
function hgRankCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('div.hg-rank-item')) {
    const a = el.querySelector('a[href^="/video/"]');
    if (!a) continue;
    const tt = el.querySelector('.hg-rank-item__title');
    const title = ((tt ? tt.textContent : a.textContent) || '').replace(/\s+/g, ' ').trim();
    if (!title) continue;
    const img = el.querySelector('img[data-src]') || el.querySelector('img');
    const num = (el.querySelector('.hg-rank-num')?.textContent || '').trim();
    out.push({ title, url: a.getAttribute('href') || '', cover: img?.getAttribute('data-src') || '',
      meta: num ? '第 ' + num + ' 名' : '', badge: '', desc: '', tags: [] });
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 按模板取一页列表（与 api.dart 的 category() 对应） */
async function fetchList(site, cat, subKey, page) {
  const tpl = site.template || 'wordpress';
  if (tpl === 'huangguo') {
    // 路径型（精选推荐/最近上新/专题/排行榜/吃瓜黑料）
    const k = subKey || cat.key;
    if (k.startsWith('/')) return hgPageList(site, k, page);
    const sort = subKey || 'latest';
    const sortParam = sort === 'hot' ? 'hot_window'
      : sort === 'original' ? 'hot_window&is_original=1' : sort;
    const path = `/api/videos/category/${cat.key}?sort=${sortParam}&page=${page}&size=20`;
    const j = JSON.parse(await getHtml(site, path));
    const items = (j && j.data && j.data.items) || [];
    return items.map(hgItem);
  }
  if (tpl === 'porna') {
    return pornaFetch(site, subKey || cat.key, page);
  }
  if (tpl === 'pektino') {
    // 主分类 4 个都是路径型（/zh-CN/、/zh-CN/weekly…）→ 解出 range；
    // 主题/时长/排序是页面里的筛选器（pkFilter，多级分类）
    const k = cat.key || '';
    const range = k.endsWith('/weekly') ? 'weekly'
      : k.endsWith('/monthly') ? 'monthly'
      : k.endsWith('/all') ? 'all' : 'timely';
    return pektinoFetch(site, range, '', page);
  }
  if (tpl === 'hanime1') {
    return hanimeFetch(site, cat.key, page);
  }
  if (tpl === 'xvideos') {
    // 子分类（「分类」tab 下面那排）选中时用子分类 key
    return xvListAt(site, subKey || cat.key, page);
  }
  if (tpl === 'kmsvip') {
    // key = 站点 type：'0' 热门视频（listHot）/ '1' 视频广场（listAll）
    return kmList(site, cat.key === '1' ? '/api/videos/listAll' : '/api/videos/listHot', page);
  }
  if (tpl === 'pornhub') {
    // 主分类/子分类的 key 都是站内路径（'/'、'/video'、'/video?c=27'…），照原样请求
    return phFetchList(site, subKey || cat.key, page);
  }
  if (tpl === 'xhamster') {
    // 「短片」tab **走 JSON 接口**（不是 HTML），且翻页是 `?page=N` 不是路径式 → 单独处理
    if (cat.name === '短片') {
      // 新开列表（第 1 次拉）→ 清掉上一轮遗留的预取缓冲 + 批次号归零，保证从第 1 页开始
      if (page <= 1) { xhMomentsBuf = []; xhMomentsBatchFrom = 0; } // 0 = 让下一批重新随机选起始页
      return xhMoments(site, page);
    }
    // xHamster 两个 tab 各有自己的"选择器覆盖"，**只在该 tab 自己列表里生效**：
    //   · 「分类」tab 的选中项（xhFilter.cat）= 站内分类路径
    //   · 「色情明星」tab 的选中项（xhStarSel）= 榜单/分类路径
    // ⚠️ 这段以前写在 xhListAt 里做全局覆盖 → 点演员进他的页（/pornstars/<名字>）时
    //    路径被覆盖回分类列表，用户实报"点图上这个人，进去又是明星卡片"。
    //    所以：只有 tab 自己的列表才用选中项，二级页（tag/演员页）一律照 base 走。
    const sel = cat.name === '分类' ? xhFilter.cat
              : (cat.name === '色情明星' ? xhStarSel : null);
    return xhListAt(site, sel || subKey || cat.key, page);
  }
  if (tpl === 'madou') {
    // key 平时是分类 slug（已编码，如 hongkongdoll）；以 / 开头 = 站内路径
    // （/likes /week /month 三个榜单 + /tags 标签云）
    // 空 key = 「首页」tab（站点导航第一项）→ 站点首页，别拼 /category/（会 404）
    const k = subKey || cat.key;
    if (!k) return parseArticles(await getHtml(site, page <= 1 ? '/' : `/page/${page}`), site);
    if (k === '/tags') return madouTags(parseHtml(await getHtml(site, '/tags')));
    if (k.startsWith('/')) {
      // 榜单**没有翻页**：第 2 页起直接空，别重复追加
      if (page > 1) return [];
      return parseArticles(await getHtml(site, k), site);
    }
    return parseArticles(await getHtml(site, page <= 1 ? `/category/${k}` : `/category/${k}/page/${page}`), site);
  }
  // wordpress 系（含 51fans1）
  const k = subKey || cat.key;
  const path = k.startsWith('/')
    ? (page <= 1 ? k : k + page + '/')
    : (page <= 1 ? `/category/${k}/` : `/category/${k}/${page}/`);
  return parseArticles(await getHtml(site, path), site);
}

/** 91porna 的列表：按路径分三种页面类型（与 api.dart 的 _pornaList 一致）
 *  - /melonshort*        → 短视频卡片 article.video-card
 *  - heiliao / 黑料吃瓜   → 图文卡 a[href^=/heiliao-chigua/]
 *  - 其余                → div.video-item */
async function pornaFetch(site, key, page) {
  // 关键词里的空格站点用 + 分隔
  const p = key.startsWith('search:')
    ? '/comic/index/search?keyword=' + encodeURIComponent(key.slice(7)).replace(/%20/g, '+')
    : key;
  const path = page <= 1 ? p : p + (p.includes('?') ? '&' : '?') + 'page=' + page;
  const doc = parseHtml(await getHtml(site, path));
  if (path.startsWith('/melonshort')) return melonCards(doc);
  // ⚠️ 只看路径部分（搜索关键词里也可能有"黑料"），并且用完整的"黑料吃瓜"编码
  const p0 = path.split('?')[0];
  // 精选合集：/moviesets、/moviesets/{rank|category|people|brand} 是合集卡页面；
  // 再深一层才是该合集的视频列表（走 video-item）
  if (p0.startsWith('/moviesets')) {
    const segs = p0.split('/').filter((x) => x);
    if (segs.length <= 2) return msCards(doc);
  }
  if (p0 === '/novels' || p0.startsWith('/novels/')) return novelCards(doc);
  if (p0.includes('heiliao') || p0.includes('%E9%BB%91%E6%96%99%E5%90%83%E7%93%9C')) return heiliaoCards(doc);
  return pornaCards(doc);
}

/* -------- Hanime1.me（H動漫）：分类=网格卡、搜索=横排卡、详情=多档直链 mp4 -------- */

/** 相对化：绝对链接 → 站内路径（/watch?v=N 带查询串） */
function hanimeRel(href) {
  if (!/^https?:/.test(href)) return href;
  try { const u = new URL(href); return u.pathname + u.search; } catch (e) { return href; }
}

/** 网格卡（div.video-card-inner）：裏番 / 泡麵番 / 新番預告 这几个分类页用这套模板 */
function hanimeGridCards(doc) {
  const out = [];
  for (const a of doc.querySelectorAll('a[href*="/watch?v="]')) {
    const inner = a.querySelector('div.video-card-inner');
    if (!inner) continue; // 广告卡
    const img = inner.querySelector('img');
    const t = (inner.querySelector('div.home-rows-videos-title')?.textContent || '').trim();
    const src = img ? (img.getAttribute('src') || '') : '';
    if (!t || !src.includes('/image/cover/')) continue; // 只认真卡片（广告卡是 image/icon/）
    out.push({ title: t, url: hanimeRel(a.getAttribute('href') || ''), cover: src, meta: '' });
  }
  return out;
}

/** 横排卡（div.video-item-container）：搜索页 / 站内标签页，
 *  **以及另外 7 个分类页**（Motion Anime / 3DCG / 2.5D / 2D動畫 / AI生成 / MMD / Cosplay）
 *  ⚠️ meta **一律留空**（用户 2026-10-01 拍板）：站点的 div.subtitle 是「上传者 • 上传时间」，
 *  而卡片那行只该放单一信息（§8.2.1-2）——用户决定**两个都不显示**，分类页和**搜索页**都取消。
 *  时长角标（div.duration）照 §8-4 保留。 */
function hanimeRowCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('div.video-item-container')) {
    const a = el.querySelector('a.video-link');
    const href = a ? (a.getAttribute('href') || '') : '';
    if (!href.includes('/watch?v=')) continue; // 广告卡（外链）
    const img = el.querySelector('img.main-thumb');
    const t = ((el.querySelector('div.title')?.textContent || '') || (el.getAttribute('title') || '')).trim();
    if (!t) continue;
    const dur = (el.querySelector('div.duration')?.textContent || '').trim();
    out.push({ title: t, url: hanimeRel(href), cover: img ? (img.getAttribute('src') || '') : '', meta: '', badge: dur });
  }
  return out;
}

/** 分类列表：/search?genre=X&page=N（**两套模板都认**）
 *  ⚠️ 站点对分类页用了两套卡片模板（2026-10-01 用户实报"泡麵番后面的分类都没数据"）：
 *  裏番/泡麵番/新番預告 = 网格卡；Motion Anime/3DCG/2.5D/2D動畫/AI生成/MMD/Cosplay = 横排卡。
 *  实测两种布局**互斥**（同一页不会混），所以网格卡非空就直接返回。 */
async function hanimeFetch(site, genre, page) {
  const q = ['genre=' + encodeURIComponent(genre), ...(page > 1 ? ['page=' + page] : []), ...hnParams()];
  const path = '/search?' + q.join('&');
  const doc = parseHtml(await getHtml(site, path));
  const grid = hanimeGridCards(doc);
  return grid.length ? grid : hanimeRowCards(doc);
}

/** 搜索 / 站内标签（?query= 与 ?tags[]=）共用的横排卡解析（含时长/上传者/时间） */
async function hanimeSearchAt(site, basePath, page) {
  const extra = [...(page > 1 ? ['page=' + page] : []), ...hnParams()];
  const path = basePath + (extra.length ? (basePath.includes('?') ? '&' : '?') + extra.join('&') : '');
  return hanimeRowCards(parseHtml(await getHtml(site, path)));
}

/** 详情：watch?v=N → 标题 / 观看数+日期 / 标签 / 多档直链 mp4（清晰度从高到低） */
function hanimeDetail(html, url) {
  const doc = parseHtml(html);
  const title = (doc.querySelector('h3#shareBtn-title')?.textContent || '').trim() || url;
  let intro = '';
  // ⚠️ 页面有简/繁两种变体（同一 UA 也可能拿到不同版本）：两种都认
  for (const d of doc.querySelectorAll('div.video-details-wrapper')) {
    const t = (d.textContent || '').replace(/\s+/g, ' ').trim();
    if (t.includes('觀看次數') || t.includes('观看次数')) { intro = t; break; }
  }
  const og = doc.querySelector('meta[property="og:image"]');
  const poster = og ? (og.getAttribute('content') || '') : '';
  // 时长：<meta property="og:video:duration" content="1188">（秒）→ 19:48（§8.2-4）。
  // ⚠️ 站点页面 UI 上没有时长，只有这个 meta —— 有就填、没有留空（用现成的 secClock）
  const ogDur = doc.querySelector('meta[property="og:video:duration"]');
  const duration = secClock(ogDur ? (ogDur.getAttribute('content') || '') : '');
  const srcs = [];
  for (const s of doc.querySelectorAll('video source')) {
    const u = s.getAttribute('src') || '';
    if (u) srcs.push([parseInt(s.getAttribute('size') || '0', 10) || 0, u]);
  }
  srcs.sort((x, y) => y[0] - x[0]);
  const videos = [];
  if (srcs.length) videos.push({ ordinal: 1, label: '视频', sources: srcs.map((e) => e[1]) });
  const tags = [];
  for (const a of doc.querySelectorAll('.video-tags-wrapper .single-video-tag a')) {
    const href = a.getAttribute('href') || '';
    if (!href.includes('/search?')) continue; // 排除 +/-（登录按钮）
    const t = (a.textContent || '').replace(/\s+/g, ' ').replace(/\s*\(\d+\)\s*$/, '').replace(/#/g, '').trim();
    if (t) tags.push({ slug: hanimeRel(href), name: t });
  }
  return { title, time: '', images: poster ? [poster] : [], intro, videos, tags, related: [], duration };
}

/* ---------- xHamster（tw.xhamster.com）：**只按移动版 DOM 解析** ----------
   ⚠️ 四条关键事实（2026-10-02 侦察实测，见 DEVLOG 75）：

   1. 服务端把**移动版和桌面版两套 DOM 塞在同一个 HTML 里**（跟 UA 没关系，移动版渲染是
      客户端按**视口宽度**注水的）→ 我们只抓静态 HTML，所以**必须选移动版选择器**：
      卡片 `[data-role="mobile-video-thumb"]`（移动 9 处 / 桌面 26 处）。
      误用桌面的 `div.thumb-image-container` 拿到的是另一套卡、字段名也不同。
   2. 分页是**路径式**：第 N 页 = 路径 + `/N`（`/hd/2`、`/4k/2`…）；**`?page=N` 会被忽略**。
   3. 媒体源是 **HLS master**，就在静态 HTML 里（`<link rel="preload" as="fetch">`，
      全文唯一的 `.m3u8`），5 档 144p~1080p；**CDN 既不校验 Referer 也不校验 UA**
      （与 Pornhub 正好相反）→ 不需要 vproxy 那套 Referer 注入。
      注意 master 里子列表文件名写的是 `144p.h265.mp4.m3u8`，但 `CODECS` 声明的是
      `avc1…`（H.264），**文件名唬人**——以实际解码实测为准。
   4. 相关推荐在移动版是**懒加载空壳**（只有「正在載入...」），静态 HTML 里只有 JSON 形态的
      `data-role="related-item"`（不是 DOM 元素）→ v1 不做（showRelated: false）。 */

/** xHamster「色情明星」页（`/pornstars`）：**DOM 里一张卡都没有**（`thumb-list__item` 实测 0 条，
 *  整页客户端渲染），数据全在页面 JSON 的 `"pornstars":[{…}]` 里（~60 条）：
 *  `videoCount` → `name` → `pageURL`（=`/creators/<slug>`）→ `logoThumbUrl`（头像）。
 *  卡片结构跟视频卡一样（title/url/cover/meta），**不用新写渲染**；
 *  点进去是**他/她的视频列表**（`/creators/xxx`，见下面的点击分支）。
 *  ⚠️ 值是 JSON 转义的，必须 `JSON.parse` 解。 */
function xhStars(html) {
  const out = [];
  const seen = new Set();
  const re = /"videoCount":(\d+)[\s\S]{0,400}?"name":"((?:[^"\\]|\\.)*)"[\s\S]{0,300}?"pageURL":"((?:[^"\\]|\\.)*)"[\s\S]{0,300}?"logoThumbUrl":"((?:[^"\\]|\\.)*)"/g;
  const un = (s) => { try { return JSON.parse('"' + s + '"'); } catch (_) { return s; } };
  let m;
  while ((m = re.exec(html)) !== null) {
    const name = un(m[2]).replace(/\s+/g, ' ').trim();
    const url = un(m[3]).replace(/^https?:\/\/[^/]+/, '');
    if (!name || !url || seen.has(url)) continue;
    seen.add(url);
    out.push({ title: name, url, cover: un(m[4]), meta: m[1] + ' 部', badge: '' });
  }
  return out;
}

/** xHamster「短片」：**走 JSON 接口** `/api/v1/moments`（`/shorts` 页本身是纯客户端渲染，
 *  静态 HTML 里 0 卡片、0 JSON ✗，所以只能打接口）。
 *  实测（2026-10-02）：**无需 cookie**、每页 5~6 条、**翻页是查询参数 `?page=N`**
 *  （`?offset=`/`?from=` 会被忽略 ✗；也**不是**路径式，别套 xhListAt 的路径拼接 ✗）。
 *  每条带：title / pageURL（`/shorts/<slug>`）/ posterUrl·thumbUrl·cover（封面）/
 *  views / landing.name（作者）/ **sources**（H.264，列表接口就给了源）。
 *  ⚠️ 点卡片进的是**短片自己的页**（`/shorts/<slug>`），那条路照常走详情解析（实测有 m3u8 ✓）。 */
// 短路缓存：批次后面几页塞这儿，下次 loadMore 直接吐（0 延迟）。
let xhMomentsBuf = [];
// 批次起始页。**0 = 还没定** → 每次都会随机重新选（用户 2026-10-02：
// "短片的卡片列表每次进去也要随机。不然你老是显示第一批短片意义在哪里？？？"）
let xhMomentsBatchFrom = 0;
let xhMomentsPending = null; // 后台那 3 页的 promise（还没回来时别重复开新批次）

/** 洗牌（Fisher–Yates，原地） */
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

async function xhMoments(site, page) {
  // ⚠️ **渐进式并发预取**（2026-10-02 两轮用户反馈："一页一页请求显示太慢了…" → 改并发后
  // "第一屏还是先显示五篇，然后才显示其他的"）：这个接口每页只有 5~6 条
  // （itemsOnPage/limit/perPage/size/count/pageSize 全试过无效 ✗），单次 2~5s。
  // 所以：**并发抓 4 页，第 1 页回来就返回**，其余 3 页进 `xhMomentsBuf`；
  // 调用方第二次拉时会**等上一批落齐**再吐缓冲（不会重复开批次）→ 配合"第一屏一次画好"，
  // 用户侧就是：转圈 ~4-5s → 一屏内容一次性出现 ✓。
  if (xhMomentsBuf.length) {
    const out = xhMomentsBuf;
    xhMomentsBuf = [];
    return out;
  }
  if (xhMomentsPending) {
    await xhMomentsPending.catch(() => {});
    xhMomentsPending = null;
    if (xhMomentsBuf.length) {
      const out = xhMomentsBuf;
      xhMomentsBuf = [];
      return out;
    }
  }
  const BATCH = 4;
  // **每次从随机页开始**：站点接口有固定分页顺序，只打乱顺序的话池子还是那几条 ✗
  // （用户："不然你老是显示第一批短片意义在哪里？？？"）→ 起始页随机，往后顺延。
  if (!xhMomentsBatchFrom || xhMomentsBatchFrom < 1) {
    xhMomentsBatchFrom = 1 + Math.floor(Math.random() * 48); // 站点片子多，1~48 页都试过有内容 🔍
  }
  const from = xhMomentsBatchFrom;
  xhMomentsBatchFrom += BATCH;
  // 调用方传的 page 只是"第几次拉"，真正拉哪几页由批次号决定（避免和缓冲配合时页码错位）
  const urls = [];
  for (let i = 0; i < BATCH; i++) {
    const p = from + i;
    urls.push('/api/v1/moments' + (p > 1 ? '?page=' + p : ''));
  }
  const parse = (html) => {
    const out = [];
    if (!html) return out;
    let j = null;
    try { j = JSON.parse(html); } catch (_) { return out; }
    for (const it of (j.items || [])) {
      const url = String(it.pageURL || '').replace(/^https?:\/\/[^/]+/, '');
      const title = String(it.title || '').replace(/\s+/g, ' ').trim();
      if (!url || !title) continue;
      // 片源：接口里就带着（`sources.standard.h264`）—— 瀑布流要用它**直接开播**，
      // 省掉"每条再抓一次详情页"（站点自己的流就是这么干的）。
      // 取 `quality === 'auto'` 那条 = **站点默认档**（用户 2026-10-02："短片的话你就使用
      // 网站默认给的分辨率就行"）；再留一个直链 mp4 当兜底（hls.js 起不来时用）。
      const h264 = ((it.sources || {}).standard || {}).h264 || [];
      const auto = h264.find((x) => x && x.quality === 'auto') || h264[0] || {};
      const mp4 = (h264.find((x) => x && x.quality !== 'auto' && /\.mp4/.test(x.url || '')) || {}).url || '';
      out.push({
        title,
        url,
        cover: it.posterUrl || it.thumbUrl || it.cover || '',
        // meta 放作者名（站点流里每条都是「作者」+ 观看数，这里取作者就够）
        meta: (it.landing && it.landing.name) ? String(it.landing.name) : '',
        badge: '',
        play: auto.url || '',
        mp4: mp4,
      });
    }
    return out;
  };
  // ⚠️ **前 2 页并发、拿到就返回**（用户 2026-10-02："你可以一次请求10个啊"）：
  // 2 页 ≈ 10 条，配上短片改成 2 列（一屏 ~6 张）就够铺满第一屏 → 首屏更快。
  // 剩下 2 页挂后台进缓冲，后续滚动瞬间接上。
  const [p1, p2] = await Promise.all(
    [urls[0], urls[1]].map((u) => getHtml(site, u).catch(() => '')));
  const rest = urls.slice(2).map((u) => getHtml(site, u).catch(() => ''));
  xhMomentsPending = Promise.all(rest).then((bodies) => {
    for (const b of bodies) {
      const items = parse(b);
      if (items.length) xhMomentsBuf.push(...items);
    }
  });
  // 缓存给瀑布流用：点卡片时要拿到**整份带片源的列表**才能上下翻条（不必再逐条抓详情）。
  // ⚠️ 每次拉取都**覆盖**成最新批次（缓冲里那几页下一批才进来，够翻就行）。
  // 顺序**打乱**（用户 2026-10-02："短片的卡片列表每次进去也要随机"）→ 每次进 tab 都是新局面。
  const out = shuffleArr(parse(p1).concat(parse(p2)));
  if (out.length) window.__shortsItems = out;
  return out;
}

/** **列表页取数主力**：从页面的 Vue props JSON 里解出全部视频。
 *
 *  ⚠️ 为什么不用 DOM（2026-10-02 用户报"为什么只能抓到这么几篇？？？"后挖出来的）：
 *  桌面版 HTML 里 DOM 只有**前 ~12 张是真卡**，第 13 张起全是**骨架屏占位**
 *  （`<div class="…placeholderSkeleton-c6ca8">`：有 href 和 aria-label 标题，
 *   但 `<img>` 和时长要等客户端 JS 加载）→ 只解析 DOM 只能拿到 12 条 ✗。
 *  而页面 JSON 里有**全部 57 条**（`id`/`duration`秒/`title`/`pageURL`/`thumbURL`/`imageURL`），
 *  跟 `assignable`、详情页相关推荐是同一个套路。
 *  ⚠️ 值是 **JSON 转义**的（`https:\/\/…`、中文 `\u516c`），必须 `JSON.parse` 解。 */
function xhCardsFromJson(html) {
  const out = [];
  const seen = new Set();
  const re = /"id":(\d+),\s*"duration":(\d+),[\s\S]{0,600}?"title":"((?:[^"\\]|\\.)*)"[\s\S]{0,900}?"pageURL":"((?:[^"\\]|\\.)*)"[\s\S]{0,300}?"thumbURL":"((?:[^"\\]|\\.)*)"[\s\S]{0,300}?"imageURL":"((?:[^"\\]|\\.)*)"/g;
  const un = (s) => { try { return JSON.parse('"' + s + '"'); } catch (_) { return s; } };
  let m;
  while ((m = re.exec(html)) !== null) {
    const url = un(m[4]).replace(/^https?:\/\/[^/]+/, '');
    const title = un(m[3]).replace(/\s+/g, ' ').trim();
    if (!url || !title || seen.has(url)) continue;
    seen.add(url);
    out.push({
      title,
      url,
      cover: un(m[6]), // imageURL = 1280×720 大图（thumbURL 是 526×298，留作兜底用不上）
      meta: '',
      badge: secClock(String(m[2])),
    });
  }
  return out;
}

/** 列表卡（DOM 兜底）。⚠️ 现在取数走**桌面 UA**（见 server.mjs 的 DESKTOP_UA），主路径是
 *  上面的 `xhCardsFromJson`；这里只在 JSON 解不出来时兜底（桌面卡 / 移动卡两套都认）。 */
function xhCards(doc, scope) {
  const root = scope || doc;
  const out = [];
  const seen = new Set();
  const put = (href, title, cover, badge, meta) => {
    const url = String(href || '').replace(/^https?:\/\/[^/]+/, '');
    const t = String(title || '').replace(/\s+/g, ' ').trim();
    if (!url || !t || seen.has(url)) return;
    seen.add(url);
    out.push({ title: t, url, cover: cover || '', meta: meta || '', badge: badge || '' });
  };
  // ① 桌面版卡（当前主路径）
  for (const el of root.querySelectorAll('.video-thumb--type-video, .thumb-list__item.video-thumb')) {
    const a = el.querySelector('a[href*="/videos/"]');
    if (!a) continue;
    const img = el.querySelector('img');
    const d = el.querySelector('[data-role="video-duration"]') || el.querySelector('time');
    const up = el.querySelector('.video-thumb-uploader a[href*="/creators/"]') ||
               el.querySelector('.video-uploader__name');
    put(a.getAttribute('href'),
        (img && img.getAttribute('alt')) || a.getAttribute('title') || a.getAttribute('aria-label'),
        img ? (img.getAttribute('src') || img.getAttribute('data-src')) : '',
        d ? d.textContent : '',
        up ? (String(up.getAttribute('href') || '').split('/creators/')[1] || up.textContent) : '');
  }
  // ② 移动版卡（兜底：万一又拿回移动版 HTML，至少有 5 张而不是 0）
  for (const el of root.querySelectorAll('[data-role="mobile-video-thumb"]')) {
    const a = el.querySelector('a[href*="/videos/"]');
    if (!a) continue;
    const url = (a.getAttribute('href') || '').replace(/^https?:\/\/[^/]+/, '');
    if (!url || seen.has(url)) continue;
    seen.add(url);
    const img = el.querySelector('img');
    const title = (a.getAttribute('aria-label') || (img && img.getAttribute('alt')) || '').trim();
    // 封面：**优先 `src`**（实测都是完整图，连 lazy 卡的 src 也是完整的）。
    // ⚠️ 踩过的坑：xHamster 的图片 URL **内部含逗号**（`/s(w:526,h:298),webp/...`）→ 用
    //    `split(',')` 取 srcset 候选会**把 URL 从中间切断**，CDN 直接返 400（用户实报过）。
    //    真要用 srcset 只能按**空白**切（候选之间才是逗号，且后面跟空格）。
    let cover = '';
    if (img) cover = (img.getAttribute('src') || img.getAttribute('data-src') || '').trim();
    if (!cover && img) {
      const ss = (img.getAttribute('srcset') || '').trim();
      if (ss) cover = ss.split(/\s+/)[0].replace(/,$/, '');
    }
    const t = el.querySelector('time');
    const dur = t ? (t.getAttribute('datetime') || t.textContent || '').trim() : '';
    const up = el.querySelector('.video-uploader__name');
    out.push({
      title,
      url,
      cover,
      meta: up ? up.textContent.trim() : '',
      badge: dur,
    });
  }
  return out;
}

/** 列表取数：`base` = 站内路径（'/'、'/hd'、'/4k'、'/vr'、'/categories/<slug>'），
 *  **分页走路径**不是查询参数（第 N 页 = 路径 + `/N`）。
 *  ⚠️ 分类筛选（`xhFilter.cat`）生效时**覆盖** base —— 跟 PH 的 phFetchList 一个套路：
 *     站点自己的「分类」就是跳到 /categories/<slug>，选中某个标签就该只看它。 */
async function xhListAt(site, base, page) {
  // ⚠️ 这里**不能**读 `xhStarSel`（色情明星 tab 的筛选选中项）：那是"这个 tab 的列表要换成哪个路径"，
  // 只该作用在 tab 自己身上。曾经写成全局覆盖 → 点演员进他的页时路径被覆盖回分类列表，
  // 结果又是满屏演员卡（用户 2026-10-02 实报"点图上这个人，进去又是明星卡片"）。
  // 现在由 fetchList 的 xhamster 分支在调用前决定 base（见那里）。
  const path = page > 1 ? (base === '/' ? '' : base || '/') + '/' + page : (base || '/');
  const html = await getHtml(site, path);
  // **演员卡列表**的路径（精确判定，别写成"凡 /pornstars 开头" —— 那会把演员本人的页也吃进来 ✗）：
  //   `/pornstars`（榜首）、`/pornstars/all/...`（按分类/国家筛，实测返回的还是演员）、
  //   `/pornstars/top/...`（榜单）
  // ⚠️ 反面例子：`/pornstars/<名字>` = **演员本人的页 → 视频列表** ✗，不能走演员解析 ——
  //   那个页面里通常还带一段"相似演员"的 JSON（`"pornstars":[…]`），一旦走 xhStars 就会
  //   解析成一屏演员卡，用户实报："选好分类之后有些点进去又是一个明星卡片列表"。
  const isStarList = base === '/pornstars' || String(base || '').startsWith('/pornstars/all/') ||
                     String(base || '').startsWith('/pornstars/top/');
  if (isStarList) {
    const stars = xhStars(html);
    if (stars.length) return stars;
  }
  // 优先走 JSON（一页 ~46-57 条）；解不出来再退回 DOM（~12 条），最后退移动卡（~5 条）
  const fromJson = xhCardsFromJson(html);
  if (fromJson.length) return fromJson;
  return xhCards(parseHtml(html));
}

/** 详情页：**async** —— 要把 master 拉下来展开成各档（复用 XV 那套 `xvHlsVariants`）。
 *  ⚠️ 标题被 Vue SSR 包在注释里（`<!--[--><!--[!-->真标题<!----><!---->`），
 *     直接 textContent 会带一堆注释 → 先剥 `<!--...-->` 再压缩空白。 */
async function xhDetail(html, url) {
  const doc = parseHtml(html);
  // 标题：h1 → 剥注释 → 兜底用 <title>（去掉站点后缀）
  let title = '';
  const h1 = doc.querySelector('h1');
  if (h1) title = h1.textContent.replace(/<!--[\s\S]*?-->/g, '').replace(/\s+/g, ' ').trim();
  if (!title) {
    title = (doc.querySelector('title')?.textContent || '')
        .replace(/\s*[|\-–]\s*xHamster\s*$/i, '').replace(/\s+/g, ' ').trim();
  }
  // 时长：页面 JSON 里的秒数最可靠（页面上的 div.duration 在 SSR 里不一定在）
  const durSec = +((html.match(/"duration":(\d+)/) || [])[1] || 0);
  const duration = durSec > 0 ? secClock(String(durSec)) : '';
  // 封面
  const og = doc.querySelector('meta[property="og:image"]');
  const poster = og ? (og.getAttribute('content') || '') : '';
  // 标签：a[href*="/categories/"]（href 是绝对地址）
  const tags = [];
  for (const a of doc.querySelectorAll('a[href*="/categories/"]')) {
    const name = (a.getAttribute('aria-label') || a.textContent || '').trim();
    const href = a.getAttribute('href') || '';
    const after = href.split('/categories/')[1] || '';
    const slug = after.split(/[?#]/)[0];
    if (!name || !slug) continue;
    if (tags.some((t) => t.name === name)) continue;
    tags.push({ slug, name });
  }
  // 源：静态 HTML 里唯一的一条 .m3u8（<link rel="preload" as="fetch">）
  const videos = [];
  const m = html.match(/https:\/\/[^"'\s\\]+\.m3u8[^"'\s\\]*/);
  if (m) {
    const variants = await xvHlsVariants(m[0]);
    videos.push({ ordinal: 1, label: '视频', sources: variants.length ? variants : [m[0]] });
  }
  // 相关推荐：移动版页面里**没有 DOM 卡片**（`div.m-related-container` 是"正在載入..."空壳），
  // 但**静态 HTML 里有一整段 JSON**（Vue 的 props），每条带 pageURL / title / thumbURL /
  // duration / views —— 直接解析它。（用户指出"详情页的推荐视频你没加上"，这里补上。）
  // ⚠️ 值是 **JSON 转义**的：斜杠是 `https:\/\/…`、中文是 `\u516c\u517e` ——
  //    必须用 JSON.parse 解，不能拿字符串硬拼。
  const related = [];
  {
    const re = /"id":(\d+),\s*"duration":(\d+),\s*"created":\d+,\s*"title":"((?:[^"\\]|\\.)*)"[\s\S]{0,600}?"pageURL":"((?:[^"\\]|\\.)*)"[\s\S]{0,400}?"thumbURL":"((?:[^"\\]|\\.)*)"/g;
    const un = (s) => { try { return JSON.parse('"' + s + '"'); } catch (_) { return s; } };
    let mm;
    while ((mm = re.exec(html)) !== null) {
      const url = un(mm[4]);
      const title = un(mm[3]);
      if (!url || !title) continue;
      // sim 的详情导航要的是**站内路径**（绝对地址会拼成 https://站点/https://站点/…）
      const path = url.replace(/^https?:\/\/[^/]+/, '');
      if (related.some((r) => r.url === path)) continue;
      related.push({
        title,
        url: path,
        cover: un(mm[5]),
        meta: '',
        badge: secClock(String(mm[2])),
      });
      if (related.length >= 20) break;
    }
  }
  return {
    title, time: '', images: poster ? [poster] : [], intro: '',
    videos, tags, related, duration,
  };
}

/* ---------- Pornhub（cn.pornhub.com）：**按移动版 DOM 解析** ----------
   App 的全局 UA 是 iPhone Safari，站点会返回移动版；桌面 UA 下是另一套
   （li.pcVideoListItem + a[title] + var.duration），字段名不同，别混用。
   中文是域名自带的（<html lang="cn">），不用选语言。 */

/** 列表卡：li[data-video-vkey] → 标题 **img[alt]** / 时长 div.bgEffect.time / 封面 img[src]
 *  ⚠️ 标题不能取 `a.thumbnailTitle` 或第一个 `a`：首页那套卡片标题在
 *  `div.vidTitleWrapper > .title > a.thumbnailTitle`，而 /video 列表页那套**没有这个 class**，
 *  它的第一个 `<a class="imageLink">` 文本是**「已观看」**（观看历史角标）——
 *  两套唯一共有的标题来源是封面图的 `alt`（实测就是标题）。 */
function phCards(doc, scope) {
  const out = [];
  // ⚠️ 用 `[data-video-vkey]`（**不带 li**）：分类/搜索页的卡片是 <li>，但**演员页**
  // （/pornstar/xxx）的视频卡不是 li —— 实测 `li[data-video` 在演员页是 0 条。
  // [scope] 传了就在该子树里找（详情页的「相关推荐」用 #relatedVideos，
  // 免得把页面里别的视频块一起扫进来）。
  for (const li of (scope || doc).querySelectorAll('[data-video-vkey]')) {
    const aLink = li.querySelector('a[href*="view_video.php?viewkey="]');
    if (!aLink) continue;
    const href = aLink.getAttribute('href') || '';
    const img = li.querySelector('img.videoThumb') || li.querySelector('img');
    const t = (((img && img.getAttribute('alt')) || '')
      || (li.querySelector('a.thumbnailTitle')?.textContent || ''))
      .replace(/\s+/g, ' ').trim();
    if (!t) continue;
    const durEl = li.querySelector('div.bgEffect.time') || li.querySelector('div.time') ||
      li.querySelector('[class*="duration"]');
    const dur = durEl ? (durEl.textContent || '').trim() : '';
    const p = li.querySelector('a[data-poster]');
    const cover = (img ? (img.getAttribute('src') || '') : '')
      || (p ? (p.getAttribute('data-poster') || '') : '');
    out.push({ title: t, url: href, cover, meta: '', badge: dur });
  }
  return out;
}

/** 演员卡（/pornstars 页）：`.performerCard` → 名字（performerCardName 或 img[alt]）、
 *  头像 pornstarThumb、排名 `.rank_number`（1/2/3…，站点在这个位置给的就是它 → 当角标）。 */
function phStarCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('.performerCard')) {

/** 分类列表：key = 站内路径（'/'、'/video'、'/video?c=27'、'/recommended'…）；翻页 ?page=N。
 *  ⚠️ 分类筛选（phFilter.cat）生效时**覆盖** key —— 站点的分类筛选就是跳到 /video?c=NN。
 *  ⚠️ 站点首页（'/'）自己的分页链接指向 /video?page=N（实测），所以第 2 页起换成 /video。
 *  ⚠️ `/pornstars` 返回的是**演员卡**（不是视频卡），单独解析。 */
async function phFetchList(site, key, page) {
  let base = phFilter.cat || key || '/';
  const bare = base.split('?')[0];
  // 色情明星页：演员类型 + 排序都是 URL 参数（照站点 ?performerType= / ?o=）
  if (bare === '/pornstars') {
    const qs = [];
    if (phStar.type) qs.push('performerType=' + phStar.type);
    if (phStar.sort) qs.push('o=' + phStar.sort);
    if (phStar.time) qs.push('t=' + phStar.time);

  const doc = parseHtml(await getHtml(site, base));
  return bare === '/pornstars' ? phStarCards(doc) : phCards(doc);
}

/** 搜索：/video/search?search=kw（&page=N） */

/** 详情：标题 <h1>（移动版常为空 → 退回 <title> 剥"- Pornhub.com"后缀）；

function phDetail(html, url) {
  const doc = parseHtml(html);

    title = (doc.querySelector('title')?.textContent || '')
      .replace(/\s*-\s*Pornhub\.com\s*$/i, '').replace(/\s+/g, ' ').trim();

  // （页面原始顺序是乱的，实测 1080/240/480/720）。详情页横排展示、默认播 720P；
  // 若以后调整默认档，改 curQuality 一处即可（sim 和 App 要保持一致）。
  const pairs = [];
  for (const m of html.matchAll(/"height":(\d+)[^}]*?"videoUrl":"(https:[^"]*?master\.m3u8[^"]*)"/g)) {
    const u = m[2].replace(/\\\//g, '/');
    if (!pairs.some((p) => p.u === u)) pairs.push({ h: +m[1], u });

  // （tagListItems 的 pornhub 分支认得以 / 开头的 slug）。
  const tags = [...doc.querySelectorAll('a.isTag[href]')].map((a) => ({
    slug: a.getAttribute('href') || '',
    name: (a.textContent || '').replace(/^#/, '').replace(/\s+/g, ' ').trim(),
  })).filter((t) => t.name && t.slug);
  // 相关推荐：页面里是**静态的** `#relatedVideos`（实测，不用额外请求），卡片结构和列表页一样
  const relBox = doc.querySelector('#relatedVideos');
  const related = relBox ? phCards(doc, relBox) : [];
  return {
    title: title || url, time: '', images: [], intro: '',
    videos: srcs.length ? [{ ordinal: 1, label: '视频', sources: srcs }] : [],
    tags, related, duration: dur,
  };
}

async function xvListAt(site, base, page) {

/** thumb-block 卡片解析（分类/标签/搜索共用） */
function xvCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('div.thumb-block')) {
    const a = el.querySelector('p.title a') || el.querySelector('div.title a[href*="/video"]') || el.querySelector('div.thumb a[href*="/video"]');
    if (!a) continue;
    let href = a.getAttribute('href') || '';
    if (!href.includes('/video')) continue;
    // 占位符 THUMBNUM（真站由 JS 填数字；字面值 404）→ 填 1，与 App 一致
    if (href.includes('THUMBNUM')) href = href.replace('THUMBNUM', '1');
    // 标题：首页 p.title / 最佳影片 div.title（容器带 title 属性）；兜底去掉 thl 脚本残留
    const tEl = el.querySelector('p.title') || el.querySelector('div.title');
    let title = ((tEl && tEl.getAttribute('title')) || a.getAttribute('title') || '').trim();
    if (!title) title = (a.textContent || '').replace(/thl\("[^"]*",\s*\d+\);?/g, ' ').replace(/\s*\d+ (min|分钟)\s*$/, '').trim();
    if (!title) continue;
    const img = el.querySelector('img[data-src]') || el.querySelector('img');
    let cover = (img && (img.getAttribute('data-src') || img.getAttribute('src'))) || '';
    if (cover.includes('blank')) cover = '';
    if (cover.includes('THUMBNUM')) cover = cover.replace('THUMBNUM', '1');
    const durEl = el.querySelector('p.title span.duration') || el.querySelector('span.duration');
    const dur = ((durEl && durEl.textContent) || '').trim();
    let meta = ((el.querySelector('p.metadata') || el.querySelector('.video-metadata') || {}).textContent || '').replace(/\s+/g, ' ').trim();
    if (dur && meta.startsWith(dur)) meta = meta.slice(dur.length).replace(/^[\s\-–]+/, '');
    if (dur && meta.includes(dur)) meta = meta.split(dur).join(' ').replace(/\s*-\s*-\s*/g, ' - ').replace(/^\s*[-–\s]+|[-–\s]+$/, '').trim();
    out.push({ title, url: href, cover, meta, badge: dur });
  }
  return out;
}

/** 详情：标题/时长/标签/播放源（mp4 High→Low→HLS）/相关推荐（页面内 video_related 数组） */
/** 拉 HLS master，返回各档子列表地址（按分辨率/码率从高到低）；失败/单档 → []。
 *  照 App 侧 api.dart 的 `_hlsVariants`；走本机 `/proxy`（浏览器直连 XV 的 CDN 会被 CORS 拦）。 */
async function xvHlsVariants(master) {
  try {
    const txt = await (await fetch('/proxy?url=' + encodeURIComponent(master))).text();
    if (!txt.includes('#EXT-X-STREAM-INF')) return []; // 单档列表
    const lines = txt.split('\n').map((s) => s.trim());
    const out = [];
    for (let i = 0; i + 1 < lines.length; i++) {
      if (!lines[i].startsWith('#EXT-X-STREAM-INF')) continue;
      const res = /RESOLUTION=(\d+)x(\d+)/.exec(lines[i]);
      const bw = Number((/BANDWIDTH=(\d+)/.exec(lines[i]) || [])[1] || 0);
      const uri = lines[i + 1];
      if (!uri || uri.startsWith('#')) continue;
      const abs = new URL(uri, master).toString();
      if (out.some((o) => o.u === abs)) continue;
      out.push({ score: res ? Number(res[1]) * Number(res[2]) : bw, u: abs });
    }
    out.sort((a, b) => b.score - a.score); // 高 → 低
    return out.map((o) => o.u);
  } catch (e) {
    log('XV 档位解析失败：' + (e && e.message), 'dim');
    return [];
  }
}

async function xvDetail(html, url) {
  const doc = parseHtml(html);
  let title = (html.match(/setVideoTitle\('([^']*)'\)/) || [])[1] || '';
  title = title.trim() || (doc.querySelector('h2.page-title')?.textContent || '').trim() || url;
  const dur = (doc.querySelector('h2.page-title span.duration')?.textContent || '').trim();
  const srcs = [];
  // HLS 优先（master 含 1080p）；免费片的 High/Low 实测都是 mp4_sd 最低画质 → mp4 兜底
  for (const re of [/setVideoHLS\('([^']+)'\)/, /setVideoUrlHigh\('([^']+)'\)/, /setVideoUrlLow\('([^']+)'\)/]) {
    const m = html.match(re);
    if (m && m[1] && !srcs.includes(m[1])) srcs.push(m[1]);
  }
  // ⚠️ 2026-10-02：**把 master 展开成各档子列表**（高→低），照 App 侧 api.dart 的
  // `_hlsVariants`。原来只留 master 一条 → 详情页「清晰度」行认不出档位，全渲染成「P」
  // （实测 master 长这样：`#EXT-X-STREAM-INF:…RESOLUTION=854x480,NAME="480p"` 换行
  // `hls-480p-ae222.m3u8`，档位只在**子列表名**里）。第一条 = 最高档 = 默认播它。
  const hlsIdx = srcs.findIndex((s) => s.includes('.m3u8'));
  if (hlsIdx >= 0) {
    const variants = await xvHlsVariants(srcs[hlsIdx]);
    if (variants.length) srcs.splice(hlsIdx, 1, ...variants);
  }
  const videos = srcs.length ? [{ ordinal: 1, label: '视频', sources: srcs }] : [];
  const og = doc.querySelector('meta[property="og:image"]');
  const poster = og ? (og.getAttribute('content') || '') : '';
  const tags = [];
  for (const a of doc.querySelectorAll('a[href^="/tags/"]')) {
    const name = (a.querySelector('.name')?.textContent || a.textContent || '').trim();
    const href = a.getAttribute('href') || '';
    if (!name || href === '/tags') continue;
    if (tags.some((t) => t.name === name)) continue;
    tags.push({ slug: href.replace('/tags/', ''), name });
  }
  const related = [];
  const rm = html.match(/video_related=\[(.*?)\];/s);
  if (rm) {
    try {
      for (const e of JSON.parse('[' + rm[1] + ']')) {
        const u = String(e.u || ''); const t = String(e.t || e.tf || '').trim();
        if (!u || !t) continue;
        related.push({ title: t, url: u, cover: String(e.i || e.il || ''), meta: '', badge: String(e.d || '') });
        if (related.length >= 20) break;
      }
    } catch (e) { log('related 解析失败：' + e.message, 'dim'); }
  }
  return { title, time: '', images: poster ? [poster] : [], intro: '', videos, tags, related, duration: dur };
}

/** 秒 → 时长（207 → 3:27；6228 → 1:43:48），拿不到返回空 */
function secClock(raw) {
  const sec = parseInt(String(raw ?? '').trim(), 10);
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

/** 从 mp4 直链解分辨率算宽高比（/vid/avc1/1920x1080/ → 16:9）；拿不到 null */
function pektinoAspect(mp4) {
  const m = /\/(\d{2,5})x(\d{2,5})\//.exec(mp4 || '');
  if (!m) return null;
  const w = parseInt(m[1], 10), h = parseInt(m[2], 10);
  return w > 0 && h > 0 ? w / h : null;
}

/** 列表（分类/顶部榜/搜索共用接口）。slug 空串 = 全站 */
async function pektinoFetch(site, range, slug, page, bare) {
  // 主题从筛选器来（slug 非空 = 搜索词，优先）；时长带 min/max；排序带 sort。
  // bare=true（搜索用）：不受列表页筛选状态影响（搜索是独立的）
  const cat = slug || (bare ? '' : (pkFilter.theme || ''));
  const d = (bare ? '0,0' : (pkFilter.dur || '0,0')).split(',');
  const min = parseInt(d[0], 10) || 0, max = parseInt(d[1], 10) || 0;
  const path = `/api/media?range=${range}&page=${page}&per_page=50`
    + `&category=${encodeURIComponent(cat)}&ids=&isFilteredOnly=0&sort=${bare ? 'favorite' : pkFilter.sort}`
    + (min > 0 ? `&min_time=${min}` : '') + (max > 0 ? `&max_time=${max}` : '');
  const j = JSON.parse(await getHtml(site, path));
  return ((j && j.items) || []).map(pektinoItem);
}

/** 一条视频 → 卡片：封面（横竖混排）+ 右下角时长 + 播放/评论/收藏数，没有标题 */
function pektinoItem(v) {
  const parts = [];
  if (v.pv) parts.push('播放 ' + v.pv);
  if (typeof v.commentCount === 'number') parts.push('评论 ' + v.commentCount);
  if (v.favorite) parts.push('收藏 ' + v.favorite);
  return {
    title: '',
    url: '/zh-CN/movie/' + (v.url_cd || ''),
    cover: v.thumbnail || '',
    meta: '',
    badge: secClock(v.time),
    desc: parts.join(' · '),
    tags: [],
    aspect: pektinoAspect(v.url || ''),
  };
}

/** 详情：Next.js payload 里数据块按 "url_cd" 切块、正则抽字段（同 App 的 _pektinoDetail） */
function pektinoDetail(html, url) {
  const urlCd = (url || '').split('/movie/').pop().replace(/\/$/, '');
  const plain = html.replace(/\\"/g, '"').replace(/\\\\/g, '\\');
  const starts = [];
  let at = -1;
  while ((at = plain.indexOf('"url_cd"', at + 1)) >= 0) starts.push(at);
  const grab = (chunk, key) => {
    const m = new RegExp('"' + key + '":\\s*("(?:[^"]*)"|[0-9.]+|null)').exec(chunk);
    if (!m) return '';
    const v = m[1];
    return v === 'null' ? '' : (v[0] === '"' ? v.slice(1, -1) : v);
  };
  const entries = [];
  for (let i = 0; i < starts.length; i++) {
    const end = i + 1 < starts.length ? starts[i + 1] : plain.length;
    const chunk = plain.slice(starts[i], Math.min(starts[i] + 2000, end));
    const e = {
      url_cd: grab(chunk, 'url_cd'), url: grab(chunk, 'url'), time: grab(chunk, 'time'),
      thumbnail: grab(chunk, 'thumbnail'), pv: grab(chunk, 'pv'),
      favorite: grab(chunk, 'favorite'), tweet_account: grab(chunk, 'tweet_account'),
    };
    if (e.url && e.thumbnail) entries.push(e); // 只收真视频条目（挡 tags 表噪音）
  }
  let main = null; const rel = [];
  for (const e of entries) { if (!main && e.url_cd === urlCd) main = e; else rel.push(e); }
  if (!main) main = entries[0] || null;
  const videos = [];
  if (main && main.url) videos.push({ ordinal: 1, label: '视频', sources: [main.url] });
  const introParts = [];
  if (main && main.tweet_account) introParts.push('@' + main.tweet_account);
  if (main && main.pv) introParts.push(main.pv + ' 次播放');
  if (main && main.favorite) introParts.push(main.favorite + ' 收藏');
  return {
    title: urlCd || url,
    intro: introParts.join(' · '),
    time: '',
    images: [],
    videos,
    tags: [],
    related: rel.slice(0, 12).map((e) => ({
      title: '', url: '/zh-CN/movie/' + e.url_cd, cover: e.thumbnail, meta: '',
      badge: secClock(e.time), desc: '', tags: [], aspect: pektinoAspect(e.url),
    })),
    duration: secClock(main ? main.time : ''),
  };
}

      // 专题卡（/topics/xxx/）点开的是"该专题下的视频列表"，不是某一篇详情
      if (a.url && (a.url.startsWith('/topics/') || a.url.startsWith('/moviesets/'))) {
        const site0 = cat.site || SITES.find((s) => s.categories.includes(cat)) || SITES[0];
        openTagList(site0, a.title, a.url, false);
        return;
      }
      // 标签卡（url 形如 /tag/xxx，麻豆社的「热门标签」标签云页）：
      // 点进的是该标签的列表页，不是文章详情
      if (a.url && a.url.startsWith('/tag/')) {
        const site1 = cat.site || SITES.find((s) => s.categories.includes(cat)) || SITES[0];
        openTagList(site1, a.title, a.url, true);
        return;
      }
      // XVideos 频道/演员卡：进该频道/演员的「視頻」免费列表（RED 收费不取）
      const siteNow = cat.site || SITES.find((s) => s.categories.includes(cat)) || SITES[0];
      if (siteNow && siteNow.template === 'xvideos' && a.url && !a.url.includes('/video.')) {
        openTagList(siteNow, a.title, a.url, false);
        return;
      }
      // Pornhub 演员卡（/pornstar/xxx、/model/xxx）：进该演员的**视频列表**（用户 2026-10-02
      // 明确要求——不是详情页；和上面 xvideos 的频道/演员卡一个处理）
      if (siteNow && siteNow.template === 'pornhub' && a.url && /\/(pornstar|model)\//.test(a.url)) {
        openTagList(siteNow, a.title, a.url, false);
        return;
      }
      // xHamster 演员卡（`/pornstars/<slug>`，实测不是 /creators/）：进**他/她的视频列表**（不是详情页）
      if (siteNow && siteNow.template === 'xhamster' && a.url &&
          (a.url.includes('/pornstars/') || a.url.includes('/creators/'))) {
        openTagList(siteNow, a.title, a.url, false);
        return;
      }
      // xHamster 短片卡：进**竖屏瀑布流**（用户 2026-10-02 要求），不是详情页。
      // 列表已在 xhMoments 里缓存到 window.__shortsItems（带片源，能直接开播）。
      if (siteNow && siteNow.template === 'xhamster' && a.url && a.url.startsWith('/shorts/')) {
        const all = window.__shortsItems || [];
        if (all.length) {
          let idx = 0;
          for (let q = 0; q < all.length; q++) if (all[q].url === a.url) { idx = q; break; }
          viewShortsFeed(siteNow, all, idx);
          return;
        }
      }
      openDetail(a, cat, $('body').scrollTop);
    };
  });
  fillImages(wrap);
  // 搜索页没有 #more（只有列表页有），判空，否则会抛
  // "Cannot set properties of null (setting 'innerHTML')" 并被误报成"搜索失败"
  const more = $('more');
  if (more) {
    more.innerHTML = st.done
      ? '<span class="dim">没有更多了</span>'
      : '<span class="spin"></span>';
  }
  log(`${cat.name}：已加载 ${st.items.length} 篇`, 'dim');
}

async function loadMore(site, cat, st, sub) {
  if (st.loading || st.done) return;
  st.loading = true;
  try {
    const items = await fetchList(site, cat, sub, st.page);
    if (!items.length) { st.done = true; log(`${cat.name} 第 ${st.page} 页：0 篇（到底）`, 'dim'); }
    else {
      // ⚠️ **去重**：xHamster 短片现在改成"随机起始页 + 打乱"，批次之间会撞车
      //（用户看到同一条短片在列表里出现两次 ✗）→ 按 url 过滤掉已有的再追加。
      const have = new Set(st.items.map((x) => x.url));
      const fresh = items.filter((x) => x.url && !have.has(x.url));
      st.items.push(...fresh);
      st.page++;
      log(`${cat.name} 第 ${st.page - 1} 页：${items.length} 篇`, 'ok');
    }
  } catch (e) {
    st.done = true;
    log(`抓取失败 ${cat.name}：${e.message}`, 'err');
  } finally {
    st.loading = false;
    // ⚠️ **第一屏一次画好**（2026-10-02 用户两轮反馈：先是"一页一页太慢"，改并发后又"第一屏还是先显示
    // 五篇，然后才显示其他的"）：
    // 每来一页就 renderCards 一次 → 必然看到"5 张 → 蹦出剩下的"的中间态 ✗。
    // 所以：**内容还不够铺满一屏时先不画**（保持 spinner），继续补页，够了再一次性画。
    // 竖版 3 列一屏约 9~12 张、横版 2 列约 6~8 张 → 取 12 当阈值（别的站首屏本来就 50+ 条，
    // 一页就过阈值，行为不变 ✓）。
    // 兜底：到底了 / 连着补了 4 次还凑不够 → 有多少画多少（小分类就只有几条，不能一直转圈）。
    st.autoFill = st.autoFill || 0;
    // 短片 2 列、一屏 ~6 张 → 阈值放低（10 条就够一次画好）；其它站照旧 12
    const need = cat.name === '短片' ? 8 : 12;
    const enough = st.items.length >= need || st.done || st.autoFill >= 4;
    if (!enough && !st.loading) {
      st.autoFill++;
      loadMore(site, cat, st, sub);
      return; // 先不画
    }
    renderCards({ name: cat.name, site }, st);
  }
}

/* -------- 短片瀑布流（竖屏流）--------
   用户 2026-10-02 定的操作：**单击 = 暂停/播放；上/下划 = 换条；左/右划 = 调进度**（进度条放底部）。
   复用现成的 <video> + hls.js + `.pbar` 那套（观感与详情页一致）。
   片源直接用**列表接口给的 `sources`**（站点自己的流就是这么干的）→ 不必每条再抓详情页。
   短片是 **H.264**（不是 4K 站那种 h265）→ 浏览器 hls.js 放得动，所以 sim 里能真播。 */
let feedItems = [];
let feedIdx = 0;
let feedHls = null;
let feedSite = null;

/// 秒 → `mm:ss`（sim 里没有现成的数字版格式化；`secClock` 是解析"1:23"这种文本用的）
function feedClock(t) {
  t = Math.max(0, Math.floor(t || 0));
  const m = Math.floor(t / 60);
  const s = t % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/** 退出瀑布流：把流元素藏起来 + 走正常的返回（回到短片卡片列表）。 */
function feedExit() {
  const f = document.getElementById('feed');
  if (f) f.style.display = 'none';
  try { const v = document.getElementById('v'); if (v) v.pause(); } catch (_) {}
  // 只撤销"流自己加的"那套黑底标记（用户背景图功能可能本来就带着 hasbg/darkbg ✗ 别误删）
  if (window.__feedAddedBg) {
    const sc = document.querySelector('.screen');
    if (sc) sc.classList.remove('hasbg', 'darkbg');
    window.__feedAddedBg = false;
  }
  const sc2 = document.querySelector('.screen');
  if (sc2) sc2.classList.remove('feedon', 'feedpause'); // 状态栏层级/暂停态标记都还原
  back();
}

/** 续拉下一批（用户 2026-10-02 报"五条播完就划不动了"）：
 *  缓存给流的列表只有**第一批**（`xhMoments` 每次返回一批），滑到尾部就没有了 ✗。
 *  `xhMoments` 内部用批次计数器 `xhMomentsBatchFrom` 自动往后走，所以直接再调一次就是下一批。 */
async function feedLoadMore() {
  if (!feedSite || window.__feedLoading) return;
  window.__feedLoading = true;
  try {
    // 续拉的这批也**打乱**再追加 → 保持整条流的随机性（用户 2026-10-02："瀑布流随机"）
    const more = shuffleArr(await xhMoments(feedSite, 99));
    const seen = new Set(feedItems.map((x) => x.url));
    for (const it of more) {
      if (!it || !it.url || seen.has(it.url)) continue;
      seen.add(it.url);
      feedItems.push(it);
    }
    window.__shortsItems = feedItems;
    // 用户 2026-10-02："打日志就没必要了吧。只要修改好就可以了" → 成功路径不打日志（失败仍打 ✓）
  } catch (e) {
    log('瀑布流续拉失败：' + e.message, 'err');
  } finally {
    window.__feedLoading = false;
  }
}

function feedStopHls() {
  if (feedHls) {
    try { feedHls.destroy(); } catch (_) {}
    feedHls = null;
  }
}

/** **预缓存接下来 5 条**（用户 2026-10-02："预缓存3条"→"预缓冲五条吧，三条太少了"）。
 *  实测：不预缓冲换条要等 **~3.0 秒**；预 1 条降到 **~0.5 秒**（多数 30ms）。
 *  **做法 = 纯网络预取**（不占解码器，比隐藏 video 还轻）：把 master → 变体清单 → 前几个分片
 *  用 `fetch()` 拉一遍，让它们落进 **HTTP 缓存** ✓。切条时 hls.js 重新 init 也照样要解析清单 ✗，
 *  但分片已经在缓存里 → 起播不用等网络 ✓（这正是实测收益的来源 ✓）。
 *  ⚠️ 不做双实例：浏览器里反正要重建 hls ✗；真机上两个 KpPlayer = 两份 demux 缓冲 + 两个解码器，
 *     开销远大于纯预取（用户判断正确 ✓）。 */
let feedPreCache = null;

async function feedPreload(from) {
  if (!feedPreCache) feedPreCache = new Set();
  const COUNT = 5; // 永远保持"前面 5 条已缓存"
  const added = [];
  for (let k = 0; k < COUNT; k++) {
    const j = from + k;
    const it = feedItems[j];
    if (!it) { // 窗口已经越过列表尾部 → 顺手把列表续上
      if (j >= feedItems.length) feedLoadMore();
      continue;
    }
    const url = it.play || it.mp4 || '';
    if (!url || feedPreCache.has(url)) continue; // 已在缓存里的跳过（这就是"只补差额"）
    feedPreCache.add(url);
    added.push(k);
    feedPrecacheOne(url, k);
  }
  // 用户 2026-10-02："打日志就没必要了吧。只要修改好就可以了" → 不再打补货日志（行为见上方注释）
}

async function feedPrecacheOne(url, idx) {
  try {
    const isM3u8 = /\.m3u8/i.test(url);
    if (!isM3u8) { await fetch(url).catch(() => {}); return; } // 直链 mp4：拉一下进缓存
    const master = await (await fetch(url)).text();
    if (!/#EXTM3U/.test(master)) return;
    // master → 取**起播档**（hls.js 默认从低档起步，这里取第一条变体 = 最低档）
    const lines = master.split('\n').map((s) => s.trim());
    let variant = '';
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('#EXT-X-STREAM-INF') && lines[i + 1]) { variant = lines[i + 1]; break; }
    }
    if (!variant) return;
    const vurl = new URL(variant, url).href;
    const vt = await (await fetch(vurl)).text();
    const segs = vt.split('\n').map((s) => s.trim()).filter((l) => l && !l.startsWith('#'));
    for (const s of segs.slice(0, 3)) { // 前 3 个分片足够起播
      try { await fetch(new URL(s, vurl).href); } catch (_) {}
    }
  } catch (_) {}
}

async function feedPlay(i) {
  if (i < 0 || i >= feedItems.length) return;
  feedIdx = i;
  const it = feedItems[i];
  const v = $('v');
  const st = $('pstate');
  if (!v) return;
  feedStopHls();
  try { v.pause(); } catch (_) {}
  v.removeAttribute('src');
  st.textContent = '加载中…';
  // ⚠️ `$` 在本文件里是 getElementById 的别名 → **不能带 `#`**（带了拿回 null，一取 .textContent 就抛）
  $('ftitle').textContent = it.title || '';
  $('fauthor').textContent = it.meta || '';
  // 站点默认档优先（用户要求），直链 mp4 兜底
  const url = it.play || it.mp4 || '';
  if (!url) { st.textContent = '这条没有片源'; return; }
  const okHls = await ensureHls();
  const isM3u8 = /\.m3u8/i.test(url);
  // ⚠️ **一旦真的开始播就抹掉"加载中…"**（用户 2026-10-02："我都开始看了还一直在"）：
  //    根因是 `else`（mp4 兜底）那条分支我忘了清 `pstate` ✗ —— hls.js 没加载上时视频照样播，
  //    但"加载中…"永远挂着。这里用 onplaying 兜住**所有**路径，以后加分支也不会再漏。
  v.onplaying = () => { st.textContent = ''; };
  // **播放/暂停 → 控制"暂停时才显示 X 和状态栏"**（用户 2026-10-02）：
  // 播放 = 沉浸（藏着），暂停/加载中 = 露出可操作。用类挂在 .screen 上，CSS 统一门控。
  const scP = document.querySelector('.screen');
  v.onplay = () => { if (scP) scP.classList.remove('feedpause'); };
  v.onpause = () => { if (scP) scP.classList.add('feedpause'); };
  if (okHls && window.Hls && window.Hls.isSupported() && isM3u8) {
    st.textContent = '';
    feedHls = new window.Hls({ enableWorker: false });
    feedHls.loadSource(url);
    feedHls.attachMedia(v);
    feedHls.on(window.Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
    feedHls.on(window.Hls.Events.ERROR, (_, dd) => {
      // 致命错误且还没试过兜底 → 换直链 mp4 再试一次（防抖：每集只兜底一次）
      if (dd && dd.fatal && it.mp4 && !it._fb) {
        it._fb = true;
        log('短片 HLS 失败，换直链 mp4：' + it.title.slice(0, 20), 'dim');
        feedStopHls();
        v.src = it.mp4;
        v.play().catch(() => {});
      } else if (dd && dd.fatal) {
        st.textContent = '播放出错';
      }
    });
  } else {
    // mp4 兜底（或 HLS 不可用）：这里也必须清掉"加载中…"（onplaying 也会兜，双保险）
    st.textContent = '';
    v.src = isM3u8 ? (it.mp4 || url) : url;
    v.play().catch(() => {});
    if (isM3u8 && it.mp4) it._fb = true;
  }
  const upd = () => {
    const pos = v.currentTime || 0;
    const dur = v.duration || 0;
    $('ptime').textContent = feedClock(pos) + ' / ' + feedClock(dur);
    const pc = dur > 0 ? (pos / dur * 100) : 0;
    $('pplay').style.width = pc + '%';
    $('pknob').style.left = pc + '%';
    $('pbuf').style.width = (dur > 0 && v.buffered.length ? (v.buffered.end(v.buffered.length - 1) / dur * 100) : 0) + '%';
  };
  v.ontimeupdate = upd;
  v.ondurationchange = upd;
  v.onprogress = upd;
  // **播完自动下一条**（用户 2026-10-02："进度条满了为什么不自动下一个短片？"）——
  // 抖音式流就是这个行为；已经是最后一条时 feedPlay 会直接 return（停在结尾，不报错）。
  v.onended = () => { feedPlay(feedIdx + 1); };
  // 滑到尾部附近就**预先续拉下一批**（不然播完/划到第 N 条就"划不动了" ✗）
  if (feedIdx >= feedItems.length - 2) feedLoadMore();
  // **预缓冲下一条**（当前这条开播之后再去做，别抢它的带宽 ✓）
  feedPreload(feedIdx + 1);
  upd();
}

function viewShortsFeed(site, items, start) {
  feedSite = site;
  feedPreCache = null; // 每次进流重新预缓存（上一轮的缓存 key 作废，避免误判"已缓存"）
  // **瀑布流随机**（用户 2026-10-02："瀑布流随机"）：点的那条放第 1 位（点啥先看啥），其余全部打乱；
  // 之后每续拉一批也打乱再追加 → 就是一条随机流（不重复，靠 url 去重）。
  const arr = (items || []).slice();
  const picked = arr.splice(Math.max(0, Math.min(start || 0, arr.length - 1)), 1)[0];
  feedItems = picked ? [picked].concat(shuffleArr(arr)) : shuffleArr(arr);
  push(() => {
    showNav(false);
    $('tabs').style.display = 'none';
    $('subbar').style.display = 'none';
    const sb2 = $('subbar2');
    if (sb2) sb2.style.display = 'none';
    setAppbar(`<div class="ic" onclick="feedExit()">‹</div><h1>短片</h1><div class="spacer"></div>`);
    const screen = document.querySelector('.screen');
    $('body').innerHTML = '';
    let el = document.getElementById('feed');
    if (!el) {
      el = document.createElement('div');
      el.id = 'feed';
      el.className = 'feed';
      el.innerHTML = `
        <video id="v" playsinline></video>
        <video id="pre" playsinline muted style="display:none"></video>
        <div class="pstate" id="pstate">加载中…</div>
        <div class="fhint" id="fhint" style="display:none"></div>
        <div class="fclose" id="fclose">✕</div>
        <div class="fmeta"><div class="ft" id="ftitle"></div><div class="fa" id="fauthor"></div></div>
        <div class="ptime" id="ptime"></div>
        <div class="pbar" id="pbar"><div class="track"></div><div class="buf" id="pbuf"></div>
          <div class="play" id="pplay"></div><div class="knob" id="pknob"></div></div>`;
      screen.appendChild(el);
    }
    el.style.display = 'block';
    // 状态栏：流是黑底的 → 用 sim 自己的"深底白字"机制（`.screen.hasbg.darkbg .status`）
    // 否则状态栏是深色字、在黑底上**看不见** ✗（用户 2026-10-02 提 X 位置时一并暴露的问题）
    const sc0 = document.querySelector('.screen');
    if (sc0 && !sc0.classList.contains('darkbg')) {
      sc0.classList.add('hasbg', 'darkbg');
      window.__feedAddedBg = true;
    }
    if (sc0) sc0.classList.add('feedon', 'feedpause'); // feedon=状态栏可提到流之上；feedpause=暂停态（刚进来还没播，按暂停态显示 X）
    // 左上角 X（用户 2026-10-02 要求）＋ 顶栏返回键也走同一个出口（否则只会 pop 不会收起流元素）
    const fc = $('fclose');
    if (fc) fc.onclick = () => feedExit();
    feedPlay(0); // 起点恒为 0：点的那条已经在 viewShortsFeed 里被挪到第 1 位了

    // ---- 手势：单击暂停 / 上下滑换条 / 左右滑调进度 ----
    let sx = 0, sy = 0, mode = '', hint = null;
    const v = () => $('v');
    // ---- 手势：单击暂停 / 上下滑换条 / 左右滑调进度 ----
    // ⚠️ 全部绑在 **document** 上（不再挂 el）：用户 2026-10-02 报"你这个提示一直显示的？"
    //    —— 说明真鼠标/触摸下 `pointerup` 不保证落在 el 上；挂 el 的话不只是提示收不掉，
    //    **上下滑/左右滑也会整个失效** ✗（我之前的测试用合成事件，每次成对发出，所以测不出来 ✗）。
    //    绑 document 只要手在窗口内就一定收到；用 `feedOpen()` 挡住别的页面。
    //    绑定只做一次（反复进瀑布流不会叠加监听）。
    if (!window.__feedBound) {
      window.__feedBound = true;
      const feedOpen = () => {
        const f = document.getElementById('feed');
        return !!f && f.style.display !== 'none';
      };
      const feedEl = () => document.getElementById('feed');
      const showHint = (txt) => {
        const h = document.getElementById('fhint');
        if (h) { h.style.display = 'block'; h.textContent = txt; }
      };
      const hideHint = () => {
        const h = document.getElementById('fhint');
        if (h) h.style.display = 'none';
      };
      document.addEventListener('pointerdown', (e) => {
        if (!feedOpen()) return;
        window.__feedDown = true; // ⚠️ 必须记"按下了"：否则鼠标**只是悬停**时 pointermove 也会触发，
                                  // 拿旧起点算位移 → 白白弹出"↑ 下一条"提示（用户实测就是这么挂着不消失 ✗）
        window.__feedSx = e.clientX;
        window.__feedSy = e.clientY;
        // 起点是否贴着左边缘（决定这次横划是"返回"还是"调进度"）
        window.__feedEdge = e.clientX < 30;
        window.__feedMode = '';
      }, true);
      document.addEventListener('pointermove', (e) => {
        if (!feedOpen()) return;
        // 没按下键就不算手势（鼠标悬停也会发 pointermove ✗）——这是提示"挂着不消失"的根因
        if (!window.__feedDown && e.buttons === 0) return;
        const dx = e.clientX - (window.__feedSx || 0);
        const dy = e.clientY - (window.__feedSy || 0);
        if (!window.__feedMode) {
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            window.__feedMode = Math.abs(dx) > Math.abs(dy) ? 'seek' : 'switch';
          } else {
            return;
          }
        }
        const vv = document.getElementById('v');
        if (!vv) return;
        if (window.__feedMode === 'seek') {
          const bb = feedEl().getBoundingClientRect();
          const add = dx / bb.width * ((vv.duration || 0) || 120);
          showHint((add >= 0 ? '▶ ' : '◀ ') + feedClock(Math.abs(add)));
        } else {
          showHint(dy < 0 ? '↑ 下一条' : '↓ 上一条');
        }
      }, true);
      document.addEventListener('pointerup', (e) => {
        if (!feedOpen()) return;
        window.__feedDown = false;
        const dx = e.clientX - (window.__feedSx || 0);
        const dy = e.clientY - (window.__feedSy || 0);
        const mode = window.__feedMode || '';
        window.__feedMode = '';
        hideHint();
        // 从左边缘往右划 = **返回**（用户 2026-10-02："左滑返回也是要的"）。
        // 与"左右滑调进度"不冲突：只有起点在左边缘 30px 内才算返回。
        if (window.__feedEdge && dx > 60) { feedExit(); return; }
        const vv = document.getElementById('v');
        if (!vv) return;
        if (mode === 'seek') {
          const bb = feedEl().getBoundingClientRect();
          const add = dx / bb.width * ((vv.duration || 0) || 120);
          vv.currentTime = Math.max(0, Math.min(vv.duration || 9999, (vv.currentTime || 0) + add));
        } else if (mode === 'switch') {
          if (Math.abs(dy) > 55) feedPlay(feedIdx + (dy < 0 ? 1 : -1));
        } else {
          // 没滑动 = 单击 → 暂停/播放
          if (vv.paused) vv.play().catch(() => {}); else vv.pause();
        }
      }, true);
      document.addEventListener('pointercancel', () => { window.__feedMode = ''; window.__feedDown = false; hideHint(); }, true);
    }
    // 进度条也可点（跟详情页一致）
    $('pbar').onclick = (e) => {
      const r = $('pbar').getBoundingClientRect();
      const vv = v();
      vv.currentTime = ((e.clientX - r.left) / r.width) * (vv.duration || 0);
    };
  });
}

/* -------- 播放器（hls.js + 自定义进度条，行为对齐 App） -------- */
const HLS_CDNS = [
  'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
  'https://unpkg.com/hls.js@1/dist/hls.min.js',
  'https://cdn.bootcdn.net/ajax/libs/hls.js/1.5.15/hls.min.js',
];
async function ensureHls() {
  if (window.Hls) return true;
  for (const src of HLS_CDNS) {
    try {
      await new Promise((ok, no) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = no;
        document.head.appendChild(s);
      });
      if (window.Hls) { log('hls.js 已加载：' + src, 'dim'); return true; }
    } catch (e) { log('hls.js 源不可用：' + src, 'dim'); }
  }
  return false;
}

const lazySrcCache = new Map(); // 合集按需取源缓存：子文章地址 -> 播放源[]

/** 合集：点哪集抓哪集（把这一篇子文章的 dplayer 源取回来） */
async function fetchLazySources(site, url) {
  if (lazySrcCache.has(url)) return lazySrcCache.get(url);
  const task = (async () => {
    try {
      const html = await getHtml(site, url);
      const page = parseHtml(html);
      const out = [];
      if (site.template === 'huangguo') {
        // 黄果的某一集：源在 videoInitialData.epPlaySrcs[本集号]（页面自报 ep）
        let data = null;
        const raw = page.querySelector('script#videoInitialData')?.textContent || '';
        if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
        const ep = data ? (parseInt(String(data.ep), 10) || 0) : 0;
        const src = (data && data.epPlaySrcs && data.epPlaySrcs[String(ep)]) || '';
        if (src) out.push(src);
      } else {
        for (const dp of page.querySelectorAll('.dplayer[data-config]')) {
          try {
            const cfg = JSON.parse(dp.getAttribute('data-config'));
            if (cfg.video && cfg.video.url) out.push(cfg.video.url);
            if (cfg.video_h265 && cfg.video_h265.url) out.push(cfg.video_h265.url);
          } catch (e) {}
        }
      }
      if (out.length) lazySrcCache.set(url, out);
      return out;
    } catch (e) {
      log('取源失败 ' + url + '：' + ((e && e.message) || e), 'err');
      return [];
    }
  })();
  lazySrcCache.set(url, task);
  return task;
}

/** 从源 URL 里抠清晰度数字（'1080' / '720' …）；抠不到返回 '' */
/** 从源 URL 里抠清晰度数字。兼容两种命名（与 App 侧 detail_page._qualityOf 一致）：
 *  Pornhub `.../1080P_4000K_xxx.mp4/master.m3u8`（大写 P + 下划线）、
 *  XVideos `.../hls-480p-ae222.m3u8`（小写 p，后跟 `.`/`?` 等非数字）。
 *  ⚠️ 2026-10-02：原来是 PH 专用的 `(\d+)P_`，XV 的档位认不出来（全渲染成「P」）→ 放宽。
 *  ⚠️ 2026-10-02 再修：**必须先取最后一段文件名再匹配** —— xHamster 的 URL 里带
 *     `media=hls4/multi=256x144:144p,426x240:240p,…`，对整个 URL 匹配会先命中
 *     参数里的 `144p`，5 档全被认成 144P（实测）。只看文件名对别的站也没影响。 */
const qOf = (u) => {
  const s = String(u).split('?')[0];
  const name = s.slice(s.lastIndexOf('/') + 1);
  return (name.match(/(\d{3,4})[pP](?![0-9])/) || [])[1] || '';
};

/** 当前该用哪一档：用户手选的优先；否则**默认 720P**（用户 2026-10-02 定）；
 *  该档不存在就退回列表里最高的那档（列表由 phDetail 按清晰度从高到低排好） */
function curQuality(srcs) {
  const list = srcs || [];
  const q = window.__curQ;
  if (q && list.some((u) => qOf(u) === q)) return q;
  if (list.some((u) => qOf(u) === '720')) return '720';
  return qOf(list[0]) || '';
}

async function playVideo(v, site) {
  const video = $('v');
  if (!video) return;
  if (curPlayer && curPlayer.destroy) { try { curPlayer.destroy(); } catch (e) {} curPlayer = null; }
  // 合集类：这一集没有源 → 按需去它的子文章页取（详情页首屏才快）
  if (v && !(v.sources && v.sources.length) && v.lazyUrl) {
    $('pstate').textContent = '正在取视频…';
    log('按需取源：' + v.lazyUrl, 'dim');
    const got = await fetchLazySources(site, v.lazyUrl);
    if (!got.length) {
      $('pstate').textContent = '这一集已失效（子文章打不开或没有视频）';
      log('这一集取源失败：' + v.lazyUrl, 'err');
      return;
    }
    v = { ...v, sources: got };
  }
  // 源：按选中的清晰度挑（默认 720P，见 curQuality）；列表是 phDetail 排好的高→低
  const srcs = (v && v.sources) || [];
  const wantQ = curQuality(srcs);
  const src = srcs.find((u) => qOf(u) === wantQ) || srcs[0];
  if (!src) {
    $('pstate').textContent = '该视频没有可用源';
    log('视频无源（dplayer 配置里 video/video_h265 都为空）', 'err');
    return;
  }
  $('pstate').textContent = '加载中…';
  log('播放：' + src.slice(0, 90), 'dim');
  const url = video.canPlayType('application/vnd.apple.mpegurl') ? src : src;
  // mp4（Pektino 的推文原视频）直接给 video 元素；只有 m3u8 才走 hls.js
  if (!/\.mp4(\?|$)/i.test(url) && await ensureHls() && window.Hls.isSupported()) {
    // ⚠️ 这里**不要**用 xhrSetup 改 URL 去走 /vproxy：hls.js 解析清单里的相对 URI 时，
    // base 用的是「它实际请求的那个 URL」，一改就会把相对路径解析到模拟器自己身上
    // （2026-10-02 实测：子清单被请求成 http://localhost:8787/index-v1-a1.m3u8 → levelLoadError）。
    // 正确做法在服务端：server.mjs 的 streamM3u8 把清单里每个 URI 换成 /vproxy 的绝对地址，
    // 客户端这边完全无感（跨域、Referer 都由 Node 那边解决）。
    const hls = new window.Hls({ maxBufferLength: 30, maxMaxBufferLength: 120 });
    curPlayer = hls;
    // ⚠️ phncdn（Pornhub）：**第一次请求就要走 /vproxy**。否则 hls.js 拿着原始 CDN 地址
    // 一路直连：master/子清单能过（CDN 给 CORS、m3u8 不要 Referer），但**分片**挑站点
    // Referer（浏览器只能带 localhost）→ 必然 404 → fragLoadError（2026-10-02 实测定位）。
    // 进中转后：Referer 由 Node 写、清单里的 URI 由 streamM3u8 换成 /vproxy 绝对地址，
    // 后面每一层自动继续走中转。
    const playUrl = /phncdn\.com/.test(url)
      ? location.origin + '/vproxy?url=' + encodeURIComponent(url)
      : url;
    hls.loadSource(playUrl);
    hls.attachMedia(video);
    hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
      $('pstate').textContent = '';
      video.play().catch(() => {});
    });
    hls.on(window.Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) { log('hls：' + data.details, 'dim'); return; }
      // ⚠️ PH 的 CDN 子域会变（em-h/im-h 畅通，hm-h 走 Cloudflare、对我们的请求一律 410）。
      // 站点每次抓详情随机分配子域 → 命中 hm-h 时**重抓一次详情换个源**再试（最多 2 次）。
      const q = window.__curQ || '';
      if (/phncdn/.test(url) && (v.__retry || 0) < 2 && /manifest|level|frag/i.test(data.details || '')) {
        v.__retry = (v.__retry || 0) + 1;
        $('pstate').textContent = '源不可达，换一个源重试…';
        log(`第 ${v.__retry} 次换源重试`, 'dim');
        (async () => {
          try {
            const html2 = await getHtml(site, window.__curUrl);
            const d2 = phDetail(html2, window.__curUrl);
            const v2 = (d2.videos || [])[0];
            if (v2 && v2.sources && v2.sources.length) {
              v2.__retry = v.__retry;   // 带着计数继续（避免无限循环）
              window.__curDetail = d2;  // 同步给清晰度行/上一集下一集，否则它们还拿着旧源的 URL
              const keepQ = q; window.__curQ = ''; // 重试时先按默认档挑（新源可能没有原来那档）
              await playVideo(v2, site);
              window.__curQ = keepQ;
              return;
            }
          } catch (e) { log('换源失败：' + (e && e.message), 'err'); }
          $('pstate').textContent = '播放出错：' + (data.details || '') + '（换源也没成功）';
        })();
        return;
      }
      $('pstate').textContent = '播放出错：' + (data.details || '');
      log('hls 致命错误：' + data.details, 'err');
    });
  } else {
    // mp4（Pektino 的推文原视频）走**服务端中转**：内置浏览器直连 video.twimg.com
    // 被墙；Node 服务器跟随系统代理能拉，把流转发给播放器（支持 Range 拖动）
    video.src = /\.mp4(\?|$)/i.test(url)
      ? '/vproxy?url=' + encodeURIComponent(url)
      : url;
    video.onloadeddata = () => { $('pstate').textContent = ''; };
    video.onerror = () => {
      // Pektino 的视频是推文原 mp4（video.twimg.com 直链）：连不上那个 CDN 时
      // 报"格式不支持"会误导——它就是网络到推特视频 CDN 不通（挂代理再试）
      $('pstate').textContent = /\.mp4/i.test(url)
        ? '视频源打不开（video.twimg.com）——多为网络到推特视频 CDN 不通，挂代理再试'
        : '播放出错（浏览器不支持该格式，且 hls.js 没加载上）';
      log('video 元素报错', 'err');

/** 播放器控件状态：播放/暂停图标；上一集/下一集禁用态（与 App 对齐） */
function simUpdPlayBtn() {
  const v = $('v'), b = $('bPlay');
  if (v && b) b.textContent = v.paused ? '▶' : '⏸';
}
function simUpdNavBtns() {
  const n = (window.__curDetail && window.__curDetail.videos.length) || 0;
  const i = window.__curVi || 0;
  if ($('bPrev')) $('bPrev').classList.toggle('dis', i <= 0);
  if ($('bNext')) $('bNext').classList.toggle('dis', i >= n - 1);
}
/** 播放器"上一集/下一集"：与点选集同一套（高亮 + playVideo） */
function simSwitchTo(i) {
  const d = window.__curDetail, site = window.__curSite;
  if (!d || !d.videos.length || i < 0 || i > d.videos.length - 1) return;
  window.__curVi = i;
  document.querySelectorAll('#vlist .vrow, #vlist .vchip').forEach((r) => {
    r.classList.toggle('on', parseInt(r.dataset.i, 10) === i);
  });
  playVideo(d.videos[i], site);
}

function bindPlayerUi(video) {
  const upd = () => {
    const dur = video.duration || 0;
    const pos = video.currentTime || 0;
    let bufEnd = 0;
    try {
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= pos + 0.5 && video.buffered.end(i) > bufEnd) {
          bufEnd = video.buffered.end(i);
        }
      }
    } catch (e) {}
    const p = dur ? (pos / dur) * 100 : 0;
    const b = dur ? (bufEnd / dur) * 100 : 0;
    $('pplay').style.width = p + '%';
    $('pbuf').style.width = b + '%';
    $('pknob').style.left = p + '%';
    $('ptime').textContent = `${fmt(pos)} / ${fmt(dur)}`;
  };
  video.ontimeupdate = upd;
  video.onprogress = upd;
  video.ondurationchange = upd;
  upd();

  // 控件行（与 App 对齐）：上一集 / 播放暂停 / 下一集 / 放大一倍 / 全屏
  if ($('bPrev')) {
    $('bPrev').onclick = () => simSwitchTo((window.__curVi || 0) - 1);
    $('bNext').onclick = () => simSwitchTo((window.__curVi || 0) + 1);
    $('bPlay').onclick = () => {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      simUpdPlayBtn();
    };
    $('bZoom').onclick = () => {
      const on = !video.dataset.zoom;
      video.dataset.zoom = on ? '1' : '';
      video.style.transform = on ? 'scale(2)' : '';
      $('bZoom').classList.toggle('on', on);
      $('bZoom').textContent = on ? '还原' : '放大';
    };
    $('bFull').onclick = () => {
      const p = $('player');
      if (document.fullscreenElement) document.exitFullscreen();
      else if (p.requestFullscreen) p.requestFullscreen();
    };
    video.onplay = simUpdPlayBtn;
    video.onpause = simUpdPlayBtn;
  }
  simUpdPlayBtn();
  simUpdNavBtns();

  // 双击：左三成退 / 右三成进 10 秒（与 App 设置项一致）；**中间三成 = 暂停/播放**
  $('player').ondblclick = (ev) => {
    const r = $('player').getBoundingClientRect();
    const x = ev.clientX - r.left;
    if (x > r.width * 0.35 && x < r.width * 0.65) {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      simUpdPlayBtn();
      return;
    }
    const back = x < r.width / 2;
    video.currentTime = Math.max(0, Math.min(video.duration || 0,
      video.currentTime + (back ? -10 : 10)));
    upd();
  };
  // 左右拖动 = 按距离跳转（滑满一屏 120 秒），松手才跳
  let dragging = false, dx = 0, from = 0, width = 0;
  $('player').onpointerdown = (ev) => {
    dragging = true; dx = 0; from = video.currentTime;
    width = $('player').getBoundingClientRect().width;
  };
  $('player').onpointermove = (ev) => {
    if (!dragging) return;
    dx += ev.movementX || 0;
    if (Math.abs(dx) > 6) $('ptime').textContent =
      `${fmt(Math.max(0, from + dx / width * 120))} （松手跳转 ${Math.round(dx / width * 120)}s）`;
  };
  $('player').onpointerup = () => {
    if (!dragging) return;
    dragging = false;
    if (Math.abs(dx) > 6) {
      video.currentTime = Math.max(0, Math.min(video.duration || 0, from + dx / width * 120));
      upd();
    }
  };
  $('pbar').onclick = (ev) => {
    const r = $('pbar').getBoundingClientRect();
    video.currentTime = ((ev.clientX - r.left) / r.width) * (video.duration || 0);
    upd();
  };
}

/** 标签/分类列表（按站点模板取，与 api.dart 的 tag()/category() 对应） */
async function tagListItems(site, slug, isTag, page) {
  const tpl = site.template || 'wordpress';
  if (tpl === 'huangguo') {
    if (slug.startsWith('/')) return hgPageList(site, slug, page);  // 专题等路径型
    if (page > 1) return [];
    return hgCards(parseHtml(await getHtml(site, `/tag/${slug}/`)));
  }
  if (tpl === 'porna') {
    // 以 / 开头的是站内分类页（黑料吃瓜的标签），否则当搜索关键词
    return pornaFetch(site, slug.startsWith('/') ? slug : 'search:' + slug, page);
  }
  if (tpl === 'hanime1') {
    // 详情页标签是 /search?query= 或 /search?tags[]= 的路径；其余当搜索词
    return hanimeSearchAt(site, slug.startsWith('/search') ? slug : '/search?query=' + encodeURIComponent(slug), page);
  }
  if (tpl === 'xvideos') {
    // 频道/演员卡（slug 以 / 开头）：进「視頻」免费列表；其余是详情页标签
    if (slug.startsWith('/')) return xvProfileVideos(site, slug, page);
    return xvListAt(site, '/tags/' + slug, page);
  }
  if (tpl === 'pornhub') {
    // 演员卡（/pornstar/xxx、/model/xxx）→ 该演员的**视频列表**（不是详情页）；
    // slug 可能已经带查询串（如 /pornstar/x?o=mv），分页要接 & 不是 ?
    const p = page <= 1 ? slug : slug + (slug.includes('?') ? '&' : '?') + 'page=' + page;
    return phCards(parseHtml(await getHtml(site, p)));
  }
  if (tpl === 'kmsvip') return []; // 站点没有标签功能
  if (tpl === 'xhamster') {
    // 演员卡给的 slug 是站内路径（实测 `/pornstars/<slug>`），进的是**视频列表**；
    // 分页走路径（`/pornstars/<slug>/2`）。非路径形态的标签这里不接。
    if (slug.startsWith('/')) return xhListAt(site, slug, page);
    return [];
  }
  if (tpl === 'madou') {
    // 详情页的标签是裸 slug（/tag/{slug}）；以 / 开头的是卡片上的分类路径
    const path = slug.startsWith('/')
      ? (page <= 1 ? slug : `${slug}/page/${page}`)
      : (page <= 1 ? `/tag/${slug}` : `/tag/${slug}/page/${page}`);
    return parseArticles(await getHtml(site, path), site);
  }
  const path = isTag
    ? (page <= 1 ? `/tag/${slug}/` : `/tag/${slug}/page/${page}/`)
    : (page <= 1 ? `/category/${slug}/` : `/category/${slug}/${page}/`);
  return parseArticles(await getHtml(site, path), site);
}

/** 搜索列表（按站点模板取，与 api.dart 的 search() 对齐）
 *  WordPress 系 5 站的搜索**有分页**：/search/{kw}/{页码}/
 *  （页面上「下一页」链接就是这个形态；实测第 2 页有内容且与第 1 页不重复。
 *  2026-09-30 修正：之前以为"站点无搜索分页"，只取了第 1 页）；
 *  黄果搜索单页；91porna 走 &page=。 */
async function searchItems(site, kw, page) {
  const tpl = site.template || 'wordpress';
  if (tpl === 'kmsvip') return []; // 站点没有搜索功能
  if (tpl === 'huangguo') {
    if (page > 1) return []; // 黄果搜索单页（页面上没有分页入口）
    return hgCards(parseHtml(await getHtml(site, '/search/?keyword=' + encodeURIComponent(kw))));
  }
  if (tpl === 'porna') return pornaFetch(site, 'search:' + kw, page);
  // Pektino：搜索 = 把输入当分类名传同一个接口（与站点一致；搜索独立、不受列表筛选影响）
  if (tpl === 'pektino') return pektinoFetch(site, 'all', kw, page, true);
  if (tpl === 'hanime1') return hanimeSearchAt(site, '/search?query=' + encodeURIComponent(kw), page);
  if (tpl === 'xvideos') return xvSearchAt(site, kw, page);
  if (tpl === 'pornhub') return phSearch(site, kw, page);
  if (tpl === 'madou') {
    // 搜索 = /?s={kw}；翻页参数是 **paged**（不是 page），照站点原样
    const encM = encodeURIComponent(kw);
    return parseArticles(await getHtml(site, page <= 1 ? `/?s=${encM}` : `/?paged=${page}&s=${encM}`), site);
  }
  const enc = encodeURIComponent(kw);
  const path = page <= 1 ? `/search/${enc}/` : `/search/${enc}/${page}/`;
  return parseArticles(await getHtml(site, path), site);
}

function openSearch(siteIdx) { push(() => viewSearch(SITES[siteIdx])); }

function viewSearch(site) {
  showNav(false);
  setAppbar(`<div class="ic" onclick="back()">‹</div>
    <div class="searchbar" style="flex:1">
      <input id="kw" placeholder="搜索文章关键词..." />
    </div>
    <div style="padding:0 10px;color:#8d4b2a;cursor:pointer" id="doSearch">搜索</div>`);
  $('tabs').style.display = 'none';
  $('subbar').style.display = 'none';
  const sb2 = $('subbar2'); if (sb2) sb2.style.display = 'none';
  $('body').className = 'body';
  // 清掉上一个页面遗留的滚动监听：否则搜索结果滚到底，会去加载那个分类的
  // "下一页"，并把搜索结果替换成分类列表（串台，踩过 → 已在真机对照中发现）
  $('body').onscroll = null;
  $('body').innerHTML = `<div class="hint">输入关键词即可搜索</div>`;
  $('doSearch').onclick = doSearch;
  $('kw').onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
  $('kw').focus();
  async function doSearch() {
    const kw = $('kw').value.trim();
    if (!kw) return;
    $('body').onscroll = null; // 换一批结果前先解绑旧的滚动监听
    $('body').innerHTML = `<div style="text-align:center;padding:40px 0"><span class="spin"></span></div>`;
    try {
      const items = await searchItems(site, kw, 1);
      log(`搜索「${kw}」：${items.length} 篇`, items.length ? 'ok' : 'err');
      if (!items.length) { $('body').innerHTML = `<div class="hint">无结果</div>`; return; }
      const portrait = site.portraitCovers ? ' portrait' : '';
      const hnBar = site.template === 'hanime1' ? hnFilterBarHtml() : '';
      $('body').innerHTML = `${hnBar}<div class="cards${portrait}" id="cards"></div>
        <div style="text-align:center;padding:12px;color:#999" id="more"></div>`;
      if (site.template === 'hanime1') hnBindBar(site, doSearch); // 筛选变了：按新条件重搜
      const st = { items, page: 2, done: false };
      // 与 App 搜索页一致：滚到底自动翻下一页（到底后 #more 显示"没有更多了"）
      const load = async () => {
        if (st.loading || st.done) return;
        st.loading = true;
        try {
          const more = await searchItems(site, kw, st.page);
          if (!more.length) { st.done = true; log(`搜索「${kw}」第 ${st.page} 页：0 篇（到底）`, 'dim'); }
          else { st.items.push(...more); st.page++; log(`搜索「${kw}」第 ${st.page - 1} 页：${more.length} 篇`, 'ok'); }
        } catch (e) {
          st.done = true;
          log(`搜索「${kw}」抓取失败：${e.message}`, 'err');
        } finally {
          st.loading = false;
          renderCards({ name: '搜索「' + kw + '」', site }, st);
          // 内容还占不满一屏（如黄果只有 9 条）→ 够不着"滚到底"，继续检查
          if (!st.done && $('body').scrollHeight <= $('body').clientHeight + 300) load();
        }
      };
      $('body').onscroll = () => {
        if ($('body').scrollTop + $('body').clientHeight > $('body').scrollHeight - 300) load();
      };
      // 传 site：详情页要靠它决定请求哪个域名（原先是 null → 回落 51吃瓜 → 404）
      renderCards({ name: '搜索「' + kw + '」', site }, st);
      // 一屏都没占满（如黄果只有 9 条）就够不着"滚到底"：直接检查，
      // 该加载就接着加载（黄果会立刻到底 → 显示"没有更多了"）
      if ($('body').scrollHeight <= $('body').clientHeight + 300) load();
    } catch (e) {
      $('body').innerHTML = `<div class="hint">搜索失败：${esc(e.message)}</div>`;
      log('搜索失败：' + e.message, 'err');
    }
  }
}

        <div class="srow">
          <div class="lab"><div class="t">自动播放下一集</div>
            <div class="s">一篇里有多个视频时，播完自动切下一个</div></div>
          <div class="sw ${stCfg.autoNext ? 'on' : ''}" onclick="stToggle()"></div>
        </div>
        <div class="sdivider"></div>
        <div class="srow"><div class="lab">
          <div class="t">播放缓冲大小</div>
          <div class="s">越大越抗卡、拖动越顺，但更吃内存</div></div></div>
        ${stSeg('buffer', [{ v: 100, label: '100M' }, { v: 200, label: '200M' }, { v: 300, label: '300M' }, { v: 500, label: '500M' }, { v: 1024, label: '1G' }], stCfg.buffer)}
        <div class="snote">改完重进视频生效；1G 在低内存机型上可能被杀进程</div>
      </div>

      <div class="scard">
        <div class="scard-hd"><div class="ic">🖼</div><div class="tt">背景图</div></div>
        <!-- 图集入口（模拟器加的，真机没有）：左=当前背景缩略图，右=背景图集 / N 张 › / 当前状态 -->
        <div class="srec bgentry" onclick="bgAlbumOpen()">
          <i class="bgal-th"${bgImgSt}></i><div class="mid">
            <div class="ti oneline">背景图集</div>
            <div class="meta"><span>当前：${bgCurTxt}</span><span>${bgAlbum.length} 张 ›</span></div>
          </div>
        </div>
        <div class="sbtnrow" style="padding-top:12px;gap:10px">
          <div class="abtn" onclick="bgPickGallery()">从相册选择</div>
          ${appBg === 'bg_default.jpg'
            ? `<div class="abtn off">恢复默认</div>`
            : `<div class="abtn" onclick="bgRestore()">恢复默认</div>`}
        </div>
        <div class="snote">从相册选择背景不保存在图集，想储存用就在图集里添加</div>
        <!-- 模拟器专用控件（真机没有） -->
        <div class="sdivider"></div>
        <div class="snote" style="padding-bottom:6px">模拟器专用（真机是相册选图）</div>
        <div class="sbtnrow"><div class="sbtn" onclick="bgAlbumLoadTests()">载入 5 张测试图</div></div>
        <input class="sinput" id="bgUrl" type="url" placeholder="粘贴图片 URL，如 https://…jpg"
          value="${esc(appBg)}">
        <div class="sbtnrow">
          <div class="sbtn primary" onclick="bgApplyInput()">应用图片</div>
          <div class="sbtn" onclick="bgAlbumAddInput()">加入图集</div>
          <div class="sbtn danger" onclick="bgPick('')">清除背景</div>
        </div>
        <div class="snote">随便点一张示范图试试：</div>
        <div class="bgpresets">${BG_DEMO.map((u, i) =>
          `<i style="background:${u};width:74px;height:44px;border-radius:10px;cursor:pointer;display:block" onclick="bgPick('${u}')"></i>`).join('')}</div>
        <div class="snote" style="padding-bottom:2px">有背景图时，卡片和底部导航自动变半透明、
          文字加描边 —— 无论图多花，图标和字都看得清</div>
      </div>

      <div class="snote" style="text-align:center;padding-top:2px">
        模拟器里设置项只做展示（可点，但不影响 App）
      </div>
    </div>`;
}

/* -------- 启动 -------- */
$('nav').querySelectorAll('.item').forEach((it) => {
  it.onclick = () => {
    $('nav').querySelectorAll('.item').forEach((x) => x.classList.remove('on'));
    it.classList.add('on');
    stack = [];
    if (it.dataset.nav === 'grid') viewGrid(); else viewSettings();
  };
});
// 先把外壳渲染出来（否则第一屏是空白，要等 /sites 回来才有东西）
// ?nav=settings 直达设置页（截图/调试方便：不用手点底部导航）
// ?albumpick=1 直达图集页并自动弹出"添加背景"弹层（核验弹层用，不用手点）
if (WANT_ALBUMPICK) {
  viewAlbum();
  bgAlbumPick();
} else if (WANT_SETTINGS) {
  const it = $('nav').querySelector('[data-nav="settings"]');
  if (it) {
    $('nav').querySelectorAll('.item').forEach((x) => x.classList.remove('on'));
    it.classList.add('on');
    viewSettings();
  } else {
    viewGrid();
  }
} else if (WANT_SITE < 0) {
  viewGrid();
}
log('模拟器已就绪；站点清单来自 lib/sites.dart', 'ok');
loadSitesWithRetry();
</script>
</body>
</html>
