<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>KPXX 模拟器（数据/界面验证）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #e9eaee;
    /* 用户 2026-10-02 指定用微软雅黑（桌面版没有 iOS 的 SF Pro，字形会有细微差别） */
    font: 14px/1.5 "Microsoft YaHei", "微软雅黑", "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 28px;
    color: #1b1b1f;
  }
  /* ---------- 手机外壳 ---------- */
  .phone {
    /* ⚠️ 2026-10-02 用户要求照 **iPhone 16 Pro Max** 改：**屏幕** 440×956（= 他截图
       1320×2868 ÷ 3x）。外壳把这 12px 的边框**加在外面**（464×980）—— 早先写成
       `width: 440` + padding，结果屏幕只有 416 宽，状态栏所有水平位置整体偏 12pt。
       窗口放不下时由 fitPhone() 把 .phone 整体 zoom 缩小（zoom 真改布局尺寸，不留滚动条）。 */
    width: 464px; height: 980px; background: #000; border-radius: 64px;
    padding: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.35); flex: 0 0 auto;
    position: relative;
  }
  .screen {
    position: relative; width: 100%; height: 100%; background: #fff;
    border-radius: 55px; overflow: hidden; display: flex; flex-direction: column;
  }
  /* 灵动岛（16 Pro 的挖孔）：真机上必有 —— iOS 系统截图**不渲染它**，所以用户给的截图里
     看不见它。用户 2026-10-02 明确要求加上；位置/尺寸照真机：125×37、顶部 11px、水平居中。 */
  .island {
    position: absolute; left: 50%; top: 11px; transform: translateX(-50%);
    width: 125px; height: 37px; background: #000; border-radius: 18.5px;
    z-index: 30; pointer-events: none;
  }
  /* 状态栏：高 62px = iPhone 16 Pro 系列的顶部安全区（给灵动岛让位）。
     ⚠️ 2026-10-02 照用户真机截图**逐像素量**出来的位置（单位 pt，440 宽）：
       · 时间：真机是**在「灵动岛左边那块区域」里居中**（中心 ≈82），不是"左边距 32"；
               垂直中心 ≈32，字号 ≈19（按数字高 14.2 反推）。
       · 图标：靠右，**右边距 ≈42**；信号 311.7..334.2、Wi-Fi 340.8..360.8、电池 ..398；
               图标高 ≈15、间隔 ≈6.6/7.1；垂直中心 ≈31（和时间同高）。
     → 所以：左侧固定占「灵动岛左侧区」宽 157.5px 并居中，右侧 flex 到右端 + 右内边距 42px，
       整条用 padding-top 22 + line-height 1.2 把内容压到顶部那一带。 */
  .status {
    height: 62px; flex: 0 0 auto; display: flex; align-items: flex-start;
    justify-content: space-between; padding: 21px 0 0;
    /* ⚠️ 2026-10-02 用户："时间加粗 1" → 400 → **600**。微软雅黑只有 400/700 两档，
       500 是空的（实测 400 与 500 渲染完全相同），所以直接跳到 600 才有可见变化。
       "时间上移" → padding-top 22 → 21.5 → **21**（两次各 0.5px）。
       注意这是整条状态栏的内边距，图标会跟着一起上移。 */
    font-weight: 600; font-size: 19px;
    line-height: 1.2;
    /* ⚠️ 2026-10-02 **不再写死白色**：曾经按用户"都改成白色"的要求锁成 #fff，
       结果切到白色/浅色背景图时，整条状态栏在全白背景上**一片空白看不见**
       （用户实测报的）。现在交回给 sim 原有的"按背景明暗自适应"机制：
       浅色背景 = 深字（继承 body 的 #1b1b1f），深色背景由下面
       `.screen.hasbg.darkbg .status *` 那条规则翻白。 */
    background: transparent; /* 用户要求：状态栏/顶栏/底栏一律透明，不吃底色 */
    position: relative; z-index: 40; /* 压在灵动岛之上：时间和图标在它两侧，不会重叠 */
  }
  #clock { flex: 0 0 157.5px; text-align: center; }
  /* 状态栏右侧：仿 iOS —— 信号格 / Wi-Fi / 电量百分比 / 电池。
     ⚠️ 2026-10-02 用户要求「要仿真」：原来是一串字符画（`▮▮▮ ⌾▮ 72`）。 */
  .status .right {
    flex: 1; display: flex; align-items: center; justify-content: flex-end;
    gap: 7px; letter-spacing: 0; padding-right: 42px;
  }
  /* 信号格 + Wi-Fi 用抠过底的真机截图（黑+alpha 的 sb-icons.png，52×17）：**按 1:1 显示**
     —— 图里图标本身高 ≈15px，早先显示成 15px 等于把图缩到 0.88，看着比真机小一圈。
     ⚠️ 图本身是**黑色**的：浅色背景直接显示，深色背景**才** invert 翻白
     （不能再无条件 invert —— 那样浅色背景下会变成白色、跟背景糊在一起）。 */
  .status .right .sb-ico { display: block; height: 17px; width: auto; }
  .screen.hasbg.darkbg .status .right .sb-ico { filter: invert(1); }
  /* 电池：**整体跟随状态栏文字色**（`currentColor`），所以浅色背景是黑的、深色背景是白的。
     框 / 凸点 / 未填充区 = currentColor 的半透明版；填充 = 实心 currentColor、占满框内高。
     **电量固定 50%**（用户要求，不再读真机电量）。
     ⚠️ 尺寸：用户要求"高度跟 wifi 信号一样"→ 框 34×17 = 和 .sb-ico（17px）同高。
     ⚠️ 曾经写成"半透明白"常量，切浅色背景时同样会糊成一片（同一个 bug）。 */
  .bat { position: relative; display: inline-block; width: 34px; height: 17px; flex: 0 0 auto; }
  .bat::before {
    content: ''; position: absolute; inset: 0; box-sizing: border-box;
    border: 1.5px solid color-mix(in srgb, currentColor 58%, transparent); border-radius: 5.5px;
    background: color-mix(in srgb, currentColor 28%, transparent);
  }
  .bat::after {
    content: ''; position: absolute; right: -2.5px; top: 5px; width: 2px;
    height: 7px; border-radius: 0 1.5px 1.5px 0;
    background: color-mix(in srgb, currentColor 58%, transparent);
  }
  .bat .fill {
    /* ⚠️ 2026-10-02 用户："电池是填充的，你的电池左边没有填充满" → 左端/上下都贴到边框
       （原来 1.5px 的缝看着像没填满）。留 1px，正好压在边框内沿上。
       填充用 currentColor：浅色背景=黑、深色背景=白（跟框一致）。 */
    position: absolute; left: 1px; top: 1px; height: 15px; width: 16px;
    border-radius: 4.5px 0 0 4.5px; background: currentColor;
  }
  .bat .num {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 700; letter-spacing: -.2px;
    /* ⚠️ 数字压在电量条上：用 difference 自动反色 ——
       浅色背景（条是黑的）→ 字变白；未填充区是浅的 → 字变深；
       深色背景正好反过来。这样不用为"透明色/黑白"写死两套。 */
    color: #fff; mix-blend-mode: difference;
  }
  /* ---------- 顶栏 ---------- */
  .appbar {
    flex: 0 0 auto; background: transparent; display: flex; align-items: center;
    gap: 6px; padding: 4px 8px 8px; position: relative;
  }
  .appbar h1 { flex: 1; text-align: center; font-size: 20px; font-weight: 600; margin: 0; }
  .appbar .ic {
    width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px;
    cursor: pointer; border-radius: 50%;
  }
  .appbar .ic:hover { background: rgba(0,0,0,.06); }
  .appbar .spacer { width: 40px; }
  /* ---------- KPXX 品牌标识（宫格首页顶栏，**通栏居中**） ---------- */
  /* ⚠️ 2026-10-02 照用户真机截图改：原来是个小胶囊（padding 0 11px），
     真机上是**左右各留 16px 的通栏宽条**、圆角 14、粗体居中。 */
  .brand { display: flex; flex: 1; margin: 0 8px; }
  .brand .tag {
    flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    background: linear-gradient(180deg,#FFB63C 0%,#F29A12 100%);
    color: #14100B; font-weight: 800; font-size: 18px; letter-spacing: .6px;
    box-shadow: 0 2px 7px rgba(0,0,0,.28);
  }
  /* ---------- 内容区 ---------- */
  .body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; background: #F6F6F9; }
  .body.white { background: #fff; }
  /* ---------- 底部导航 ---------- */
  .nav {
    flex: 0 0 auto; display: flex; background: transparent; border-top: 1px solid #eee;
  }
  /* ⚠️ 2026-10-02 用户要求"底栏抬高一点，跟手机界面一样"：底部内边距 14 → **34px**，
     正好是 iPhone 16 Pro Max 的底部安全区（Home Indicator 那一条的高度）；
     原来是 14px，内容贴着屏幕的 55px 圆角，看着像被切掉。 */
  .nav .item {
    flex: 1; padding: 10px 0 34px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; cursor: pointer; color: #6b6b6b; font-size: 12px;
  }
  .nav .item.on { color: #8d4b2a; }
  .nav svg { width: 26px; height: 26px; }
  /* ---------- 宫格 ---------- */
  /* ⚠️ 2026-10-02 照用户真机截图放尺寸：图标 74px（原 62）、行距 26（原 18）、左右留白 14（原 10） */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px 10px; padding: 16px 14px; }
  /* ⚠️ 2026-10-02：用户报"下面的文字被挡住了一点"。CDP 实测**没有任何裁切**（文字底部=tile 底部，
     clientHeight=scrollHeight，祖先的 overflow 边界都在 380px 之外）—— 真正原因是文字**紧贴**
     tile 下边界 + 窗口缩放 0.91 时 12px 字亚像素渲染发糊，看着像被切。
     这里给 tile 底部留 4px 余量，让它不再顶边（不动行距，避免整体位移）。 */
  .tile { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer;
          padding-bottom: 6px; }
  .tile .box {
    width: 74px; height: 74px; border-radius: 16px; background: #fff;
    border: 1px solid rgba(0,0,0,.08); display: grid; place-items: center; overflow: hidden;
  }
  .tile .box img { width: 100%; height: 100%; object-fit: contain; padding: 11px; }
  .tile .box .noimg { color: #fff; font-size: 30px; font-weight: 700; width: 100%; height: 100%;
    display: grid; place-items: center; }
  /* ⚠️ 2026-10-02 站名 12 → **13px**：用户报"文字像缺了一点"。实测 DOM 没有裁切，
     真因是窗口缩放到 0.91 时 12px 字变成 ~10.9px，笔画在亚像素下会被吃掉。
     放大一档后即使缩放也还有 ~11.8px，字形才立得住。 */
  .tile span { font-size: 13px; color: #333; text-align: center; }
  /* ---------- 列表页 ---------- */
  .tabs {
    display: flex; gap: 22px; overflow-x: auto; padding: 0 16px; background: transparent;
    border-bottom: 1px solid transparent; flex: 0 0 auto; scrollbar-width: none;
    touch-action: pan-x;   /* 触屏：浏览器原生横滑；鼠标拖动由 JS 处理 */
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs .tab {
    padding: 12px 0 8px; font-size: 14px; color: #333; white-space: nowrap;
    cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tabs .tab.on { color: #8d4b2a; border-color: #8d4b2a; font-weight: 600; }
  /* 子分类行（黄果的排序 / 91porna 的子频道） */
  .subbar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; background: transparent;
    border-bottom: 1px solid transparent; flex: 0 0 auto; scrollbar-width: none; touch-action: pan-x; }
  .subbar::-webkit-scrollbar { display: none; }
  .subbar .sub { flex: 0 0 auto; padding: 5px 12px; border-radius: 15px; font-size: 12px;
    background: transparent; border: 1px solid rgba(60,60,60,.35); color: #2c2c2c; cursor: pointer; white-space: nowrap; }
  .subbar .sub.on { background: #e8590c; color: #fff; }
  /* Hanime1 的四个筛选下拉（標籤/排序方式/發佈日期/時長）：裸 <button>，
     原来吃的是全局 button 样式（浅灰实心框）→ 覆盖成透明底+细描边，和 App 一致 */
  .hnbar { background: transparent; }
  .hnbar button { background: transparent; border: 1px solid rgba(60,60,60,.35);
    color: #2c2c2c; border-radius: 8px; }
  /* 二级子分类行：小一号、底色浅，跟一级区分 */
  .subbar.l2 { background: #fafafa; padding: 5px 12px; gap: 6px; }
  .subbar.l2 .sub { padding: 4px 10px; font-size: 11px; border-radius: 13px; }
  /* 卡片拉伸到整行高度：同一行里卡片高度必须一致（用户要求） */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px;
    align-items: stretch; }
  /* 竖屏封面站（黄果短剧）：封面 3:4，且**一行 3 个**（和 App 一致） */
  .cards.portrait { grid-template-columns: repeat(3, 1fr); }
  .cards.portrait .card .cover { aspect-ratio: 3/4; }
  /* 短片专用：**2 列**（用户 2026-10-02："把竖屏改为2个并行"）—— 卡片更大、一屏约 6 张就铺满，
     所以接口每页 5~6 条也不算太糟（配合并发 2 页 = 10 条，首屏一次画好）。 */
  .cards.shorts { grid-template-columns: repeat(2, 1fr); }
  /* 短片瀑布流：一屏一条、黑底铺满（用户 2026-10-02 要的抖音式竖屏流）。
     ⚠️ `touch-action: none` 必须加 —— 否则浏览器把上下滑当页面滚动、左右滑当返回，手势全被抢走。 */
  .feed { position: absolute; inset: 0; background: #000; z-index: 55; overflow: hidden; touch-action: none; }
  .feed video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .feed .pstate { position: absolute; top: 50%; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; }
  .feed .fhint { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); color: #fff;
                 font-size: 20px; font-weight: 700; opacity: .92; background: rgba(0,0,0,.45);
                 padding: 8px 14px; border-radius: 10px; pointer-events: none; }
  .feed .fmeta { position: absolute; left: 14px; right: 14px; bottom: 42px; color: #fff; z-index: 2;
                 text-shadow: 0 1px 6px rgba(0,0,0,.65); pointer-events: none; }
  .feed .fmeta .ft { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .feed .fmeta .fa { font-size: 13px; opacity: .85; margin-top: 4px; }
  .feed .pbar { position: absolute; left: 14px; right: 14px; bottom: 20px; z-index: 3; }
  /* 进度条**上方**显示 当前/总时长（用户 2026-10-02 要求）。
     ⚠️ 必须写 `left: auto` —— 基础规则 `.ptime` 是 `left: 10px`，只覆盖 right 的话
     元素会同时有 left 和 right 被**拉满一行**、文字贴到左边去（用户："放到右边去吧，左边被标题挡住了"）。 */
  .feed .ptime { position: absolute; left: auto; right: 14px; bottom: 38px; color: #fff; font-size: 12px;
                 z-index: 3; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  /* 左上角退出（回短片卡片列表）。⚠️ **只在暂停时显示**（用户 2026-10-02：
     "暂停的时候才显示X跟状态栏"）→ 默认藏起来，`.screen.feedpause` 才出现。
     `top` 要让开状态栏（`.status` 62px）；`pointer-events` 跟着开关，免得藏了还挡点击。 */
  .feed .fclose { position: absolute; top: 72px; left: 16px; z-index: 4; width: 40px; height: 40px;
                  border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 18px;
                  display: flex; align-items: center; justify-content: center; cursor: pointer;
                  opacity: 0; pointer-events: none; transition: opacity .15s; }
  .screen.feedpause .feed .fclose { opacity: 1; pointer-events: auto; }
  /* **状态栏也只在暂停时露出**（播放时被黑底盖住 = 沉浸）。
     ⚠️ 权重必须够高：后面（393/493 行）有 `.screen.hasbg .status{z-index:1}` 这类规则，
       写在前面且同权重会被后写的覆盖（实测算出 z-index=1 ✗ 吃过一次亏）。 */
  .screen.hasbg.darkbg.feedon.feedpause .status,
  .screen.hasbg.feedon.feedpause .status,
  .screen.feedon.feedpause .status { position: relative; z-index: 60; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .cover { position: relative; width: 100%; aspect-ratio: 16/9; background: #eee; }
  .card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 封面右下角的时长角标（站点有视频时长才显示） */
  .card .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.6);
    color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; }
  .card .txt { padding: 6px 8px 8px; }
  /* 标题能一行就一行（不预留两行高度）；最多两行 */
  .card .ttl { font-size: 13px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { margin-top: 4px; font-size: 10px; color: #999; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .card .ttl { text-align: center; }   /* 标题一律居中（用户要求） */
  /* 小字简介（黄果的卡片有） */
  /* 简介同样能一行就一行，最多两行 */
  .card .desc { margin-top: 3px; font-size: 11px; line-height: 1.3; color: #666;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 卡片上的分类标签（可点 → 标签列表） */
  .card .ctags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .card .ctag { font-size: 10px; color: #555; background: #f0f0f2; border-radius: 9px;
    padding: 2px 6px; cursor: pointer; }
  .card .ctag:hover { background: #e4e4e8; }
  /* ---------- 详情页 ---------- */
  .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .player video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .pbar { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 14px; cursor: pointer; }
  /* 播放器控件行（与 App 的控件条对齐：上一集/播放/下一集/放大一倍/全屏） */
  .pbtns { position: absolute; left: 10px; right: 10px; bottom: 40px; display: flex;
    align-items: center; gap: 6px; }
  .pbtn { color: #fff; background: rgba(0,0,0,.45); border-radius: 6px;
    padding: 2px 10px; font-size: 15px; cursor: pointer; user-select: none; }
  .pbtn.dis { opacity: .3; }
  .pbtn.on { background: rgba(232,89,12,.8); }
  .pbar .track { position: absolute; left: 0; right: 0; bottom: 3px; height: 3px;
    background: rgba(255,255,255,.25); border-radius: 2px; }
  .pbar .buf { position: absolute; left: 0; bottom: 3px; height: 3px; width: 0;
    background: rgba(255,255,255,.5); border-radius: 2px; }
  .pbar .play { position: absolute; left: 0; bottom: 3px; height: 3px; width: 0;
    background: #fff; border-radius: 2px; }
  .pbar .knob { position: absolute; bottom: .5px; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; transform: translateX(-4px); }
  .ptime { position: absolute; left: 10px; bottom: 22px; color: #fff; font-size: 11px;
    text-shadow: 0 1px 2px #000; }
  .pstate { position: absolute; left: 0; right: 0; top: 45%; text-align: center;
    color: #fff9; font-size: 12px; }
  .dwrap { padding: 12px; }
  .dwrap h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.4; }
  .dmeta { font-size: 12px; color: #888; display: flex; gap: 10px; align-items: center; }
  .sec { margin-top: 14px; }

  /* ---------- 侧栏日志 ---------- */
  .side { width: 420px; max-height: 844px; background: #181a20; color: #c9d1d9;
    border-radius: 14px; padding: 12px; overflow: auto; font: 12px/1.6 Consolas, monospace; }
  .side h3 { margin: 0 0 8px; font-size: 13px; color: #fff; font-weight: 600; }
  .side .ok { color: #7ee787; } .side .err { color: #ff7b72; } .side .dim { color: #8b949e; }
  .side button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;

  .spin { display:inline-block; width:16px; height:16px; border:2px solid #ddd;
    border-top-color:#8d4b2a; border-radius:50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* ---------- 背景图（首页/设置页；有图时卡片与导航半透明，保证图标文字仍清楚） ---------- */
  .bg { position: absolute; inset: 0; background: center/cover no-repeat; opacity: 0;
    transition: opacity .25s; z-index: 0; pointer-events: none; }
  .bg.on { opacity: 1; }
  /* ⚠️ 这里**不再铺全屏白纱**：白纱会把整张图洗成"浅浅的发白"（用户实测嫌难受）。
     改法：图原样显示，对比度只在内容块上做 —— 卡片/导航半透明 + 文字描边。 */
  /* ⚠️ 关键：背景层有 z-index（定位元素），内容区是静态的 —— 不抬起来会被背景盖住。
     给内容区统一 z-index:1，压过 .bg(z-index:0)。 */
  /* ⚠️ 全屏铺图：页面容器只要有不透明底色就会把背景挡住（首页/设置页/列表页都要透明）。
     卡片、图标、播放器这些"内容块"保持自己的底色 —— 保证看得清。 */
  .screen.hasbg .status, .screen.hasbg .appbar, .screen.hasbg .tabs,
  .screen.hasbg .subbar, .screen.hasbg .body, .screen.hasbg .nav,
  .screen.hasbg .body > * {
    position: relative; z-index: 1;
  }
  .screen.hasbg .body, .screen.hasbg .tabs, .screen.hasbg .subbar,
  .screen.hasbg .body > * { background: transparent; }
  /* 文字可读性：**只靠按背景明暗自适应黑白字**（明暗判定见 applyBg / bgIsDark）——
     浅色图深字、深色图（.screen.darkbg）白字，**不加描边、不加光晕**。
     描边方案都被用户否掉了（先是 -webkit-text-stroke，后是 1px 零模糊硬边）：小字怎么描都会发虚/发糊，
     纯黑白反而干净。这两条通配现在只负责"明确不带 text-shadow"（挡掉继承来的阴影）。 */
  .screen.hasbg .appbar *, .screen.hasbg .body *, .screen.hasbg .nav *,
  .screen.hasbg .status *, .screen.hasbg .tabs *, .screen.hasbg .subbar * {
    text-shadow: none;
  }
  /* 深色图：直接浮在图上的文字翻白 —— 这就是"自适应黑白"的落点 */
  .screen.hasbg.darkbg .appbar *, .screen.hasbg.darkbg .body *,
  .screen.hasbg.darkbg .nav *, .screen.hasbg.darkbg .status *,
  .screen.hasbg.darkbg .tabs *, .screen.hasbg.darkbg .subbar * {
    color: #fff;
    text-shadow: none;
  }
  /* ⚠️ 例外：字压在自己底色上的控件（白底卡片 / 分段控件 / 按钮 / 输入框 / 浅色徽标）
     不是"直接浮在照片上"的 —— 深色图下**一律不翻白**（白字压自己的白底会发浑看不清），
     描边也一概不加（见下）。这批选择器比上面的通配多一级（特异性更高）且写在通配之后，盖得住。
     （透明底 + 细边框的胶囊 / 筛选钮不在此列 —— 它们直接贴图，要跟着翻白，见下面 border 那条） */
  .screen.hasbg.darkbg .brand .tag,
  .screen.hasbg.darkbg .seg > div,
  .screen.hasbg.darkbg .sbtn,
  .screen.hasbg.darkbg .card,
  .screen.hasbg.darkbg .card *,
  .screen.hasbg.darkbg .ctag,
  .screen.hasbg.darkbg .vrow .num,
  .screen.hasbg.darkbg .pkbar select,
  .screen.hasbg.darkbg .sinput,
  .screen.hasbg.darkbg .scard-hd .ic,
  .screen.hasbg.darkbg .srec .bar,
  .screen.hasbg.darkbg .srec .noimg,
  .screen.hasbg.darkbg .relrow .noimg {
    /* 这批是"字压自己底色"的，深色图下不翻白 → 同样不吃描边（全局已取消，这里留一行兜底） */
    text-shadow: none;
  }
  /* 上面这批元素的字色 = 它们原有的配色（深色图下保持不变；.on 态一律留在后面，别被基础色盖掉） */
  .screen.hasbg.darkbg .brand .tag { color: #14100B; }
  .screen.hasbg.darkbg .seg > div { color: #4b5563; }
  .screen.hasbg.darkbg .seg > div.on, .screen.hasbg.darkbg .scard-hd .ic { color: #D1550F; }
  /* .sbtn 三个状态都**自带底色**（#f1f2f5 浅灰 / #E8590C 橙 / #fdecec 浅粉），字色是配着这些底走的
     （深灰 / 白 / 红）→ 深色图下照样看得清，**保持不动**（真翻成白字压在浅粉/浅灰底上反而看不见了）。
     实测 ?bg=4：应用图片 = 橙底白字、清除背景 = 浅粉底红字。 */
  .screen.hasbg.darkbg .sbtn { color: #3c4043; }
  .screen.hasbg.darkbg .sbtn.primary { color: #fff; }
  .screen.hasbg.darkbg .sbtn.danger { color: #c62828; }
  .screen.hasbg.darkbg .vrow .num { color: #555; }
  .screen.hasbg.darkbg .vrow.on .num { color: #fff; }
  .screen.hasbg.darkbg .card { color: #1b1b1f; }
  .screen.hasbg.darkbg .card * { color: inherit; }
  .screen.hasbg.darkbg .card .meta { color: #999; }
  .screen.hasbg.darkbg .card .desc { color: #666; }
  .screen.hasbg.darkbg .card .ctag { color: #555; }
  .screen.hasbg.darkbg .card .dur { color: #fff; }
  /* ⚠️ 这两个控件的底是**不透明白底**（.sinput / .pkbar select 都是 background:#fff），必须写死深色字：
     原来写的是 color:inherit —— 它会继承"被通配翻白的父链"，结果是白底白字，框里的 URL / 选项直接看不见
     （实测 ?bg=4 输入框是一条纯白空条）。#1b1b1f = 它们原本继承自 body 的字色。 */
  .screen.hasbg.darkbg .pkbar select, .screen.hasbg.darkbg .sinput { color: #1b1b1f; }
  /* 透明底 + 细边框的胶囊 / 筛选钮就是**直接贴在图上**的 → 跟着翻白（白字 + 深柔光走上面的通配），
     深色边框在深色图上看不见，这里一并转浅 */
  .screen.hasbg.darkbg .subbar .sub, .screen.hasbg.darkbg .pktag, .screen.hasbg.darkbg .vchip,
  .screen.hasbg.darkbg .hnbar button, .screen.hasbg.darkbg .pkbar button {
    border-color: rgba(255,255,255,.55);
  }
  /* 选中态用浅橙：深色图上不发闷（白底上也还看得见选中） */
  .screen.hasbg.darkbg .nav .item.on { color: #FFB07A; }
  .screen.hasbg.darkbg .tabs .tab.on { color: #FFB07A; border-color: #FFB07A; }
  /* 「已看完」的绿色语义色保住（别被通配翻白） */
  .screen.hasbg.darkbg .srec .meta .done { color: #7BD88F; }
  .screen.hasbg .tile span, .screen.hasbg .nav .item span,
  .screen.hasbg .appbar h1 { font-weight: 700; color: #17171a; }
  /* 偏浅的灰字在图上会糊 → 统一压深一档 */
  .screen.hasbg .nav .item { color: #2f2f33; }
  .screen.hasbg .nav .item.on { color: #B4430A; }
  .screen.hasbg .snote, .screen.hasbg .srow .lab .s { color: #2f3642; }
  .screen.hasbg .scard-hd .go, .screen.hasbg .srec .meta { color: #2f3642; }
  /* ⚠️ 深色图补丁（必须写在这一段之后）：
     上面这几条 .screen.hasbg … 的特异性已经 ≥ 通配（都是 4~5 个类），光靠通配压不住 ——
     实测深色图下底栏文字仍是 #17171a、.srow .lab .s / .srec .meta / .scard-hd .go 仍是 #2f3642，
     深字贴在暗图上等于看不见。这里同选择器加 .darkbg 前缀重写一遍（特异性更高 + 源顺位在后）。 */
  .screen.hasbg.darkbg .tile span, .screen.hasbg.darkbg .nav .item span,
  .screen.hasbg.darkbg .appbar h1 { color: #fff; }
  .screen.hasbg.darkbg .nav .item.on span { color: #FFB07A; }  /* 当前页：文字跟图标一样浅橙 */
  .screen.hasbg.darkbg .status, .screen.hasbg.darkbg .status * { color: #fff; }
  .screen.hasbg.darkbg .snote, .screen.hasbg.darkbg .srow .lab .s { color: #fff; }
  .screen.hasbg.darkbg .scard-hd .go, .screen.hasbg.darkbg .srec .meta,
  .screen.hasbg.darkbg .srec .site { color: #fff; }
  /* 卡片：用户要求分组框**也透明**（不再铺白底） */
  .screen.hasbg .scard { background: transparent; border: none; box-shadow: none; }
  .screen.hasbg .sdivider { background: rgba(0,0,0,.12); }
  .screen.hasbg .tile .box { background: rgba(255,255,255,.92); }
  /* 顶栏/底栏也吃背景图（不是白条压在上面）。
     用户要求：**不要磨砂（毛玻璃）** —— 留一点点膜都会和图之间出现一道色阶接缝，
     所以直接完全透明、无缝；字靠描边光晕保证看得清。 */
  .screen.hasbg .appbar, .screen.hasbg .status, .screen.hasbg .nav {
    background: transparent !important;
    border-top-color: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  /* 图标/首字色块仍保持自己的底（不然图标本身也看不见了） */
  .screen.hasbg .tile .box { background: rgba(255,255,255,.92); }
  /* 背景图选择卡 */
  .bgpresets { display: flex; gap: 8px; padding: 10px 16px 12px; }
  .bgpresets img { width: 74px; height: 44px; border-radius: 10px; object-fit: cover;
    cursor: pointer; border: 2px solid transparent; }
  .bgpresets img.on { border-color: #E8590C; }
  .sinput { width: calc(100% - 32px); margin: 0 16px; padding: 10px 12px; font-size: 13px;
    border: 1px solid #e3e4e8; border-radius: 12px; background: #fff; outline: none; }
  .sbtnrow { display: flex; gap: 8px; padding: 10px 16px 0; }
  .sbtn { flex: 1; text-align: center; font-size: 13px; padding: 10px 0; border-radius: 12px;
    background: #f1f2f5; color: #3c4043; cursor: pointer; }
  .sbtn.primary { background: #E8590C; color: #fff; font-weight: 600; }
  .sbtn.danger { background: #fdecec; color: #c62828; }
  /* ---------- 背景图集（独立子页：缩略图 + 加入时间；当前那条打 ✓；左滑露出一条「删除」）----------
     整页**没有白底**：行是透明的，背景图从行间透出来，行里的字走文中那套"深色图翻白 / 浅色图深字"。 */
  .bgal { position: relative; overflow: hidden; }
  .bgal-row { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: transparent;
    cursor: pointer; user-select: none; touch-action: pan-y; transition: transform .18s ease; }
    /* ↑ 没有 border-bottom：用户要求"去除中间的分割线"（原来有 1px #f0f0f2），行与行之间靠间距分开 */
  .bgal-row.on { background: rgba(232,89,12,.12); box-shadow: inset 3px 0 0 #E8590C; }  /* 当前项：淡橙底 + 左侧橙条 */
  .bgal-th { width: 64px; height: 110px; border-radius: 9px; flex: 0 0 auto;
    background: center/cover no-repeat #eceff3; }   /* 竖版缩略图：图集页的行 + 设置页入口行共用 */
  /* 设置页那张图集入口行：文字块要和 110px 高的缩略图**垂直居中对齐**、并和缩略图拉开点距离。
     ⚠️ 它复用 .srec（播放记录那套），而 .srec 明确写了 `align-items: flex-start`（行 240，
     记录行里封面比文字矮，所以顶对齐是对的）+ `gap: 10px` → 入口行照抄会把文字顶到最上面、
     且贴着缩略图（用户实测指出）。只给这一行覆盖，不动播放记录的行。 */

<script>
/* =========================================================================
   KPXX 模拟器 —— 只做两件事：验证真实数据能不能抓到、界面显示对不对。
   解析规则与 app 的 lib/api.dart 一一对应（改动要两边同步）。
   ========================================================================= */
const $ = (id) => document.getElementById(id);
const logEl = $('log');
function log(msg, cls) {
  const t = new Date().toTimeString().slice(0, 8);
  logEl.insertAdjacentHTML('beforeend',
    `<div class="${cls || ''}">[${t}] ${msg}</div>`);
  logEl.parentElement.scrollTop = 1e9;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(sec) {
  if (!isFinite(sec)) sec = 0;
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(Math.floor(sec % 60)).padStart(2, '0');
  return `${m}:${s}`;
}
const tickClock = () => {
  const d = new Date();
  $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
};
// ⚠️ 2026-10-02：先进来就设一次。原来只挂 setInterval，页面刚打开那 10 秒显示的是 HTML 里
// 写死的 "23:10"（用户看到的"时间不对"就是这个），之后才跳成真实时间。
tickClock();
setInterval(tickClock, 10000);

/* ⚠️ 2026-10-02：电池**固定 50%**（用户要求"直接固定50，跟图上一模一样"），
   所以原来读真机电量的 sbBattery() 已删除 —— 电量条宽度由 CSS 写死（.bat .fill）。
   之前那版是"黑填充 + 白字反色"（Battery Status API 驱动的），用户说"是安卓的"，已换掉。 */

/* 整机自适应缩放：目标是 440×956 的 iPhone 16 Pro Max（外壳再加 12px 边距），
   窗口放不下就整体缩小 —— 用 `zoom` 而不是 transform，因为 zoom 真改布局尺寸、
   不会留下滚动条。只缩放 .phone，不动页面右边那个日志面板。 */
function fitPhone() {
  const phone = document.querySelector('.phone');
  if (!phone) return;
  const needW = 440 + 24, needH = 956 + 24;
  const s = Math.min(1, (window.innerWidth - 16) / needW, (window.innerHeight - 16) / needH);
  phone.style.zoom = s.toFixed(3);
}
fitPhone();
window.addEventListener('resize', fitPhone);

/* ---------------------------- 数据层 ---------------------------- */
const AES_KEY = 'f5d965df75336270';   // 与 app 的 fetched_image.dart 一致
const AES_IV = '97b60394abc2fbe1';

/* 模拟器**默认静音**：所有 video（含动态插入的）自动 muted ——
   在别的浏览器/窗口打开模拟器也不用特意去关声音 */
(function initMute() {
  const mute = () => document.querySelectorAll('video').forEach((v) => {
    v.muted = true;
    v.volume = 0;
  });
  document.addEventListener('play', (e) => {
    const v = e.target;
    if (v && v.tagName === 'VIDEO') { v.muted = true; v.volume = 0; }
  }, true);
  new MutationObserver(mute).observe(document.documentElement, { childList: true, subtree: true });
  mute();
})();

let SITES = [];

/* -------- 背景图状态（必须声明在启动代码之前：启动时会解析 ?bg=）--------
   模拟器里只演示、不持久化；真机上是"从相册选图"（见 DEVLOG）。
   默认背景 = bg_default.jpg（用户指定的原图，放在 sim 目录，由 server.mjs 静态路由提供） */
let appBg = 'bg_default.jpg';
// 示范背景：纯 CSS 渐变（不依赖外网图，预览时不会加载不出来）
const BG_DEMO = [
  'linear-gradient(140deg,#1f2544 0%,#474f7a 45%,#81689d 100%)',
  'linear-gradient(140deg,#0f2027 0%,#203a43 50%,#2c5364 100%)',
  'linear-gradient(140deg,#3e2723 0%,#6d4c41 50%,#a1887f 100%)',
  'linear-gradient(140deg,#05070c 0%,#12161f 55%,#2a2f3a 100%)',
];

/* -------- 背景图集（自选背景收藏；存 localStorage，刷新不丢）--------
   条目 = { v: 图片 URL 或 CSS 渐变串, t: 加入时间(ms) }；
   sim_bg_cur = "当前应用的是哪条"（图集拿它打 ✓，刷新时也按它还原背景）。 */
const BG_ALBUM_KEY = 'sim_bg_album';
const BG_CUR_KEY = 'sim_bg_cur';
const BG_ALBUM_MAX = 20;
let bgAlbum = [];
let bgCur = null;   // null = 没记过（还是内置默认图）；'' = 用户清掉了背景
try {
  bgAlbum = JSON.parse(localStorage.getItem(BG_ALBUM_KEY) || '[]');
  if (!Array.isArray(bgAlbum)) bgAlbum = [];
  bgCur = localStorage.getItem(BG_CUR_KEY);
} catch (e) { bgAlbum = []; }

/* ⚠️ 这里**不许预置、也不许自动删任何图片**！图集里放什么是用户自己的事 ——
   早先版本干过两件蠢事：① 自动把 5 张测试图塞进图集；② 又写了个"一次性清理"把它们删掉，
   结果把用户正在测的图集清空了。两段代码都已删除，现在**启动时不碰图集一个字**。
   想用这 5 张测试图看布局：设置页 →「模拟器专用」区 →「载入 5 张测试图」按钮（手动点）。 */
const BG_TEST_IMGS = ['alb1.jpg', 'alb2.jpg', 'alb3.jpg', 'alb4.jpg', 'alb5.jpg'];

/** ?nav=settings：直达设置页（截图/调试用；站点清单加载完不许切回宫格） */
const WANT_SETTINGS = /[?&]nav=settings\b/.test(location.search);
/** ?albumpick=1：直达图集页并自动弹出「添加背景」弹层（截图/调试用，同样不许被站点清单加载抢回宫格） */
const WANT_ALBUMPICK = /[?&]albumpick=1\b/.test(location.search);
/** ?site=N：直达第 N 个站点的列表页（0 起；截图/调试用） */
const WANT_SITE = (() => {
  const m = /[?&]site=(\d+)\b/.exec(location.search);
  return m ? parseInt(m[1], 10) : -1;
})();
/** ?bg=1|2|3：上来就套一张示范背景（截图/调试用，看背景效果不用手点）；
    没有 ?bg= 就接着上次应用的那条（图集的 ✓ 才不会说谎） */
{
  const m = /[?&]bg=(\d+)\b/.exec(location.search);
  if (m) {
    const i = parseInt(m[1], 10) - 1;
    if (BG_DEMO[i]) appBg = BG_DEMO[i];
  } else if (bgCur !== null) {
    appBg = bgCur;
  }
}

async function reloadSites() {
  const r = await fetch('/sites');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error('解析 lib/sites.dart 失败：' + j.error);
  SITES = j.sites || [];
  log(`站点清单：${SITES.map((s) => s.name).join('、')}`, 'ok');
  // ?site=N 直达某站点的列表页（截图/调试用，和 ?nav=settings 一个路子）
  if (WANT_SITE >= 0 && SITES[WANT_SITE]) {
    openSite(SITES[WANT_SITE]);
    return;
  }
  // ?nav=settings 直达设置页时不抢回宫格（站点清单加载完本来会切走）
  // ?albumpick=1 同理：站点清单回来后要重新进图集页并弹层（首次渲染时清单还没加载，页面会被覆盖）
  if (WANT_ALBUMPICK) {
    viewAlbum();
    bgAlbumPick();
    return;
  }
  if (!WANT_SETTINGS) viewGrid();
}

/** 首次打开时服务可能还没监听 → 失败要重试几次，别留一屏空白 */
async function loadSitesWithRetry() {
  for (let i = 1; i <= 6; i++) {
    try {
      await reloadSites();
      if (SITES.length) return;
    } catch (e) {
      log(`读取站点清单失败（第 ${i} 次）：${e.message}`, 'err');
    }
    await new Promise((r) => setTimeout(r, 700));
  }
  $('body').innerHTML = `<div class="hint">读不到站点清单。<br>
    服务端可能没起来 —— 关掉服务窗口，重新双击「启动模拟器.bat」。</div>`;
}

const base = (site) => 'https://' + (site.hosts[0] || '');
const px = (url) => '/proxy?url=' + encodeURIComponent(url);

// 走 /site：服务端会依次试该站的所有域名（和 App 的 _fetchText 一样），
// 跑通哪个记住哪个。要抓的是站点 HTML，不能直连（浏览器跨域会被拦）。
async function getHtml(site, path) {
  const r = await fetch('/site?name=' + encodeURIComponent(site.name) +
    '&path=' + encodeURIComponent(path));
  const text = await r.text();
  if (r.status !== 200) throw new Error(text.slice(0, 140));
  return text;
}

/** 卡片信息行只取时间（与 api.dart 的 _metaDate 对应） */
function metaDate(raw) {
  const t = String(raw || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  let m = /\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日(?:\s*\d{1,2}:\d{2}(?::\d{2})?)?/.exec(t);
  if (m) return m[0];
  m = /\d{4}[-/.]\d{1,2}[-/.]\d{1,2}(?:\s*\d{1,2}:\d{2}(?::\d{2})?)?/.exec(t);
  if (m) return m[0];
  // 51fans1 的列表卡片只有 09-23
  m = /\d{1,2}\s*月\s*\d{1,2}\s*日/.exec(t);
  if (m) return m[0];
  m = /^\d{1,2}-\d{1,2}$/.exec(t);
  if (m) return m[0];
  m = /\d{1,2}\s*(?:分钟|小时|天)前/.exec(t);
  if (m) return m[0];
  return '';
}

/** 详情页时间显示（与 api.dart 侧的 _fmtTime 对齐）：站点自带时分秒就原样显示 */
function fmtTime(t) {
  const s = String(t || '');
  if (!s) return '';
  if (s.length >= 19 && s[10] === ' ') return s;
  return s.slice(0, 10);
}

/** 与 api.dart 的 _parseArticles 对应（按站点模板分派） */
function parseArticles(html, site) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tpl = (site && site.template) || 'wordpress';
  if (tpl === 'huangguo') return hgCards(doc);
  if (tpl === 'porna') return pornaCards(doc);
  if (tpl === 'madou') return madouCards(doc);
  if (tpl === 'pornhub') return phCards(doc);
  if (tpl === 'xhamster') return xhCards(doc);
  const out = [];
  for (const el of doc.querySelectorAll('article[itemscope]')) {
    const cls = el.className || '';
    // 分类页链接是相对的，搜索页是绝对地址（只认相对会把搜索结果全丢掉）
    const a = el.querySelector('a[href*="/archives/"]');
    if (!a || cls.includes('ad-item')) continue;
    const title = (el.querySelector('.post-card-title')?.textContent || '').trim();
    if (!title) continue;
    let cover = '';
    for (const s of el.querySelectorAll('script')) {
      const m = /loadBannerDirect\('([^']+)'/.exec(s.textContent);
      if (m) { cover = m[1]; break; }
    }
    if (!cover) cover = el.querySelector('img[data-src]')?.getAttribute('data-src') || '';
    // 卡片只显示时间（原来是"作者 • 日期 • 分类"）
    const meta = metaDate(el.querySelector('.post-card-info')?.textContent || '');
    let href = a.getAttribute('href') || '';
    if (href.startsWith('http')) {
      const i = href.indexOf('/archives/');
      if (i >= 0) href = href.slice(i);
    }
    out.push({ title, url: href, cover, meta, duration: '' });
  }
  // 51fans1：div.xqbj-list-rows（封面在 z-image-loader-url，值偶尔带反引号）
  if (!out.length) {
    for (const el of doc.querySelectorAll('div.xqbj-list-rows')) {
      const a = el.querySelector('a[href*="/archives/"]');
      if (!a) continue;
      const title = (el.querySelector('.xqbj-list-rows-image-title')?.textContent || '')
        .replace(/\s+/g, ' ').trim();
      if (!title) continue;
      const img = el.querySelector('img[z-image-loader-url]');
      const cover = (img?.getAttribute('z-image-loader-url') || '').replace(/`/g, '').trim();
      // 移动端文案更全（"9月29日"），桌面端只有时刻（"19:00"）→ 优先移动端
      let meta = (el.querySelector('.xqbj-list-rows-bottom-tags-text.is-mobile')?.textContent || '').trim();
      if (!meta || !metaDate(meta)) {
        const desk = (el.querySelector('.xqbj-list-rows-bottom-tags-text.is-desktop')?.textContent || '').trim();
        if (desk) meta = desk;
      }
      out.push({ title, url: a.getAttribute('href') || '', cover, meta: metaDate(meta), duration: '' });
    }
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 黄果短剧的卡片（相关推荐/标签页/搜索页都是这套结构） */
function hgCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('div.hg-drama-card')) {
    const a = el.querySelector('a.hg-drama-card__cover-link') || el.querySelector('a[href^="/video/"]');
    if (!a) continue;
    // 标题取链接里的文本节点，排掉 <span class="sr-only">全集在线观看</span>
    const titleEl = el.querySelector('.hg-drama-card__title a') || a;
    let title = '';
    for (const n of titleEl.childNodes) if (n.nodeType === 3) title += n.textContent;
    title = title.replace(/\s+/g, ' ').trim() || (titleEl.textContent || '').replace('全集在线观看', '').trim();
    if (!title) continue;
    const img = el.querySelector('img[data-src]') || el.querySelector('img');
    const epRaw = (el.querySelector('.hg-drama-card__episode')?.textContent || '')
      .replace(/\s+/g, ' ').trim();

    const desc = (el.querySelector('.hg-drama-card__desc')?.textContent || '')

      meta: '',
      badge: ep ? ep[0] : '',
      desc,
      tags: [],   // 卡片不显示标签（用户要求）
    });
    if (out.length >= 60) break;
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 黄果短剧接口里的一条 → 卡片（时长单位是秒） */
function hgItem(v) {

  const epText = v.is_finished && total > 0 ? `全集${total}集` : (ep > 0 ? `更新至${ep}集` : '');
  return {
    title: String(v.title || '').trim(),
    url: `/video/${v.id}/`,
    cover: v.cover || '',
    meta: '',
    badge: epText,
    desc: String(v.description || '').replace(/\s+/g, ' ').trim(),
    tags: [],   // 卡片不显示标签（用户要求）
  };
}

/** 秒 → 3:27 / 1:00:39 */
function hgDuration(raw) {
  const sec = parseInt(String(raw || '').trim(), 10);
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

/* -------- 麻豆社（madou.club）：article.excerpt 卡片（无 itemscope）
   + 详情正文 iframe → dash.madou.club 分享页取 m3u8（与 api.dart 的 _md* 对齐） -------- */

/** 绝对地址 → 站内路径（与 api.dart 的 _toRelPath 一致：先认 /archives/，否则剥 scheme+host） */
function madouRel(href) {
  const h = String(href || '');
  if (!/^https?:/i.test(h)) return h;
  const i = h.indexOf('/archives/');
  if (i >= 0) return h.slice(i);
  try { const u = new URL(h); return u.pathname + (u.search || ''); } catch (e) { return h; }
}

/** 卡片：article.excerpt（首页/分类/搜索/标签/榜单共用，同 api.dart 的 _mdCards） */
function madouCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('article.excerpt')) {
    const href = madouRel(el.querySelector('a.thumbnail')?.getAttribute('href') || '');
    if (!href) continue;
    const title = (el.querySelector('h2 a')?.textContent || '').trim();
    if (!title) continue;
    // 封面必须是真图：img[src] 是懒加载占位（thumb.png），真封面在 data-src 上
    const cover = (el.querySelector('a.thumbnail img')?.getAttribute('data-src') || '').trim();
    if (!cover || cover.endsWith('/showcase/img/thumb.png')) continue;
    // 观看数：站点原文「观看(59.26K)」原样显示（与 api.dart 的 _mdCards 一致；
    // 用户先要只留数字、随后又说"观看数加回去"，以最终要求为准）
    out.push({
      title, url: href, cover,
      meta: (el.querySelector('.post-view')?.textContent || '').trim(),
      badge: '', desc: '',
      // ⚠️ 卡片上的分类名**不取**（footer 的 rel="category tag"，如"麻豆传媒"）：
      // 用户明确要求去掉（见 DEVLOG 第 56 条）——挂 tags 会在卡片上渲染成可点胶囊。
      // 详情页的分类/标签不受影响（走 madouDetail 的 .item-3/.article-tags）。
      tags: [],
    });
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 麻豆社「热门标签」标签云页（/tags）——**不是文章卡片**，别用 madouCards 解：
 *  `.tagslist li` 里 `a.name`=标签名（href 是 /tag/{slug}）、`<small>`=文章数
 *  （形如 ×2577）、`a.tit` 是"该标签下的一篇示例文章"（**忽略**）。
 *  没有封面 → 卡片变纯文字卡。站点**没有分页**（实测无 .pagination）。
 *  （与 api.dart 的 _mdTags 逐条一致） */
function madouTags(doc) {
  const out = [];
  for (const li of doc.querySelectorAll('.tagslist li')) {
    const a = li.querySelector('a.name');
    if (!a) continue;
    const title = (a.textContent || '').trim();
    const segs = (a.getAttribute('href') || '').split('/').filter((s) => s);
    const slug = segs.length ? segs[segs.length - 1] : '';
    if (!title || !slug) continue;
    if (out.some((x) => x.url === '/tag/' + slug)) continue;
    out.push({
      title, url: '/tag/' + slug, cover: '',
      meta: (li.querySelector('small')?.textContent || '').trim(),
      badge: '', desc: '', tags: [],
    });
  }
  return out;
}

/** 详情：标题/分类/标签/相关推荐 + 播放源（唯一一个：分享页里的 m3u8 + token） */
async function madouDetail(html, url) {
  const doc = parseHtml(html);
  const title = (doc.querySelector('.article-title')?.textContent || '').trim();
  const catName = (doc.querySelector('.item-3 a')?.textContent || '').trim();
  // 标签：slug = URL 最后一段（原始编码值，不解码——与其它站点一致）
  const tags = [];
  for (const a of doc.querySelectorAll('.article-tags a')) {
    const name = (a.textContent || '').trim();
    const segs = (a.getAttribute('href') || '').split('/').filter((s) => s);
    const slug = segs.length ? segs[segs.length - 1] : '';
    if (!name || !slug) continue;
    if (tags.some((t) => t.slug === slug)) continue;
    tags.push({ slug, name });
  }
  // 相关推荐：标题取锚的文本（<a> 里只有一个缩进的 span>img，没有别的文本节点）
  const related = [];
  for (const a of doc.querySelectorAll('.postitems li a')) {
    const href = madouRel(a.getAttribute('href') || '');
    const t = (a.textContent || '').trim();
    if (!href || !t || href === url) continue;
    if (related.some((x) => x.url === href)) continue;
    related.push({
      title: t, url: href, meta: '', badge: '', desc: '', tags: [],
      cover: (a.querySelector('img[data-src]')?.getAttribute('data-src') || '').trim(),
    });
    if (related.length >= 12) break;
  }
  // 播放源：正文第一个 iframe（src 带不带引号都行，DOMParser 两种都吃）→ 分享页。
  // 分享页是另一个域（dash.madou.club），走服务端的 /proxy 抓（浏览器直连被跨域拦）。
  const videos = [];
  const share = (doc.querySelector('.article-content iframe')?.getAttribute('src') || '').trim();
  if (share) {
    try {
      const r = await fetch(px(share));
      if (!r.ok) {
        log('分享页请求失败 HTTP ' + r.status + '：' + share, 'err');
      } else {
        const sh = await r.text();
        // 分享页里两行 JS：token 是双引号、m3u8 是单引号
        const tok = /var\s+token\s*=\s*"([^"]*)"/.exec(sh);
        const m3 = /var\s+m3u8\s*=\s*'([^']*)'/.exec(sh);
        if (tok && m3) {
          const abs = /^https?:/i.test(m3[1]) ? m3[1] : 'https://dash.madou.club' + m3[1];
          videos.push({ ordinal: 1, label: title, sources: [abs + '?token=' + tok[1]] });
        } else {
          log('分享页里没找到 token/m3u8：' + share, 'err');
        }
      }
    } catch (e) {
      log('分享页取源失败：' + ((e && e.message) || e), 'err');
    }
  }
  return {
    title, time: '', categories: catName ? [catName] : [], images: [], intro: '',
    videos, tags, related, duration: '',
  };
}

/** 与 api.dart 的 detail() 对应（按站点模板分派；黄果/91porna 还要额外请求） */
async function parseDetail(html, site, url) {
  const tpl = (site && site.template) || 'wordpress';
  if (tpl === 'huangguo') {
    // 吃瓜社区的帖子（/archives/N/）是图文帖，跟视频详情不是一套
    if (url && url.startsWith('/archives/')) return hgPostDetail(html);
    return hgDetail(html);
  }
  if (tpl === 'porna') {
    // 三种详情页：短视频 / 黑料图文 / 普通视频（靠 URL 区分）
    if (url && url.startsWith('/melonshort/video/')) return melonDetail(html, url);
    if (url && url.startsWith('/heiliao-chigua/')) return await heiliaoDetail(html, site);
    if (url && url.startsWith('/novels/')) return await novelDetail(html);
    return await pornaDetail(html, site);
  }
  if (tpl === 'pektino') return pektinoDetail(html, url);
  if (tpl === 'hanime1') return hanimeDetail(html, url);
  if (tpl === 'xvideos') return xvDetail(html, url);
  if (tpl === 'madou') return await madouDetail(html, url);
  if (tpl === 'pornhub') return phDetail(html, url);
  if (tpl === 'xhamster') return await xhDetail(html, url);
  return await wpDetail(html, site, url);
}

/** WordPress 系详情（含 51fans1 的兜底分支） */
async function wpDetail(html, site, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let title = (doc.querySelector('.post-title')?.textContent || '').trim();
  if (!title) title = (doc.querySelector('.novel-title h1')?.textContent || '').trim();
  const intro = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '')
    .replace(/\s+/g, ' ').trim();
  let time = doc.querySelector('meta[itemprop="datePublished"]')?.getAttribute('content') || '';
  if (!time) time = metaDate(doc.querySelector('.novel-info')?.textContent || '');

  const images = [];
  for (const img of doc.querySelectorAll('.post-content img')) {
    const src = img.getAttribute('data-xkrkllgl') || '';
    if (src.startsWith('http') && !images.includes(src)) images.push(src);
  }
  if (!images.length) {
    // 51fans1：.defaultimg 里 img[data-image-preview][z-image-loader-url]
    for (const img of doc.querySelectorAll('img[data-image-preview]')) {
      const src = (img.getAttribute('z-image-loader-url') || '').replace(/`/g, '').trim();
      if (src.startsWith('http') && !images.includes(src)) images.push(src);
    }
  }
  if (!images.length) {
    for (const img of doc.querySelectorAll('.post-content img')) {
      let src = img.getAttribute('data-src') || img.getAttribute('src') || '';
      if (src.startsWith('http') && !src.includes('/hc237/') && !images.includes(src)) images.push(src);
    }
  }

  const videos = [];
  let order = 0;
  for (const dp of doc.querySelectorAll('.dplayer[data-config]')) {
    order++;
    const sources = [];
    try {
      const cfg = JSON.parse(dp.getAttribute('data-config'));
      if (cfg.video && cfg.video.url) sources.push(cfg.video.url);
      if (cfg.video_h265 && cfg.video_h265.url) sources.push(cfg.video_h265.url);
    } catch (e) { /* 单个视频配置坏，跳过 */ }
    const texts = [];
    for (let e = dp.previousElementSibling; e && texts.length < 2; e = e.previousElementSibling) {
      const t = (e.textContent || '').replace(/\s+/g, ' ').trim();
      if (!t || t.length > 60) continue;
      texts.push(t);
    }
    let ord = 0;
    for (const t of texts) { const v = videoOrdinal(t); if (v > 0) { ord = v; break; } }
    const n = ord > 0 ? ord : order;
    videos.push({ ordinal: n, label: ord > 0 && texts.length ? texts[0] : '视频 ' + n, sources });
  }
  // 合集文章：正文没有播放器，只有"👉点我查看详情帖"链接 → 抓子文章取源，拼成篇内视频
  if (!videos.length) {
    const subs = [];
    // 结构规律（不看文字）：真·子文章链接的直接父元素是 <p>；
    // 推广在 th、上一篇/下一篇在 span、相关文章在 div.link-list、版权行 href 是本页
    const contentEl = doc.querySelector('.post-content');
    for (const a of contentEl ? contentEl.querySelectorAll('a[href*="/archives/"]') : []) {
      // 两道结构判定：父级是 <p>，且该 <p> 是 .post-content 的直接子元素
      if (!a.parentElement || a.parentElement.tagName.toLowerCase() !== 'p') continue;
      if (a.parentElement.parentElement !== contentEl) continue;
      let href = a.getAttribute('href') || '';
      if (href.startsWith('http')) { const i = href.indexOf('/archives/'); if (i >= 0) href = href.slice(i); }
      const txt = (a.textContent || '').replace(/\s+/g, ' ').trim();
      if (!href || !txt || href === url) continue;
      if (subs.some((x) => x[0] === href)) continue;
      subs.push([href, txt]);
      if (subs.length >= 20) break;
    }
    // ⚠️ 不预抓子文章：只放"标题 + 地址"，点到哪集才抓哪篇（playVideo 里按需取）
    let o = 0;
    for (const x of subs) {
      o++;
      videos.push({ ordinal: o, label: cleanSubTitle(x[1]), sources: [], lazyUrl: x[0] });
    }
  }

  videos.sort((a, b) => a.ordinal - b.ordinal);

  /** 合集的"详情帖"链接文字 → 选集标题 */
  function cleanSubTitle(raw) {
    let s = String(raw || '').replace(/\s+/g, ' ').trim();
    s = s.replace('点我查看详情帖', ' ');
    s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    return s || '视频';
  }

  // 标签（/tag/xxx/），可点击跳转
  const tags = [];
  for (const a of doc.querySelectorAll('a[href*="/tag/"]')) {
    const href = a.getAttribute("href") || "";
    const t = (a.textContent || "").trim();
    if (!href || !t || t.length > 20) continue;
    const slug = href.split("/tag/").pop().replace(/\/$/, "");
    if (!slug) continue;
    if (!tags.some((x) => x.slug === slug)) tags.push({ slug, name: t });
    if (tags.length >= 30) break;
  }

  // 相关推荐（尾部「热门新闻」区 .hot-news-section/.hot-news-box/.hot-news-content，
  // 没有单独的 .hot-news 元素——原选择器匹配不到，区块不显示），显示在剧照下方
  const related = [];
  for (const el of doc.querySelectorAll('.hot-news-content')) {
    const a = el.querySelector('a[href*="/archives/"]');
    if (!a) continue;
    let href = a.getAttribute("href") || "";
    const t = ((el.querySelector('p') || {}).textContent || "").replace(/\s+/g, " ").trim();
    if (!href || !t) continue;
    if (href.startsWith("http")) {
      const i = href.indexOf("/archives/");
      if (i >= 0) href = href.slice(i);
    }
    if (related.some((x) => x.url === href)) continue;
    related.push({ title: t, url: href, cover: "" });
    if (related.length >= 12) break;
  }

  return { title, intro, time, images, videos, tags, related, duration: '' };
}

/** 黄果短剧：详情页内嵌 <script id="videoInitialData">，
 *  epPlaySrcs = {"1": m3u8, ...} 一次拿到整部剧所有集。 */
function hgDetail(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let data = null;
  const raw = doc.querySelector('script#videoInitialData')?.textContent || '';
  if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
  const videos = [];
  // 选集：页面上有完整的选集链接（/video/{id}/、/video/{id}/ep-{n}/）；
  // epPlaySrcs 只是"当前集附近 2~3 集"的窗口 → 列全，窗口内有源的直接播，
  // 其余 lazyUrl 留那一集地址，点到才取（点哪集抓哪集）
  const epUrls = new Map();
  const vid = data ? String(data.id || '') : '';
  if (vid) {
    const re = new RegExp('^/video/' + vid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:/ep-(\\d+))?/$');
    for (const a of doc.querySelectorAll('a[href^="/video/"]')) {
      const href = a.getAttribute('href') || '';
      const m = re.exec(href);
      if (!m) continue;
      const n = parseInt(m[1] || '1', 10) || 1;
      if (!epUrls.has(n)) epUrls.set(n, href);
    }
  }
  if (epUrls.size) {
    for (const n of Array.from(epUrls.keys()).sort((a, b) => a - b)) {
      const src = (data && data.epPlaySrcs && data.epPlaySrcs[String(n)]) || '';
      videos.push({
        ordinal: n, label: `第 ${n} 集`,
        sources: src ? [src] : [],
        lazyUrl: src ? undefined : epUrls.get(n),
      });
    }
  } else if (data && data.epPlaySrcs) {
    const keys = Object.keys(data.epPlaySrcs).map((k) => parseInt(k, 10) || 0).sort((a, b) => a - b);
    for (const k of keys) {
      const src = data.epPlaySrcs[String(k)];
      if (!src) continue;
      videos.push({ ordinal: k > 0 ? k : videos.length + 1, label: `第 ${k} 集`, sources: [src] });
    }
  }
  const tags = [];
  if (data && Array.isArray(data.tagLinks)) {
    for (const t of data.tagLinks) {
      const slug = String(t.url || '').split('/tag/').pop().replace(/\/$/, '');
      if (t.name && slug) tags.push({ slug, name: t.name });
    }
  }
  // 相关推荐 = 「猜你喜欢」区的卡片（广告 aside 里没有 hg-drama-card，天然排除）
  const related = hgCards(doc).slice(0, 12);
  return {
    title: (data && data.title) || (doc.querySelector('h1')?.textContent || '').trim(),
    intro: ((data && data.description) || '').replace(/\s+/g, ' ').trim(),
    time: (data && data.time) || '',
    images: [],           // 这站没有剧照
    videos,
    tags,

/** 黄果吃瓜社区的帖子详情：图文（正文 .hg-post-detail__body 的图）
 *  + 可选的多个视频（div.post-video-player 的 data-src 就是现成 m3u8，

 *  ⚠️ 2026-09-30 修正：之前写死"没有视频"是探测不到位（实测 606/605/604/602 都有） */
function hgPostDetail(html) {
  const doc = parseHtml(html);
  const title = (doc.querySelector('h1')?.textContent || '').replace(/\s+/g, ' ').trim();
  const intro = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '')
    .replace(/\s+/g, ' ').trim();
  const images = [];
  for (const img of doc.querySelectorAll('.hg-post-detail__body img[data-src]')) {
    const src = img.getAttribute('data-src') || '';
    if (src.startsWith('http') && !images.includes(src)) images.push(src);
  }
  const time = metaDate(doc.querySelector('.hg-post-detail')?.textContent || '');
  const tags = [];
  for (const a of doc.querySelectorAll('.hg-post-detail a[href*="/tag/"]')) {
    const href = a.getAttribute('href') || '';
    const name = (a.textContent || '').trim();
    if (!href || !name || name.length > 20) continue;
    const slug = href.split('/tag/').pop().replace(/\/$/, '');
    if (!slug) continue;
    if (!tags.some((x) => x.slug === slug)) tags.push({ slug, name });
  }
  // 正文里的视频（可以多个）：data-src 即 m3u8；label 取视频前面最近的 <h2>
  const videos = [];
  const vbody = doc.querySelector('.hg-post-detail__body');
  if (vbody) {

    for (const p of vbody.querySelectorAll('div.post-video-player')) {
      const src = p.getAttribute('data-src') || '';
      if (!src.startsWith('http')) continue;
      o++;
      let label = '';
      let prev = p.previousElementSibling;
      while (prev) {
        if (prev.localName === 'h2') { label = (prev.textContent || '').trim(); break; }
        prev = prev.previousElementSibling;
      }
      videos.push({ ordinal: o, label: label || ('视频 ' + o), sources: [src] });
    }
  }
  return {
    title, intro, time, images,
    videos,
    tags,
    related: hgCards(doc).slice(0, 12),
    duration: '',
  };
}

/** 91porna：标题/简介/时长/标签来自 LD+JSON；
 *  播放地址要再请求 /index/detail_play（img=封面路径、u=页面内嵌 hex token、t=时间戳/2100）。 */
async function pornaDetail(html, site) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let obj = null;
  for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
    try {
      const j = JSON.parse(s.textContent);
      for (const n of (j['@graph'] || [])) if (n['@type'] === 'VideoObject') obj = n;
    } catch (e) { /* 坏 JSON 忽略 */ }
  }
  const title = (obj && obj.name) ||
    (doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || '').trim();
  const duration = pornaDuration((obj && obj.duration) || '');
  let cover = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';
  if (!cover && obj && Array.isArray(obj.thumbnailUrl) && obj.thumbnailUrl.length) cover = obj.thumbnailUrl[0];
  const tags = [];
  if (obj && Array.isArray(obj.keywords)) for (const k of obj.keywords) if (k) tags.push({ slug: k, name: k });

  // 播放地址
  const videos = [];
  let img = '';
  try { img = new URL(cover).pathname; } catch (e) { img = ''; }
  if (!img) {
    const m = /(?:upload_01|md-\d+)\/[^"'\s]+\.(?:jpe?g|png|webp)/.exec(html);
    img = m ? '/' + m[0] : '';
  }
  // token 长度不固定（视频页 160 位、日本AV 页 352 位），候选逐个试
  const toks = [...new Set([
    ...html.matchAll(/parseInt\|([0-9a-f]{60,400})\|/g),
    ...html.matchAll(/\|([0-9a-f]{120,400})\|/g),
    ...html.matchAll(/\b([0-9a-f]{120,400})\b/g),
  ].map((m) => m[1]))].slice(0, 6);
  if (img) {
    for (const token of toks) {
      const t = Math.floor(Date.now() / 1000 / 2100);
      const path = '/index/detail_play?img=' + encodeURIComponent(img) + '&ads=&u=' + token + '&h=&t=' + t;
      const src = await pornaPlayFromScript(site, path);
      if (src) { videos.push({ ordinal: 1, label: '视频 1', sources: [src] }); break; }
    }
  }

  return {
    title: title || '',
    intro: ((obj && obj.description) || '').replace(/\s+/g, ' ').trim(),
    time: (obj && (obj.uploadDate || obj.datePublished)) || '',
    images: [],  // 这站没有剧照
    videos,
    tags,
    related: pornaCards(doc).slice(0, 12),
    duration,
  };
}

/** 解开站点前端用的 JS 打包格式（Dean Edwards packer）—— 换源响应里 m3u8 被拆成字典碎片。 */
/** 解开站点前端用的 JS 打包格式（Dean Edwards packer）—— 换源响应里 m3u8 被拆成字典碎片。 */
function unpackPacker(src) {
  const head = /eval\(function\(p,a,c,k,e,[rd]\)\{[\s\S]*?\}\('([\s\S]*?)',(\d+),(\d+),'([\s\S]*?)'\.split\('\|'\)/.exec(src);
  if (!head) return null;
  const p0 = head[1], a = parseInt(head[2], 10), c = parseInt(head[3], 10);
  const dict = head[4].split('|');
  // 还原 JS 字符串字面量里的转义（扫描式，避免正则被反斜杠绕晕）
  const ESC = { n: '\n', t: '\t', r: '\r', "'": "'", '\u005c': '\u005c', '"': '"' };
  let p = '';
  for (let i = 0; i < p0.length; i++) {
    const ch = p0[i];
    if (ch === '\u005c' && i + 1 < p0.length) {
      const nxt = p0[i + 1];
      if (ESC[nxt] !== undefined) { p += ESC[nxt]; i++; continue; }
    }
    p += ch;
  }
  const enc = (n) => (n < a ? '' : enc(Math.floor(n / a))) +
    ((n % a) > 35 ? String.fromCharCode((n % a) + 29) : (n % a).toString(36));
  for (let i = c - 1; i >= 0; i--) {
    if (i >= dict.length || !dict[i]) continue;
    p = p.replace(new RegExp('\u005cb' + enc(i) + '\u005cb', 'g'), dict[i]);
  }
  return p;
}

/** 请求换源脚本（detail_play / melon_detail_play）并抠出 m3u8 */
async function pornaPlayFromScript(site, path) {
  let js;
  try { js = await getHtml(site, path); } catch (e) { return ''; }
  const RE = /https?:\/\/[^"'\s\\]+\.m3u8[^"'\s\\]*/;
  let m = RE.exec(js);
  if (m) return m[0];
  const plain = unpackPacker(js);
  if (!plain) return '';
  m = RE.exec(plain);
  return m ? m[0] : '';
}

/** PT1H39S → 1:00:39 */
function pornaDuration(iso) {
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(String(iso || ''));
  if (!m) return '';
  const h = parseInt(m[1] || '0', 10), mi = parseInt(m[2] || '0', 10), s = parseInt(m[3] || '0', 10);
  if (!h && !mi && !s) return '';
  const mm = String(mi).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function videoOrdinal(s) {
  const m = /视频\s*([0-9一二三四五六七八九十百]+)/.exec(s);
  if (!m) return 0;
  const t = m[1];
  if (/^[0-9]+$/.test(t)) return parseInt(t, 10);
  const cn = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  if (t === '十') return 10;
  if (t.startsWith('十')) return 10 + (cn[t.slice(1)] || 0);
  if (t.includes('十')) {
    const p = t.split('十');
    return (cn[p[0]] || 0) * 10 + (p.length > 1 ? (cn[p[1]] || 0) : 0);
  }
  return cn[t] || 0;
}

/* -------- 图片：下载 + AES 解密（与 fetched_image.dart 对应） -------- */
const imgCache = new Map();
function looksLikeImage(b) {
  if (b.length < 12) return false;
  if (b[0] === 0xff && b[1] === 0xd8) return true;
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return true;
  const s = String.fromCharCode(...b.slice(0, 6));
  if (s.startsWith('GIF8')) return true;
  if (s.startsWith('RIFF') && String.fromCharCode(...b.slice(8, 12)) === 'WEBP') return true;
  return false;
}
const isIco = (b) => b.length > 6 && b[0] === 0 && b[1] === 0 && b[2] === 1 && b[3] === 0;

const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));

/** 下载 + 解密一张图。
 *  ⚠️ 封面偶发"解密失败"多半不是密钥问题，而是**请求层**：一次拉几十张图时
 *  本地代理会偶发超时/被限流，回来的不是密文（错误页/空包）→ 解密当然失败。
 *  所以这里：非 200 或解密失败都**重试一次**，并且**失败结果不进缓存**
 *  （原来把失败的 Promise 缓存住了，那张图就一直空白到刷新为止）。 */
async function imageUrl(url, retries = 1) {
  if (!url) return '';
  if (imgCache.has(url)) return imgCache.get(url);
  const task = (async () => {
    for (let attempt = 0; attempt <= retries; attempt++) {
      if (attempt) await sleep(400);   // 给代理/图床喘口气
      let b;
      try {
        const r = await fetch(px(url));
        if (!r.ok) {
          if (attempt < retries) continue;
          log(`封面请求失败 HTTP ${r.status}：` + url.slice(0, 50), 'err');
          return '';
        }
        b = new Uint8Array(await r.arrayBuffer());
        if (b.length < 12) {
          if (attempt < retries) continue;
          log('封面响应是空的（重试后仍然）：' + url.slice(0, 50), 'err');
          return '';
        }
      } catch (e) {
        if (attempt < retries) continue;
        log('封面下载失败：' + url.slice(0, 50) + '（' + (e && e.message ? e.message : e) + '）', 'err');
        return '';
      }
      if (isIco(b)) return URL.createObjectURL(new Blob([b]));   // 浏览器自己能显示 ICO
      if (!looksLikeImage(b)) {
        let ok = false;
        try {
          const key = await crypto.subtle.importKey('raw',
            new TextEncoder().encode(AES_KEY), { name: 'AES-CBC' }, false, ['decrypt']);
          b = new Uint8Array(await crypto.subtle.decrypt(
            { name: 'AES-CBC', iv: new TextEncoder().encode(AES_IV) }, key, b));
          ok = true;
        } catch (e) {
          if (attempt < retries) continue;   // 偶发坏响应，再试一次
          log(`图片解密失败（密钥/密文对不上，重试过）：` + url.slice(0, 50), 'err');
          return '';
        }
        if (!looksLikeImage(b)) {
          if (attempt < retries) continue;
          log('解密后仍不是图片：' + url.slice(0, 50), 'err');
          return '';
        }
      }
      return URL.createObjectURL(new Blob([b]));
    }
    return '';
  })();
  imgCache.set(url, task);
  const out = await task;
  if (!out) imgCache.delete(url);   // 失败不缓存，下次还能重试
  return out;
}
async function fillImages(root) {
  for (const img of root.querySelectorAll('img[data-src]')) {
    const u = img.getAttribute('data-src');
    img.removeAttribute('data-src');
    const obj = await imageUrl(u);
    if (obj) img.src = obj; else img.style.visibility = 'hidden';
  }
}

/** 横向长条支持"按住左右拖"滚动。
 *  用户是手机远控电脑（没有滚轮/触控板），横条只能靠拖动才够得着；
 *  拖超过 8px 就把随后那次 click 吞掉，免得滑动时误切了分类。 */
function enableDragScroll(el) {
  if (!el || el.dataset.dragScroll === '1') return;
  el.dataset.dragScroll = '1';
  let down = false, startX = 0, startLeft = 0, moved = 0;
  el.addEventListener('pointerdown', (e) => {
    // 触摸走浏览器原生横滑（CSS 里给了 touch-action: pan-x），这里只管鼠标
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    down = true; moved = 0; startX = e.clientX; startLeft = el.scrollLeft;
    // ⚠️ 千万别用 setPointerCapture：指针捕获会把随后的 click 也重定向到容器，
    //    子元素（tab、子分类胶囊）的点击会全部失效——之前就是这么把点击搞坏的
    el.style.cursor = 'grabbing';
  });
  el.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > moved) moved = Math.abs(dx);
    el.scrollLeft = startLeft - dx;
    if (moved > 8 && e.cancelable) e.preventDefault();
  });
  const up = () => {
    if (!down) return;
    down = false;
    el.style.cursor = '';
    if (moved > 8) {
      // 捕获阶段吞掉这次 click（滑完手抬起来别顺手切了分类）
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      el.addEventListener('click', swallow, true);
      setTimeout(() => el.removeEventListener('click', swallow, true), 300);
    }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}

function push(view) { stack.push(view); view(); }

/* -------- 背景图（首页/设置页）--------
   状态与示范图定义在文件上方（启动时要解析 ?bg=，那会儿还不能碰这两个符号）；
   这里只放行为：有图时给 .screen 挂 hasbg —— 卡片/导航变半透明 + 文字加柔光，
   再按图的明暗挂 .darkbg（深色图才翻白字，判定见下面的 bgIsDark），
   保证"图标和文字仍清楚"（图再花也压得住）。 */

/* -------- 背景明暗判定（决定文字配色：深色图 → 文字翻白 + 深柔光）--------
   规则：位图缩到 32px 宽，数"暗像素"（亮度 < 0.5）占比，> 50% 算深色图；
   CSS 渐变串不碰 canvas，取串里所有 #rrggbb 求平均亮度，< 0.5 算深色图；
   加载失败或跨域导致 getImageData 抛错 → 按浅色处理（日志里记一行）。 */
const bgLuma = (r, g, b) => (0.299 * r + 0.587 * g + 0.114 * b) / 255;

/** 判定背景明暗：true=深色 / false=浅色 / null=判定不了（调用方按浅色处理） */
function bgIsDark(v) {
  const say = (m) => { console.log(m); log(m); };
  if (/gradient\(/.test(v)) {
    const hex = v.match(/#[0-9a-f]{6}/gi) || [];
    if (!hex.length) return Promise.resolve(null);
    const sum = hex.reduce((a, h) => [a[0] + parseInt(h.slice(1, 3), 16),
      a[1] + parseInt(h.slice(3, 5), 16), a[2] + parseInt(h.slice(5, 7), 16)], [0, 0, 0]);
    const l = bgLuma(sum[0] / hex.length, sum[1] / hex.length, sum[2] / hex.length);
    say(`背景明暗：渐变平均亮度 ${l.toFixed(3)} → ${l < 0.5 ? '深色图' : '浅色图'}`);
    return Promise.resolve(l < 0.5);
  }
  return new Promise((done) => {
    const img = new Image();
    if (/^https?:/i.test(v)) img.crossOrigin = 'anonymous'; // 远程图不带这个，getImageData 必抛错
    img.onload = () => {
      try {
        const w = 32, h = Math.max(1, Math.round(32 * img.naturalHeight / img.naturalWidth));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0, w, h);
        const d = g.getImageData(0, 0, w, h).data;
        let n = 0;
        for (let i = 0; i < d.length; i += 4) if (bgLuma(d[i], d[i + 1], d[i + 2]) < 0.5) n++;
        const ratio = n / (w * h);
        say(`背景明暗：暗像素占比 ${(ratio * 100).toFixed(1)}% → ${ratio > 0.5 ? '深色图' : '浅色图'}`);
        done(ratio > 0.5);
      } catch (e) { done(null); } // 画布被跨域图污染：getImageData 抛错
    };
    img.onerror = () => done(null);
    img.src = v;
  });
}

let bgJudged = null; // 已判定过的背景值：切页会反复调 applyBg，别重复解码 + 刷日志

async function applyBg() {
  const el = $('bg');
  if (el) {
    el.style.backgroundImage = !appBg
      ? ''
      : (/gradient\(/.test(appBg) ? appBg : `url("${appBg}")`);
    el.classList.toggle('on', !!appBg);
  }
  const sc = $('screen');
  if (sc) sc.classList.toggle('hasbg', !!appBg);
  // 明暗判定（异步；结果只落 .darkbg 类，文字配色全在 CSS 里）
  if (!sc || !appBg) { bgJudged = null; if (sc) sc.classList.remove('darkbg'); return; }
  if (bgJudged === appBg) return;
  bgJudged = appBg;
  const key = appBg;
  const dark = await bgIsDark(appBg);
  if (key !== bgJudged) return; // 判定期间背景又被换了 → 这次结果作废
  if (dark === null) log('背景明暗判定失败，按浅色处理');
  sc.classList.toggle('darkbg', dark === true);
}

function bgPick(url) {

/** 加入时间：用户要求**直接写年月日时**（不要"刚刚 / N分钟前"那种相对时间）→ 2026-10-01 18:53 */
function bgStamp(ts) {
  const d = new Date(ts || Date.now());
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

  bgAlbum.unshift({ v, t: Date.now() });   // 新加的排最前

/** 左滑露出右侧「导出 / 删除」两个按钮：横拖行内容向左位移；没拖动 = 点一下 → 立即应用。
    指针事件（鼠标 / 触摸同一套）。⚠️ 别用 setPointerCapture：它会把随后的 click 重定向
    （见 enableDragScroll 里的教训）。 */
function bgAlbumSwipe(box) {
  const W = 128;   // = 两个按钮的总宽（各 64px，见 .bgal-acts > div）
  let row = null, x0 = 0, base = 0, moved = 0, dx = 0;
  const onMove = (e) => {
    dx = e.clientX - x0;
    if (Math.abs(dx) > moved) moved = Math.abs(dx);
    if (moved > 3) row.dataset.drag = '1';   // 真开始拖了才把「删除」亮出来（免得点一下闪一下）
    row.style.transform = `translateX(${Math.max(-W, Math.min(0, base + dx))}px)`;
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    const r = row;
    row = null;
    if (!r) return;
    delete r.dataset.drag;
    const open = moved < 8 ? false : (base + dx) < -W / 2;   // 过半停在滑开位；滑开的那条点一下=收回
    r.style.transition = '';                                 // 交回 CSS 过渡，吸附回去
    r.style.transform = open ? `translateX(${-W}px)` : '';
    r.dataset.open = open ? '1' : '0';
    if (moved < 8 && !base) bgAlbumApply(+r.dataset.i);
  };
  box.addEventListener('pointerdown', (e) => {
    const r = e.target.closest('.bgal-row');
    if (!r || row || e.button !== 0) return;   // 只认主键/手指（右键别把行拖住）
    row = r; x0 = e.clientX; base = r.dataset.open === '1' ? -W : 0; moved = 0; dx = 0;
    r.style.transition = 'none';
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}
