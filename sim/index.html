/** 取**更高档**的流（用户 2026-10-03："240p 太糊" ✗）——
 *  实测（同一 model 只换 URL 后缀 ✓）：`…/master/<id>_240p.m3u8` 里的 `_240p` 换成
 *  **`_480p` / `_960p` / `_960p60` 都是 200 + 合法 m3u8** ✓（`_1080p` → **404** ✗）；
 *  有哪些档由 model 自己的 `presets` 给（例 `["960p60","960p","480p","240p","160p_blurred"]` ✓）。
 *  选档顺序：**960p → 480p → 240p** ✓（**跳过 `960p60`** ✗ 60fps 码率更高、起播更慢 ✓；
 *  **跳过 `*_blurred`** ✗ 那是马赛克档 ✓；`presetsAv1` 是 AV1 那套 ✗ 不用 ✓）；
 *  逐个探（`fetch` 读状态 + `#EXTM3U` ✓ —— CDN 有 `ACAO:*` ✓ 探得动 ✓），**第一个能用的就用** ✓；
 *  全探不到才退回接口给的 `hlsPlaylist` ✓（= 原来那档 240p ✓）。挑好的记进 `livePresetCache` ✓ 同一房间不重复探 ✓。 */
const livePresetCache = new Map();
function probeLivePreset(m) {
  const base = String(m.hlsPlaylist || '');
  const urls = [];
  const add = (p) => {
    const u = base ? base.replace(/_[A-Za-z0-9_]+\.m3u8(\?.*)?$/, '_' + p + '.m3u8') : '';
    if (u && u !== base && urls.indexOf(u) < 0) urls.push(u);
  };
  add('960p'); add('480p'); add('240p');
  if (base) urls.push(base);
  const labelOf = (u) => { const mm = /_([A-Za-z0-9_]+)\.m3u8(\?|$)/.exec(u); return mm ? mm[1] : ''; };
  const step = (i) => {
    if (i >= urls.length) return { url: base, preset: '' };
    return fetch(urls[i]).then((r) => (r.ok ? r.text() : '')).then((t) => {
      if (t && t.indexOf('#EXTM3U') === 0) return { url: urls[i], preset: labelOf(urls[i]) };
      return step(i + 1);
    }).catch(() => step(i + 1));
  };
  return Promise.resolve().then(() => step(0));
}
function pickLivePreset(m) {
  const key = String(m.id || m.username || '');
  if (!livePresetCache.has(key)) livePresetCache.set(key, probeLivePreset(m));
  return livePresetCache.get(key);   // 始终是 promise ✓（并发点两次也只探一遍 ✓）
}

}

  el.innerHTML = albSt.loading ? '<span class="spin"></span>' : (albSt.done ? '没有更多了' : '上滑加载更多');
}

async function albLoad() {
  if (albSt.loading || albSt.done) return;
  const req = albReq;                       // ★ 我是"哪一代"请求 ✓（换分类/重拉会 `albReq++` ✓）
  albSt.loading = true; albPaintMore();
  const page = albSt.page + 1;
  try {
    const items = await albPageData(page);
    // ★★ 关键：换分类后**旧响应一律丢弃** ✗ —— 不然它会把上一个分类的条目塞进新列表（**实测串台过** ✗：
    //    少女映画那次响应慢，落到了下一次点击之后 → 沫沫真爱页里出现 29 条 = 15(少女映画)+14(沫沫真爱) ✗）
    if (req !== albReq) return;             // 丢掉时**连 loading 都不动** ✗（那是新一代的状态 ✓）
    albSt.items = albSt.items.concat(items);
    albSt.page = page;
    albSt.err = '';
    // ★ "到底" = 这一页**一条都没有** ✓（真站第 999 页返回 0 条 ✓ 实测 ✓）；
    //   顺便：不满 24 条也当最后一页 ✓（免得白拉一页空的 ✗）
    if (items.length < ALB_PER_PAGE) albSt.done = true;
    log(`在线图集1「${albCurTag().name}」：第 ${page} 页（${albPageUrl(page)}）→ ${items.length} 条` +
        `（累计 ${albSt.items.length}${albSt.done ? '，到底' : ''}）`, 'dim');
  } catch (e) {
    if (req !== albReq) return;             // 旧代的失败也丢掉 ✗（否则会把新分类显示成失败态 ✓）
    albSt.err = (e && e.message) || String(e);
    albSt.done = true;                    // 失败不自动重拉 ✓（失败态那颗「重试 ✓」/ 下拉刷新 ✓）
    log('在线图集1：' + albSt.err, 'err');
  }
  albSt.loading = false;
  renderAlbCards();
}

/** 下拉刷新 = **清空、重拉第 1 页** ✓（这页没有筛选状态 ✓ 所以就是把列表推倒重来 ✓） */
function albReload() {
  albReq++;                                // ★ 作废所有在飞的旧请求 ✓
  albSt = { page: 0, loading: false, err: '', items: [], done: false };
  renderAlbCards(); albPaintMore();
  return albLoad();
}

/* ---------- 「在线图集1」详情页（2026-10-05 用户要求 ✓ · **只 sim** ✓ app-sim 同步 ✓）----------
   ★ 数据 = 同域名详情页 ✓ 走**同一个** `/albpage` 白名单代理 ✓（**只复用、不改它** ✗ 白名单已覆盖 ✓）
   实测口径（我探明的 ✓ 见 `DEVLOG`/本轮报告 ✓）：图片真址也在 **`data-src`** ✓
      （`src` 是占位 gif `loading_3_green_dot` ✗ 跳过 ✓）；容器 `#picture-item-row` ✓；
      该图集 **23 张** ✓ **无分页/加载更多** ✓（SSR 一次给全 ✓）；页面 **`srcset`=0 · `<picture>`=0** ✓
   ⚠️ **无损口径**（用户原话 ✓ 别过度解读 ✗）：`width:100%; height:auto` ✓ **不写固定像素** ✗、
      **不用 `object-fit: cover`** ✗（默认 `fill` + `height:auto` ⇒ 盒子比例 = 原图比例 ⇒ **不裁不压** ✓）；

   ⚠️ **占位**：灰底 = 既有色 `#eceff3`（`.lv-room .cov` 那个 ✓）+ 内联 `aspect-ratio: 2/3` ✓
      （本站扫图常见比例 ✓ 实测 `023.jpeg` = 2162×3840 ✓）→ 图 `onload` 回填**真实比例** ✓ ⇒ 不跳版不变形 ✓
      （⚠️ 占位只是"没图时别白一片" ✓ **不是**压图 ✗） */
let albDSt = { loading: false, err: '', items: [], done: false };
let albDReq = 0;                         // ★ 同 `albReq`：换图集/重拉都 +1 ⇒ 旧响应丢弃 ✗（免得上一本的图串到这一本 ✓）

/** 点卡片 → 详情页 ✓（把 item 带进栈 ✓ 返回时 `back()` 回图集列表 ✓） */
function onlineAlbumDetailOpen(item) { push(() => viewOnlineAlbumDetail(item)); }

function viewOnlineAlbumDetail(item) {

/** 详情页图列表（**竖排、每张占满宽度、原图直出** ✓）—— 三态在 `albDPaintMore()` ✓ */
function renderAlbDetail() {
  const box = $('albDList'); if (!box) return;
  box.innerHTML = albDSt.items.map((src, i) => `
    <div id="albDBox${i}" style="background:#eceff3;aspect-ratio:2/3;overflow:hidden">

    </div>`).join('');
  box.querySelectorAll('img').forEach((im, i) => {                 // 加载完把占位框换成**真实比例** ✓ 不跳版 ✓
    const set = () => {

      if (el && im.naturalWidth) el.style.aspectRatio = im.naturalWidth + ' / ' + im.naturalHeight;
    };

    // ★ 点图 ⇒ 弹预览 ✓（复用**同一个 URL** ✓ 已缓存 ⇒ **不新增请求** ✗ 不重新拉图 ✓）
    //   参数传**下标** ✓ ⇒ 进预览就定位到"点的那张" ✓ 页码 `i+1 / 总数` ✓
    im.onclick = () => albPreviewOpen(i);
  });

}

/** 详情页状态行（三态 ✓ 与图集页同一套既有件 ✓；失败也可点重试 ✓） */
function albDPaintMore() {
  const el = $('albDMore'); if (!el) return;
  if (albDSt.err) {
    el.innerHTML = `<div class="hint">加载失败：${esc(albDSt.err)}<br />`
      + `<span class="sbtn" style="display:inline-block;flex:none;padding:8px 18px;margin-top:10px" `
      + `onclick="albDetailRetry()">重试 ✓</span><br />（或下拉刷新 ✓）</div>`;
    return;
  }
  if (albDSt.loading) { el.innerHTML = '<span class="spin"></span>'; return; }
  if (!albDSt.items.length) { el.innerHTML = '<div class="hint">这个图集没有图片（空态 ✓）</div>'; return; }
  el.innerHTML = '';
}

let albDLast = null;                       // 记住当前详情项（重试用 ✓ —— 只是本地变量 ✓ 不做缓存/预取 ✗）
function albDetailRetry() { if (albDLast) albDetailLoad(albDLast); }

function albDetailLoad(item) {
  if (albDSt.loading) return;
  const req = albDReq;                     // ★ 我是哪一代 ✓（换了图集就丢弃 ✓）
  albDLast = item;
  albDSt.loading = true; albDPaintMore();
  const url = '/albpage?url=' + encodeURIComponent(ALB_BASE + item.href);
  return fetch(url).then((r) => {
    if (!r.ok) throw new Error('取页失败：HTTP ' + r.status);
    return r.text();
  }).then((html) => {
    if (req !== albDReq) return;           // 旧代 ⇒ 什么都不动 ✗（连 loading 也不碰 ✓）
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // ★ 与列表页/App 同口径：**图片真址在 `data-src`** ✓（`src` = 占位 gif ✗ 跳过 ✓）
    const row = doc.getElementById('picture-item-row') || doc;
    albDSt.items = [...row.querySelectorAll('img[data-src]')]
      .map((im) => albAbs(im.getAttribute('data-src')))          // ★ 同款：相对路径补绝对 ✓（详情图也可能有相对的 ✗）
      .filter((s) => s && !s.includes(ALB_PLACEHOLDER));
    albDSt.err = '';
    log(`图集详情：${item.href} → **${albDSt.items.length} 张**（取自 data-src ✓ 跳过占位 gif ✓）`, 'dim');
    albPreloadAll(albDSt.items);                        // ★ 后台预热整本 ✓ 不挡首屏 ✓ 失败静默 ✓
  }).catch((e) => {
    if (req !== albDReq) return;
    albDSt.err = (e && e.message) || String(e);
    log('图集详情：' + albDSt.err, 'err');
  }).then(() => { if (req === albDReq) { albDSt.loading = false; renderAlbDetail(); } });
}

/** 下拉刷新 = 清空重取这一页 ✓（详情没有分页/筛选 ✓ 就是把图重拉一遍 ✓） */
function albDetailReload(item) {
  albDReq++;                               // ★ 作废在飞的旧请求 ✓
  albDSt = { loading: false, err: '', items: [], done: false };
  renderAlbDetail();
  return albDetailLoad(item);
}

/* ---------- 图片预览 / 框选（2026-10-05 用户要求 ✓ **只 sim** ✓ App 本轮不动 ✗）----------
   口径（用户原话 ✓ 照此实现 ✓）：
   ① **框选比例 = 手机屏幕（分辨率）的比例** ✓ —— 框在**图片范围内**移动 ✓（用户框出要显示的那部分 ✓）
   ② **设为背景** = **一次性选择** ✓ —— **不写进"背景图集"** ✗；sim 里**不真设** ✓（只给提示 ✓）
      并在提示里注明真机语义（**设完即用 ✓ 不进图集 ✓**）
   ③ **保存相册** = **原图无损、不裁剪、直接存** ✓ —— 与本轮的"框选"**无关** ✗（它不需要框选 ✓）；sim 不真存 ✓
   件：**全部复用既有** `.ovl`（遮罩弹层 ✓ 挂在 `#screen` 上 ✓）+ `.ovl .row2/.cancel/.ok`（那排两颗按钮 ✓）
      ⇒ **没新造样式** ✗（只在内联里调了布局 ✓）
   ⚠️ 移动交互选了「**拖图**」（框固定 ✓ 手一拖图走 ✓）：设壁纸/裁剪本来就是这个手势 ✓，
      比"拖框"顺（框始终在屏幕固定位置 ✓ 不会拖出屏幕外 ✗）；拖的方向还能靠"图跟手"直观看出来 ✓
   ⚠️ 图和框按 **cover** 口径缩放 ✓（`max(框宽/图宽, 框高/图高)` ✓）⇒ 竖图/横图/方图都**不露底** ✓；
      两个方向各自夹住 ✓ ⇒ **框永远不出图** ✓
   ⚠️ 提示**不用 `alert`** ✗（headless 下会卡住 ✓ 用弹层里那条既有 `.hint` ✓ + 1.4s 后自动关 ✓） */
let albPv = null;          // { src, mode:'view'|'crop' } —— 当前预览态 ✓（关掉即 null ✓）
let albCropSt = null;      // 框选态的位移/余量 ✓：{ dx, dy, dw, dh, slackX, slackY }

/** 打开预览（点详情页的图 ✓）—— URL 与详情页那张**同一个** ✓ 已缓存 ⇒ **不新增请求** ✗
 *  ★ 参数是**下标** ✓：进预览就按"点的那张"定位 ⇒ 页码显示 `下标+1 / 总数` ✓ */
function albPreviewOpen(i) {
  albPreviewClose();                                  // 幂等：先清旧的 ✓
  const n = albDSt.items.length;
  const idx = Math.max(0, Math.min(n - 1, parseInt(i, 10) || 0));
  const o = document.createElement('div');
  o.className = 'ovl';
  o.style.alignItems = 'center';                      // 预览要**整图居中** ✓（`.ovl` 默认 flex-end 是底弹层 ✓ 内联盖掉 ✓）
  o.onclick = (e) => { if (e.target === o) albPreviewClose(); };   // 点遮罩关 ✓（照既有弹层规矩 ✓）
  $('screen').appendChild(o);
  albPv = { mode: 'view', i: idx, src: albDSt.items[idx] || '' };
  albPreviewPaint();
  log(`图片预览：第 ${idx + 1} / ${n} 张 ✓（左滑=下一张 ✓ 右滑=上一张 ✓ 点遮罩关 ✓）`, 'dim');
}

/** ★ 换上一张/下一张（`d` = +1 下一张 / -1 上一张）——
 *  ⚠️ 方向 = **用户最终口径** ✓（2026-10-05 拍板）：**左滑 = 下一张** ✓ **右滑 = 上一张** ✗
 *     （口径换过三次 ☠ 以"左=下一张"为准 ✓ 见 `albPreviewSwipe` 头上那段历史注释 ✓）
 *  ⚠️ **不循环** ✗：到边界就停住 ✓（只记一条日志 ✓）；⚠️ **只在预览态生效** ✗ —— 框选态的手势归拖图 ✓
 *  ⚠️ **零新增请求** ✓：只把 `src` 换成**列表里早就加载过的那条 URL** ✓（同 URL ⇒ 浏览器缓存 ✓ 不重新拉 ✗） */
function albPreviewStep(d) {
  if (!albPv || albPv.mode !== 'view') return;        // ★ 框选态不许切图 ✗（那里拖拽要用来移图 ✓）
  const n = albDSt.items.length;
  const ni = albPv.i + d;
  if (ni < 0 || ni > n - 1) {                         // ★ 边界（按最终口径 ✓）：**第一张右滑 / 最后一张左滑 ⇒ 一动不动** ✓
    log(`预览：已经是${ni < 0 ? '第一' : '最后'}张 ✓ 不循环 ✗`, 'dim');
    return;
  }
  albPv.i = ni;
  albPv.src = albDSt.items[ni];                       // 详情页早加载过这条 ✓ ⇒ 零新增请求 ✓
  albPreviewPaint();
  log(`预览：${ni + 1} / ${n} ✓`, 'dim');
}

/** ★ 预览图的左右滑（pointer ✓ 鼠标/触屏同一套 ✓；横位移 > 40px 且比竖位移大才算 ✓ 免得跟"点遮罩关"打架 ✗）
 *  ★ 2026-10-05 **用户最终口径** ✓：**左滑 = 下一张** ✓ **右滑 = 上一张** ✗（框选态不切图 ✗）
 *     判定一行：`dx < 0`（往左划）给 `+1`（下一张）✓；`dx > 0` 给 `-1`（上一张）✓
 *  ⚠️ **不跟动画打架** ☠：这边**没有滑动动画** ✗（换图 = 直接换 `src` ✓ 无位移过渡 ✓）⇒ 方向只决定"换哪张" ✓
 *  ⚠️ 图集2 那条是**另一份**同款代码（`alb2PreviewSwipe` ✓）⇒ 两处必须一起改 ✓ 别只改一处 ☠（漏过一次 ✗）
 *  ⚠️ 历史 ☠：这条口径换过三次（最初左=下 → 2026-10-05 改成左=上 → 同日**用户拍板翻回左=下** ✓ 以本次为准 ✗） */
function albPreviewSwipe() {
  const o = document.querySelector('.ovl'); if (!o) return;
  const im = o.querySelector('img'); if (!im) return;
  let down = false, sx = 0, sy = 0;
  im.addEventListener('pointerdown', (e) => { down = true; sx = e.clientX; sy = e.clientY; });
  const end = (e) => {
    if (!down) return; down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 40 || Math.abs(dx) <= Math.abs(dy)) return;   // 太小 / 竖着划 ⇒ 不切图 ✓
    albPreviewStep(dx < 0 ? 1 : -1);                                 // ★ 左滑=下一张 ✓ 右滑=上一张 ✓
  };
  im.addEventListener('pointerup', end);
  im.addEventListener('pointercancel', () => { down = false; });
}

function albPreviewClose() {
  const o = document.querySelector('.ovl'); if (o) o.remove();
  albPv = null; albCropSt = null;
}

/** 框的宽高比 = **手机屏幕的比例** ✓ —— 取 `.screen`（模拟器那台手机 ✓）的**实际 rect** 现算 ✓ 不写死 ✗
 *  ⚠️ 为什么不取 `window.innerWidth/innerHeight` ✗：那是**浏览器窗口** ✗ —— 窗口一拉伸/最大化，
 *     比例就跟着变（实测 headless 里 `--window-size=430,932` 拿到的视口是 492×840 ⇒ 0.5857 ✗，
 *     而手机屏是 440×956 ⇒ **0.4603** ✓ ≈ 用户说的 430/932 = 0.4614 ✓）。
 *     用户原话是"**手机分辨率（屏幕）的比例**" ✓ ⇒ 取手机屏 ✓（换机型/改 CSS 尺寸会自动跟着变 ✓）
 *  ⚠️ `.screen` 万一取不到 → 退回视口 ✓（不会 NaN ✗） */
function albScreenRatio() {
  const sc = $('screen');
  const r = sc ? sc.getBoundingClientRect() : null;
  if (r && r.width > 0 && r.height > 0) return r.width / r.height;
  return window.innerWidth / window.innerHeight;
}

function albPreviewPaint() {
  const o = document.querySelector('.ovl'); if (!o || !albPv) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ratio = albScreenRatio();
  const n = albDSt.items.length || 1;
  if (albPv.mode === 'view') {                        // ① 预览态：整图 + 页码 + 两颗按钮（设为背景 / 保存相册 ✓）
    // ⚠️ 两颗按钮**都亮** ✓（2026-10-05 用户截图：原来 保存相册 用的是 `.cancel` 灰底 ✗ ⇒ 改成主按钮那套橙底白字 ✓）
    o.innerHTML = `<div style="width:100%;padding:0 12px;box-sizing:border-box">
      <img src="${esc(albPv.src)}" alt="" draggable="false"
        style="width:100%;height:auto;display:block;border-radius:10px;-webkit-user-drag:none" />
      <div style="text-align:center;color:#fff;opacity:.85;font-size:12px;margin:8px 0 0">${albPv.i + 1} / ${n}</div>
      <div class="row2"><div class="ok" onclick="albPreviewCrop()">设为背景</div>
        <div class="ok" onclick="albPreviewSave()">保存相册</div></div></div>`;
    albPreviewSwipe();                                // ★ 左滑=下一张 · 右滑=上一张（只在预览态 ✓ 框选态不切图 ✗）
    return;
  }
  // ② 框选态：**两颗按钮藏起来** ✗ → 换 确认/取消 ✓；框 = 手机屏比例 ✓；框外压暗 ✓
  //   ⚠️ 2026-10-05 用户截图报「框贴最左 ✗ + 确认/取消那排也偏左 ✗」—— **实测复现 + 根因**：
  //      这层外框原来只有"内容宽" ✗：`.ovl` 是 **row 方向** flex 且默认 `justify-content:flex-start`
  //      ⇒ 它被顶到最左 ✓，宽只剩框宽 **201.83** ✗（父宽 **370.06** ✗）⇒ 里面 `width:100%` 的 `.row2`
  //      也只有 201.83 ✗ ⇒ 框和按钮排**一起贴左** ✓（实测左间隙 0 / 右间隙 168.23 ✗）
  //   ⇒ 最小修法：外框补 **width:100% + box-sizing:border-box + 左右留白** ✓（框的水平居中交给
  //      `align-items:center` ✓ 天然对称 ✓）；`.row2` 自己那份 padding 去掉 ✗（免得和外层叠成 24px ✗）
  //   ⚠️ **比例口径 / 拖拽 / 夹住 / 按钮文案顺序 一律没动** ✗
  const fw = Math.max(120, Math.round(Math.min(vw - 96, vh * ratio * 0.62)));
  const fh = Math.round(fw / ratio);
  o.innerHTML = `<div style="width:100%;box-sizing:border-box;padding:0 12px;
    display:flex;flex-direction:column;align-items:center;gap:16px">
    <div id="albCropStage" style="position:relative;width:${fw}px;height:${fh}px;overflow:hidden;border-radius:12px;
      background:#000;box-shadow:0 0 0 9999px rgba(0,0,0,.55)"></div>
    <div style="text-align:center;color:#fff;opacity:.85;font-size:12px;position:relative;z-index:1">${albPv.i + 1} / ${n}</div>
    <div class="row2" style="width:100%;margin:0;position:relative;z-index:1">
      <div class="ok" onclick="albCropOk()">确认</div>
      <div class="ok" onclick="albCropCancel()">取消</div></div></div>`;
  // ⚠️ 上面那颗 `取消` 原来用 `.cancel`（灰底 ✗ = mock 里"禁用"那套语义 ✗）⇒ 2026-10-05 用户截图报"看着灰"
  //    ⇒ 改成和 `确认` 同一套**主按钮橙底白字** ✓（用户要"都亮" ✓）
  // ⚠️ 这一排另加了 `position:relative;z-index:1` ✗ —— **实测根因**：框那层是 `position:relative`（定位元素）
  //    且带 `box-shadow: 0 0 0 9999px rgba(0,0,0,.55)` ⇒ 它在绘制顺序上**压在这排 static 按钮之上** ✗
  //    （像素实测：确认按钮底色 **105,40,5** ✗ = 本色 #E8590C(232,89,12) × 0.45 ✓ 正是被 0.55 黑压过 ✓）
  //    抬层级后按钮恢复本色 ✓；**框外压暗本身保留** ✓（那是框选的视觉语义 ✓ 不能取消 ✗）
  const st = $('albCropStage');
  st.addEventListener('click', (e) => e.stopPropagation());   // 框上点一下**别**当"点遮罩关" ✗
  albCropBuild();
  log(`框选：框 ${fw}×${fh}（= 视口比 ${ratio.toFixed(4)} ✓）· 拖图选区域 ✓`, 'dim');
}

/** 框里铺图 + 指针拖拽 + **双指捏缩放/滚轮缩放**（鼠标/触屏都走 pointer ✓ —— 照 mock 里 `enablePullRefresh` 那套 ✓）
 *  ★ 2026-10-05 用户要求（与 App 的 `InteractiveViewer` 对齐 ✓）：**拖动平移 + 双指捏缩放** ✓
 *     · 缩放上下限 `z ∈ [1, 4]` ✓（`z=1` = 刚好盖住框 ✓ ⇒ **永远不露底** ✗；最大 4 倍 ✓）
 *     · 缩放锚点 = 两指中点 ✓（滚轮锚在舞台中心 ✓）· 每次缩放**重算余量并夹住** ✓ ⇒ 图始终盖住框 ✓
 *     · 桌面可测：**滚轮**在舞台内直接缩放 ✓ · `touch-action:none` 防浏览器抢双指手势 ✓ */
function albCropBuild() {
  const st = $('albCropStage'); if (!st || !albPv) return;
  st.style.touchAction = 'none';                      // ★ 别让浏览器把双指手势当页面缩放/滚动抢走 ✓
  const fw = st.clientWidth, fh = st.clientHeight;
  const im = document.createElement('img');
  im.src = albPv.src; im.alt = ''; im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;-webkit-user-drag:none;user-select:none';
  st.appendChild(im);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  /** 按 `z` 重算尺寸/余量，并把 dx/dy 夹住 ✓（`wantDx/wantDy` = 缩放锚点希望的新位移 ✓ 没给就居中 ✓） */
  const applyZoom = (z) => {
    const nw = im.naturalWidth || fw, nh = im.naturalHeight || fh;
    const base = Math.max(fw / nw, fh / nh);          // ★ "刚好盖住框"那档 = z 的 1 倍 ✓
    const s = base * z;
    albCropSt.z = z;
    albCropSt.dw = nw * s; albCropSt.dh = nh * s;
    albCropSt.slackX = Math.max(0, albCropSt.dw - fw);
    albCropSt.slackY = Math.max(0, albCropSt.dh - fh);
    albCropSt.dx = (typeof albCropSt.wantDx === 'number') ? albCropSt.wantDx : -albCropSt.slackX / 2;
    albCropSt.dy = (typeof albCropSt.wantDy === 'number') ? albCropSt.wantDy : -albCropSt.slackY / 2;
    delete albCropSt.wantDx; delete albCropSt.wantDy;
    albCropSt.dx = clamp(albCropSt.dx, -albCropSt.slackX, 0);   // ★ 夹住：图必须**盖住**框 ✓ 框不出图 ✓
    albCropSt.dy = clamp(albCropSt.dy, -albCropSt.slackY, 0);
    albCropPaint(im);
  };
  const fit = () => { albCropSt = { z: 1 }; applyZoom(1); };
  if (im.complete && im.naturalWidth) fit(); else im.onload = fit;
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  st.addEventListener('pointerdown', (e) => {
    if (!albCropSt || !im.naturalWidth || albCropSt.pinching) return;   // 双指进行时让位 ✓
    dragging = true; sx = e.clientX; sy = e.clientY; ox = albCropSt.dx; oy = albCropSt.dy;
    try { st.setPointerCapture(e.pointerId); } catch (_) {}
  });
  st.addEventListener('pointermove', (e) => {
    if (!dragging || !albCropSt || albCropSt.pinching) return;
    albCropSt.dx = clamp(ox + (e.clientX - sx), -albCropSt.slackX, 0);
    albCropSt.dy = clamp(oy + (e.clientY - sy), -albCropSt.slackY, 0);
    albCropPaint(im);
  });
  const up = () => { dragging = false; };
  st.addEventListener('pointerup', up);
  st.addEventListener('pointercancel', up);
  // ★ 接上共用的手势工具（双指捏 + 滚轮 ✓ 纯工具 ✓ 状态仍归 `albCropSt` ✓）
  albCropSt = albCropSt || { z: 1 };
  albCropSt.reflow = () => applyZoom(typeof albCropSt.wantZ === 'number' ? albCropSt.wantZ : (albCropSt.z || 1));
  albCropGestures(st, () => albCropSt);
}

/** ★ 框选舞台的**双指捏缩放 + 滚轮缩放**（2026-10-05 用户要求 ✓ 与 App 的 `InteractiveViewer` 对齐 ✓）
 *  ⚠️ 上下限：`z ∈ [1, 4]` ✓（z=1 = "图刚好盖住框"那档 ⇒ **永远不露底** ✗；最大 4 倍 ✓）
 *  ⚠️ 缩放锚点 = **两指中点** ✓（滚轮 = 舞台中心 ✓）· 夹住交给调用方的 `reflow()` ✓
 *  ⚠️ 双指期间置 `st.pinching = true` ✓ ⇒ 单指拖动那套**自动让位** ✗（免得两套手势打架 ☠）
 *  ⚠️ 桌面可测：**滚轮**直接缩放 ✓（`preventDefault` 只吃舞台里那一下 ✗ 页面滚动不受影响 ✓）
 *  ⚠️ **纯工具** ✓：状态由调用方持有（图集1 的 `albCropSt` / 图集2 的 `alb2CropSt` ✓ 不共享页面状态 ✗） */
function albCropGestures(stage, get) {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const pts = new Map();
  let startDist = 0, startZ = 1, ax = 0, ay = 0;
  const two = () => { const a = [...pts.values()]; return a.length >= 2 ? a.slice(0, 2) : null; };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const apply = (nz, anchorX, anchorY) => {
    const st = get(); if (!st || typeof st.reflow !== 'function') return;
    nz = clamp(nz, 1, 4);
    const rz = nz / (st.z || 1);
    st.wantZ = nz;
    st.wantDx = anchorX - (anchorX - st.dx) * rz;      // ★ 锚点不动：位移按缩放比一起放/缩 ✓
    st.wantDy = anchorY - (anchorY - st.dy) * rz;
    st.reflow();                                        // 由调用方重算余量 + 夹住 + 画 ✓
  };
  stage.addEventListener('pointerdown', (e) => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    const p = two(), st = get();
    if (p && st) {
      st.pinching = true;                              // ★ 单指拖动让位 ✓
      startDist = Math.max(1, dist(p[0], p[1]));
      startZ = st.z || 1;
      const r = stage.getBoundingClientRect();
      ax = (p[0].x + p[1].x) / 2 - r.left;             // 换成舞台内坐标 ✓（dx/dy 就在这个坐标系 ✓）
      ay = (p[0].y + p[1].y) / 2 - r.top;
    }
  }, true);
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = two();
    if (!p || !startDist) return;
    apply(startZ * (dist(p[0], p[1]) / startDist), ax, ay);
  }, true);
  const up = (e) => {
    pts.delete(e.pointerId);
    const st = get();
    if (pts.size < 2) { if (st) st.pinching = false; startDist = 0; }
  };
  stage.addEventListener('pointerup', up, true);
  stage.addEventListener('pointercancel', up, true);
  stage.addEventListener('wheel', (e) => {             // ★ 桌面也能测 ✓
    const st = get(); if (!st) return;
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    apply((st.z || 1) * (1 - e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
}

/** ★ 进详情后**后台预热整本图**（2026-10-05 用户要求 ✓ 与 App 同款 ✓）
 *  ⚠️ **不许挡首屏** ✗：起手那 1~2 张由详情页自己拉 ✓；其余的**推迟一拍**再以 `fetchPriority:'low'` 丢出去 ✓
 *  ⚠️ 失败/被拒**一律静默** ✗（不弹错 ✓ 不刷日志 ✓）；纯预取 ✓ 不碰任何页面 DOM ✓
 *  ⇒ 收益：之后在预览里左右滑**不再临时拉图** ✓（图已在缓存 ✓）
 *  ⚠️ 图集1/图集2 共用这一支纯工具 ✓（只持有引用防 GC ✓ 不共享任何页面状态 ✗） */
let albPre = [];
function albPreloadAll(urls) {
  albPre = [];
  const list = (urls || []).slice();
  setTimeout(() => {
    for (const u of list) {
      const im = new Image();
      im.fetchPriority = 'low'; im.decoding = 'async';
      im.onerror = () => {};                            // ★ 静默 ✓
      im.src = u;
      albPre.push(im);
    }
    log(`预热：${list.length} 张图后台低优先加载 ✓（失败静默 ✓ 不挡首屏 ✓）`, 'dim');
  }, 300);
}

/** 把当前 `albCropSt` 画到图上 ✓（尺寸 + 位移 ✓） */
function albCropPaint(im) {
  if (!albCropSt || !im) return;
  im.style.width = albCropSt.dw + 'px';
  im.style.height = albCropSt.dh + 'px';
  im.style.transform = `translate(${albCropSt.dx}px, ${albCropSt.dy}px)`;
}

// ===== 框选态那两颗 =====
function albPreviewCrop() { if (!albPv) return; albCropSt = null; albPv.mode = 'crop'; albPreviewPaint(); }
function albCropCancel() {                              // 取消 ⇒ **退回预览态**（按钮复原 ✓ 框消失 ✓）
  if (!albPv) return;
  albCropSt = null; albPv.mode = 'view'; albPreviewPaint();
  log('框选：取消 ✓ 回到预览态 ✓', 'dim');
}
function albCropOk() {                                  // 确认 ⇒ 提示真机语义 + 关预览 ✓（sim 不真设 ✗）
  albPreviewTip('模拟器不真设背景 ✓（真机：设完即用 ✓ 不进背景图集 ✗）');
}
function albPreviewSave() {                             // 保存相册 ⇒ **与框选无关** ✗ 原图直存 ✓
  albPreviewTip('模拟器不保存相册 ✓（真机：原图无损、不裁剪、直接存 ✓ 与框选无关 ✗）');
}

/** 弹层里冒一条提示 ✓（复用既有 `.hint` ✓）→ 1.4s 后自动关预览 ✓（**不用 alert** ✗ headless 会卡 ✓） */
function albPreviewTip(msg) {
  const o = document.querySelector('.ovl'); if (!o) return;
  let t = o.querySelector('.albTip');
  if (!t) {
    t = document.createElement('div');
    t.className = 'hint albTip';
    t.style.cssText = 'position:absolute;left:12px;right:12px;bottom:76px;text-align:center;z-index:2;'
      + 'background:rgba(0,0,0,.72);color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5';
    o.appendChild(t);
  }
  t.textContent = msg;
  log('图片预览：' + msg, 'dim');
  setTimeout(albPreviewClose, 1400);
}

const ALB2_BASE = 'https://www.photos18.com';
const ALB2_PER_PAGE = 100;                    // 实测每页 100 条 ✓
const ALB2_TABS = [                           // ★ 21 个：第 1 个「全部」= 首页 ✓ + 20 个分类 ✓ 顺序/文案照抄 ✓（括号数字不显示 ✗）

let alb2TabSel = 0, alb2SortSel = 0;          // 默认：「全部」✓ + 「最新」✓（依据 = 站上 `btn-danger` 高亮的是 /sort/created ✓）

 *  ③ 「全部」+「最新」 ⇒ `/`（首页 ✓ 依据 = 用户口径"全部 = 首页" ✓ 且实测与 `/sort/created` 前三条完全相同 ✓）

/** 取一页 + 解析（容器 `.card-columns .card` ✓ 首图在 `img src` ✓ 详情链接 `/v/XXX` 先存着 ✓） */
function alb2PageData(page) {
  return fetch('/albpage?url=' + encodeURIComponent(alb2PageUrl(page))).then((r) => {
    if (!r.ok) throw new Error('取页失败：HTTP ' + r.status);
    return r.text();
  }).then((html) => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const seen = new Set();
    return [...doc.querySelectorAll('.card-columns .card')].map((c) => {
      const a = c.querySelector('a[href^="/v/"]');
      const im = c.querySelector('img');
      const t = c.querySelector('.card-body a[href^="/v/"]');
      return { href: a ? a.getAttribute('href') : '', cover: alb2Abs(im && im.getAttribute('src')),
        title: t ? t.textContent.trim() : '' };            // 标题**解析保留** ✓ 本轮**不渲染** ✗（照图集1 ✓）
    }).filter((x) => {                                     // 去重 + 丢掉没链接/没封面的脏条目 ✓
      if (!x.href || !x.cover || seen.has(x.href)) return false;
      seen.add(x.href); return true;
    });
  });
}

/** 卡片（2 列 ✓ 竖版 3:4 ✓ **无标题** ✓ —— 三条都在 style 的 `#alb2Cards` 里 ✓ 与图集1 各管各的 ✗） */
function renderAlb2Cards() {

/** 状态行（三态 ✓ 与图集1 同一套既有件 ✓ 失败可点重试 ✓） */
function alb2PaintMore() {
  const el = $('alb2More'); if (!el) return;
  if (alb2St.err) {
    el.innerHTML = `<div class="hint">加载失败：${esc(alb2St.err)}<br />`
      + `<span class="sbtn" style="display:inline-block;flex:none;padding:8px 18px;margin-top:10px" `
      + `onclick="alb2Reload()">重试 ✓</span><br />（或下拉刷新 ✓）</div>`;
    return;
  }
  if (alb2St.loading) { el.innerHTML = '<span class="spin"></span>'; return; }
  if (!alb2St.items.length) { el.innerHTML = '<div class="hint">没有图集（空态 ✓）</div>'; return; }
  el.innerHTML = alb2St.done ? '没有更多了' : '上滑加载更多';
}

async function alb2Load() {
  if (alb2St.loading || alb2St.done) return;
  const req = alb2Req;                                  // ★ 我是哪一代 ✓
  alb2St.loading = true; alb2PaintMore();
  const page = alb2St.page + 1;
  try {
    const items = await alb2PageData(page);
    if (req !== alb2Req) return;                        // ★ 换选择器了 ⇒ 旧响应一律丢弃 ✗（连 loading 都不碰 ✓）
    alb2St.items = alb2St.items.concat(items);
    alb2St.page = page;
    alb2St.err = '';
    if (items.length < ALB2_PER_PAGE) alb2St.done = true;   // 不满 100 条 ⇒ 最后一页 ✓
    log(`在线图集2：第 ${page} 页（${alb2PageUrl(page).replace(ALB2_BASE, '')}）→ ${items.length} 条` +
        `（累计 ${alb2St.items.length}${alb2St.done ? '，到底' : ''}）`, 'dim');
  } catch (e) {
    if (req !== alb2Req) return;
    alb2St.err = (e && e.message) || String(e);
    alb2St.done = true;
    log('在线图集2：' + alb2St.err, 'err');
  }
  alb2St.loading = false;
  renderAlb2Cards();
}

/** 下拉刷新 = 清空重拉第 1 页 ✓（当前分类/排序不变 ✓） */
function alb2Reload() {
  alb2Req++;
  alb2St = { page: 0, loading: false, err: '', items: [], done: false };
  renderAlb2Cards(); alb2PaintMore();
  return alb2Load();
}

/* ---------- 「在线图集2」详情页 + 预览 + 框选（照「在线图集1」那套**逐项对齐** ✓ 但**整条线独立** ✗）----------
   实测口径（`/v/ZQygA` ✓ 只抓文本 ✓）：
     · 图片容器 = `#content .imgHolder img` ✓ **图在 `src`** ✓（**绝对 URL** ✓，没有 `data-src`/`srcset` ✗ —— 
       ⚠️ 与列表页不同：列表页封面是**相对**的 `src` ✓ 那边已用 `alb2Abs` 补绝对 ✓）
     · **该本 24 张** ✓（`data-fancybox="gallery"` 也是 24 ✓）· **没有分页/加载更多** ✓（`下一页/加载更多/pagination/查看更多` 全 0 ✓）
     · 图片域名 = **`img.photos18.com`** ✗（**与列表页的 `www.photos18.com` 不是一个域** ✓）
       ⚠️ 但图片是**页面里的 `<img>` 直接加载**的 ✗ 不走 `/albpage` 代理 ✓ ⇒ **白名单完全不用动** ✓✓
   本段 = 图集1 那条线的**镜像** ✓（详情 ✓ 预览两按钮 ✓ 左右滑+页码 ✓ 框选+夹住+压暗+抬层级 ✓ 三态 ✓ 下拉刷新 ✓）
   ⚠️⚠️ **状态与代际计数器全部另起一套**（`alb2DSt`/`alb2DReq`/`alb2Pv`/`alb2CropSt` ✗）—— **绝不与图集1 共用** ☠
   ⚠️ 样式：**一律内联 + 既有件**（`.ovl/.row2/.ok/.hint/.spin/.sbtn` ✓）→ **没新加一条 CSS** ✗
      （两排的 id 作用域样式在 :226-238 ✓ 与这里无关 ✓；框比那支 `albScreenRatio()` 是**纯读 DOM 的工具** ✓ 复用它 ✓） */
let alb2DSt = { loading: false, err: '', items: [] };     // 详情：图 URL 列表 ✓
let alb2DReq = 0;                                        // ★ 图集2 详情**自己的**代际计数器 ✗
let alb2DLast = null;                                    // 重试用：记住当前那本 ✓
let alb2Pv = null;                                       // { mode:'view'|'crop', i, src } ✓
let alb2CropSt = null;                                   // 框选位移/余量 ✓

/** 详情图列表（**竖排、每张占满宽度、原图直出** ✓ 无 cover 裁切 ✗；占位框按真实比例回填 ✓） */
function renderAlb2Detail() {
  const box = $('alb2DList'); if (!box) return;
  box.innerHTML = alb2DSt.items.map((src, i) => `
    <div id="alb2DBox${i}" style="background:#eceff3;aspect-ratio:2/3;overflow:hidden">
      <img src="${esc(src)}" alt="" loading="lazy" draggable="false" style="width:100%;height:auto;display:block;-webkit-user-drag:none" />
    </div>`).join('');
  box.querySelectorAll('img').forEach((im, i) => {
    const set = () => { const el = document.getElementById(`alb2DBox${i}`); if (el && im.naturalWidth) el.style.aspectRatio = im.naturalWidth + ' / ' + im.naturalHeight; };
    if (im.complete && im.naturalWidth) set(); else im.onload = set;
    im.onclick = () => alb2PreviewOpen(i);          // ★ 点图 ⇒ 预览 ✓（同 URL 已加载 ⇒ 零新增请求 ✗）
  });

}

function alb2DPaintMore() {
  const el = $('alb2DMore'); if (!el) return;
  if (alb2DSt.err) {
    el.innerHTML = `<div class="hint">加载失败：${esc(alb2DSt.err)}<br />`
      + `<span class="sbtn" style="display:inline-block;flex:none;padding:8px 18px;margin-top:10px" `
      + `onclick="alb2DetailRetry()">重试 ✓</span><br />（或下拉刷新 ✓）</div>`;
    return;
  }
  if (alb2DSt.loading) { el.innerHTML = '<span class="spin"></span>'; return; }
  if (!alb2DSt.items.length) { el.innerHTML = '<div class="hint">这本没有图片（空态 ✓）</div>'; return; }
  el.innerHTML = '';
}

function alb2DetailLoad(item) {
  if (alb2DSt.loading) return;
  const req = alb2DReq;
  alb2DLast = item;
  alb2DSt.loading = true; alb2DPaintMore();
  return fetch('/albpage?url=' + encodeURIComponent(ALB2_BASE + item.href)).then((r) => {
    if (!r.ok) throw new Error('取页失败：HTTP ' + r.status);
    return r.text();
  }).then((html) => {
    if (req !== alb2DReq) return;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // ★ 图在 `img src` ✓（实测是**绝对** URL ✓ 仍统一过一遍 `alb2Abs` ✓ 万一是相对的也不怕 ✓）
    alb2DSt.items = [...doc.querySelectorAll('#content .imgHolder img')].map((im) => alb2Abs(im.getAttribute('src')))
      .filter((s) => /\.(jpe?g|png|webp|avif|gif)(\?|$)/i.test(s));
    alb2DSt.err = '';
    log(`图集2详情：${item.href} → **${alb2DSt.items.length} 张**（取自 img src ✓）`, 'dim');
    albPreloadAll(alb2DSt.items);                       // ★ 后台预热整本 ✓ 不滑不再临时拉图 ✓
  }).catch((e) => {
    if (req !== alb2DReq) return;
    alb2DSt.err = (e && e.message) || String(e);
    log('图集2详情：' + alb2DSt.err, 'err');
  }).then(() => { if (req === alb2DReq) { alb2DSt.loading = false; renderAlb2Detail(); } });
}

function alb2DetailRetry() { if (alb2DLast) alb2DetailLoad(alb2DLast); }
function alb2DetailReload(item) {
  alb2DReq++;
  alb2DSt = { loading: false, err: '', items: [] };
  renderAlb2Detail();
  return alb2DetailLoad(item);
}

// ===== 预览 / 框选（与图集1 同款行为 ✓ 但状态各管各的 ✗）=====
function alb2PreviewOpen(i) {
  alb2PreviewClose();
  const n = alb2DSt.items.length;
  const idx = Math.max(0, Math.min(n - 1, parseInt(i, 10) || 0));
  const o = document.createElement('div');
  o.className = 'ovl';
  o.style.alignItems = 'center';
  o.onclick = (e) => { if (e.target === o) alb2PreviewClose(); };
  $('screen').appendChild(o);
  alb2Pv = { mode: 'view', i: idx, src: alb2DSt.items[idx] || '' };
  alb2PreviewPaint();
  log(`图集2预览：第 ${idx + 1} / ${n} 张 ✓（左滑=下一张 ✓ 右滑=上一张 ✓）`, 'dim');
}

function alb2PreviewClose() {
  const o = document.querySelector('.ovl'); if (o) o.remove();
  alb2Pv = null; alb2CropSt = null;
}

function alb2PreviewStep(d) {
  if (!alb2Pv || alb2Pv.mode !== 'view') return;            // ★ 框选态不切图 ✗
  const n = alb2DSt.items.length;
  const ni = alb2Pv.i + d;
  if (ni < 0 || ni > n - 1) { log(`图集2预览：已经是${ni < 0 ? '第一' : '最后'}张 ✓ 不循环 ✗`, 'dim'); return; }
  alb2Pv.i = ni; alb2Pv.src = alb2DSt.items[ni];
  alb2PreviewPaint();
  log(`图集2预览：${ni + 1} / ${n} ✓`, 'dim');
}

/** ★ 预览图的左右滑（图集2 版 ✓ 与图集1 的 `albPreviewSwipe` 是**两份同款代码** ☠ 改一处必改另一处 ✗）
 *  ★ 2026-10-05 **用户最终口径** ✓：**左滑 = 下一张** ✓ **右滑 = 上一张** ✗（框选态不切图 ✗） */
function alb2PreviewSwipe() {
  const o = document.querySelector('.ovl'); if (!o) return;
  const im = o.querySelector('img'); if (!im) return;
  let down = false, sx = 0, sy = 0;
  im.addEventListener('pointerdown', (e) => { down = true; sx = e.clientX; sy = e.clientY; });
  const end = (e) => {
    if (!down) return; down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 40 || Math.abs(dx) <= Math.abs(dy)) return;
    alb2PreviewStep(dx < 0 ? 1 : -1);        // ★ 2026-10-05 用户最终口径：左滑=下一张 · 右滑=上一张（框选态不切图 ✗）
  };
  im.addEventListener('pointerup', end);
  im.addEventListener('pointercancel', () => { down = false; });
}

function alb2PreviewPaint() {
  const o = document.querySelector('.ovl'); if (!o || !alb2Pv) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ratio = albScreenRatio();                            // 复用那支纯函数 ✓（读 .screen 的实际 rect ✓）
  const n = alb2DSt.items.length || 1;
  if (alb2Pv.mode === 'view') {
    o.innerHTML = `<div style="width:100%;padding:0 12px;box-sizing:border-box">
      <img src="${esc(alb2Pv.src)}" alt="" draggable="false"
        style="width:100%;height:auto;display:block;border-radius:10px;-webkit-user-drag:none" />
      <div style="text-align:center;color:#fff;opacity:.85;font-size:12px;margin:8px 0 0">${alb2Pv.i + 1} / ${n}</div>
      <div class="row2"><div class="ok" onclick="alb2PreviewCrop()">设为背景</div>
        <div class="ok" onclick="alb2PreviewSave()">保存相册</div></div></div>`;
    alb2PreviewSwipe();
    return;
  }
  const fw = Math.max(120, Math.round(Math.min(vw - 96, vh * ratio * 0.62)));
  const fh = Math.round(fw / ratio);
  o.innerHTML = `<div style="width:100%;box-sizing:border-box;padding:0 12px;
    display:flex;flex-direction:column;align-items:center;gap:16px">
    <div id="alb2CropStage" style="position:relative;width:${fw}px;height:${fh}px;overflow:hidden;border-radius:12px;
      background:#000;box-shadow:0 0 0 9999px rgba(0,0,0,.55)"></div>
    <div style="text-align:center;color:#fff;opacity:.85;font-size:12px;position:relative;z-index:1">${alb2Pv.i + 1} / ${n}</div>
    <div class="row2" style="width:100%;margin:0;position:relative;z-index:1">
      <div class="ok" onclick="alb2CropOk()">确认</div>
      <div class="ok" onclick="alb2CropCancel()">取消</div></div></div>`;
  const st = $('alb2CropStage');
  st.addEventListener('click', (e) => e.stopPropagation());
  alb2CropBuild();
  log(`图集2框选：框 ${fw}×${fh}（= 手机屏比 ${ratio.toFixed(4)} ✓）· 拖图选区域 ✓`, 'dim');
}

function alb2CropBuild() {
  const st = $('alb2CropStage'); if (!st || !alb2Pv) return;
  const fw = st.clientWidth, fh = st.clientHeight;
  const im = document.createElement('img');
  im.src = alb2Pv.src; im.alt = ''; im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;-webkit-user-drag:none;user-select:none';
  st.appendChild(im);
  st.style.touchAction = 'none';                      // ★ 别让浏览器抢双指手势 ✓（照图集1 ✓）
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  /** 按 `z` 重算尺寸/余量并夹住 ✓（`z=1` = 刚好盖住框 ✓ ⇒ 不露底 ✗） */
  const applyZoom = (z) => {
    const nw = im.naturalWidth || fw, nh = im.naturalHeight || fh;
    const base = Math.max(fw / nw, fh / nh);
    const s = base * z;
    alb2CropSt.z = z;
    alb2CropSt.dw = nw * s; alb2CropSt.dh = nh * s;
    alb2CropSt.slackX = Math.max(0, alb2CropSt.dw - fw);
    alb2CropSt.slackY = Math.max(0, alb2CropSt.dh - fh);
    alb2CropSt.dx = (typeof alb2CropSt.wantDx === 'number') ? alb2CropSt.wantDx : -alb2CropSt.slackX / 2;
    alb2CropSt.dy = (typeof alb2CropSt.wantDy === 'number') ? alb2CropSt.wantDy : -alb2CropSt.slackY / 2;
    delete alb2CropSt.wantDx; delete alb2CropSt.wantDy;
    alb2CropSt.dx = clamp(alb2CropSt.dx, -alb2CropSt.slackX, 0);   // ★ 夹住：图盖住框 ✓
    alb2CropSt.dy = clamp(alb2CropSt.dy, -alb2CropSt.slackY, 0);
    alb2CropPaint(im);
  };
  const fit = () => { alb2CropSt = { z: 1 }; applyZoom(1); };
  if (im.complete && im.naturalWidth) fit(); else im.onload = fit;
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  st.addEventListener('pointerdown', (e) => {
    if (!alb2CropSt || !im.naturalWidth || alb2CropSt.pinching) return;   // 双指进行时让位 ✓
    dragging = true; sx = e.clientX; sy = e.clientY; ox = alb2CropSt.dx; oy = alb2CropSt.dy;
    try { st.setPointerCapture(e.pointerId); } catch (_) {}
  });
  st.addEventListener('pointermove', (e) => {
    if (!dragging || !alb2CropSt || alb2CropSt.pinching) return;
    alb2CropSt.dx = clamp(ox + (e.clientX - sx), -alb2CropSt.slackX, 0);
    alb2CropSt.dy = clamp(oy + (e.clientY - sy), -alb2CropSt.slackY, 0);
    alb2CropPaint(im);
  });
  const up = () => { dragging = false; };
  st.addEventListener('pointerup', up);
  st.addEventListener('pointercancel', up);
  // ★ 接上共用的手势工具（双指捏 + 滚轮 ✓ 状态仍归 `alb2CropSt` ✓ 与图集1 不共享 ✗）
  alb2CropSt = alb2CropSt || { z: 1 };
  alb2CropSt.reflow = () => applyZoom(typeof alb2CropSt.wantZ === 'number' ? alb2CropSt.wantZ : (alb2CropSt.z || 1));
  albCropGestures(st, () => alb2CropSt);
}

function alb2CropPaint(im) {
  if (!alb2CropSt || !im) return;
  im.style.width = alb2CropSt.dw + 'px';
  im.style.height = alb2CropSt.dh + 'px';
  im.style.transform = `translate(${alb2CropSt.dx}px, ${alb2CropSt.dy}px)`;
}

function alb2PreviewCrop() { if (!alb2Pv) return; alb2CropSt = null; alb2Pv.mode = 'crop'; alb2PreviewPaint(); }
function alb2CropCancel() {
  if (!alb2Pv) return;
  alb2CropSt = null; alb2Pv.mode = 'view'; alb2PreviewPaint();
  log('图集2框选：取消 ✓ 回到预览态 ✓', 'dim');
}
function alb2CropOk() { alb2PreviewTip('模拟器不真设背景 ✓（真机：设完即用 ✓ 不进背景图集 ✗）'); }
function alb2PreviewSave() { alb2PreviewTip('模拟器不保存相册 ✓（真机：原图无损、不裁剪、直接存 ✓ 与框选无关 ✗）'); }

function alb2PreviewTip(msg) {
  const o = document.querySelector('.ovl'); if (!o) return;
  let t = o.querySelector('.alb2Tip');
  if (!t) {
    t = document.createElement('div');
    t.className = 'hint alb2Tip';
    t.style.cssText = 'position:absolute;left:12px;right:12px;bottom:76px;text-align:center;z-index:2;'
      + 'background:rgba(0,0,0,.72);color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5';
    o.appendChild(t);
  }
  t.textContent = msg;
  log('图集2预览：' + msg, 'dim');
  setTimeout(alb2PreviewClose, 1400);
}

});

} else if (WANT_SETTINGS) {

} else if (WANT_SITE < 0 && !STANDALONE) {

}
