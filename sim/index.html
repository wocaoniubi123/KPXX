<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>KPXX 模拟器（数据/界面验证）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #e9eaee;
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 28px;
    color: #1b1b1f;
  }
  /* ---------- 手机外壳 ---------- */
  .phone {
    width: 390px; height: 844px; background: #000; border-radius: 44px;
    padding: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.35); flex: 0 0 auto;
  }
  .screen {
    position: relative; width: 100%; height: 100%; background: #fff;
    border-radius: 36px; overflow: hidden; display: flex; flex-direction: column;
  }
  .status {
    height: 44px; flex: 0 0 auto; display: flex; align-items: center;
    justify-content: space-between; padding: 0 22px; font-weight: 600; font-size: 14px;
    background: inherit;
  }
  .status .right { letter-spacing: 2px; }
  /* ---------- 顶栏 ---------- */
  .appbar {
    flex: 0 0 auto; background: #fdf1ee; display: flex; align-items: center;
    gap: 6px; padding: 4px 8px 8px; position: relative;
  }
  .appbar h1 { flex: 1; text-align: center; font-size: 20px; font-weight: 600; margin: 0; }
  .appbar .ic {
    width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px;
    cursor: pointer; border-radius: 50%;
  }
  .appbar .ic:hover { background: rgba(0,0,0,.06); }
  .appbar .spacer { width: 40px; }
  /* ---------- 内容区 ---------- */
  .body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; background: #F6F6F9; }
  .body.white { background: #fff; }
  /* ---------- 底部导航 ---------- */
  .nav {
    flex: 0 0 auto; display: flex; background: #fdf1ee; border-top: 1px solid #eee;
  }
  .nav .item {
    flex: 1; padding: 8px 0 14px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; cursor: pointer; color: #6b6b6b; font-size: 12px;
  }
  .nav .item.on { color: #8d4b2a; }
  .nav svg { width: 26px; height: 26px; }
  /* ---------- 宫格 ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 8px; padding: 18px 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .tile .box {
    width: 62px; height: 62px; border-radius: 13px; background: #fff;
    border: 1px solid rgba(0,0,0,.08); display: grid; place-items: center; overflow: hidden;
  }
  .tile .box img { width: 100%; height: 100%; object-fit: contain; padding: 9px; }
  .tile .box .noimg { color: #fff; font-size: 26px; font-weight: 700; width: 100%; height: 100%;
    display: grid; place-items: center; }
  .tile span { font-size: 12px; color: #333; text-align: center; }
  /* ---------- 列表页 ---------- */
  .tabs {
    display: flex; gap: 22px; overflow-x: auto; padding: 0 16px; background: #fff;
    border-bottom: 1px solid #f0f0f0; flex: 0 0 auto; scrollbar-width: none;
    touch-action: pan-x;   /* 触屏：浏览器原生横滑；鼠标拖动由 JS 处理 */
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs .tab {
    padding: 12px 0 8px; font-size: 14px; color: #333; white-space: nowrap;
    cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tabs .tab.on { color: #8d4b2a; border-color: #8d4b2a; font-weight: 600; }
  /* 子分类行（黄果的排序 / 91porna 的子频道） */
  .subbar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; background: #fff;
    border-bottom: 1px solid #f0f0f0; flex: 0 0 auto; scrollbar-width: none; touch-action: pan-x; }
  .subbar::-webkit-scrollbar { display: none; }
  .subbar .sub { flex: 0 0 auto; padding: 5px 12px; border-radius: 15px; font-size: 12px;
    background: #f0f0f2; color: #444; cursor: pointer; white-space: nowrap; }
  .subbar .sub.on { background: #e8590c; color: #fff; }
  /* 二级子分类行：小一号、底色浅，跟一级区分 */
  .subbar.l2 { background: #fafafa; padding: 5px 12px; gap: 6px; }
  .subbar.l2 .sub { padding: 4px 10px; font-size: 11px; border-radius: 13px; }
  /* 卡片拉伸到整行高度：同一行里卡片高度必须一致（用户要求） */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px;
    align-items: stretch; }
  /* 竖屏封面站（黄果短剧）：封面 3:4，且**一行 3 个**（和 App 一致） */
  .cards.portrait { grid-template-columns: repeat(3, 1fr); }
  .cards.portrait .card .cover { aspect-ratio: 3/4; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .cover { position: relative; width: 100%; aspect-ratio: 16/9; background: #eee; }
  .card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 封面右下角的时长角标（站点有视频时长才显示） */
  .card .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.6);
    color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; }
  .card .txt { padding: 6px 8px 8px; }
  /* 标题能一行就一行（不预留两行高度）；最多两行 */
  .card .ttl { font-size: 13px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { margin-top: 4px; font-size: 10px; color: #999; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .card .ttl { text-align: center; }   /* 标题一律居中（用户要求） */
  /* 小字简介（黄果的卡片有） */
  /* 简介同样能一行就一行，最多两行 */
  .card .desc { margin-top: 3px; font-size: 11px; line-height: 1.3; color: #666;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 卡片上的分类标签（可点 → 标签列表） */
  .card .ctags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .card .ctag { font-size: 10px; color: #555; background: #f0f0f2; border-radius: 9px;
    padding: 2px 6px; cursor: pointer; }
  .card .ctag:hover { background: #e4e4e8; }
  /* ---------- 详情页 ---------- */
  .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .player video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .pbar { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 14px; cursor: pointer; }
  /* 播放器控件行（与 App 的控件条对齐：上一集/播放/下一集/放大一倍/全屏） */
  .pbtns { position: absolute; left: 10px; right: 10px; bottom: 40px; display: flex;
    align-items: center; gap: 6px; }
  .pbtn { color: #fff; background: rgba(0,0,0,.45); border-radius: 6px;
    padding: 2px 10px; font-size: 15px; cursor: pointer; user-select: none; }
  .pbtn.dis { opacity: .3; }
  .pbtn.on { background: rgba(232,89,12,.8); }
  .pbar .track { position: absolute; left: 0; right: 0; bottom: 3px; height: 3px;
    background: rgba(255,255,255,.25); border-radius: 2px; }
  .pbar .buf { position: absolute; left: 0; bottom: 3px; height: 3px; width: 0;
    background: rgba(255,255,255,.5); border-radius: 2px; }
  .pbar .play { position: absolute; left: 0; bottom: 3px; height: 3px; width: 0;
    background: #fff; border-radius: 2px; }
  .pbar .knob { position: absolute; bottom: .5px; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; transform: translateX(-4px); }
  .ptime { position: absolute; left: 10px; bottom: 22px; color: #fff; font-size: 11px;
    text-shadow: 0 1px 2px #000; }
  .pstate { position: absolute; left: 0; right: 0; top: 45%; text-align: center;
    color: #fff9; font-size: 12px; }
  .dwrap { padding: 12px; }
  .dwrap h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.4; }
  .dmeta { font-size: 12px; color: #888; display: flex; gap: 10px; align-items: center; }
  .sec { margin-top: 14px; }
  .sec h3 { font-size: 15px; margin: 0 0 6px; }
  .intro { font-size: 13px; color: #333; line-height: 1.6; white-space: pre-wrap; }
  .vlist { display: flex; flex-direction: column; }
  .vrow { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .vrow .num { width: 22px; height: 22px; border-radius: 6px; background: rgba(0,0,0,.06);
    color: #555; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: 0 0 auto; }
  .vrow.on .num { background: #e8590c; color: #fff; }
  .vrow.on .t { font-weight: 700; }
  .vrow .t { font-size: 13px; line-height: 1.4; }
  /* 黄果短剧的选集：横向排，按宽度自动换行（用户要求，仅这站这么显示） */
  .vchips { display: flex; flex-wrap: wrap; gap: 6px; }
  /* Pektino 的筛选行（多级分类：主题/时长/排序） */
  .pkbar button { border: 1px solid #ddd; background: #fff; border-radius: 8px;
    padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .pkbar select { border: 1px solid #ddd; border-radius: 8px; padding: 4px 6px;
    font-size: 13px; background: #fff; }
  .pktag { font-size: 12px; padding: 5px 10px; border-radius: 8px; background: #f0f0f2;
    color: #444; cursor: pointer; }
  .pktag.on { background: #e8590c; color: #fff; font-weight: 600; }
  /* Pektino：瀑布流两列（卡片按顺序轮流放、列内连续；照站点，不留空档） */
  .cards.pk { display: flex; gap: 10px; align-items: flex-start; }
  .cards.pk .pkcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .vchip { padding: 5px 10px; border-radius: 8px; background: #f0f0f2; color: #444;
    font-size: 12px; line-height: 1.2; cursor: pointer; }
  .vchip.on { background: #e8590c; color: #fff; font-weight: 600; }
  .stills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; touch-action: pan-x; }
  .stills img { width: 120px; height: 84px; object-fit: cover; border-radius: 6px;
    background: #eee; cursor: zoom-in; flex: 0 0 auto; }
  /* 相关推荐：有封面显示缩略图；没有（如 51/每日大赛 的热闻区）显示个占位图标 */
  .relrow { display: flex; gap: 8px; align-items: center; padding: 6px 0; cursor: pointer; }
  .relrow img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px;
    background: #eee; flex: 0 0 auto; }
  .relrow .noimg { width: 96px; height: 54px; border-radius: 6px; background: #f3f3f3;
    display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
  .relrow .t { font-size: 13px; line-height: 1.4; }
  /* ---------- 大图 ---------- */
  .lightbox { position: absolute; inset: 0; background: #000; display: none;
    align-items: center; justify-content: center; z-index: 20; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox .info { position: absolute; top: 48px; right: 16px; color: #fff9; font-size: 12px; }
  /* ---------- 搜索 ---------- */
  .searchbar { display: flex; align-items: center; gap: 8px; }
  .searchbar input { flex: 1; border: 0; border-bottom: 2px solid #8d4b2a; outline: 0;
    padding: 6px 2px; font-size: 15px; background: transparent; }
  .hint { text-align: center; color: #666; margin-top: 120px; font-size: 14px; }
  /* ---------- 设置 ---------- */
  .stlist { background: #fff; }
  .strow { padding: 14px 16px; border-bottom: 1px solid #f2f2f2; }
  .strow .t { font-size: 15px; }
  .strow .s { font-size: 12px; color: #888; margin-top: 2px; line-height: 1.5; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px 16px; }
  /* 标签：横向单行滚动（在剧照下方） */
  .tagrow { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; touch-action: pan-x; }
  .tagrow::-webkit-scrollbar { display: none; }
  .tagrow .chip { flex: 0 0 auto; cursor: pointer; }
  .chip { padding: 6px 14px; border-radius: 18px; border: 1px solid #ddd; font-size: 13px; }
  .chip.on { background: #e8590c; color: #fff; border-color: #e8590c; }
  /* ---------- 侧栏日志 ---------- */
  .side { width: 420px; max-height: 844px; background: #181a20; color: #c9d1d9;
    border-radius: 14px; padding: 12px; overflow: auto; font: 12px/1.6 Consolas, monospace; }
  .side h3 { margin: 0 0 8px; font-size: 13px; color: #fff; font-weight: 600; }
  .side .ok { color: #7ee787; } .side .err { color: #ff7b72; } .side .dim { color: #8b949e; }
  .side button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 11px; margin-right: 6px; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #ddd;
    border-top-color:#8d4b2a; border-radius:50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status">
      <span id="clock">23:10</span>
      <span class="right">▮▮▮ ⌾▮ 72</span>
    </div>
    <div class="appbar" id="appbar"></div>
    <div class="tabs" id="tabs" style="display:none"></div>
    <div class="subbar" id="subbar" style="display:none"></div>
    <div class="subbar l2" id="subbar2" style="display:none"></div>
    <div class="body" id="body"></div>
    <div class="nav" id="nav">
      <div class="item on" data-nav="grid">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        <span>模块</span>
      </div>
      <div class="item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.05A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.05A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.05a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.05a1.7 1.7 0 0 0-1.55 1z"/></svg>
        <span>设置</span>
      </div>

    <div class="lightbox" id="lightbox">
      <img id="lightbox-img" alt="" />
      <div class="info" id="lightbox-info"></div>

</div>

<div class="side">
  <h3>模拟器日志（数据抓取 / 解密 / 播放）</h3>
  <div style="margin-bottom:8px">
    <button onclick="document.getElementById('log').innerHTML=''">清空</button>
    <button onclick="loadSitesWithRetry()">重读站点清单</button>
    <span class="dim">站点清单来自 lib/sites.dart</span>
  </div>
  <div id="log"></div>
</div>

<script>
/* =========================================================================
   KPXX 模拟器 —— 只做两件事：验证真实数据能不能抓到、界面显示对不对。
   解析规则与 app 的 lib/api.dart 一一对应（改动要两边同步）。
   ========================================================================= */
const $ = (id) => document.getElementById(id);
const logEl = $('log');
function log(msg, cls) {
  const t = new Date().toTimeString().slice(0, 8);
  logEl.insertAdjacentHTML('beforeend',
    `<div class="${cls || ''}">[${t}] ${msg}</div>`);
  logEl.parentElement.scrollTop = 1e9;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(sec) {
  if (!isFinite(sec)) sec = 0;
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(Math.floor(sec % 60)).padStart(2, '0');
  return `${m}:${s}`;
}
setInterval(() => {
  const d = new Date();
  $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}, 10000);

/* ---------------------------- 数据层 ---------------------------- */
const AES_KEY = 'f5d965df75336270';   // 与 app 的 fetched_image.dart 一致
const AES_IV = '97b60394abc2fbe1';

/* 模拟器**默认静音**：所有 video（含动态插入的）自动 muted ——
   在别的浏览器/窗口打开模拟器也不用特意去关声音 */
(function initMute() {
  const mute = () => document.querySelectorAll('video').forEach((v) => {
    v.muted = true;
    v.volume = 0;
  });
  document.addEventListener('play', (e) => {
    const v = e.target;
    if (v && v.tagName === 'VIDEO') { v.muted = true; v.volume = 0; }
  }, true);
  new MutationObserver(mute).observe(document.documentElement, { childList: true, subtree: true });
  mute();
})();

let SITES = [];

async function reloadSites() {
  const r = await fetch('/sites');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error('解析 lib/sites.dart 失败：' + j.error);
  SITES = j.sites || [];
  log(`站点清单：${SITES.map((s) => s.name).join('、')}`, 'ok');
  viewGrid();
}

/** 首次打开时服务可能还没监听 → 失败要重试几次，别留一屏空白 */
async function loadSitesWithRetry() {
  for (let i = 1; i <= 6; i++) {
    try {
      await reloadSites();
      if (SITES.length) return;
    } catch (e) {
      log(`读取站点清单失败（第 ${i} 次）：${e.message}`, 'err');
    }
    await new Promise((r) => setTimeout(r, 700));
  }
  $('body').innerHTML = `<div class="hint">读不到站点清单。<br>
    服务端可能没起来 —— 关掉服务窗口，重新双击「启动模拟器.bat」。</div>`;
}

const base = (site) => 'https://' + (site.hosts[0] || '');
const px = (url) => '/proxy?url=' + encodeURIComponent(url);

// 走 /site：服务端会依次试该站的所有域名（和 App 的 _fetchText 一样），
// 跑通哪个记住哪个。要抓的是站点 HTML，不能直连（浏览器跨域会被拦）。
async function getHtml(site, path) {
  const r = await fetch('/site?name=' + encodeURIComponent(site.name) +
    '&path=' + encodeURIComponent(path));
  const text = await r.text();
  if (r.status !== 200) throw new Error(text.slice(0, 140));
  return text;
}

/** 卡片信息行只取时间（与 api.dart 的 _metaDate 对应） */
function metaDate(raw) {
  const t = String(raw || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  let m = /\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日(?:\s*\d{1,2}:\d{2}(?::\d{2})?)?/.exec(t);
  if (m) return m[0];
  m = /\d{4}[-/.]\d{1,2}[-/.]\d{1,2}(?:\s*\d{1,2}:\d{2}(?::\d{2})?)?/.exec(t);
  if (m) return m[0];
  // 51fans1 的列表卡片只有 09-23
  m = /\d{1,2}\s*月\s*\d{1,2}\s*日/.exec(t);
  if (m) return m[0];
  m = /^\d{1,2}-\d{1,2}$/.exec(t);
  if (m) return m[0];
  m = /\d{1,2}\s*(?:分钟|小时|天)前/.exec(t);
  if (m) return m[0];
  return '';
}

/** 详情页时间显示（与 api.dart 侧的 _fmtTime 对齐）：站点自带时分秒就原样显示 */
function fmtTime(t) {
  const s = String(t || '');
  if (!s) return '';
  if (s.length >= 19 && s[10] === ' ') return s;
  return s.slice(0, 10);
}

/** 与 api.dart 的 _parseArticles 对应（按站点模板分派） */
function parseArticles(html, site) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tpl = (site && site.template) || 'wordpress';
  if (tpl === 'huangguo') return hgCards(doc);
  if (tpl === 'porna') return pornaCards(doc);
  const out = [];
  for (const el of doc.querySelectorAll('article[itemscope]')) {
    const cls = el.className || '';
    // 分类页链接是相对的，搜索页是绝对地址（只认相对会把搜索结果全丢掉）
    const a = el.querySelector('a[href*="/archives/"]');
    if (!a || cls.includes('ad-item')) continue;
    const title = (el.querySelector('.post-card-title')?.textContent || '').trim();
    if (!title) continue;
    let cover = '';
    for (const s of el.querySelectorAll('script')) {
      const m = /loadBannerDirect\('([^']+)'/.exec(s.textContent);
      if (m) { cover = m[1]; break; }
    }
    if (!cover) cover = el.querySelector('img[data-src]')?.getAttribute('data-src') || '';
    // 卡片只显示时间（原来是"作者 • 日期 • 分类"）
    const meta = metaDate(el.querySelector('.post-card-info')?.textContent || '');
    let href = a.getAttribute('href') || '';
    if (href.startsWith('http')) {
      const i = href.indexOf('/archives/');
      if (i >= 0) href = href.slice(i);
    }
    out.push({ title, url: href, cover, meta, duration: '' });
  }
  // 51fans1：div.xqbj-list-rows（封面在 z-image-loader-url，值偶尔带反引号）
  if (!out.length) {
    for (const el of doc.querySelectorAll('div.xqbj-list-rows')) {
      const a = el.querySelector('a[href*="/archives/"]');
      if (!a) continue;
      const title = (el.querySelector('.xqbj-list-rows-image-title')?.textContent || '')
        .replace(/\s+/g, ' ').trim();
      if (!title) continue;
      const img = el.querySelector('img[z-image-loader-url]');
      const cover = (img?.getAttribute('z-image-loader-url') || '').replace(/`/g, '').trim();
      // 移动端文案更全（"9月29日"），桌面端只有时刻（"19:00"）→ 优先移动端
      let meta = (el.querySelector('.xqbj-list-rows-bottom-tags-text.is-mobile')?.textContent || '').trim();
      if (!meta || !metaDate(meta)) {
        const desk = (el.querySelector('.xqbj-list-rows-bottom-tags-text.is-desktop')?.textContent || '').trim();
        if (desk) meta = desk;
      }
      out.push({ title, url: a.getAttribute('href') || '', cover, meta: metaDate(meta), duration: '' });
    }
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 黄果短剧的卡片（相关推荐/标签页/搜索页都是这套结构） */
function hgCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('div.hg-drama-card')) {
    const a = el.querySelector('a.hg-drama-card__cover-link') || el.querySelector('a[href^="/video/"]');
    if (!a) continue;
    // 标题取链接里的文本节点，排掉 <span class="sr-only">全集在线观看</span>
    const titleEl = el.querySelector('.hg-drama-card__title a') || a;
    let title = '';
    for (const n of titleEl.childNodes) if (n.nodeType === 3) title += n.textContent;
    title = title.replace(/\s+/g, ' ').trim() || (titleEl.textContent || '').replace('全集在线观看', '').trim();
    if (!title) continue;
    const img = el.querySelector('img[data-src]') || el.querySelector('img');
    const epRaw = (el.querySelector('.hg-drama-card__episode')?.textContent || '')
      .replace(/\s+/g, ' ').trim();
    const ep = /(更新至\s*\d+\s*集|全\s*\d+\s*集|完结)/.exec(epRaw);
    const desc = (el.querySelector('.hg-drama-card__desc')?.textContent || '')
      .replace(/\s+/g, ' ').trim();
    out.push({
      title,
      url: a.getAttribute('href') || '',
      cover: img?.getAttribute('data-src') || '',
      meta: '',
      badge: ep ? ep[0] : '',
      desc,
      tags: [],   // 卡片不显示标签（用户要求）
    });
    if (out.length >= 60) break;
  }
  const seen = new Set();
  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));
}

/** 黄果短剧接口里的一条 → 卡片（时长单位是秒） */
function hgItem(v) {
  const ep = parseInt(v.episode_count, 10) || 0;
  const total = parseInt(v.total_episodes, 10) || 0;
  // 黄果的卡片：封面右下角=集数（站点就是这么显示的），标题下面=小字简介+分类
  const epText = v.is_finished && total > 0 ? `全集${total}集` : (ep > 0 ? `更新至${ep}集` : '');
  return {
    title: String(v.title || '').trim(),
    url: `/video/${v.id}/`,
    cover: v.cover || '',
    meta: '',
    badge: epText,
    desc: String(v.description || '').replace(/\s+/g, ' ').trim(),
    tags: [],   // 卡片不显示标签（用户要求）
  };
}

/** 秒 → 3:27 / 1:00:39 */
function hgDuration(raw) {
  const sec = parseInt(String(raw || '').trim(), 10);
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

/** 91porna 的卡片：div.video-item（时长角标在封面右下角） */
function pornaCards(doc) {
  const out = [];
  for (const el of doc.querySelectorAll('div.video-item')) {

/** 与 api.dart 的 detail() 对应（按站点模板分派；黄果/91porna 还要额外请求） */
async function parseDetail(html, site, url) {
  const tpl = (site && site.template) || 'wordpress';
  if (tpl === 'huangguo') {
    // 吃瓜社区的帖子（/archives/N/）是图文帖，跟视频详情不是一套
    if (url && url.startsWith('/archives/')) return hgPostDetail(html);
    return hgDetail(html);
  }
  if (tpl === 'porna') {
    // 三种详情页：短视频 / 黑料图文 / 普通视频（靠 URL 区分）
    if (url && url.startsWith('/melonshort/video/')) return melonDetail(html, url);
    if (url && url.startsWith('/heiliao-chigua/')) return await heiliaoDetail(html, site);
    if (url && url.startsWith('/novels/')) return await novelDetail(html);
    return await pornaDetail(html, site);
  }
  if (tpl === 'pektino') return pektinoDetail(html, url);
  return await wpDetail(html, site, url);
}

/** WordPress 系详情（含 51fans1 的兜底分支） */
async function wpDetail(html, site, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let title = (doc.querySelector('.post-title')?.textContent || '').trim();
  if (!title) title = (doc.querySelector('.novel-title h1')?.textContent || '').trim();
  const intro = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '')
    .replace(/\s+/g, ' ').trim();
  let time = doc.querySelector('meta[itemprop="datePublished"]')?.getAttribute('content') || '';
  if (!time) time = metaDate(doc.querySelector('.novel-info')?.textContent || '');

  const images = [];
  for (const img of doc.querySelectorAll('.post-content img')) {
    const src = img.getAttribute('data-xkrkllgl') || '';
    if (src.startsWith('http') && !images.includes(src)) images.push(src);
  }
  if (!images.length) {
    // 51fans1：.defaultimg 里 img[data-image-preview][z-image-loader-url]
    for (const img of doc.querySelectorAll('img[data-image-preview]')) {
      const src = (img.getAttribute('z-image-loader-url') || '').replace(/`/g, '').trim();
      if (src.startsWith('http') && !images.includes(src)) images.push(src);
    }
  }
  if (!images.length) {
    for (const img of doc.querySelectorAll('.post-content img')) {
      let src = img.getAttribute('data-src') || img.getAttribute('src') || '';
      if (src.startsWith('http') && !src.includes('/hc237/') && !images.includes(src)) images.push(src);
    }
  }

  const videos = [];
  let order = 0;
  for (const dp of doc.querySelectorAll('.dplayer[data-config]')) {
    order++;
    const sources = [];
    try {
      const cfg = JSON.parse(dp.getAttribute('data-config'));
      if (cfg.video && cfg.video.url) sources.push(cfg.video.url);
      if (cfg.video_h265 && cfg.video_h265.url) sources.push(cfg.video_h265.url);
    } catch (e) { /* 单个视频配置坏，跳过 */ }
    const texts = [];
    for (let e = dp.previousElementSibling; e && texts.length < 2; e = e.previousElementSibling) {
      const t = (e.textContent || '').replace(/\s+/g, ' ').trim();
      if (!t || t.length > 60) continue;
      texts.push(t);
    }
    let ord = 0;
    for (const t of texts) { const v = videoOrdinal(t); if (v > 0) { ord = v; break; } }
    const n = ord > 0 ? ord : order;
    videos.push({ ordinal: n, label: ord > 0 && texts.length ? texts[0] : '视频 ' + n, sources });
  }
  // 合集文章：正文没有播放器，只有"👉点我查看详情帖"链接 → 抓子文章取源，拼成篇内视频
  if (!videos.length) {
    const subs = [];
    // 结构规律（不看文字）：真·子文章链接的直接父元素是 <p>；
    // 推广在 th、上一篇/下一篇在 span、相关文章在 div.link-list、版权行 href 是本页
    const contentEl = doc.querySelector('.post-content');
    for (const a of contentEl ? contentEl.querySelectorAll('a[href*="/archives/"]') : []) {
      // 两道结构判定：父级是 <p>，且该 <p> 是 .post-content 的直接子元素
      if (!a.parentElement || a.parentElement.tagName.toLowerCase() !== 'p') continue;
      if (a.parentElement.parentElement !== contentEl) continue;
      let href = a.getAttribute('href') || '';
      if (href.startsWith('http')) { const i = href.indexOf('/archives/'); if (i >= 0) href = href.slice(i); }
      const txt = (a.textContent || '').replace(/\s+/g, ' ').trim();
      if (!href || !txt || href === url) continue;
      if (subs.some((x) => x[0] === href)) continue;
      subs.push([href, txt]);
      if (subs.length >= 20) break;
    }
    // ⚠️ 不预抓子文章：只放"标题 + 地址"，点到哪集才抓哪篇（playVideo 里按需取）
    let o = 0;
    for (const x of subs) {
      o++;
      videos.push({ ordinal: o, label: cleanSubTitle(x[1]), sources: [], lazyUrl: x[0] });
    }
  }

  videos.sort((a, b) => a.ordinal - b.ordinal);

  /** 合集的"详情帖"链接文字 → 选集标题 */
  function cleanSubTitle(raw) {
    let s = String(raw || '').replace(/\s+/g, ' ').trim();
    s = s.replace('点我查看详情帖', ' ');
    s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    return s || '视频';
  }

  // 标签（/tag/xxx/），可点击跳转
  const tags = [];
  for (const a of doc.querySelectorAll('a[href*="/tag/"]')) {
    const href = a.getAttribute("href") || "";
    const t = (a.textContent || "").trim();
    if (!href || !t || t.length > 20) continue;
    const slug = href.split("/tag/").pop().replace(/\/$/, "");
    if (!slug) continue;
    if (!tags.some((x) => x.slug === slug)) tags.push({ slug, name: t });
    if (tags.length >= 30) break;
  }

  // 相关推荐（尾部「热门新闻」区 .hot-news-section/.hot-news-box/.hot-news-content，
  // 没有单独的 .hot-news 元素——原选择器匹配不到，区块不显示），显示在剧照下方
  const related = [];
  for (const el of doc.querySelectorAll('.hot-news-content')) {
    const a = el.querySelector('a[href*="/archives/"]');
    if (!a) continue;
    let href = a.getAttribute("href") || "";
    const t = ((el.querySelector('p') || {}).textContent || "").replace(/\s+/g, " ").trim();
    if (!href || !t) continue;
    if (href.startsWith("http")) {
      const i = href.indexOf("/archives/");
      if (i >= 0) href = href.slice(i);
    }
    if (related.some((x) => x.url === href)) continue;
    related.push({ title: t, url: href, cover: "" });
    if (related.length >= 12) break;
  }

  return { title, intro, time, images, videos, tags, related, duration: '' };
}

/** 黄果短剧：详情页内嵌 <script id="videoInitialData">，
 *  epPlaySrcs = {"1": m3u8, ...} 一次拿到整部剧所有集。 */
function hgDetail(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let data = null;
  const raw = doc.querySelector('script#videoInitialData')?.textContent || '';
  if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
  const videos = [];
  // 选集：页面上有完整的选集链接（/video/{id}/、/video/{id}/ep-{n}/）；
  // epPlaySrcs 只是"当前集附近 2~3 集"的窗口 → 列全，窗口内有源的直接播，
  // 其余 lazyUrl 留那一集地址，点到才取（点哪集抓哪集）
  const epUrls = new Map();
  const vid = data ? String(data.id || '') : '';
  if (vid) {
    const re = new RegExp('^/video/' + vid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:/ep-(\\d+))?/$');
    for (const a of doc.querySelectorAll('a[href^="/video/"]')) {
      const href = a.getAttribute('href') || '';
      const m = re.exec(href);
      if (!m) continue;
      const n = parseInt(m[1] || '1', 10) || 1;
      if (!epUrls.has(n)) epUrls.set(n, href);
    }
  }
  if (epUrls.size) {
    for (const n of Array.from(epUrls.keys()).sort((a, b) => a - b)) {
      const src = (data && data.epPlaySrcs && data.epPlaySrcs[String(n)]) || '';
      videos.push({
        ordinal: n, label: `第 ${n} 集`,
        sources: src ? [src] : [],
        lazyUrl: src ? undefined : epUrls.get(n),
      });
    }
  } else if (data && data.epPlaySrcs) {
    const keys = Object.keys(data.epPlaySrcs).map((k) => parseInt(k, 10) || 0).sort((a, b) => a - b);
    for (const k of keys) {
      const src = data.epPlaySrcs[String(k)];
      if (!src) continue;
      videos.push({ ordinal: k > 0 ? k : videos.length + 1, label: `第 ${k} 集`, sources: [src] });
    }
  }
  const tags = [];
  if (data && Array.isArray(data.tagLinks)) {
    for (const t of data.tagLinks) {
      const slug = String(t.url || '').split('/tag/').pop().replace(/\/$/, '');
      if (t.name && slug) tags.push({ slug, name: t.name });
    }
  }
  // 相关推荐 = 「猜你喜欢」区的卡片（广告 aside 里没有 hg-drama-card，天然排除）
  const related = hgCards(doc).slice(0, 12);
  return {
    title: (data && data.title) || (doc.querySelector('h1')?.textContent || '').trim(),
    intro: ((data && data.description) || '').replace(/\s+/g, ' ').trim(),
    time: (data && data.time) || '',
    images: [],           // 这站没有剧照
    videos,
    tags,
    related,
    duration: '',
  };
}

/** 黄果吃瓜社区的帖子详情：图文（正文 .hg-post-detail__body 的图）
 *  + 可选的多个视频（div.post-video-player 的 data-src 就是现成 m3u8，
 *    每个视频上面一般有个 <h2> 小标题当 label）。
 *  ⚠️ 2026-09-30 修正：之前写死"没有视频"是探测不到位（实测 606/605/604/602 都有） */
function hgPostDetail(html) {
  const doc = parseHtml(html);
  const title = (doc.querySelector('h1')?.textContent || '').replace(/\s+/g, ' ').trim();
  const intro = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '')
    .replace(/\s+/g, ' ').trim();
  const images = [];
  for (const img of doc.querySelectorAll('.hg-post-detail__body img[data-src]')) {
    const src = img.getAttribute('data-src') || '';
    if (src.startsWith('http') && !images.includes(src)) images.push(src);
  }
  const time = metaDate(doc.querySelector('.hg-post-detail')?.textContent || '');
  const tags = [];
  for (const a of doc.querySelectorAll('.hg-post-detail a[href*="/tag/"]')) {
    const href = a.getAttribute('href') || '';
    const name = (a.textContent || '').trim();
    if (!href || !name || name.length > 20) continue;
    const slug = href.split('/tag/').pop().replace(/\/$/, '');
    if (!slug) continue;
    if (!tags.some((x) => x.slug === slug)) tags.push({ slug, name });
  }
  // 正文里的视频（可以多个）：data-src 即 m3u8；label 取视频前面最近的 <h2>
  const videos = [];
  const vbody = doc.querySelector('.hg-post-detail__body');
  if (vbody) {
    let o = 0;
    for (const p of vbody.querySelectorAll('div.post-video-player')) {
      const src = p.getAttribute('data-src') || '';
      if (!src.startsWith('http')) continue;
      o++;
      let label = '';
      let prev = p.previousElementSibling;
      while (prev) {
        if (prev.localName === 'h2') { label = (prev.textContent || '').trim(); break; }
        prev = prev.previousElementSibling;
      }
      videos.push({ ordinal: o, label: label || ('视频 ' + o), sources: [src] });
    }
  }
  return {
    title, intro, time, images,
    videos,
    tags,
    related: hgCards(doc).slice(0, 12),
    duration: '',
  };
}

/** 91porna：标题/简介/时长/标签来自 LD+JSON；
 *  播放地址要再请求 /index/detail_play（img=封面路径、u=页面内嵌 hex token、t=时间戳/2100）。 */
async function pornaDetail(html, site) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let obj = null;
  for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
    try {
      const j = JSON.parse(s.textContent);
      for (const n of (j['@graph'] || [])) if (n['@type'] === 'VideoObject') obj = n;
    } catch (e) { /* 坏 JSON 忽略 */ }
  }
  const title = (obj && obj.name) ||
    (doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || '').trim();
  const duration = pornaDuration((obj && obj.duration) || '');
  let cover = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';
  if (!cover && obj && Array.isArray(obj.thumbnailUrl) && obj.thumbnailUrl.length) cover = obj.thumbnailUrl[0];
  const tags = [];
  if (obj && Array.isArray(obj.keywords)) for (const k of obj.keywords) if (k) tags.push({ slug: k, name: k });

  // 播放地址
  const videos = [];
  let img = '';
  try { img = new URL(cover).pathname; } catch (e) { img = ''; }
  if (!img) {
    const m = /(?:upload_01|md-\d+)\/[^"'\s]+\.(?:jpe?g|png|webp)/.exec(html);
    img = m ? '/' + m[0] : '';
  }
  // token 长度不固定（视频页 160 位、日本AV 页 352 位），候选逐个试
  const toks = [...new Set([
    ...html.matchAll(/parseInt\|([0-9a-f]{60,400})\|/g),
    ...html.matchAll(/\|([0-9a-f]{120,400})\|/g),
    ...html.matchAll(/\b([0-9a-f]{120,400})\b/g),
  ].map((m) => m[1]))].slice(0, 6);
  if (img) {
    for (const token of toks) {
      const t = Math.floor(Date.now() / 1000 / 2100);
      const path = '/index/detail_play?img=' + encodeURIComponent(img) + '&ads=&u=' + token + '&h=&t=' + t;
      const src = await pornaPlayFromScript(site, path);
      if (src) { videos.push({ ordinal: 1, label: '视频 1', sources: [src] }); break; }
    }
  }

  return {
    title: title || '',
    intro: ((obj && obj.description) || '').replace(/\s+/g, ' ').trim(),
    time: (obj && (obj.uploadDate || obj.datePublished)) || '',
    images: [],  // 这站没有剧照
    videos,
    tags,
    related: pornaCards(doc).slice(0, 12),
    duration,
  };
}

/** 解开站点前端用的 JS 打包格式（Dean Edwards packer）—— 换源响应里 m3u8 被拆成字典碎片。 */
/** 解开站点前端用的 JS 打包格式（Dean Edwards packer）—— 换源响应里 m3u8 被拆成字典碎片。 */
function unpackPacker(src) {
  const head = /eval\(function\(p,a,c,k,e,[rd]\)\{[\s\S]*?\}\('([\s\S]*?)',(\d+),(\d+),'([\s\S]*?)'\.split\('\|'\)/.exec(src);
  if (!head) return null;
  const p0 = head[1], a = parseInt(head[2], 10), c = parseInt(head[3], 10);
  const dict = head[4].split('|');
  // 还原 JS 字符串字面量里的转义（扫描式，避免正则被反斜杠绕晕）
  const ESC = { n: '\n', t: '\t', r: '\r', "'": "'", '\u005c': '\u005c', '"': '"' };
  let p = '';
  for (let i = 0; i < p0.length; i++) {
    const ch = p0[i];
    if (ch === '\u005c' && i + 1 < p0.length) {
      const nxt = p0[i + 1];
      if (ESC[nxt] !== undefined) { p += ESC[nxt]; i++; continue; }
    }
    p += ch;
  }
  const enc = (n) => (n < a ? '' : enc(Math.floor(n / a))) +
    ((n % a) > 35 ? String.fromCharCode((n % a) + 29) : (n % a).toString(36));
  for (let i = c - 1; i >= 0; i--) {
    if (i >= dict.length || !dict[i]) continue;
    p = p.replace(new RegExp('\u005cb' + enc(i) + '\u005cb', 'g'), dict[i]);
  }
  return p;
}

/** 请求换源脚本（detail_play / melon_detail_play）并抠出 m3u8 */
async function pornaPlayFromScript(site, path) {
  let js;
  try { js = await getHtml(site, path); } catch (e) { return ''; }
  const RE = /https?:\/\/[^"'\s\\]+\.m3u8[^"'\s\\]*/;
  let m = RE.exec(js);
  if (m) return m[0];
  const plain = unpackPacker(js);
  if (!plain) return '';
  m = RE.exec(plain);
  return m ? m[0] : '';
}

/** PT1H39S → 1:00:39 */
function pornaDuration(iso) {
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(String(iso || ''));
  if (!m) return '';
  const h = parseInt(m[1] || '0', 10), mi = parseInt(m[2] || '0', 10), s = parseInt(m[3] || '0', 10);
  if (!h && !mi && !s) return '';
  const mm = String(mi).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

/** 黑料吃瓜详情：图文帖（正文 article.ql-editor；图片 data-src；标签是 /黑料吃瓜/xxx 分类链接） */
async function heiliaoDetail(html, site) {

  for (const img of doc.querySelectorAll('article.ql-editor img[data-src]')) {

    if (!tags.some((x) => x.slug === href)) tags.push({ slug: href, name });
  }
  // 正文里的视频：一块 ql-video-mse，地址要拿页面内嵌 token 去 melon_detail_play 换
  const videos = [];
  const toks = [...html.matchAll(/parseInt\|([0-9a-f]{60,400})\|/g)].map((m) => m[1]);

function videoOrdinal(s) {
  const m = /视频\s*([0-9一二三四五六七八九十百]+)/.exec(s);
  if (!m) return 0;
  const t = m[1];
  if (/^[0-9]+$/.test(t)) return parseInt(t, 10);
  const cn = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  if (t === '十') return 10;
  if (t.startsWith('十')) return 10 + (cn[t.slice(1)] || 0);
  if (t.includes('十')) {
    const p = t.split('十');
    return (cn[p[0]] || 0) * 10 + (p.length > 1 ? (cn[p[1]] || 0) : 0);
  }
  return cn[t] || 0;
}

/* -------- 图片：下载 + AES 解密（与 fetched_image.dart 对应） -------- */
const imgCache = new Map();
function looksLikeImage(b) {
  if (b.length < 12) return false;
  if (b[0] === 0xff && b[1] === 0xd8) return true;
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return true;
  const s = String.fromCharCode(...b.slice(0, 6));
  if (s.startsWith('GIF8')) return true;
  if (s.startsWith('RIFF') && String.fromCharCode(...b.slice(8, 12)) === 'WEBP') return true;
  return false;
}
const isIco = (b) => b.length > 6 && b[0] === 0 && b[1] === 0 && b[2] === 1 && b[3] === 0;

const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));

/** 下载 + 解密一张图。
 *  ⚠️ 封面偶发"解密失败"多半不是密钥问题，而是**请求层**：一次拉几十张图时
 *  本地代理会偶发超时/被限流，回来的不是密文（错误页/空包）→ 解密当然失败。
 *  所以这里：非 200 或解密失败都**重试一次**，并且**失败结果不进缓存**
 *  （原来把失败的 Promise 缓存住了，那张图就一直空白到刷新为止）。 */
async function imageUrl(url, retries = 1) {
  if (!url) return '';
  if (imgCache.has(url)) return imgCache.get(url);
  const task = (async () => {
    for (let attempt = 0; attempt <= retries; attempt++) {
      if (attempt) await sleep(400);   // 给代理/图床喘口气
      let b;
      try {
        const r = await fetch(px(url));
        if (!r.ok) {
          if (attempt < retries) continue;
          log(`封面请求失败 HTTP ${r.status}：` + url.slice(0, 50), 'err');
          return '';
        }
        b = new Uint8Array(await r.arrayBuffer());
        if (b.length < 12) {
          if (attempt < retries) continue;
          log('封面响应是空的（重试后仍然）：' + url.slice(0, 50), 'err');
          return '';
        }
      } catch (e) {
        if (attempt < retries) continue;
        log('封面下载失败：' + url.slice(0, 50) + '（' + (e && e.message ? e.message : e) + '）', 'err');
        return '';
      }
      if (isIco(b)) return URL.createObjectURL(new Blob([b]));   // 浏览器自己能显示 ICO
      if (!looksLikeImage(b)) {
        let ok = false;
        try {
          const key = await crypto.subtle.importKey('raw',
            new TextEncoder().encode(AES_KEY), { name: 'AES-CBC' }, false, ['decrypt']);
          b = new Uint8Array(await crypto.subtle.decrypt(
            { name: 'AES-CBC', iv: new TextEncoder().encode(AES_IV) }, key, b));
          ok = true;
        } catch (e) {
          if (attempt < retries) continue;   // 偶发坏响应，再试一次
          log(`图片解密失败（密钥/密文对不上，重试过）：` + url.slice(0, 50), 'err');
          return '';
        }
        if (!looksLikeImage(b)) {
          if (attempt < retries) continue;
          log('解密后仍不是图片：' + url.slice(0, 50), 'err');
          return '';
        }
      }
      return URL.createObjectURL(new Blob([b]));
    }
    return '';
  })();
  imgCache.set(url, task);
  const out = await task;
  if (!out) imgCache.delete(url);   // 失败不缓存，下次还能重试
  return out;
}
async function fillImages(root) {
  for (const img of root.querySelectorAll('img[data-src]')) {
    const u = img.getAttribute('data-src');
    img.removeAttribute('data-src');
    const obj = await imageUrl(u);
    if (obj) img.src = obj; else img.style.visibility = 'hidden';
  }
}

/** 横向长条支持"按住左右拖"滚动。
 *  用户是手机远控电脑（没有滚轮/触控板），横条只能靠拖动才够得着；
 *  拖超过 8px 就把随后那次 click 吞掉，免得滑动时误切了分类。 */
function enableDragScroll(el) {
  if (!el || el.dataset.dragScroll === '1') return;
  el.dataset.dragScroll = '1';
  let down = false, startX = 0, startLeft = 0, moved = 0;
  el.addEventListener('pointerdown', (e) => {
    // 触摸走浏览器原生横滑（CSS 里给了 touch-action: pan-x），这里只管鼠标
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    down = true; moved = 0; startX = e.clientX; startLeft = el.scrollLeft;
    // ⚠️ 千万别用 setPointerCapture：指针捕获会把随后的 click 也重定向到容器，
    //    子元素（tab、子分类胶囊）的点击会全部失效——之前就是这么把点击搞坏的
    el.style.cursor = 'grabbing';
  });
  el.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > moved) moved = Math.abs(dx);
    el.scrollLeft = startLeft - dx;
    if (moved > 8 && e.cancelable) e.preventDefault();
  });
  const up = () => {
    if (!down) return;
    down = false;
    el.style.cursor = '';
    if (moved > 8) {
      // 捕获阶段吞掉这次 click（滑完手抬起来别顺手切了分类）
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      el.addEventListener('click', swallow, true);
      setTimeout(() => el.removeEventListener('click', swallow, true), 300);
    }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}

function push(view) { stack.push(view); view(); }

/** 一级子分类（选中项；没子分类返回 null），返回 SiteTab 对象 */
function subTabOf(site, cat) {
  if (!cat.subs || !cat.subs.length) return null;
  const want = subSel.get(site.name + '/' + cat.key) || cat.subs[0].key;
  return cat.subs.find((s) => s.key === want) || cat.subs[0];
}

/** 二级子分类（选中项；一级子没有再下一级就返回 null） */
function subTabOf2(site, cat) {
  const l1 = subTabOf(site, cat);
  if (!l1 || !l1.subs || !l1.subs.length) return null;
  const k2 = site.name + '/' + cat.key + '|' + l1.key;
  const want = subSel2.get(k2) || l1.subs[0].key;
  return l1.subs.find((s) => s.key === want) || l1.subs[0];
}

/** 黄果的"路径型"列表页（与 api.dart 的 _hgPageList 对应）：
 *  /recommend、/newest、/topics/xxx/ → hg-drama-card（翻页 /xxx/2/）
 *  /ranks/hot/                       → hg-rank-item（TOP20）
 *  /chigua/                          → hg-post-card（翻页 /chigua/page/N/） */
async function hgPageList(site, path, page) {
  const p0 = path.endsWith('/') ? path : path + '/';
  // ⚠️ 精选推荐 / 最近上新 走 JSON 接口：页面 HTML 那份是站点没更新的静态版
  if (p0 === '/recommend/' || p0 === '/newest/') {
    const sort = p0 === '/newest/' ? 'sort=new&' : '';
    const j = JSON.parse(await getHtml(site, `/api/videos?${sort}page=${page}&size=20`));
    const items = (j && j.data && j.data.items) || [];
    return items.map(hgItem);
  }
  // 翻页形态按站点实际链接来（不猜）："全部"（/chigua/）→ /chigua/page/2/；
  // 子分类（/chigua/remen/ 等）→ /chigua/remen/2/；其余路径型 → /xxx/2/
  const url = page <= 1 ? p0
    : ((p0 === '/chigua/' || p0 === '/chigua') ? p0 + 'page/' + page + '/' : p0 + page + '/');
  const doc = parseHtml(await getHtml(site, url));
  if (p0.startsWith('/chigua')) return hgPostCards(doc);
  if (p0.startsWith('/ranks')) return hgRankCards(doc);
  // 专题列表页（/topics/）上是"专题卡"，专题自己的页面（/topics/xxx/）才是视频网格
  if (p0 === '/topics/') return hgTopicCards(doc);
  return hgCards(doc);
}

/** 专题卡（a.hg-topic-card → /topics/xxx/）：点开是该专题下的视频列表 */
function hgTopicCards(doc) {

    const href = a.getAttribute('href') || '';
    const tt = a.querySelector('.hg-topic-card__title');

    const mt = a.querySelector('.hg-topic-card__meta');

  return out.filter((x) => !seen.has(x.url) && seen.add(x.url));

/** 按模板取一页列表（与 api.dart 的 category() 对应） */
async function fetchList(site, cat, subKey, page) {
  const tpl = site.template || 'wordpress';
  if (tpl === 'huangguo') {
    // 路径型（精选推荐/最近上新/专题/排行榜/吃瓜黑料）
    const k = subKey || cat.key;
    if (k.startsWith('/')) return hgPageList(site, k, page);
    const sort = subKey || 'latest';
    const sortParam = sort === 'hot' ? 'hot_window'
      : sort === 'original' ? 'hot_window&is_original=1' : sort;
    const path = `/api/videos/category/${cat.key}?sort=${sortParam}&page=${page}&size=20`;
    const j = JSON.parse(await getHtml(site, path));
    const items = (j && j.data && j.data.items) || [];
    return items.map(hgItem);
  }
  if (tpl === 'porna') {
    return pornaFetch(site, subKey || cat.key, page);
  }
  if (tpl === 'pektino') {
    // 主分类 4 个都是路径型（/zh-CN/、/zh-CN/weekly…）→ 解出 range；
    // 主题/时长/排序是页面里的筛选器（pkFilter，多级分类）
    const k = cat.key || '';
    const range = k.endsWith('/weekly') ? 'weekly'
      : k.endsWith('/monthly') ? 'monthly'
      : k.endsWith('/all') ? 'all' : 'timely';
    return pektinoFetch(site, range, '', page);
  }
  // wordpress 系（含 51fans1）
  const k = subKey || cat.key;
  const path = k.startsWith('/')
    ? (page <= 1 ? k : k + page + '/')
    : (page <= 1 ? `/category/${k}/` : `/category/${k}/${page}/`);
  return parseArticles(await getHtml(site, path), site);
}

/** 91porna 的列表：按路径分三种页面类型（与 api.dart 的 _pornaList 一致）
 *  - /melonshort*        → 短视频卡片 article.video-card
 *  - heiliao / 黑料吃瓜   → 图文卡 a[href^=/heiliao-chigua/]
 *  - 其余                → div.video-item */
async function pornaFetch(site, key, page) {
  // 关键词里的空格站点用 + 分隔
  const p = key.startsWith('search:')
    ? '/comic/index/search?keyword=' + encodeURIComponent(key.slice(7)).replace(/%20/g, '+')
    : key;
  const path = page <= 1 ? p : p + (p.includes('?') ? '&' : '?') + 'page=' + page;
  const doc = parseHtml(await getHtml(site, path));
  if (path.startsWith('/melonshort')) return melonCards(doc);
  // ⚠️ 只看路径部分（搜索关键词里也可能有"黑料"），并且用完整的"黑料吃瓜"编码
  const p0 = path.split('?')[0];
  // 精选合集：/moviesets、/moviesets/{rank|category|people|brand} 是合集卡页面；
  // 再深一层才是该合集的视频列表（走 video-item）
  if (p0.startsWith('/moviesets')) {
    const segs = p0.split('/').filter((x) => x);
    if (segs.length <= 2) return msCards(doc);
  }
  if (p0 === '/novels' || p0.startsWith('/novels/')) return novelCards(doc);
  if (p0.includes('heiliao') || p0.includes('%E9%BB%91%E6%96%99%E5%90%83%E7%93%9C')) return heiliaoCards(doc);
  return pornaCards(doc);
}

/** 秒 → 时长（207 → 3:27；6228 → 1:43:48），拿不到返回空 */
function secClock(raw) {
  const sec = parseInt(String(raw ?? '').trim(), 10);
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

/** 从 mp4 直链解分辨率算宽高比（/vid/avc1/1920x1080/ → 16:9）；拿不到 null */
function pektinoAspect(mp4) {
  const m = /\/(\d{2,5})x(\d{2,5})\//.exec(mp4 || '');
  if (!m) return null;
  const w = parseInt(m[1], 10), h = parseInt(m[2], 10);
  return w > 0 && h > 0 ? w / h : null;
}

function pektinoItem(v) {
  const parts = [];
  if (v.pv) parts.push('播放 ' + v.pv);
  if (typeof v.commentCount === 'number') parts.push('评论 ' + v.commentCount);
  if (v.favorite) parts.push('收藏 ' + v.favorite);
  return {
    title: '',
    url: '/zh-CN/movie/' + (v.url_cd || ''),
    cover: v.thumbnail || '',
    meta: '',
    badge: secClock(v.time),
    desc: parts.join(' · '),
    tags: [],
    aspect: pektinoAspect(v.url || ''),
  };
}

/** 详情：Next.js payload 里数据块按 "url_cd" 切块、正则抽字段（同 App 的 _pektinoDetail） */
function pektinoDetail(html, url) {
  const urlCd = (url || '').split('/movie/').pop().replace(/\/$/, '');
  const plain = html.replace(/\\"/g, '"').replace(/\\\\/g, '\\');
  const starts = [];
  let at = -1;
  while ((at = plain.indexOf('"url_cd"', at + 1)) >= 0) starts.push(at);
  const grab = (chunk, key) => {
    const m = new RegExp('"' + key + '":\\s*("(?:[^"]*)"|[0-9.]+|null)').exec(chunk);
    if (!m) return '';
    const v = m[1];
    return v === 'null' ? '' : (v[0] === '"' ? v.slice(1, -1) : v);
  };
  const entries = [];
  for (let i = 0; i < starts.length; i++) {
    const end = i + 1 < starts.length ? starts[i + 1] : plain.length;
    const chunk = plain.slice(starts[i], Math.min(starts[i] + 2000, end));
    const e = {
      url_cd: grab(chunk, 'url_cd'), url: grab(chunk, 'url'), time: grab(chunk, 'time'),
      thumbnail: grab(chunk, 'thumbnail'), pv: grab(chunk, 'pv'),
      favorite: grab(chunk, 'favorite'), tweet_account: grab(chunk, 'tweet_account'),
    };
    if (e.url && e.thumbnail) entries.push(e); // 只收真视频条目（挡 tags 表噪音）
  }
  let main = null; const rel = [];
  for (const e of entries) { if (!main && e.url_cd === urlCd) main = e; else rel.push(e); }
  if (!main) main = entries[0] || null;
  const videos = [];
  if (main && main.url) videos.push({ ordinal: 1, label: '视频', sources: [main.url] });
  const introParts = [];
  if (main && main.tweet_account) introParts.push('@' + main.tweet_account);
  if (main && main.pv) introParts.push(main.pv + ' 次播放');
  if (main && main.favorite) introParts.push(main.favorite + ' 收藏');
  return {
    title: urlCd || url,
    intro: introParts.join(' · '),
    time: '',
    images: [],
    videos,
    tags: [],
    related: rel.slice(0, 12).map((e) => ({
      title: '', url: '/zh-CN/movie/' + e.url_cd, cover: e.thumbnail, meta: '',
      badge: secClock(e.time), desc: '', tags: [], aspect: pektinoAspect(e.url),
    })),
    duration: secClock(main ? main.time : ''),
  };
}

      <div class="txt">
        ${a.title ? `<div class="ttl${centerTitle ? ' center' : ''}">${esc(a.title)}</div>` : ''}
        ${a.desc ? `<div class="desc">${esc(a.desc)}</div>` : ''}
        ${(a.tags && a.tags.length) ? `<div class="ctags">${a.tags.slice(0, 4).map((t) =>

        ${a.meta ? `<div class="meta">${esc(a.meta)}</div>` : ''}
      </div>
    </div>`;
  // Pektino：瀑布流两列（按顺序轮流放、列内连续；照站点，横竖混排不留空档）
  const pk = !!(cat.site && cat.site.template === 'pektino');
  if (pk) {
    wrap.innerHTML =
      `<div class="pkcol">${st.items.filter((_, i) => i % 2 === 0).map((a, i) => cardHtml(a, i * 2)).join('')}</div>` +
      `<div class="pkcol">${st.items.filter((_, i) => i % 2 === 1).map((a, i) => cardHtml(a, i * 2 + 1)).join('')}</div>`;
  } else {
    wrap.innerHTML = st.items.map((a, i) => cardHtml(a, i)).join('');
  }
  // 卡片上的分类标签：能点就进该标签的列表（slug 为空 = 只展示）
  wrap.querySelectorAll('.ctag').forEach((el) => {
    if (!el.dataset.slug) return;
    el.onclick = (e) => {
      e.stopPropagation();
      const site0 = cat.site || SITES.find((s) => s.categories.includes(cat)) || SITES[0];
      openTagList(site0, el.dataset.name, el.dataset.slug, true);
    };
  });
  wrap.querySelectorAll('.card').forEach((c) => {
    const a = st.items[parseInt(c.dataset.i, 10)];
    c.onclick = () => {
      // 专题卡（/topics/xxx/）点开的是"该专题下的视频列表"，不是某一篇详情
      if (a.url && (a.url.startsWith('/topics/') || a.url.startsWith('/moviesets/'))) {
        const site0 = cat.site || SITES.find((s) => s.categories.includes(cat)) || SITES[0];
        openTagList(site0, a.title, a.url, false);
        return;
      }
      openDetail(a, cat, $('body').scrollTop);
    };
  });
  fillImages(wrap);
  // 搜索页没有 #more（只有列表页有），判空，否则会抛
  // "Cannot set properties of null (setting 'innerHTML')" 并被误报成"搜索失败"
  const more = $('more');
  if (more) {
    more.innerHTML = st.done
      ? '<span class="dim">没有更多了</span>'
      : '<span class="spin"></span>';
  }
  log(`${cat.name}：已加载 ${st.items.length} 篇`, 'dim');
}

async function loadMore(site, cat, st, sub) {
  if (st.loading || st.done) return;
  st.loading = true;
  try {
    const items = await fetchList(site, cat, sub, st.page);
    if (!items.length) { st.done = true; log(`${cat.name} 第 ${st.page} 页：0 篇（到底）`, 'dim'); }
    else {
      st.items.push(...items);
      st.page++;
      log(`${cat.name} 第 ${st.page - 1} 页：${items.length} 篇`, 'ok');
    }
  } catch (e) {
    st.done = true;
    log(`抓取失败 ${cat.name}：${e.message}`, 'err');
  } finally {
    st.loading = false;
    renderCards({ name: cat.name, site }, st);
  }
}

/* -------- 播放器（hls.js + 自定义进度条，行为对齐 App） -------- */
const HLS_CDNS = [
  'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
  'https://unpkg.com/hls.js@1/dist/hls.min.js',
  'https://cdn.bootcdn.net/ajax/libs/hls.js/1.5.15/hls.min.js',
];
async function ensureHls() {
  if (window.Hls) return true;
  for (const src of HLS_CDNS) {
    try {
      await new Promise((ok, no) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = no;
        document.head.appendChild(s);
      });
      if (window.Hls) { log('hls.js 已加载：' + src, 'dim'); return true; }
    } catch (e) { log('hls.js 源不可用：' + src, 'dim'); }
  }
  return false;
}

const lazySrcCache = new Map(); // 合集按需取源缓存：子文章地址 -> 播放源[]

/** 合集：点哪集抓哪集（把这一篇子文章的 dplayer 源取回来） */
async function fetchLazySources(site, url) {
  if (lazySrcCache.has(url)) return lazySrcCache.get(url);
  const task = (async () => {
    try {
      const html = await getHtml(site, url);
      const page = parseHtml(html);
      const out = [];
      if (site.template === 'huangguo') {
        // 黄果的某一集：源在 videoInitialData.epPlaySrcs[本集号]（页面自报 ep）
        let data = null;
        const raw = page.querySelector('script#videoInitialData')?.textContent || '';
        if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
        const ep = data ? (parseInt(String(data.ep), 10) || 0) : 0;
        const src = (data && data.epPlaySrcs && data.epPlaySrcs[String(ep)]) || '';
        if (src) out.push(src);
      } else {
        for (const dp of page.querySelectorAll('.dplayer[data-config]')) {
          try {
            const cfg = JSON.parse(dp.getAttribute('data-config'));
            if (cfg.video && cfg.video.url) out.push(cfg.video.url);
            if (cfg.video_h265 && cfg.video_h265.url) out.push(cfg.video_h265.url);
          } catch (e) {}
        }
      }
      if (out.length) lazySrcCache.set(url, out);
      return out;
    } catch (e) {
      log('取源失败 ' + url + '：' + ((e && e.message) || e), 'err');
      return [];
    }
  })();
  lazySrcCache.set(url, task);
  return task;
}

async function playVideo(v, site) {
  const video = $('v');
  if (!video) return;
  if (curPlayer && curPlayer.destroy) { try { curPlayer.destroy(); } catch (e) {} curPlayer = null; }
  // 合集类：这一集没有源 → 按需去它的子文章页取（详情页首屏才快）
  if (v && !(v.sources && v.sources.length) && v.lazyUrl) {
    $('pstate').textContent = '正在取视频…';
    log('按需取源：' + v.lazyUrl, 'dim');
    const got = await fetchLazySources(site, v.lazyUrl);
    if (!got.length) {
      $('pstate').textContent = '这一集已失效（子文章打不开或没有视频）';
      log('这一集取源失败：' + v.lazyUrl, 'err');
      return;
    }
    v = { ...v, sources: got };
  }
  const src = v && v.sources && v.sources[0];
  if (!src) {
    $('pstate').textContent = '该视频没有可用源';
    log('视频无源（dplayer 配置里 video/video_h265 都为空）', 'err');
    return;
  }
  $('pstate').textContent = '加载中…';
  log('播放：' + src.slice(0, 90), 'dim');
  const url = video.canPlayType('application/vnd.apple.mpegurl') ? src : src;
  // mp4（Pektino 的推文原视频）直接给 video 元素；只有 m3u8 才走 hls.js
  if (!/\.mp4(\?|$)/i.test(url) && await ensureHls() && window.Hls.isSupported()) {
    const hls = new window.Hls({ maxBufferLength: 30, maxMaxBufferLength: 120 });
    curPlayer = hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
      $('pstate').textContent = '';
      video.play().catch(() => {});
    });
    hls.on(window.Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        $('pstate').textContent = '播放出错：' + (data.details || '');
        log('hls 致命错误：' + data.details, 'err');
      } else {
        log('hls：' + data.details, 'dim');
      }
    });
  } else {
    // mp4（Pektino 的推文原视频）走**服务端中转**：内置浏览器直连 video.twimg.com
    // 被墙；Node 服务器跟随系统代理能拉，把流转发给播放器（支持 Range 拖动）
    video.src = /\.mp4(\?|$)/i.test(url)
      ? '/vproxy?url=' + encodeURIComponent(url)
      : url;
    video.onloadeddata = () => { $('pstate').textContent = ''; };
    video.onerror = () => {
      // Pektino 的视频是推文原 mp4（video.twimg.com 直链）：连不上那个 CDN 时
      // 报"格式不支持"会误导——它就是网络到推特视频 CDN 不通（挂代理再试）
      $('pstate').textContent = /\.mp4/i.test(url)
        ? '视频源打不开（video.twimg.com）——多为网络到推特视频 CDN 不通，挂代理再试'
        : '播放出错（浏览器不支持该格式，且 hls.js 没加载上）';
      log('video 元素报错', 'err');
    };
    video.play().catch(() => {});
  }
  bindPlayerUi(video);
}

/** 播放器控件状态：播放/暂停图标；上一集/下一集禁用态（与 App 对齐） */
function simUpdPlayBtn() {
  const v = $('v'), b = $('bPlay');
  if (v && b) b.textContent = v.paused ? '▶' : '⏸';
}
function simUpdNavBtns() {
  const n = (window.__curDetail && window.__curDetail.videos.length) || 0;
  const i = window.__curVi || 0;
  if ($('bPrev')) $('bPrev').classList.toggle('dis', i <= 0);
  if ($('bNext')) $('bNext').classList.toggle('dis', i >= n - 1);
}
/** 播放器"上一集/下一集"：与点选集同一套（高亮 + playVideo） */
function simSwitchTo(i) {
  const d = window.__curDetail, site = window.__curSite;
  if (!d || !d.videos.length || i < 0 || i > d.videos.length - 1) return;
  window.__curVi = i;
  document.querySelectorAll('#vlist .vrow, #vlist .vchip').forEach((r) => {
    r.classList.toggle('on', parseInt(r.dataset.i, 10) === i);
  });
  playVideo(d.videos[i], site);
}

function bindPlayerUi(video) {
  const upd = () => {
    const dur = video.duration || 0;
    const pos = video.currentTime || 0;
    let bufEnd = 0;
    try {
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= pos + 0.5 && video.buffered.end(i) > bufEnd) {
          bufEnd = video.buffered.end(i);
        }
      }
    } catch (e) {}
    const p = dur ? (pos / dur) * 100 : 0;
    const b = dur ? (bufEnd / dur) * 100 : 0;
    $('pplay').style.width = p + '%';
    $('pbuf').style.width = b + '%';
    $('pknob').style.left = p + '%';
    $('ptime').textContent = `${fmt(pos)} / ${fmt(dur)}`;
  };
  video.ontimeupdate = upd;
  video.onprogress = upd;
  video.ondurationchange = upd;
  upd();

  // 控件行（与 App 对齐）：上一集 / 播放暂停 / 下一集 / 放大一倍 / 全屏
  if ($('bPrev')) {
    $('bPrev').onclick = () => simSwitchTo((window.__curVi || 0) - 1);
    $('bNext').onclick = () => simSwitchTo((window.__curVi || 0) + 1);
    $('bPlay').onclick = () => {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      simUpdPlayBtn();
    };
    $('bZoom').onclick = () => {
      const on = !video.dataset.zoom;
      video.dataset.zoom = on ? '1' : '';
      video.style.transform = on ? 'scale(2)' : '';
      $('bZoom').classList.toggle('on', on);
      $('bZoom').textContent = on ? '还原' : '放大';
    };
    $('bFull').onclick = () => {
      const p = $('player');
      if (document.fullscreenElement) document.exitFullscreen();
      else if (p.requestFullscreen) p.requestFullscreen();
    };
    video.onplay = simUpdPlayBtn;
    video.onpause = simUpdPlayBtn;
  }
  simUpdPlayBtn();
  simUpdNavBtns();

  // 双击：左三成退 / 右三成进 10 秒（与 App 设置项一致）；**中间三成 = 暂停/播放**
  $('player').ondblclick = (ev) => {
    const r = $('player').getBoundingClientRect();
    const x = ev.clientX - r.left;
    if (x > r.width * 0.35 && x < r.width * 0.65) {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      simUpdPlayBtn();
      return;
    }
    const back = x < r.width / 2;
    video.currentTime = Math.max(0, Math.min(video.duration || 0,
      video.currentTime + (back ? -10 : 10)));
    upd();
  };
  // 左右拖动 = 按距离跳转（滑满一屏 120 秒），松手才跳
  let dragging = false, dx = 0, from = 0, width = 0;
  $('player').onpointerdown = (ev) => {
    dragging = true; dx = 0; from = video.currentTime;
    width = $('player').getBoundingClientRect().width;
  };
  $('player').onpointermove = (ev) => {
    if (!dragging) return;
    dx += ev.movementX || 0;
    if (Math.abs(dx) > 6) $('ptime').textContent =
      `${fmt(Math.max(0, from + dx / width * 120))} （松手跳转 ${Math.round(dx / width * 120)}s）`;
  };
  $('player').onpointerup = () => {
    if (!dragging) return;
    dragging = false;
    if (Math.abs(dx) > 6) {
      video.currentTime = Math.max(0, Math.min(video.duration || 0, from + dx / width * 120));
      upd();
    }
  };
  $('pbar').onclick = (ev) => {
    const r = $('pbar').getBoundingClientRect();
    video.currentTime = ((ev.clientX - r.left) / r.width) * (video.duration || 0);
    upd();
  };
}

async function viewTagList(site, title, slug, isTag) {
  showNav(false);
  setAppbar(`<div class="ic" onclick="back()">‹</div><h1>${esc(title)}</h1><div class="spacer"></div>`);
  $('tabs').style.display = 'none';
  $('subbar').style.display = 'none';

  $('body').className = 'body' + (site.portraitCovers ? '' : '');
  $('body').onscroll = null;
  $('body').innerHTML = `<div style="text-align:center;padding:40px 0"><span class="spin"></span></div>`;
  listState.delete("@tag/" + slug);
  const st = { items: [], page: 1, done: false };
  listState.set("@tag/" + slug, st);
  const portrait = site.portraitCovers ? ' portrait' : '';
  $('body').innerHTML = `<div class="cards${portrait}" id="cards"></div>
    <div style="text-align:center;padding:12px;color:#999" id="more"></div>`;
  const load = async () => {
    if (st.loading || st.done) return;
    st.loading = true;
    try {
      // 按模板取：porna 的"标签"= 关键词搜索；huangguo 是 /tag/x/；
      // wordpress 系（含 51fans1）是 /tag/x/ 或 /category/x/
      const items = await tagListItems(site, slug, isTag, st.page);
      if (!items.length) st.done = true; else { st.items.push(...items); st.page++; }
      log(`${title} 第 ${st.page - 1} 页：${items.length} 篇`, items.length ? 'ok' : 'dim');
    } catch (e) {
      st.done = true;
      log(`抓取失败 ${title}：${e.message}`, 'err');
    } finally {
      st.loading = false;
      // 把站点一起传下去：详情页要靠它决定请求哪个域名（否则会误用 51吃瓜）
      renderCards({ name: title, site }, st);
    }
  };
  $('body').onscroll = () => {
    if ($('body').scrollTop + $('body').clientHeight > $('body').scrollHeight - 300) load();
  };
  await load();
}

/** 标签/分类列表（按站点模板取，与 api.dart 的 tag()/category() 对应） */
async function tagListItems(site, slug, isTag, page) {
  const tpl = site.template || 'wordpress';
  if (tpl === 'huangguo') {
    if (slug.startsWith('/')) return hgPageList(site, slug, page);  // 专题等路径型
    if (page > 1) return [];
    return hgCards(parseHtml(await getHtml(site, `/tag/${slug}/`)));
  }
  if (tpl === 'porna') {
    // 以 / 开头的是站内分类页（黑料吃瓜的标签），否则当搜索关键词
    return pornaFetch(site, slug.startsWith('/') ? slug : 'search:' + slug, page);
  }
  const path = isTag
    ? (page <= 1 ? `/tag/${slug}/` : `/tag/${slug}/page/${page}/`)
    : (page <= 1 ? `/category/${slug}/` : `/category/${slug}/${page}/`);
  return parseArticles(await getHtml(site, path), site);
}

/** 搜索列表（按站点模板取，与 api.dart 的 search() 对齐）
 *  WordPress 系 5 站的搜索**有分页**：/search/{kw}/{页码}/
 *  （页面上「下一页」链接就是这个形态；实测第 2 页有内容且与第 1 页不重复。
 *  2026-09-30 修正：之前以为"站点无搜索分页"，只取了第 1 页）；
 *  黄果搜索单页；91porna 走 &page=。 */
async function searchItems(site, kw, page) {
  const tpl = site.template || 'wordpress';
  if (tpl === 'huangguo') {
    if (page > 1) return []; // 黄果搜索单页（页面上没有分页入口）
    return hgCards(parseHtml(await getHtml(site, '/search/?keyword=' + encodeURIComponent(kw))));
  }
  if (tpl === 'porna') return pornaFetch(site, 'search:' + kw, page);
  // Pektino：搜索 = 把输入当分类名传同一个接口（与站点一致；搜索独立、不受列表筛选影响）
  if (tpl === 'pektino') return pektinoFetch(site, 'all', kw, page, true);
  const enc = encodeURIComponent(kw);
  const path = page <= 1 ? `/search/${enc}/` : `/search/${enc}/${page}/`;
  return parseArticles(await getHtml(site, path), site);
}

/* -------- 搜索页 -------- */
function openSearch(siteIdx) { push(() => viewSearch(SITES[siteIdx])); }

function viewSearch(site) {
  showNav(false);
  setAppbar(`<div class="ic" onclick="back()">‹</div>
    <div class="searchbar" style="flex:1">
      <input id="kw" placeholder="搜索文章关键词..." />
    </div>
    <div style="padding:0 10px;color:#8d4b2a;cursor:pointer" id="doSearch">搜索</div>`);
  $('tabs').style.display = 'none';
  $('subbar').style.display = 'none';
  const sb2 = $('subbar2'); if (sb2) sb2.style.display = 'none';
  $('body').className = 'body';
  // 清掉上一个页面遗留的滚动监听：否则搜索结果滚到底，会去加载那个分类的
  // "下一页"，并把搜索结果替换成分类列表（串台，踩过 → 已在真机对照中发现）
  $('body').onscroll = null;
  $('body').innerHTML = `<div class="hint">输入关键词即可搜索</div>`;
  $('doSearch').onclick = doSearch;
  $('kw').onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
  $('kw').focus();
  async function doSearch() {
    const kw = $('kw').value.trim();
    if (!kw) return;
    $('body').onscroll = null; // 换一批结果前先解绑旧的滚动监听
    $('body').innerHTML = `<div style="text-align:center;padding:40px 0"><span class="spin"></span></div>`;
    try {
      const items = await searchItems(site, kw, 1);
      log(`搜索「${kw}」：${items.length} 篇`, items.length ? 'ok' : 'err');
      if (!items.length) { $('body').innerHTML = `<div class="hint">无结果</div>`; return; }
      const portrait = site.portraitCovers ? ' portrait' : '';
      $('body').innerHTML = `<div class="cards${portrait}" id="cards"></div>
        <div style="text-align:center;padding:12px;color:#999" id="more"></div>`;
      const st = { items, page: 2, done: false };
      // 与 App 搜索页一致：滚到底自动翻下一页（到底后 #more 显示"没有更多了"）
      const load = async () => {
        if (st.loading || st.done) return;
        st.loading = true;
        try {
          const more = await searchItems(site, kw, st.page);
          if (!more.length) { st.done = true; log(`搜索「${kw}」第 ${st.page} 页：0 篇（到底）`, 'dim'); }
          else { st.items.push(...more); st.page++; log(`搜索「${kw}」第 ${st.page - 1} 页：${more.length} 篇`, 'ok'); }
        } catch (e) {
          st.done = true;
          log(`搜索「${kw}」抓取失败：${e.message}`, 'err');
        } finally {
          st.loading = false;
          renderCards({ name: '搜索「' + kw + '」', site }, st);
          // 内容还占不满一屏（如黄果只有 9 条）→ 够不着"滚到底"，继续检查
          if (!st.done && $('body').scrollHeight <= $('body').clientHeight + 300) load();
        }
      };
      $('body').onscroll = () => {
        if ($('body').scrollTop + $('body').clientHeight > $('body').scrollHeight - 300) load();
      };
      // 传 site：详情页要靠它决定请求哪个域名（原先是 null → 回落 51吃瓜 → 404）
      renderCards({ name: '搜索「' + kw + '」', site }, st);
      // 一屏都没占满（如黄果只有 9 条）就够不着"滚到底"：直接检查，
      // 该加载就接着加载（黄果会立刻到底 → 显示"没有更多了"）
      if ($('body').scrollHeight <= $('body').clientHeight + 300) load();
    } catch (e) {
      $('body').innerHTML = `<div class="hint">搜索失败：${esc(e.message)}</div>`;
      log('搜索失败：' + e.message, 'err');
    }
  }
}
